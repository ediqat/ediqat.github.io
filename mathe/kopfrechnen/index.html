<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopfrechentrainer – Mathe-Grundkenntnisse</title>
<style>
:root {
  /* Layout: schmale Spalte zum Üben, Übersicht als Kartenraster. Farben: kühles Schulblau-Grau, Teal als Akzent, Gold nur für Stufen. */
  --bg: #eef2f4; --card: #ffffff; --ink: #14232e; --muted: #566872; --line: #d5dee3;
  --accent: #0b6e6e; --accent-ink: #ffffff; --gold: #e8a317;
  --good: #1f8a4c; --good-bg: #e1f4e8; --bad: #c43d3d; --bad-bg: #fbe5e5; --warn: #d9902b;
  --display: 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a21; --card: #17252e; --ink: #e8f0f3; --muted: #93a8b3; --line: #2a3d48;
    --accent: #3fb8b0; --accent-ink: #06201f; --gold: #f0b840;
    --good: #4cc27f; --good-bg: #14301f; --bad: #ef7777; --bad-bg: #3a1d1d; --warn: #e8a548;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a21; --card: #17252e; --ink: #e8f0f3; --muted: #93a8b3; --line: #2a3d48;
  --accent: #3fb8b0; --accent-ink: #06201f; --gold: #f0b840;
  --good: #4cc27f; --good-bg: #14301f; --bad: #ef7777; --bad-bg: #3a1d1d; --warn: #e8a548;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); }
p { margin: 0; }
.wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 56px; display: flex; flex-direction: column; gap: 18px; }
.wrap.narrow { max-width: 540px; }
.lead { color: var(--muted); max-width: 60ch; }
.hint { color: var(--muted); font-size: .92rem; }
.sec { font-size: 1.25rem; margin-top: 8px; }
.top { display: flex; flex-direction: column; gap: 6px; }

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 18px; font-weight: 700; min-height: 46px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { font-size: 1.25rem; min-height: 60px; padding: 12px 28px; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; padding: 6px 14px; font-size: .95rem; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.chip { border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 14px; min-height: 36px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.today { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .today { grid-template-columns: 1fr 1.3fr; align-items: center; } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.bsp { color: var(--muted); font-size: .92rem; margin-top: 2px; }
.lv { display: flex; align-items: center; gap: 8px; }
.dots { display: inline-flex; gap: 4px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gold); }
.dot.on { background: var(--gold); }
.lvt { font-weight: 700; font-size: .95rem; }
.step { margin-left: auto; display: inline-flex; gap: 4px; }

.kk { min-height: 60px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-family: var(--display); font-weight: 700; font-size: 1.6rem; touch-action: manipulation; user-select: none; }
.kk:active { background: var(--line); }
.kk.fn { color: var(--muted); }
.kk.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 1.2rem; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; min-height: 58px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-size: 1.1rem; }
.opt:hover:not(:disabled) { border-color: var(--accent); }

.opt.right { border-color: var(--good); background: var(--good-bg); }

.fb { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.fb.good { background: var(--good-bg); color: var(--good); font-weight: 700; }
.fb.bad { background: var(--bad-bg); }

/* Brüche */
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; margin: 0 .12em; font-size: .8em; }

.fr > span:last-child { padding: 0 .2em; }

/* Auswertung */

.rows { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.rows li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.rows li:first-child { border-top: 0; }
.sc { display: inline-flex; gap: 10px; align-items: baseline; font-variant-numeric: tabular-nums; }
.cmp { font-size: .85rem; color: var(--muted); }
.cmp.up { color: var(--good); } .cmp.down { color: var(--bad); }

/* Daten */
textarea { width: 100%; font: .85rem/1.35 ui-monospace, Menlo, Consolas, monospace; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px; resize: vertical; }
.msg { background: var(--card); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 8px; }
.file { display: inline-flex; gap: 10px; align-items: center; font-weight: 700; flex-wrap: wrap; }
.file input { font: inherit; font-weight: 400; max-width: 100%; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.prog { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 10px; }
.ptop { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: flex-end; }
.pnum { display: flex; align-items: baseline; gap: 10px; }
.pnum b { font-family: var(--display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.pnum span { color: var(--muted); }
.psel { display: flex; flex-direction: column; gap: 2px; font-size: .88rem; color: var(--muted); }
.psel select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; max-width: 100%; }
.chart { width: 100%; height: auto; display: block; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .gt { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .ar { fill: var(--accent); opacity: .14; }

.chart .dm { fill: var(--accent); }
.chart .la { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .da { fill: var(--card); stroke: var(--muted); stroke-width: 1.5; }
.chart .dc { fill: var(--gold); stroke: var(--card); stroke-width: 1.5; }
.empty { padding: 18px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .88rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend.big { color: var(--ink); font-size: .95rem; }
.sw { display: inline-block; width: 14px; height: 10px; border-radius: 3px; }
.sw-m { background: var(--accent); } .sw-a { background: none; border-top: 2px dashed var(--muted); height: 0; }
.sw-c { background: var(--gold); transform: rotate(45deg); width: 10px; }
.sw-s { background: var(--good); } .sw-p { background: var(--accent); } .sw-w { background: var(--warn); } .sw-n { background: var(--line); }
.key { display: grid; gap: 6px; }
.ah { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.gvx { font-size: .78rem; font-weight: 700; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--muted); white-space: nowrap; }
.bsp { color: var(--muted); font-size: .88rem; margin: 2px 0 0; }
.lvt { font-size: .9rem; color: var(--muted); }
.step { margin-left: auto; display: inline-flex; gap: 6px; }
.bart { margin: 0; font-size: .9rem; color: var(--muted); }
.bart b { color: var(--ink); }

.mode { display: grid; gap: 8px; }
.mode .hint { margin: 0; }
.wkt { margin: 14px 0 4px; }
.wk { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; height: 56px; align-items: end; }
.wb { display: flex; align-items: flex-end; height: 100%; background: var(--bg); border-radius: 4px; overflow: hidden; }
.wb i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; }
.ch { font-size: 1rem; margin: 14px 0 6px; }
.prog .ch { margin-top: 0; }
.wk { height: 84px; align-items: stretch; }
.wc { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wb { flex: 1; background: var(--line); height: auto; }
.wc em { font-style: normal; font-size: .68rem; color: var(--muted); text-align: center; }

.sq { display: inline-flex; align-items: stretch; vertical-align: middle; line-height: 1.2; margin: 0 .1em; }
.rs { width: .72em; flex: none; height: auto; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: miter; vector-effect: non-scaling-stroke; }

.rad { border-top: 1.7px solid currentColor; padding: .1em .15em 0 .08em; }

.bar i { height: 100%; border-radius: 99px; }
.mode { border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 12px; padding: 12px 14px; background: var(--bg); }

.btn.checkbtn { background: var(--gold); color: #261a00; border-color: var(--gold); font-weight: 700; }
.btn.checkbtn:hover { filter: brightness(1.06); }
.warn { background: var(--bad-bg); border: 2px solid var(--bad); border-radius: 14px; padding: 18px; display: grid; gap: 10px; margin-top: 18px; }
.warn h2 { font-size: 1.3rem; margin: 0; }
.warn p { margin: 0; }
.fbox { display: inline-flex; flex-direction: column; align-items: center; gap: 5px; vertical-align: middle; }
.fbox .ansbox { min-width: 4.6ch; min-height: 1.5em; justify-content: center; cursor: pointer; border-bottom: 0; border-radius: 8px; border: 2px solid var(--line); }

.chart .lf { fill: none; stroke: var(--gold); stroke-width: 2.5; stroke-dasharray: 6 4; }

.area.ready { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.btn.up { background: var(--gold); color: #261a00; border-color: var(--gold); font-weight: 700; }
.upbox { background: var(--card); border: 2px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
.stats small { font-size: .9rem; color: var(--muted); font-weight: 400; }
.stats { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
/* Link zurück zur Mathematik-Seite: liegt im oberen Innenabstand, verschiebt nichts; im Training ausgeblendet. */
body { position: relative; }

<script>
'use strict';
// ---------- Hilfsfunktionen ----------
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const P = a => a[Math.floor(Math.random() * a.length)];
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clean = n => Math.abs(n) > 1e6 ? Math.round(n * 1e4) / 1e4 : Math.round(n * 1e9) / 1e9;
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function fmt(n) {
  n = clean(n);
  const neg = n < 0;
  let s = String(Math.abs(n));
  if (s.includes('e')) s = Math.abs(n).toFixed(6).replace(/0+$/, '');
  let [i, d] = s.split('.');
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '−' : '') + i + (d ? ',' + d : '');
}
const MINUS = '−';

// ---------- Bereiche ----------
const AREAS = [
  { id: 'mal',    titel: 'Einmaleins & Teilen',          bsp: '7 · 8,  56 : 7',             t: 6,  gvx: 'G4' },
  { id: 'plus',   titel: 'Plus & Minus',                 bsp: '47 + 8,  100 − 64',          t: 9,  gvx: 'G4' },
  { id: 'ganz',   titel: 'Ganze Zahlen',                 bsp: '−3 − 4,  (−2) · (−5)',       t: 10, gvx: 'G4' },
  { id: 'stell',  titel: 'Stellenwert & Dezimalzahlen',  bsp: '3,4 · 10,  0,7 + 0,5',       t: 10, gvx: 'G2' },
  { id: 'rund',   titel: 'Runden & Überschlag',          bsp: '3,47 auf Zehntel',           t: 12, gvx: 'V2' },
  { id: 'mass',   titel: 'Maße umwandeln',               bsp: '2,5 m = ? cm',               t: 12, gvx: 'G2' },
  { id: 'bruch',  titel: 'Brüche, Dezimalzahlen & Prozent', bsp: '¼ von 20,  10 % von 60',  t: 14, gvx: 'G4' },
  { id: 'bruchr', titel: 'Bruchrechnen',                 bsp: '½ + ¼,  ⅔ · ¾',              t: 18, gvx: 'G4' },
  { id: 'pot',    titel: 'Potenzen & Wurzeln',           bsp: '2⁵,  √144',                  t: 10, gvx: 'G4' },
  { id: 'geo',    titel: 'Geometrie-Basics',             bsp: 'Umfang, Fläche, Winkel',     t: 20, gvx: 'G3' },
  { id: 'gleich', titel: 'Terme & Gleichungen',          bsp: '3x = 12,  2 + 3 · 4',        t: 18, gvx: 'G2' },
  { id: 'begr',   titel: 'Begriffe',                     bsp: 'Quotient, normal, Sekante',  t: 15, gvx: 'G2/G3' },
  { id: 'zmeng',  titel: 'Zahlenmengen & Teilgebiete',   bsp: 'ℕ, ℤ, ℚ, Algebra?',          t: 14, gvx: 'G1/V1' },
  { id: 'extra',  titel: 'Zahlenwerte & Kopfrechentricks', bsp: '4987 · 5013,  Tage im Jahr', t: 25, gvx: 'X1' },
];
const MAXL = 4;

// ---------- Aufgaben-Einheiten ----------
const UNITS = [];
const add = (area, lvl, key, make, uniq) => UNITS.push({ key, area, lvl, make, uniq: !!uniq || key.includes(':') });
const E = (q, a) => ({ q: q + ' =', a: clean(a), inline: true });          // Rechenausdruck
const W = (q, a, unit) => ({ q, a: clean(a), unit: unit || '' });           // Textaufgabe
const GL = (q, a) => ({ q, a: clean(a), pre: 'x =' });                      // Gleichung
const MC = (q, correct, wrongs, why) => {
  const all = shuf([correct, ...[...new Set(wrongs)].filter(w => w !== correct)]);
  return { q, opts: all, ok: all.indexOf(correct), why: why || '' };
};

// --- Einmaleins & Teilen (Einzelfakten) ---
function mulLvl(a, b) { if ([2, 5, 10].includes(a) || [2, 5, 10].includes(b)) return 1; return a <= 4 ? 2 : 3; }
for (let a = 2; a <= 10; a++) for (let b = a; b <= 10; b++) {
  const L = mulLvl(a, b);
  add('mal', L, `mal:${a}x${b}`, () => { const f = Math.random() < .5 ? [a, b] : [b, a]; return E(`${f[0]} · ${f[1]}`, a * b); });
  add('mal', L, `durch:${a}x${b}`, () => { const d = Math.random() < .5 ? a : b; return E(`${a * b} : ${d}`, a * b / d); });
}
for (const a of [11, 12]) for (let b = 2; b <= 9; b++) {
  add('mal', 4, `mal:${a}x${b}`, () => { const f = Math.random() < .5 ? [a, b] : [b, a]; return E(`${f[0]} · ${f[1]}`, a * b); });
  add('mal', 4, `durch:${a}x${b}`, () => { const d = Math.random() < .5 ? a : b; return E(`${a * b} : ${d}`, a * b / d); });
}
add('mal', 4, 'mal.zehner', () => { const a = R(2, 9) * 10, b = R(3, 9); return E(`${a} · ${b}`, a * b); });

add('bruch', 4, 'bruch.vergl', () => {
  const L = [[1, 2], [2, 3], [3, 4], [3, 5], [2, 5], [5, 8], [4, 5], [5, 6], [1, 3], [3, 8]];
  let x, y; do { x = P(L); y = P(L); } while (x === y || x[0] * y[1] === y[0] * x[1]);
  const bigger = x[0] * y[1] > y[0] * x[1] ? x : y;
  const o = shuf([x, y]).map(f => `{${f[0]}/${f[1]}}`);
  return { q: 'Welcher Bruch ist größer?', opts: o, ok: o.indexOf(`{${bigger[0]}/${bigger[1]}}`), why: `${fmt(x[0] / x[1])} und ${fmt(y[0] / y[1])}: im Kopf in Dezimalzahlen umrechnen hilft.` };
});

add('begr', 1, 'begr.gerade', () => {
  const ev = 2 * R(6, 49), od = []; while (od.length < 3) { const x = 2 * R(5, 49) + 1; if (!od.includes(x)) od.push(x); }
  return MC('Welche Zahl ist gerade?', String(ev), od.map(String), 'Gerade Zahlen enden auf 0, 2, 4, 6 oder 8.');
});
add('begr', 2, 'begr.vielfaches', () => {
  const k = R(3, 9), c = k * R(3, 12), w = new Set(); while (w.size < 3) { const x = k * R(2, 12) + R(1, k - 1); if (x !== c) w.add(x); }
  return MC(`Welche Zahl ist ein Vielfaches von ${k}?`, String(c), [...w].map(String), `${c} = ${k} · ${c / k}`);
});
add('begr', 2, 'begr.teiler', () => {
  const n = P([12, 18, 20, 24, 30, 36, 42]), ds = []; for (let d = 3; d <= n / 2; d++) if (n % d === 0) ds.push(d);
  const c = P(ds), w = new Set(); while (w.size < 3) { const x = R(3, n - 1); if (n % x !== 0) w.add(x); }
  return MC(`Welche Zahl ist ein Teiler von ${n}?`, String(c), [...w].map(String), `${n} : ${c} = ${n / c}, ohne Rest.`);
});
add('begr', 2, 'begr.prim', () => {
  const c = P([11, 13, 17, 19, 23, 29, 31, 37]), w = shuf([21, 27, 33, 39, 49, 51, 57, 91]).slice(0, 3);
  return MC('Welche Zahl ist eine Primzahl?', String(c), w.map(String), 'Die anderen lassen sich in kleinere Faktoren zerlegen, z. B. 21 = 3 · 7.');
});
add('begr', 3, 'begr.mittelwert', () => {
  const m = R(6, 15), d1 = R(1, 3), d2 = R(4, 5), nums = shuf([m - d1, m + d1, m - d2, m + d2]);
  return { q: `Mittelwert von ${nums.join(', ')} =`, a: m, inline: true };
});

const SUPM = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const sup = n => String(n).split('').map(c => SUPM[c]).join('');
const sg = n => n < 0 ? MINUS + Math.abs(n) : String(n);          // Zahl mit echtem Minuszeichen
const par = n => n < 0 ? `(${MINUS}${-n})` : String(n);
const fr = (n, d) => `{${n}/${d}}`;
const lcm = (a, b) => a / gcd(a, b) * b;
const FR = (q, n, d, extra) => {
  const g = gcd(Math.abs(n), d), nn = n / g, dd = d / g;
  return Object.assign({ q, a: n / d, frac: true, ansText: dd === 1 ? String(nn) : `{${nn}/${dd}}`, inline: true }, extra || {});
};
const pool = (area, lvl, prefix, items, mk) => items.forEach((it, i) => add(area, lvl, `${prefix}:${i}`, () => mk(it), true));

function bigRound(intStr, fracStr, k) {
  if (k >= 0) { const v = BigInt(intStr), m = 10n ** BigInt(k); if (k === 0) return Number(v + (fracStr[0] >= '5' ? 1n : 0n)); return Number(((v + m / 2n) / m) * m); }
  const j = -k; let s = BigInt(intStr + fracStr.slice(0, j)); if (fracStr[j] >= '5') s += 1n;
  const str = s.toString().padStart(j + 1, '0'); return Number(str.slice(0, -j) + '.' + str.slice(-j));
}
const rnd = n => String(R(0, 9)).repeat(0) + String(n);
function randNum(intLen, fracLen) { let i = String(R(1, 9)); for (let x = 1; x < intLen; x++) i += R(0, 9); let f = ''; for (let x = 0; x < fracLen; x++) f += R(0, 9); return [i, f]; }

// ---- ext3: Satz des Pythagoras in vielen Formen (Gleichung mit wechselnden Buchstaben, Umformungen, Hypotenuse erkennen, rechtwinkelig?, Rechnen mit Alltagskontext)
const PSETS = [['a', 'b', 'c'], ['p', 'q', 'r'], ['x', 'y', 'z'], ['k', 'l', 'm'], ['u', 'v', 'w']];
const TRI = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29], [9, 40, 41], [6, 8, 10]];
const pythSet = () => { const s = P(PSETS), sw = Math.random() < 0.5; return sw ? [s[1], s[0], s[2]] : s; };   // [Kathete, Kathete, Hypotenuse]
const sq2 = v => v + '²';

add('geo', 3, 'pyth.formel', () => {
  const [a, b, c] = pythSet();
  const q = P([
    `Ein rechtwinkeliges Dreieck hat die Katheten ${a} und ${b} und die Hypotenuse ${c}. Welche Gleichung stimmt?`,
    `Im rechtwinkeligen Dreieck ist ${c} die längste Seite (Hypotenuse), ${a} und ${b} sind die Katheten. Was gilt?`,
    `Satz des Pythagoras: Die Hypotenuse heißt ${c}. Welche Gleichung ist richtig?`]);
  return MC(q, `${sq2(a)} + ${sq2(b)} = ${sq2(c)}`, [`${a} + ${b} = ${c}`, `${sq2(a)} − ${sq2(b)} = ${sq2(c)}`, `${sq2(c)} + ${sq2(a)} = ${sq2(b)}`], `Die Quadrate der Katheten ergeben zusammen das Quadrat der Hypotenuse: ${sq2(a)} + ${sq2(b)} = ${sq2(c)}.`);
});
add('geo', 3, 'pyth.worte', () => MC(P(['Der Satz des Pythagoras sagt in Worten:', 'Was besagt der Satz des Pythagoras?', 'Im rechtwinkeligen Dreieck gilt: Das Quadrat über der Hypotenuse ist …']),
  'gleich der Summe der Quadrate über den Katheten', ['gleich dem Produkt der Katheten', 'gleich der Summe der beiden Katheten', 'gleich der Differenz der Quadrate über den Katheten'], 'Fläche des Hypotenusenquadrats = Fläche des einen Kathetenquadrats + Fläche des anderen.'));
add('geo', 3, 'pyth.umform', () => {
  const [a, b, c] = pythSet();
  const forms = [[`${sq2(c)} − ${sq2(a)} = ${sq2(b)}`], [`${sq2(c)} − ${sq2(b)} = ${sq2(a)}`], [`${sq2(b)} = ${sq2(c)} − ${sq2(a)}`], [`${sq2(a)} = ${sq2(c)} − ${sq2(b)}`]];
  return MC(P([`Es gilt ${sq2(a)} + ${sq2(b)} = ${sq2(c)}. Welche Gleichung folgt daraus?`, `Aus ${sq2(a)} + ${sq2(b)} = ${sq2(c)} wird umgeformt. Welche Gleichung stimmt auch?`]),
    P(forms)[0], [`${sq2(c)} + ${sq2(a)} = ${sq2(b)}`, `${sq2(a)} − ${sq2(c)} = ${sq2(b)}`, `${c} − ${a} = ${b}`], 'Subtrahiere auf beiden Seiten ein Kathetenquadrat. Das Quadrat der Hypotenuse steht immer allein vorne oder hinter dem Minus.');
});
add('geo', 3, 'pyth.hyp', () => {
  const T = P([['A', 'B', 'C'], ['P', 'Q', 'R'], ['X', 'Y', 'Z'], ['D', 'E', 'F']]), i = R(0, 2), s = T.map(v => v.toLowerCase());
  return MC(`Im Dreieck ${T.join('')} liegt der rechte Winkel bei ${T[i]}. Welche Seite ist die Hypotenuse?`, s[i], s.filter((_, k) => k !== i), `Die Hypotenuse liegt dem rechten Winkel gegenüber. Gegenüber von ${T[i]} liegt die Seite ${s[i]}.`);
});
add('geo', 3, 'pyth.recht', () => {
  const t = P(TRI).map(v => v * R(1, 2)), s = t.slice();
  if (Math.random() < 0.5) s[R(0, 2)] += P([-1, 1, 2]);
  const m = Math.max(...s), rest = s.filter((v, k) => k !== s.indexOf(m)), stimmt = rest[0] * rest[0] + rest[1] * rest[1] === m * m;
  return MC(`Ein Dreieck hat die Seiten ${shuf(s.slice()).join(' cm, ')} cm. Ist es rechtwinkelig?`, stimmt ? 'Ja' : 'Nein', [stimmt ? 'Nein' : 'Ja'],
    `Quadrate der beiden kürzeren Seiten addieren und mit dem Quadrat der längsten vergleichen: ${rest[0]}² + ${rest[1]}² = ${rest[0] * rest[0] + rest[1] * rest[1]}, ${m}² = ${m * m}.`);
});
add('geo', 3, 'pyth.quad', () => {
  const t = P(TRI), k = P([1, 1, 2]), a = t[0] * k, b = t[1] * k;
  if (Math.random() < 0.5) return W(`Die Katheten sind ${a} cm und ${b} cm lang. Wie groß ist a² + b²?`, a * a + b * b, 'cm²');

});

function parseNum(s) {
  s = String(s).trim().replace(/\u2212/g, '-').replace(/\s|\u202f/g, '').replace(',', '.').replace(/%$/, '');
  if (!s || s === '-' || s === '.') return NaN;
  if (s.includes('/')) { const [a, b] = s.split('/'); const x = Number(a), y = Number(b); return y ? x / y : NaN; }
  return Number(s);
}
function checkAnswer(task, input) {
  if (task.opts) return input === task.ok;
  const x = parseNum(input);
  if (!Number.isFinite(x)) return false;
  if (task.tol) return Math.abs(x - task.a) <= task.tol * Math.abs(task.a);
  if (Math.abs(x - task.a) >= 1e-9) return false;
  if (task.red && String(input).includes('/')) {
    const [p, q] = String(input).replace(/\u2212/g, '-').split('/').map(Number);
    return gcd(Math.abs(p), Math.abs(q)) === 1;
  }
  return true;
}
function answerText(t) {
  if (t.opts) return t.opts[t.ok];
  if (t.ansText) return t.ansText + (t.unit ? ' ' + t.unit : '');
  return (t.tol ? 'ca. ' : '') + fmt(t.tol ? Number(t.a.toPrecision(4)) : t.a) + (t.unit ? ' ' + t.unit : '');
}

const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function areaStats(id) {

function snapshot() {

  S.hist[dayKey()] = { g: Math.round(overall().pct * 10) / 10, a };

}

const measure = m => m === 'check' || m === 'up';      // Messungen: verändern den Übungsstand nicht
const checksFor = id => S.checkups.filter(c => id === 'g' ? !c.part : c.res && c.res[id]);
const UPW = 2, UPN = 6, UPOK = 5;                                  // Niveau-Check: 2 Aufwärmaufgaben (aktuelles Niveau, zählen nicht) + 6 Aufgaben auf dem nächsten Niveau, ab 5 richtig steigt man auf
function weakAreas() {                                    // Bereiche mit Übungsbedarf: zuletzt unter 85 % richtig

    .filter(x => x.n >= 5 && x.acc < 0.85).sort((p, q) => p.acc - q.acc).slice(0, 5).map(x => x.id);
}

// ---------- Auswahl ----------
const qk = q => String(q).slice(0, 90);
function unitWeight(u, lvl) {

    if (Date.now() - s.last >= INT[s.box] * DAY) w *= 2.5; else w *= 0.25;
  }
  w *= (u.lvl === lvl ? 1 : u.lvl < lvl ? 0.5 : 0.15);
  if (sess.recent.includes(u.key)) w *= 0.03;
  if (S.rk && S.rk.includes(u.key)) { const s0 = S.units[u.key]; w *= measure(sess.mode) ? 0.1 : u.uniq ? (s0 && s0.n && s0.box <= 1 ? 0.5 : 0.08) : 0.4; }   // über Sitzungen hinweg Abwechslung

}
function wpick(items, wf) {

}
function pickUnit(aid, exact, lvlOver) {

}
function pickAreaMixed() {
  return wpick(AREAS, a => {

// ---------- Training ----------
let screen = 'home', sess = null, DL = null, dataMsg = '', confirmReset = false, histSel = 'g', chkKind = 'all', chkSel = [];

function startSession(mode, areaId, opt) {
  opt = opt || {};
  let areas = AREAS.map(x => x.id), per = PER_AREA_CHECK, total = S.len || 25, plan = null;
  if (mode === 'check') {
    if (opt.areas && opt.areas.length) { areas = opt.areas; per = 3; }
    total = areas.length * per;
    for (let t = 0; t < 60; t++) { plan = shuf(areas.flatMap(a => Array(per).fill(a))); if (areas.length < 2 || !plan.some((x, i) => i && x === plan[i - 1])) break; }
  } else if (mode === 'up') { total = UPW + UPN; plan = Array(UPW + UPN).fill(areaId); }

  screen = 'train'; nextTask();
}
function nextTask() {
  if (sess.done >= sess.total) return finish();
  let unit, task, retry = false;
  const qi = sess.queue.findIndex(q => q.at <= sess.done);
  if (qi >= 0) { unit = sess.queue.splice(qi, 1)[0].unit; task = unit.make(); retry = true; }
  else {
    const aid = measure(sess.mode) ? sess.plan[sess.done] : sess.areaId || pickAreaMixed();
    let tries = 0;
    const hist = S.rq || (S.rq = []), rk = S.rk || (S.rk = []);
    const weak = u => { const s = S.units[u.key]; return !measure(sess.mode) && s && s.n && s.box <= 1; };   // Fehlerkandidaten dürfen wiederkehren
    do { unit = pickUnit(aid, measure(sess.mode), sess.mode === 'up' ? Math.min(MAXL, aState(aid).lvl + (sess.done >= UPW ? 1 : 0)) : 0); task = unit.make(); tries++; }
    while (tries < 30 && (sess.seenQ.has(task.q) || (hist.includes(qk(task.q)) && !weak(unit))));
    sess.seenQ.add(task.q); sess.used.add(unit.key);
    hist.push(qk(task.q)); if (hist.length > 500) hist.splice(0, hist.length - 500);
    rk.push(unit.key); if (rk.length > 120) rk.splice(0, rk.length - 120);

}

// Bruch-Aufgaben haben zwei Felder (Zähler über Nenner): c.input = Zähler, c.inp2 = Nenner, c.field = aktives Feld
const fld = c => (c.task.frac && c.field === 1 ? 'inp2' : 'input');
function showInput() {

  const e1 = document.getElementById('ans'), e2 = document.getElementById('ans2');
  if (e1) e1.textContent = c.input; if (e2) e2.textContent = c.inp2 || '';
  const b0 = document.getElementById('f0'), b1 = document.getElementById('f1');

}
function setField(i) {

}
function typeKey(k) {
  const c = sess && sess.cur; if (!c || c.answered || c.task.opts) return;
  const fr = c.task.frac, f = fld(c);
  if (k === '/') { if (fr) setField(c.field === 1 ? 0 : 1); return; }
  if (c[f].length >= (fr ? 6 : 12)) return;

// Absolute Zahlen: jede beantwortete Aufgabe (Training und Check-up) zählt für heute, gesamt und den Bereich
function areaTot(id) {

}
function countTask(area, ok, ms) {

// Check-up-Verlauf: richtig in % je Check-up (gesamt oder je Bereich)
function chkVal(c, id) { if (id === 'g') return c.g; const r = c.res[id]; return r && r[1] ? Math.round(1000 * r[0] / r[1]) / 10 : null; }

function chart() {
  const id = histSel, cs = checksFor(id).map(c => ({ c, v: chkVal(c, id) })).filter(x => x.v != null).slice(-12);
  const empty = !cs.length;
  const W = 640, H = 190, L = 40, Rr = 16, T = 16, B = 30, iw = W - L - Rr, ih = H - T - B;
  const x = i => L + (cs.length <= 1 ? iw / 2 : iw * i / (cs.length - 1)), y = v => T + ih * (1 - v / 100);
  const fd = t => { const d = new Date(t); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; };

  if (empty) return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Noch keine Check-ups">${grid}<text class="gt" x="${W / 2}" y="${H / 2 + 4}" text-anchor="middle">Hier erscheinen deine Check-up-Ergebnisse. Der erste ist dein Startwert.</text></svg>`;
  const path = cs.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const fs = cs.map((p, i) => ({ i, v: chkFast(p.c, id) })).filter(q => q.v != null);
  const fpath = fs.map((p, k) => (k ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const fdots = fs.map(p => `<circle class="df" cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4"><title>${Math.round(p.v)} % richtig und zügig</title></circle>`).join('');
  const dots = cs.map((p, i) => `<circle class="dm" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="5"><title>${fd(p.c.t)} ${Math.round(p.v)} % richtig</title></circle><text class="gv" x="${x(i).toFixed(1)}" y="${(y(p.v) - 10).toFixed(1)}" text-anchor="middle">${Math.round(p.v)} %</text><text class="gt" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${fd(p.c.t)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ergebnisse der Check-ups im Verlauf">${grid}${cs.length > 1 ? `<path class="lm" d="${path}"/>` : ''}${fs.length > 1 ? `<path class="lf" d="${fpath}"/>` : ''}${fdots}${dots}</svg>${fs.length ? '<p class="legend"><span><i class="sw sw-m"></i>richtig</span><span><i class="sw sw-f"></i>richtig und zügig</span></p>' : ''}`;
}
function week() {

  for (let i = 0; i < 14; i++) { const e = S.days[dayKey(d)]; out.push({ n: e ? e.n : 0, d: d.getDate() + '.' + (d.getMonth() + 1) + '.', w: wd[d.getDay()] }); d.setDate(d.getDate() + 1); }

}

function vHome() {

      <p class="bart">${tot[1] ? `<b>${tot[1]}</b> Aufgaben geübt · zuletzt <b>${acc} %</b> richtig` : 'Noch nicht geübt'}</p>

    </article>`;
  }).join('');
  const opts = `<option value="g"${histSel === 'g' ? ' selected' : ''}>Alle Bereiche</option>` + AREAS.map(a => `<option value="${a.id}"${histSel === a.id ? ' selected' : ''}>${esc(a.titel)}</option>`).join('');
  return `<main class="wrap">${vNeu()}
    <header class="top"><h1>Kopfrechentrainer</h1><p class="lead">Jeden Tag ein paar Minuten. Was noch wackelt, kommt öfter. Was sitzt, kommt nur noch selten.</p></header>

function vTrain() {
  const c = sess.cur, t = c.task, area = areaOf(c.unit.area), pct = Math.round(100 * sess.done / sess.total);
  const head = `<div class="thead"><button class="btn ghost small" data-act="quit">Beenden</button>
    <div class="prog-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${sess.total}" aria-valuenow="${sess.done}"><i style="width:${pct}%"></i></div>
    <span class="cnt">${Math.min(sess.done + (c.answered ? 0 : 1), sess.total)} / ${sess.total}</span></div>
    <p class="tag">${esc(area.titel)}${sess.mode === 'check' ? ' · Check-up' : sess.mode === 'up' ? ' · Niveau-Check' : ''}${c.retry ? ' · noch einmal' : ''}</p>`;
  let body;

    body = `<h2 class="q small">${rich(t.q)}</h2><div class="opts">${t.opts.map((o, i) => {
      let cls = 'opt';

      return `<button class="${cls}" data-act="opt" data-i="${i}" ${c.answered ? 'disabled' : ''}><kbd>${i + 1}</kbd><span>${rich(o)}</span></button>`;
    }).join('')}</div>`;
  } else {
    const st = c.answered ? (c.ok ? ' right' : ' wrong') : '';
    const box = t.frac
      ? `<span class="fbox"><span id="f0" class="ansbox${st}${!c.answered && c.field !== 1 ? ' act' : ''}" data-act="fld" data-i="0"><span id="ans" class="ans" role="textbox" aria-label="Zähler">${esc(c.input)}</span></span><span class="fline" aria-hidden="true"></span><span id="f1" class="ansbox${st}${!c.answered && c.field === 1 ? ' act' : ''}" data-act="fld" data-i="1"><span id="ans2" class="ans" role="textbox" aria-label="Nenner">${esc(c.inp2)}</span></span></span>`
      : `<span class="ansbox${st}"><span id="ans" class="ans" role="textbox" aria-label="Deine Antwort">${esc(c.input)}</span></span>`;

    else body = `<h2 class="q small">${rich(t.q)}</h2><div class="line${t.frac ? ' fl' : ''}">${t.pre ? `<span class="q">${esc(t.pre)}</span>` : ''}${box}${unit}</div>`;
    if (!c.answered && t.frac) body += '<p class="hint fh">Oben der Zähler, unten der Nenner. Mit ↕ oder einem Tipp auf das Feld wechselst du. Ist das Ergebnis eine ganze Zahl, bleibt der Nenner leer.</p>';
    if (!c.answered) body += keypad(t);

  let fb = '';

    const ans = answerText(t);

      : `<div class="fb bad" role="status"><p><b>Das stimmt nicht.</b> Richtig ist: <span class="rt">${rich(ans)}</span></p>${t.why ? `<p class="why">${rich(t.why)}</p>` : ''}<button id="goOn" class="btn primary" data-act="next">Weiter</button></div>`;
  }
  if (sess.confirmQuit) return `<main class="wrap narrow">${head}<div class="warn" role="alertdialog" aria-labelledby="wt"><h2 id="wt">${sess.mode === 'up' ? 'Niveau-Check' : 'Check-up'} wirklich abbrechen?</h2>
    <p>${sess.mode === 'up' ? 'Bei einem abgebrochenen Niveau-Check steigst du <b>nicht</b> auf.' : 'Ein abgebrochener Check-up wird <b>nicht</b> in deinen Verlauf aufgenommen.'} Du hast ${sess.done} von ${sess.total} Aufgaben geschafft. Die bereits gerechneten Aufgaben zählen trotzdem in deine Gesamtzahl.</p>
    <div class="go"><button class="btn primary" data-act="quitno">Weitermachen</button><button class="btn danger" data-act="quit">Ja, abbrechen</button></div></div></main>`;
  return `<main class="wrap narrow">${head}${body}${fb}</main>`;
}
function keypad(t) {
  const k = ['7', '8', '9', '4', '5', '6', '1', '2', '3', t.frac ? '/' : ',', '0', '−'];
  return `<div class="pad">${k.map(x => x === '/' ? `<button type="button" tabindex="-1" class="kk fn" data-act="key" data-k="/" aria-label="Zwischen Zähler und Nenner wechseln">↕</button>` : `<button type="button" tabindex="-1" class="kk" data-act="key" data-k="${x}">${x}</button>`).join('')}

}

function vSummary() {
  const all = sess.results.filter(r => !r.retry), first = all.filter(r => !r.warm), ok = first.filter(r => r.ok).length;
  const avg = first.length ? Math.round(first.reduce((a, r) => a + r.ms, 0) / first.length / 100) / 10 : 0;
  const per = {}; for (const r of first) { const x = per[r.area] || (per[r.area] = [0, 0, 0]); x[1]++; if (r.ok) x[0]++; if (r.fast) x[2]++; }
  const rows = AREAS.filter(a => per[a.id]).map(a => {
    const [o, n, fz] = per[a.id]; let cmp = '';
    const pr = sess.mode === 'check' && sess.prevBy ? sess.prevBy[a.id] : null;
    if (pr && pr.res[a.id]) { const [po, pn] = pr.res[a.id]; const d = Math.round(100 * o / n) - Math.round(100 * po / pn); cmp = `<span class="cmp ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '▲' : d < 0 ? '▼' : '='} vorher ${po}/${pn}</span>`; }
    return `<li><span>${esc(a.titel)}</span><span class="sc"><b>${o} / ${n}</b>${measure(sess.mode) ? `<span class="cmp">zügig ${fz}</span>` : ''}${cmp}</span></li>`;
  }).join('');
  const seen = new Set(), wob = first.filter(r => !r.ok && !seen.has(r.key) && seen.add(r.key));
  const lv = sess.lvlUps.map(l => `<li>${esc(areaOf(l.area).titel)}: Niveau ${l.from} → ${l.to}${l.to > l.from ? ' 🎉' : ''}</li>`).join('');
  const share = first.length ? ok / first.length : 0;
  const lead = ok === first.length ? 'Alles richtig. Stark.' : share >= 0.8 ? 'Sehr gut gemacht.' : share >= 0.5 ? 'Gut dran. Die Fehler kommen bald wieder vor.' : 'Das war ein harter Durchgang. Genau dafür ist das Training da.';
  let chk = '';
  if (sess.mode === 'check') { const g = Math.round(100 * share), pg = sess.prev ? Math.round(sess.prev.g != null ? sess.prev.g : 0) : null; const fz = Math.round(100 * first.filter(r => r.fast).length / (first.length || 1)); chk = `<p class="lead">Gesamt: ${g} % richtig, davon ${fz} % zügig${pg != null ? ' (letzter Check-up: ' + pg + ' %)' : ''}.</p>`; }
  const ready = sess.readyNow.length ? `<div class="upbox">⭐ <b>Bereit für das nächste Niveau!</b> Teste dich gleich mit einem Niveau-Check (2 Aufwärmaufgaben, dann 6 auf dem nächsten Niveau, ab 5 richtig steigst du auf):<div class="go">${sess.readyNow.map(id => `<button class="btn up" data-act="up" data-id="${id}">${esc(areaOf(id).titel)}: Niveau ${aState(id).lvl + 1} testen</button>`).join('')}</div></div>` : '';
  if (sess.mode === 'up') {
    const u = sess.up, ar = areaOf(sess.areaId);
    return `<main class="wrap narrow"><h1>${u && u.pass ? 'Niveau ' + u.to + ' geschafft! 🎉' : 'Noch nicht ganz'}</h1>
    <p class="big">${ok} von ${first.length} richtig</p>
    <p class="lead">${u && u.pass ? `<b>${esc(ar.titel)}</b> läuft jetzt auf Niveau ${u.to}. Die Aufgaben werden etwas schwerer.` : `Für Niveau ${aState(sess.areaId).lvl + 1} brauchst du ${UPOK} von ${UPN} richtig. Übe noch ein bisschen und versuche es später wieder. Der Niveau-Check bleibt auf der Übersicht.`}</p>
    ${u && !u.pass ? `<div class="go"><button class="btn up" data-act="up" data-id="${sess.areaId}">Noch einmal versuchen</button></div>` : ''}
    <h2 class="sec">Die Aufgaben</h2><ul class="rows plain">${all.map(r => `<li><span>${r.warm ? '<i>Aufwärmen: </i>' : ''}${rich(r.q)}</span><span class="rt">${r.ok ? '✓' : rich(r.ans)}</span></li>`).join('')}</ul>
    
    <div class="go"><button class="btn ${u && u.pass ? 'primary' : ''}" data-act="home">Zur Übersicht</button></div></main>`;

    <h2 class="sec">Nach Bereich</h2><ul class="rows">${rows}</ul>

    ${wob.length ? `<h2 class="sec">Das wackelt noch</h2><ul class="rows plain">${wob.slice(0, 8).map(r => `<li><span>${rich(r.q)}</span><span class="rt">${rich(r.ans)}</span></li>`).join('')}</ul>` : ''}

}

// ---------- Von selbst in eine Datei sichern (21.11.2026, wie im Übungsraum, eigener Code) ----------
// Chrome/Edge (File System Access API): Datei einmal wählen, danach wird nach jeder Änderung von selbst dorthin gesichert.
// Die gewählte Datei merkt sich der Browser (IndexedDB). Nach einem Neustart des Browsers einmal „Sichern“ tippen und
// erlauben. Andere Browser: wie bisher „Als Datei speichern“ (Download). Inhalt der Datei = Lernstand wie im Browser.
const FSA = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function';
const SICHER_DATEI = 'kopfrechentrainer-lernstand.json';
const META = 'kopfrechentrainer-sicherung';        // eigener Schlüssel; KEY bleibt unberührt
let fHandle = null, fErlaubt = false, fMeldung = '', fWartet = null;
const fMeta = () => { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch (e) { return {}; } };
const fMetaSetzen = m => { try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) { } };
const fUngesichert = () => { const m = fMeta(); return (m.geaendert || 0) > (m.zuletzt || 0); };
const fZeit = d => { const x = new Date(d), z = n => String(n).padStart(2, '0'); return `${z(x.getDate())}.${z(x.getMonth() + 1)}.${x.getFullYear()}, ${z(x.getHours())}:${z(x.getMinutes())}`; };
function fDb() {
  return new Promise((ok, no) => {
    if (typeof indexedDB === 'undefined') return no(new Error('kein IndexedDB'));
    const r = indexedDB.open('kopfrechentrainer', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('dateien');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
}
async function fHandleLesen() {
  try { const d = await fDb(); return await new Promise(ok => { const q = d.transaction('dateien').objectStore('dateien').get('lernstand'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; }
}
async function fHandleMerken(h) {
  try { const d = await fDb(); await new Promise(ok => { const t = d.transaction('dateien', 'readwrite'); t.objectStore('dateien').put(h, 'lernstand'); t.oncomplete = ok; t.onerror = ok; }); } catch (e) { }
}
function fNeuZeichnen() { if (screen === 'home' || screen === 'data') keep(); }   // nie mitten in einer Aufgabe
async function fSchreiben() {
  const w = await fHandle.createWritable(); await w.write(JSON.stringify(S)); await w.close();
  const m = fMeta(); m.zuletzt = Date.now(); m.datei = fHandle.name; fMetaSetzen(m);
}
async function fErlauben() {
  try { if (await fHandle.queryPermission({ mode: 'readwrite' }) === 'granted') return true; return await fHandle.requestPermission({ mode: 'readwrite' }) === 'granted'; } catch (e) { return false; }
}
async function fSichern(neueDatei) {                       // Knopf: Datei wählen bzw. jetzt sichern
  if (!FSA) return;
  try {
    if (!fHandle || neueDatei) {
      fHandle = await window.showSaveFilePicker({ suggestedName: SICHER_DATEI, types: [{ description: 'Lernstand Kopfrechentrainer', accept: { 'application/json': ['.json'] } }] });
      await fHandleMerken(fHandle);
    }
    fErlaubt = await fErlauben();
    if (!fErlaubt) fMeldung = 'Sichern wurde nicht erlaubt. Tippe noch einmal auf „Sichern“ und erlaube es.';
    else { await fSchreiben(); fMeldung = `Gesichert in „${fHandle.name}“. Ab jetzt sichert der Trainer von selbst dorthin.`; }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    fErlaubt = false; fMeldung = 'Sichern hat nicht geklappt. Bitte noch einmal versuchen oder eine andere Datei wählen.';
  }
  fNeuZeichnen();
}
async function fOeffnen() {                                // Sicherungsdatei laden und danach weiter dorthin sichern
  try {
    const [h] = await window.showOpenFilePicker({ types: [{ description: 'Lernstand Kopfrechentrainer', accept: { 'application/json': ['.json'] } }] });
    const text = await (await h.getFile()).text();
    let o = null; try { o = JSON.parse(text); } catch (e) { }
    if (!o || o.v !== 1 || typeof o.units !== 'object') { importJSON(text); return; }   // meldet den Fehler
    fHandle = h; await fHandleMerken(h); fErlaubt = await fErlauben(); fMeldung = '';
    importJSON(text);
  } catch (e) { if (!(e && e.name === 'AbortError')) { dataMsg = 'Die Datei ließ sich nicht öffnen.'; render(); } }
}
function nachSpeichern() {                                 // nach jedem save(): merken und ggf. mitsichern
  if (!FSA) return;
  const m = fMeta(); m.geaendert = Date.now(); fMetaSetzen(m);
  if (fHandle && fErlaubt) { clearTimeout(fWartet); fWartet = setTimeout(() => { fWartet = null; fSchreiben().catch(() => { fErlaubt = false; fNeuZeichnen(); }); }, 400); }
}
function vSicherung() {                                    // Abschnitt auf der Seite „Lernstand“
  if (!FSA) return '';
  const m = fMeta();
  let stand, knoepfe;
  if (!fHandle) { stand = 'Noch keine Datei gewählt.'; knoepfe = '<button class="btn primary" data-act="fsave">Sicherungsdatei wählen</button>'; }
  else if (fErlaubt) { stand = `✓ Sichert von selbst in „${esc(fHandle.name)}“${m.zuletzt ? `, zuletzt am ${fZeit(m.zuletzt)}` : ''}.`; knoepfe = '<button class="btn" data-act="fnew">Andere Datei wählen</button>'; }
  else { stand = `Datei „${esc(fHandle.name)}“: Nach einem Neustart des Browsers bitte einmal sichern und erlauben.`; knoepfe = '<button class="btn primary" data-act="fsave">Sichern</button><button class="btn" data-act="fnew">Andere Datei wählen</button>'; }
  return `<h2 class="sec">Von selbst sichern</h2>
    <p class="hint">Wähle einmal eine Datei, am besten <code>${SICHER_DATEI}</code> im selben Ordner wie der Trainer. Danach sichert der Trainer nach jeder Aufgabe von selbst dorthin. Auf einem anderen Gerät lädst du sie unten mit „Datei wählen“.</p>
    ${fMeldung ? `<p class="msg" role="status">${esc(fMeldung)}</p>` : ''}
    <p class="hint">${stand}</p><div class="go">${knoepfe}</div>`;
}
function vSicherKurz() {                                   // Zeile auf der Startseite
  if (!FSA || !fHandle) return '';
  if (fErlaubt) return `<p class="sicher ok">✓ Gesichert in „${esc(fHandle.name)}“</p>`;
  return `<p class="sicher offen">Noch nicht in „${esc(fHandle.name)}“ gesichert. <button class="btn small" data-act="fsave">Sichern</button></p>`;
}

// ---------- Ereignisse ----------
document.addEventListener('mousedown', e => { if (e.target.closest('.kk')) e.preventDefault(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'mixed') startSession('mixed');
  else if (a === 'check') { const ar = chkKind === 'all' ? null : (chkKind === 'weak' ? weakAreas() : chkSel.slice()); if (ar && !ar.length) return; startSession('check', null, { areas: ar }); }
  else if (a === 'ck') { chkKind = b.dataset.k; keep(); }
  else if (a === 'up') startSession('up', b.dataset.id);
  else if (a === 'area') startSession('area', b.dataset.id);
  else if (a === 'len') { S.len = +b.dataset.n; save(); keep(); }
  else if (a === 'lvl') { const s = aState(b.dataset.id); s.lvl = Math.max(1, Math.min(MAXL, s.lvl + +b.dataset.d)); s.win = []; s.ready = false; save(); keep(); }
  else if (a === 'fld') setField(+b.dataset.i);
  else if (a === 'key') typeKey(b.dataset.k);
  else if (a === 'back') backKey();
  else if (a === 'submit') submit();
  else if (a === 'opt') submit(+b.dataset.i);
  else if (a === 'next') advance();
  else if (a === 'quit' && measure(sess.mode) && !sess.confirmQuit) { clearTimeout(sess.cur && sess.cur.timer); sess.confirmQuit = true; render(); }
  else if (a === 'quitno') { sess.confirmQuit = false; const c = sess.cur; if (c && c.answered && c.ok) advance(); else render(); }
  else if (a === 'quit') { clearTimeout(sess && sess.cur && sess.cur.timer); if (measure(sess.mode)) { screen = 'home'; render(); } else if (sess.results.length) { sess.total = sess.done; finish(); } else { screen = 'home'; render(); } }
  else if (a === 'again') startSession(sess.mode, sess.areaId);
  else if (a === 'home') { screen = 'home'; dataMsg = ''; confirmReset = false; render(); }
  else if (a === 'data') { screen = 'data'; dataMsg = ''; render(); }
  else if (a === 'dl' && !DL) { try { const bl = new Blob([JSON.stringify(S)], { type: 'application/json' }), u = URL.createObjectURL(bl), l = document.createElement('a'); l.href = u; l.download = 'kopfrechentrainer-lernstand-' + dayKey() + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); dataMsg = 'Datei gespeichert.'; } catch (e) { dataMsg = 'Speichern ist hier nicht möglich. Kopiere stattdessen den Text.'; } render(); }
  else if (a === 'dl') DL.save({ filename: 'kopfrechentrainer-lernstand-' + dayKey() + '.json', data: JSON.stringify(S) }).then(() => { dataMsg = 'Datei gespeichert.'; render(); }).catch(err => { dataMsg = err && err.code === 'declined' ? 'Speichern abgebrochen.' : 'Speichern ist hier nicht möglich. Kopiere stattdessen den Text.'; render(); });
  else if (a === 'copy') { const ta = document.getElementById('dump'); ta.select(); let ok = false; try { ok = navigator.clipboard ? (navigator.clipboard.writeText(ta.value), true) : document.execCommand('copy'); } catch (x) { try { ok = document.execCommand('copy'); } catch (y) { } } dataMsg = ok ? 'Text kopiert. Füge ihn in eine Notiz oder Datei ein.' : 'Kopieren hat nicht geklappt. Der Text ist markiert, bitte mit Strg+C kopieren.'; const m = document.querySelector('.msg'); if (m) m.textContent = dataMsg; else render(); }
  else if (a === 'fsave') fSichern(false);
  else if (a === 'fnew') fSichern(true);
  else if (a === 'fopen') fOeffnen();
  else if (a === 'loadtext') importJSON(document.getElementById('paste').value);
  else if (a === 'reset') { confirmReset = true; keep(); }
  else if (a === 'noreset') { confirmReset = false; keep(); }
  else if (a === 'reset2') { S = blank(); save(); confirmReset = false; dataMsg = 'Lernstand gelöscht.'; render(); }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.act === 'cksel') { const id = e.target.dataset.id; chkSel = e.target.checked ? [...chkSel, id] : chkSel.filter(x => x !== id); keep(); return; }
  if (e.target.id === 'file' && e.target.files[0]) { const r = new FileReader(); r.onload = () => importJSON(String(r.result)); r.readAsText(e.target.files[0]); }
  if (e.target.id === 'histSel') { histSel = e.target.value; keep(); }
});
document.addEventListener('keydown', e => {
  if (screen !== 'train' || !sess || !sess.cur || sess.confirmQuit || e.ctrlKey || e.metaKey || e.altKey) return;
  const c = sess.cur;
  if (c.answered) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advance(); } return; }
  if (c.task.opts) { const n = Number(e.key); if (n >= 1 && n <= c.task.opts.length) submit(n - 1); return; }
  if (/^[0-9]$/.test(e.key)) typeKey(e.key);
  else if (e.key === ',' || e.key === '.') typeKey(',');
  else if (e.key === '/' || e.key === 'Tab' || e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (c.task.frac) { e.preventDefault(); setField(e.key === 'ArrowUp' ? 0 : e.key === 'Tab' ? (c.field === 1 ? 0 : 1) : 1); } }
  else if (e.key === '-' || e.key === '−') typeKey('−');
  else if (e.key === 'Backspace') { e.preventDefault(); backKey(); }
  else if (e.key === 'Enter') { e.preventDefault(); submit(); }
});

if (OFFLINE) document.documentElement.classList.add('offline');
if (FSA) fHandleLesen().then(async h => { if (!h) return; fHandle = h; try { fErlaubt = await h.queryPermission({ mode: 'readwrite' }) === 'granted'; } catch (e) { fErlaubt = false; } fNeuZeichnen(); });
// Rückfrage beim Schließen nur, wenn eine Datei gewählt ist, Neues fehlt und gerade nicht von selbst gesichert werden kann
if (FSA) window.addEventListener('beforeunload', e => {
  if (!fHandle) return;
  if (fErlaubt) { if (fWartet) { clearTimeout(fWartet); fWartet = null; fSchreiben().catch(() => { }); } return; }
  if (fUngesichert()) { e.preventDefault(); e.returnValue = ''; }
});
if (OFFLINE && FASSUNG && navigator.onLine !== false && typeof fetch === 'function') {
  try {
    fetch(WEBSEITE + 'version.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null)
      .then(v => { if (v && v.nummer && istNeuer(v.nummer, FASSUNG.nummer)) { neueFassung = v; if (screen === 'home') render(); } }).catch(() => { });
  } catch (e) { }
}
try { if (window.claude && claude.use) claude.use('downloads').then(d => { DL = d || null; if (screen === 'data') render(); }).catch(() => { }); } catch (e) { }
render();

</script>
