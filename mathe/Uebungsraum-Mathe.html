<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathe-Übungsraum 7/8</title>
<style>
/* kern/stil.css */
/* Übungsraum, Kern: fachneutrales Aussehen. Karopapier wie das Infoportal; eine schmale Spalte,
   große Tipp-Flächen, eine Aufgabe pro Bildschirm. Die Fachfarbe (--ink, --ink-soft) legt fach.css
   des jeweiligen Fachs fest; G/V/X und die Bewertungssymbole sind in allen Fächern gleich. */
:root{
  --paper:#ffffff; --bg:#f4f7fb; --grid:#dde6f2; --ink:#1f4e8c; --ink-soft:#e4edf8;
  --text:#1c2533; --muted:#5a6678; --line:#d3dce8;
  --g:#2e8b57; --g-soft:#e2f2e9; --v:#b7790c; --v-soft:#fbefd6; --x:#c0394a; --x-soft:#f8e0e3;
  --ok:#2e8b57; --bad:#c0394a;
  /* Schriften wie die Infoseite: nur Schriften des Geräts (kein Nachladen, funktioniert ohne Internet) */
  --f-display:"Roboto Slab", Rockwell, Georgia, serif;
  --f-body:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1a2230; --bg:#111823; --grid:#1d2735; --ink:#8db5ec; --ink-soft:#1f3150;
  --text:#e7ecf3; --muted:#a2adbd; --line:#2c3748;
  --g:#6cc596; --g-soft:#1b3428; --v:#e3b04f; --v-soft:#3a2e15; --x:#ef7f8d; --x-soft:#3d1f25;
  --ok:#6cc596; --bad:#ef7f8d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a2230; --bg:#111823; --grid:#1d2735; --ink:#8db5ec; --ink-soft:#1f3150;
  --text:#e7ecf3; --muted:#a2adbd; --line:#2c3748;
  --g:#6cc596; --g-soft:#1b3428; --v:#e3b04f; --v-soft:#3a2e15; --x:#ef7f8d; --x-soft:#3d1f25;
  --ok:#6cc596; --bad:#ef7f8d; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:17px/1.55 var(--f-body);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(1.8rem,5vw,2.4rem)}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.back{background:none;border:none;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;border-radius:6px;padding:1px 8px;font-size:.9rem}
.cg{color:var(--g);background:var(--g-soft)} .cv{color:var(--v);background:var(--v-soft)} .cx{color:var(--x);background:var(--x-soft)}
button.big,a.big{font:inherit;font-weight:700;font-size:1.05rem;border-radius:14px;border:2px solid var(--ink);
  background:var(--ink);color:var(--paper);padding:12px 20px;cursor:pointer;min-height:52px}
button.big.alt{background:var(--paper);color:var(--ink)}
button.big:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--v);outline-offset:2px}
.sym{width:1.25em;height:1.25em;vertical-align:-.25em;flex:none}
/* Übersicht */
.topic{display:flex;flex-direction:column;gap:8px}
.reiter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.reiter button{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:99px;padding:8px 14px;min-height:44px;cursor:pointer}
.reiter button.an{background:var(--ink);color:var(--paper)}
.comp{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font:inherit;color:inherit;width:100%}
.comp.active{cursor:pointer;border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.comp.active:hover{transform:translateY(-1px)}
.comp .txt{flex:1;min-width:0}
.comp .soon{font-size:.85rem;color:var(--muted)}
.meter{height:12px;border-radius:99px;background:var(--ink-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .4s}
/* Aufgaben */
.task{font-size:clamp(1.6rem,6vw,2.3rem);font-weight:700;text-align:center;letter-spacing:.01em;font-variant-numeric:tabular-nums;padding:8px 0;overflow-wrap:anywhere}
.task.text{font-size:1.2rem;font-weight:400;text-align:left}
.answer{display:flex;gap:8px;justify-content:center;align-items:stretch;flex-wrap:wrap}
.answer input{font:inherit;font-size:1.6rem;font-weight:700;width:9ch;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);padding:8px}
.sign{font:inherit;font-size:1.6rem;font-weight:700;width:3.2rem;border-radius:12px;border:2px solid var(--line);background:var(--ink-soft);color:var(--ink);cursor:pointer}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{font:inherit;font-size:1.2rem;font-weight:700;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer}
.choices button.sel{border-color:var(--ink);background:var(--ink-soft)}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--g-soft);color:var(--text)} .fb.no{background:var(--x-soft);color:var(--text)}
.fb b.t{color:var(--ok)} .fb.no b.t{color:var(--bad)}
.steps{font-variant-numeric:tabular-nums;font-weight:700}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--g);display:block}
.dots i.on{background:var(--g)}
.progress{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.95rem;color:var(--muted)}
/* Stationen */
.stations{display:flex;flex-direction:column;gap:8px}
.station{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.station .txt{flex:1;min-width:0}
.station.need{border-color:var(--v);box-shadow:inset 4px 0 0 var(--v)}
.station.done{opacity:.85}
.badge{font-size:.8rem;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.b-need{background:var(--v-soft);color:var(--v)} .b-done{background:var(--g-soft);color:var(--g)} .b-opt{background:var(--ink-soft);color:var(--ink)}
/* Erklärung */
.rule{border-left:4px solid var(--ink);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:6px}
.ex{font-variant-numeric:tabular-nums;background:var(--ink-soft);border-radius:8px;padding:6px 10px;font-weight:700}
/* Ergebnis und Verlauf */
.verdict{display:flex;align-items:center;gap:14px}
.verdict .sym{width:3rem;height:3rem}
.verdict .pct{font-family:var(--f-display);font-size:2.4rem;color:var(--ink);font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.review div{display:flex;gap:10px;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0;flex-wrap:wrap}
.hist{display:flex;flex-direction:column;gap:6px}
.hist svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.reset{background:none;border:none;color:var(--muted);text-decoration:underline;font:inherit;font-size:.85rem;cursor:pointer;padding:0;align-self:flex-start}
/* Eingabe in mehreren Schritten */
.selfform{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.lbl{font-weight:700;color:var(--muted);text-align:center;font-size:.95rem}
.answer input.wide{width:12ch}
.answer input.tiny{width:3.2ch}
.newex{align-self:flex-start;font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);background:var(--ink-soft);border:1px solid var(--line);border-radius:10px;padding:6px 14px;cursor:pointer}
.nw{white-space:nowrap}
.tablewrap{overflow-x:auto}
.mini{border-collapse:collapse;font-size:.95rem;width:100%}
@media (max-width:480px){.mini{font-size:.82rem}.mini th,.mini td{padding:5px 6px!important}}
.mini th,.mini td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.mini thead th{background:var(--ink-soft)}
.walk{display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease-out}
/* Weitere Antwortformen (kern/formen.js): Bild, Auswahlgruppen, Reihenfolge, Zuordnen, Zahlfelder */
.bild{display:flex;justify-content:center}
.bild svg{width:100%;max-width:360px;height:auto;display:block}
.choices.drei{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.drei button{font-size:1rem;padding:12px 6px;hyphens:manual;overflow-wrap:break-word}
.choices.lang{grid-template-columns:1fr}
.choices.lang button{font-size:1.05rem;font-weight:600;text-align:left}
.choices.einheiten{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.choices.einheiten button{font-size:1rem;padding:8px 2px}
.rf-liste{margin:0;padding-left:1.8em;display:flex;flex-direction:column;gap:6px;min-height:2.8em;border:2px dashed var(--line);border-radius:12px;padding-block:8px;padding-right:8px}
.rf-liste li::marker{font-weight:700;color:var(--ink)}
.rf-ablage{display:flex;flex-direction:column;gap:6px}
.rf-karte,.zo-ding{font:inherit;text-align:left;font-size:1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;width:100%}
.rf-karte.fest{background:var(--ink-soft);color:var(--muted);cursor:default}
.zo-ding{width:auto;display:inline-flex;align-items:center;gap:6px}
.zo-ding.sel{border-color:var(--ink);background:var(--ink-soft);box-shadow:0 0 0 2px var(--ink)}
.zo-ding svg{width:78px;height:auto;display:block}
.zo-ziele{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.zo-ziel,.zo-ablage{border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:3.2em;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.zo-drin{display:flex;flex-wrap:wrap;gap:6px}
.zo-titel{font-weight:700;color:var(--muted);font-size:.9rem}
.zo-raster{display:grid;gap:4px;align-items:stretch}
.zo-kopf{font-weight:700;font-size:.8rem;color:var(--muted);text-align:center;align-self:end;overflow-wrap:anywhere}
.zo-kopf.zeile{text-align:right;align-self:center;writing-mode:horizontal-tb}
.zo-raster .zo-ziel{min-height:3.6em;padding:4px}
.zo-raster .zo-ding,.zo-ziele .zo-ding.bild-ding{padding:4px 8px}
.zo-raster .zo-ding svg{display:none}
.zo-ding .nr{font-weight:700;color:var(--ink)}
.answer input.zahl{width:8ch}
.einheit{align-self:center;font-weight:700;font-size:1.3rem}
/* Fortschritt sichern/laden und Hinweis auf neue Fassung (kern/sicherung.js) */
.sicherung{gap:10px}
button.link{font:inherit;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer}
.neuefassung{background:var(--v-soft);border:2px solid var(--v);border-radius:14px;padding:12px 16px}
.neuefassung a{color:var(--ink);font-weight:700}
.sicherklein{font:inherit;font-size:.85rem;font-weight:700;border-radius:99px;padding:5px 12px;min-height:36px;cursor:pointer;white-space:nowrap}
.sicherklein.ok{background:var(--g-soft);color:var(--g);border:1px solid var(--g)}
.sicherklein.offen{background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
/* Zahlfelder untereinander bündig, auch wenn nur manche eine Einheit haben: gleich viel Platz links und rechts */
.answer.mitE::before{content:"";min-width:2.6em}
.answer.mitE .einheit{min-width:2.6em;text-align:left}
/* Liste nach dem Check: Teile einer Antwort grün (richtig), rot (falsch) oder orange (teilweise) */
.rv-ok{color:var(--ok)} .rv-no{color:var(--bad)} .rv-halb{color:var(--v)}
/* Felder in einer Zeile mit Text dazwischen (t.zeile, z. B. P( … | … )), passt auch auf 360 px */
.answer.zeile{flex-wrap:nowrap;align-items:center;gap:4px}
.answer.zeile .zt{font-size:1.6rem;font-weight:800;white-space:nowrap}
.answer.zeile .zf{display:flex;gap:3px;align-items:stretch;min-width:0}
.answer.zeile .sign{width:2.5rem;font-size:1.3rem}
.answer.zeile input.zahl{width:4.6ch;font-size:1.4rem;padding:8px 2px}
</style>
<style>
/* Mathe/fach.css */
/* Mathe: Fachfarbe (Heft-Blau) und Aussehen der Mathe-Bausteine (Zahlengerade mit Männchen,
   Zwischenschritt, Vorzeichenschritt). */
:root{
  --ink:#1f4e8c; --ink-soft:#e4edf8;
  --c1:#1f4e8c; --cop:#b84f00; --c2:#00805d; --cop-soft:#fbe7d9; --c2-soft:#d9f1e8;   /* Rechnung: erste Zahl, Rechenzeichen, zweite Zahl (auch bei Farbsehschwäche unterscheidbar) */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#8db5ec; --ink-soft:#1f3150;
  --c1:#8db5ec; --cop:#ff9a52; --c2:#3ccf9f; --cop-soft:#3f2717; --c2-soft:#133a2e}}
:root[data-theme="dark"]{
  --ink:#8db5ec; --ink-soft:#1f3150;
  --c1:#8db5ec; --cop:#ff9a52; --c2:#3ccf9f; --cop-soft:#3f2717; --c2-soft:#133a2e}
.numline{width:100%;height:auto;display:block}
.pair{border-bottom:3px solid var(--muted);border-radius:0 0 6px 6px;padding:0 2px}
.c1{color:var(--c1);font-weight:800} .cop{color:var(--cop);background:var(--cop-soft);font-weight:800;border-radius:6px;padding:0 .32em;margin:0 .05em} .c2{color:var(--c2);font-weight:800}
.sg{color:var(--v);font-weight:800}
.hl{font-weight:800;border-bottom:3px solid var(--text);padding:0 2px}
.ex .pair{border-bottom-width:2px}
.ex .muted{font-weight:400}
.legend3{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.legend3 li{display:flex;gap:8px;align-items:center}
.steps3{font-size:1rem}
.steps3 li{align-items:flex-start}
.steps3 .num{margin-top:.15em}
.num{flex:none;width:1.5em;height:1.5em;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--paper)}
.n1{background:var(--c1)} .n2{background:var(--cop)} .n3{background:var(--c2)}
.pairm{border-bottom:3px solid var(--v);border-radius:0 0 6px 6px;padding:0 2px}
.pairm b,.hlm{color:var(--v);font-weight:800}
.sgn{display:inline-block;min-width:1.35em;text-align:center;border-radius:6px;padding:0 .28em;font-weight:800;background:var(--cop-soft);color:var(--cop);line-height:1.35}
.sgn.o{background:var(--cop-soft);color:var(--cop)}
.moves{margin:0;padding-left:1em;display:flex;flex-direction:column;gap:10px}
.pics{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;color:var(--muted);font-size:.9rem}
.mm{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--ink-soft);border-radius:10px;padding:6px 8px}
.mm{width:94px;padding:5px 4px!important}
.mm figcaption{font-size:.72rem;color:var(--text);text-align:center;line-height:1.25}
.mini-move{width:72px;height:auto}
.mini th.corner{font-weight:400;font-size:.8rem;color:var(--muted)}
.walkbox{display:flex;flex-direction:column;gap:6px}
.walkbox .st{opacity:0;transition:opacity .35s}
.walkbox.s1 .st1,.walkbox.s2 .st2,.walkbox.s3 .st3{opacity:1}
.exhead{font-size:1.15rem}
.stepbtn{display:flex;gap:8px;align-items:flex-start;font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:10px;padding:4px 8px 4px 4px;cursor:pointer;text-align:left;width:100%}
.stepbtn .num{margin-top:.1em}
.stepbtn:hover{border-color:var(--line)}
.walkbox:not(.s1) [data-step="1"] .num,.walkbox:not(.s2) [data-step="2"] .num,.walkbox:not(.s3) [data-step="3"] .num{outline:2px dashed var(--muted);outline-offset:2px}
.walkbox.s1 [data-step="1"],.walkbox.s2 [data-step="2"],.walkbox.s3 [data-step="3"]{background:var(--ink-soft)}
.slot{display:inline-block;min-width:1.5em;border:2px dashed var(--v);border-radius:8px;color:var(--v);padding:0 .2em}
.bigsign{color:var(--ink)}
ol.walksteps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
/* Terme: Eingabe mit Tasten, Brüche, Auswahl mit längeren Texten, Teile eines Terms (Variable, Konstante, Koeffizient) */
/* Termfelder nutzen die ganze Breite, damit lange Terme (z. B. vier Teilprodukte) ganz sichtbar bleiben */
.answer input.term{flex:1 1 12ch;min-width:0;width:auto;font-size:1.35rem;letter-spacing:.02em}
.tasten{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.taste{font:inherit;font-size:1.15rem;font-weight:700;min-width:2.75rem;min-height:2.75rem;border-radius:10px;border:2px solid var(--line);background:var(--ink-soft);color:var(--ink);cursor:pointer;padding:0 .4em}
.taste.hoch{font-size:1.6rem;line-height:1}
.choices.lang{grid-template-columns:1fr}
.choices.lang button{font-size:1.05rem;font-weight:600;text-align:left}
.bruch{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .1em}
.bruch>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em .05em}
.bruch>span:last-child{padding:.05em .25em 0}
.tv{color:var(--cop);font-weight:800} .tk{color:var(--c1);font-weight:800} .tc{color:var(--c2);font-weight:800}
.luecke{display:inline-block;min-width:1.6em;border:2px dashed var(--v);border-radius:8px;color:var(--v);padding:0 .2em;font-size:.8em;vertical-align:middle}
.flaeche{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
/* Bruch eingeben: Zähler über dem waagrechten Bruchstrich, Nenner darunter */
.bfeld{display:flex;flex-direction:column;align-items:stretch;gap:4px;flex:1 1 12ch;min-width:0}
.bfeld input.term{width:100%;flex:none}
.answer .bfeld ~ button.big{align-self:center}
.bstrich{height:3px;background:var(--ink);border-radius:2px;margin:0 6px}
/* Dreiecke (Mathe/bausteine/dreiecke.js): gleich lange Seiten in --cop, gleich große Winkel in --c2 (Lehrkraft 19.11.2026:
   keine Striche, die bedeuten „parallel“) */
svg.dreieck,svg.koord{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.dr{fill:none;stroke:var(--text);stroke-width:2.5;stroke-linejoin:round}
.dr-gleich{stroke:var(--cop);stroke-width:5;stroke-linecap:round}
.dr-mark{stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-opacity:.55}
.dr-winkel{fill:var(--c2);fill-opacity:.45;stroke:none}
.dr-recht{fill:none;stroke:var(--text);stroke-width:1.6}
.dr-hoehe{stroke:var(--ink);stroke-width:2.2;stroke-dasharray:6 4}
.dr-hilf,.dr-lang{stroke:var(--ink);stroke-width:2.2}
.dr-verl{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:3 4}
.dr-punkt{fill:var(--text)}
.dr-t{fill:var(--text);font-size:17px;font-weight:700;text-anchor:middle;font-family:var(--f-body)}
.dr-t.klein{font-size:14px;font-weight:600}
.dr-nr{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.dr-nrt{fill:var(--ink);font-size:13px;font-weight:700;text-anchor:middle}

<script>
/* kern/basis.js */
/* Übungsraum, Kern: gemeinsamer Namensraum UR, Anmeldung von Fach und Kompetenzen, Hilfsfunktionen
   und die fachneutralen Antwortformen. Jede Datei hängt sich an window.UR an, damit die Seite auch
   ohne Server (Doppelklick) und als eine zusammengefügte Datei läuft. */
(function(UR){
const T = UR.TEXTE;

/* ---------- Anmeldung ---------- */
UR.fach = null;          // genau ein Fach je Seite (Mathe/fach.js)
UR.kompetenzen = {};     // Bausteine, die schon fertig sind, nach ID (z. B. M-RaZa-G2)
UR.formen = {};          // Antwortformen nach t.kind
UR.bindungen = [];       // zusätzliche Ereignisse aus Fachbausteinen (z. B. Zahlengerade antippen)
UR.fachAnmelden = f => { UR.fach = f; };
// Auswahl der Lehrkraft (LEITFADEN.md, „Auswahl der Aufgabentypen“): k.kern = Typen für Checks und Lernweg,
// k.plus = freiwilliges Paket. Das Plus-Paket wird hier als letzte Station angehängt.
UR.kompetenzAnmelden = k => {
  if(k.plus&&k.plus.length) k.stationen = [...k.stationen,
    {id:'PLUS', name:T.plusName, hint:k.plusHint||T.plusHint, types:k.plus, extra:true}];
  UR.kompetenzen[k.id] = k;
};
UR.formAnmelden = (kind, f) => { UR.formen[kind] = f; };

/* ---------- Hilfsfunktionen ---------- */
UR.M = '−';                                                   // echtes Minuszeichen
UR.rnd = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
UR.pick = a => a[Math.floor(Math.random()*a.length)];
UR.zahl = n => n<0?`${UR.M}${-n}`:String(n);                  // Zahl mit echtem Minus
UR.esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Zeilenumbrüche (Wunsch der Lehrkraft, 23.10.2026): keine Zeile beginnt mit = oder einem Rechenzeichen.
   - Rechnungen (Beispielzeilen, Aufgaben, Lösungswege): umbrochen wird nur nach einem Zeichen, das Zeichen bleibt
     am Ende der Zeile (geschütztes Leerzeichen davor).
   - Fließtext: Formeln darin bleiben zusammen, höchstens nach = oder → wird umbrochen; „z. B.“ bleibt beisammen. */
const NB = String.fromCharCode(160);
const ZEICHEN = '=+−·:≠→';
UR.umbruch = s => String(s).replace(new RegExp(` ([${ZEICHEN}])(?= |$)`,"g"), NB+"$1");   // auch „… =“ am Zeilenende
const FORMEL = new RegExp(`[^ ]+(?: [${ZEICHEN}] [^ ]+)+`, 'g');
UR.umbruchText = s => String(s).replace(/z\. B\./g, 'z.'+NB+'B.')
  .replace(FORMEL, f => f.replace(/ /g, NB).replace(new RegExp(NB+'([=→])'+NB,'g'), NB+'$1 '));
const RECHNUNG = '.ex, .exhead, .steps, .task', TEXT = 'p, li, span';
function textKnoten(box, fn){
  const w=document.createTreeWalker(box, NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())) { const t=fn(n.nodeValue); if(t!==n.nodeValue) n.nodeValue=t; }
}
UR.umbruchSetzen = el => { if(!el.querySelectorAll) return;
  el.querySelectorAll(RECHNUNG).forEach(box=>textKnoten(box, UR.umbruch));
  el.querySelectorAll(TEXT).forEach(box=>{ if(!box.closest(RECHNUNG)) textKnoten(box, UR.umbruchText); }); };
/* Einheiten (Lehrkraft 20.11.2026): Eine dazugeschriebene Einheit zählt („43 %“, „7,20 €“, „4,2cm“, „90°“). Eine
   Wo die Einheit ausdrücklich gefragt ist (Einheiten-Tasten), ist eine fehlende Einheit falsch, mit Hinweis. Steht die
   Einheit fest neben dem Feld, genügt die Zahl („43“ bei „… %“). */
const EINHEIT_RE = /^(.*?[0-9̇])\s*(%|‰|€|°C|°|[A-Za-zÄÖÜäöüß*]{1,16}\.?[²³]?)\s*$/;   // auch Abkürzungen mit Punkt (Mio., Mrd.)
UR.einheitAbtrennen = raw => { const s=String(raw??'').trim(), m=s.match(EINHEIT_RE); return m ? {rest:m[1].trim(), e:m[2]} : {rest:s, e:''}; };
UR.leseZahlEinheit = raw => { const {rest,e}=UR.einheitAbtrennen(raw); return {v:UR.leseZahl(rest), e}; };
UR.einheitGleich = (a,b) => String(a??'').replace(/\s/g,'')===String(b??'').replace(/\s/g,'');
UR.lvlChip = l => `<span class="chip ${l==='G'?'cg':l==='V'?'cv':'cx'}">${l}</span>`;
UR.leseZahl = raw => {
  const s=String(raw||'').trim().replace(/−|–/g,'-').replace(/\s/g,'').replace('+','').replace(',','.');   // Komma oder Punkt
  if(s==='')return null; const v=Number(s); return Number.isFinite(v)?v:NaN;
};
// geschriebene Nachkommastellen einer Eingabe (ohne Einheit)
UR.nachkommaGeschrieben = raw => { const m=String(raw??'').trim().replace(/\s/g,'').match(/[.,](\d*)$/); return m?m[1].length:0; };
// kaufmännisch auf n Nachkommastellen runden (ab 5 auf, negative Zahlen vom Betrag aus), Gleitkomma-Reste vorher weg
UR.runde = (a,n) => { const P=10**n, x=Number((Math.abs(a)*P).toPrecision(12)); return Math.sign(a)*Math.floor(x+0.5)/P; };
/* Zahlenantwort prüfen (fachneutral). roh = Eingabe ohne Einheit, v = gelesener Wert (oder umgerechnet), f = Feld:
     f.ans, f.auch (weitere richtige Werte), dazu genau eine Regel:
     f.tol > 0     Messwert: Abstand höchstens tol
     f.stellen = n Stelle genannt: auf genau n Stellen gerundet, mehr geschriebene Stellen sind falsch
     f.offen       offenes Ergebnis: exakter Wert oder Rundung auf 1 bis 3 Stellen (nicht auf Ganze)
     sonst         nur der exakte Wert.
   Ohne Angabe entscheidet das Fach (UR.fach.zahlFall(f, t) → 'offen' | 'exakt'), z. B. nach Größe und Sachaufgabe.
   umgerechnet: Wert kommt aus einer anderen Einheit, die geschriebenen Stellen zählen dann nicht. */
UR.zahlFall = (f,t) => (f.tol||0)>0 ? 'tol' : f.stellen!==undefined&&f.stellen!==null ? 'stellen' : f.offen ? 'offen'
  : f.exakt||f.offen===false ? 'exakt' : (UR.fach.zahlFall&&UR.fach.zahlFall(f,t||{})) || 'exakt';
UR.zahlPasst = (roh, v, f, t, umgerechnet) => {
  if(v===null||v===undefined||Number.isNaN(v)) return false;
  const gl=(x,a)=>Math.abs(x-a)<=1e-9*Math.max(1,Math.abs(a)), d=UR.nachkommaGeschrieben(roh), fall=UR.zahlFall(f,t);
  return [f.ans,...(f.auch||[])].some(a=>{
    if(fall==='tol') return Math.abs(v-a)<=f.tol+1e-9*Math.max(1,Math.abs(a));
    if(fall==='stellen') return gl(v,UR.runde(a,f.stellen)) && (umgerechnet||d<=f.stellen);
    if(fall==='offen'){ if(gl(v,a)) return true; if(umgerechnet) return [1,2,3].some(k=>gl(v,UR.runde(a,k)));
      return d>=1&&d<=3&&gl(v,UR.runde(a,d)); }
    return gl(v,a);
  });
};

/* ---------- Bewertungssymbole wie im Infoportal ---------- */
UR.SYM = {
  ganz:'<svg class="sym" viewBox="0 0 24 24" aria-label="ganz erreicht"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--g)" stroke-width="2.2"/><path d="M5.3 5.3l13.4 13.4M18.7 5.3L5.3 18.7" stroke="var(--g)" stroke-width="2.2"/></svg>',
  halb:'<svg class="sym" viewBox="0 0 24 24" aria-label="halb erreicht"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--v)" stroke-width="2.2"/><path d="M18.7 5.3L5.3 18.7" stroke="var(--v)" stroke-width="2.2"/></svg>',
  nicht:'<svg class="sym" viewBox="0 0 24 24" aria-label="noch nicht erreicht"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--muted)" stroke-width="2.2"/></svg>'
};
UR.bewerte = p => p>=90?'ganz':p>=50?'halb':'nicht';    // ⊗ ab 90 %, ⊘ ab 50 %, sonst ○

/* ---------- Antwortformen ----------
   Jede Form liefert html(t, zustand), bewerten(t, vorauswahl, eingabe, allein) und loesung(t).
   gefuehrt: Form kennt den Einstieg mit Hilfe (Teilschritt vorgegeben, Kind wählt/ergänzt).
   ohneLeer: Auswahlform, der Hinweis „Felder leer lassen“ entfällt. */
UR.eingabeHTML = withSign => `<form class="answer" id="ansForm" autocomplete="off">${withSign?`<button type="button" class="sign" id="signBtn" aria-label="${T.minusSetzen}">${UR.M}</button>`:''}<input id="ans" inputmode="numeric" aria-label="${T.deineAntwort}" placeholder="?"><button class="big" type="submit">${T.ok}</button></form>`;
const lead = t => t.lead?`<p class="muted">${t.lead}</p>`:'';

// Zahl eintippen (mit Minus-Taste, wenn das Fach sie braucht)
UR.formAnmelden('num', {
  html: t => `${lead(t)}<div class="task ${t.text?'text':''}">${UR.esc(t.q)}</div>${UR.eingabeHTML(!!UR.fach.minusTaste)}${t.unit?`<p class="small muted" style="text-align:center">${T.inEinheit(t.unit)}</p>`:''}`,
  bewerten(t,pre,raw){ const {v,e}=UR.leseZahlEinheit(raw), eOk=!e||!t.unit||UR.einheitGleich(e,t.unit);
    if(v===t.ans&&!eOk) t.hinweis=T.einheitPasstNicht(t.unit);
    return {ok:v===t.ans&&eOk,shown:v===null?T.leer:Number.isNaN(v)?String(raw).trim():UR.zahl(v)+(e?' '+e:'')}; },
  loesung: t => typeof t.ans==='number'?UR.zahl(t.ans):t.ans,
  // LZK auf Papier (kern/lzk.js): Rechnung mit Platz für das Ergebnis
  papier: t => ({aufgabe:`<div class="pz-q ${t.text?'text':''}">${UR.esc(t.q)}${t.text?'':' ='}</div>${UR.papier.platz(t.text?2:1)}`,
    loesung: t.stepsh||t.steps ? t.stepsh||UR.esc(t.steps) : UR.esc(typeof t.ans==='number'?UR.zahl(t.ans):t.ans)+(t.unit?' '+UR.esc(t.unit):''), aufwand:t.text?2:1})
});
// Auswahl unter festen Möglichkeiten (t.optionen = [[Wert, Beschriftung], …])
UR.formAnmelden('wahl', {
  ohneLeer: true,
  html: t => `${lead(t)}<div class="task">${UR.esc(t.q)}</div><div class="choices">${t.optionen.map(([v,l])=>`<button data-choice="${v}">${l}</button>`).join('')}</div>`,
  bewerten(t,pre,raw){ return {ok:raw===t.ans,shown:raw}; },
  loesung: t => t.ans,
  papier: t => ({aufgabe:`<div class="pz-q">${UR.esc(t.q)}</div>${UR.papier.ankreuzen(t.optionen)}`,
    loesung:`<div class="pz-q">${UR.esc(t.q)}</div>${UR.papier.ankreuzen(t.optionen, t.ans)}`, statt:true, aufwand:1})
});
})(window.UR = window.UR || {});
</script>
<script>
/* kern/formen.js */
/* Übungsraum, Kern: weitere fachneutrale Antwortformen (LEITFADEN.md, „Antwortformen“, 19.11.2026).
   Alle nutzen das Formular multiForm: Der Kern liest die Felder [data-feld] in ihrer Reihenfolge (ablauf.js).
   - 'fragen':      eine oder mehrere Auswahlfragen auf einem Bildschirm (t.gruppen), auch mehrfach oder im Bild
                    antippen. Antippbare Stellen im Bild tragen data-wg="q<Nummer der Frage>" und data-wert.
   - 'reihenfolge': Kärtchen der Reihe nach antippen (t.karten, t.loesungen = alle richtigen Reihenfolgen,
                    t.fest = so viele Kärtchen sind vorgegeben, z. B. in der leichteren Fassung)
   - 'zuordnen':    Kärtchen antippen, dann das passende Feld (t.dinge, t.ziele, t.ans = {Ding: Ziel}, t.raster)
   - 'zahlen':      ein oder mehrere Zahlfelder (t.felder) mit Toleranz, fester Einheit oder Einheiten-Tasten
   Über der Antwort steht optional ein Bild (t.bild, z. B. SVG). Getippt wird nur, gezogen nie (große Tipp-Flächen,
   auch am Handy). */
(function(UR){
const T = UR.TEXTE, esc = UR.esc;
const ohneTags = s => String(s).replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/<[^>]+>/g,'').replace(/­/g,'').replace(/\s+/g,' ').trim();
const lead = t => t.lead ? `<p class="muted">${t.lead}</p>` : '';
UR.aufgabeKopf = t => `${lead(t)}${t.qh||t.q?`<div class="task ${t.text?'text':''}">${t.qh||esc(t.q)}</div>`:''}${t.bild?`<div class="bild">${t.bild}</div>`:''}`;
const okKnopf = `<div class="answer"><button class="big" type="submit">${T.ok}</button></div>`;

/* ---------- Auswahlknöpfe, die ein verstecktes Feld setzen ---------- */
// schluessel verbindet Knöpfe (data-wg) und Feld (data-wfeld); mehrfach: mehrere Werte, mit Komma getrennt
UR.wahlFeld = schluessel => `<input type="hidden" data-feld data-wfeld="${schluessel}" value="">`;
UR.wahlGruppe = (schluessel, optionen, o={}) => `<div class="choices ${o.klasse||''}" data-wgruppe="${schluessel}"${o.mehrfach?' data-mehrfach="1"':''}>${
  optionen.map(([v,l])=>`<button type="button" data-wg="${schluessel}" data-wert="${esc(v)}">${l}</button>`).join('')}</div>`;
UR.bindungen.push(app=>{ if(!app.querySelector) return;   // Testumgebung ohne DOM
 
  app.querySelectorAll('[data-wg]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.wg, feld=app.querySelector(`[data-wfeld="${k}"]`); if(!feld) return;
    const alle=[...app.querySelectorAll(`[data-wg="${k}"]`)], mehr=!!app.querySelector(`[data-wgruppe="${k}"][data-mehrfach]`);
    if(mehr) b.classList.toggle('sel'); else alle.forEach(x=>x.classList.toggle('sel',x===b));
    feld.value = alle.filter(x=>x.classList.contains('sel')).map(x=>x.dataset.wert).join(',');
  }));
});

/* ---------- 'fragen' ---------- */
const norm = (x,g) => g.mehrfach ? String(x||'').split(',').filter(Boolean).sort().join(',') : String(x??'');
const beschriftung = (g,v) => !v ? T.leer : String(v).split(',').map(w=>{ const o=(g.optionen||[]).find(o=>o[0]===w); return o?ohneTags(o[1]):w; }).join(', ');
UR.formAnmelden('fragen', {
  ohneLeer: true,
  html(t){
    const g=t.gruppen, frage=x=>x.frage?`<p class="lbl">${x.frage}</p>`:'';
    if(g.length===1 && !g[0].imBild && !g[0].mehrfach)        // eine Frage mit Knöpfen: Antippen genügt
      return `${UR.aufgabeKopf(t)}${frage(g[0])}<div class="choices ${g[0].klasse||''}">${g[0].optionen.map(([v,l])=>`<button data-choice="${esc(v)}">${l}</button>`).join('')}</div>`;
    return `${UR.aufgabeKopf(t)}<form class="selfform" id="multiForm" autocomplete="off">${g.map((x,i)=>UR.wahlFeld('q'+i)).join('')}
      ${g.map((x,i)=>`${frage(x)}${x.imBild?'':UR.wahlGruppe('q'+i,x.optionen,x)}`).join('')}${okKnopf}</form>`;
  },
  bewerten(t,pre,raw){
    const l=Array.isArray(raw)?raw:[raw];
    const teile=t.gruppen.map((g,i)=>norm(l[i],g)!=='' && norm(l[i],g)===norm(g.ans,g));
    t.falsch=teile.map(x=>!x);
    const stuecke = t.gruppen.length>1 ? t.gruppen.map((g,i)=>({text:beschriftung(g,norm(l[i],g)), ok:teile[i], soll:beschriftung(g,norm(g.ans,g))})) : null;
    return {ok:teile.every(Boolean), teile, stuecke, shown:t.gruppen.map((g,i)=>beschriftung(g,norm(l[i],g))).join(' · ')};
  },
  loesung: t => t.gruppen.map(g=>beschriftung(g,norm(g.ans,g))).join(' · '),
  // als HTML (Beschriftung der Knöpfe, z. B. Brüche mit waagrechtem Strich); g.ansHTML, wenn es keine Knöpfe gibt (im Bild)
  loesungHTML: t => t.gruppen.map(g=>g.ansHTML || String(norm(g.ans,g)).split(',').map(w=>{ const o=(g.optionen||[]).find(o=>o[0]===w); return o?o[1]:esc(w); }).join(', ')).join(' · ')
});

/* ---------- 'reihenfolge' ---------- */
const karte = (k,fest) => `<button type="button" class="rf-karte${fest?' fest':''}" data-rf="${esc(k.id)}"${fest?' disabled':''}>${k.text}</button>`;
const kurz = (t,id) => { const k=t.karten.find(x=>x.id===id); const s=k?ohneTags(k.kurz||k.text):id; return s.length>28?s.slice(0,26)+'…':s; };
UR.formAnmelden('reihenfolge', {
  ohneLeer: true,
  html(t){
    const vorgabe=t.loesungen[0].slice(0,t.fest||0), rest=t.karten.filter(k=>!vorgabe.includes(k.id));
    return `${UR.aufgabeKopf(t)}<form class="selfform" id="multiForm" autocomplete="off"><input type="hidden" data-feld data-rf-wert value="${esc(vorgabe.join(','))}">
      <ol class="rf-liste" data-rf-liste>${vorgabe.map(id=>`<li>${karte(t.karten.find(k=>k.id===id),true)}</li>`).join('')}</ol>
      <p class="small muted">${T.rfHinweis}</p><div class="rf-ablage" data-rf-ablage>${rest.map(k=>karte(k,false)).join('')}</div>${okKnopf}</form>`;
  },
  bewerten(t,pre,raw){
    const ids=String((Array.isArray(raw)?raw[0]:raw)||'').split(',').filter(Boolean);
    return {ok:t.loesungen.some(l=>l.join(',')===ids.join(',')), shown:ids.length?ids.map(id=>kurz(t,id)).join(' → '):T.leer};
  },
  loesung: t => t.loesungen[0].map(id=>kurz(t,id)).join(' → ')
});
UR.bindungen.push(app=>{ if(!app.querySelector) return;   // Testumgebung ohne DOM
 
  const liste=app.querySelector('[data-rf-liste]'), ablage=app.querySelector('[data-rf-ablage]'), wert=app.querySelector('[data-rf-wert]');
  if(!liste) return;
  const merken = () => { wert.value=[...liste.querySelectorAll('[data-rf]')].map(b=>b.dataset.rf).join(','); };
  app.querySelectorAll('.rf-karte:not(.fest)').forEach(b=>b.addEventListener('click',()=>{
    if(b.closest('[data-rf-ablage]')){ const li=document.createElement('li'); li.appendChild(b); liste.appendChild(li); }
    else { const li=b.parentNode; ablage.appendChild(b); li.remove(); }
    merken();
  }));
});

/* ---------- 'zuordnen' ---------- */
// t.dinge [{id, html, kurz}], t.ziele [{id, text}], t.ans {Ding-ID: Ziel-ID};
// t.raster {zeilen:[[id,text]], spalten:[[id,text]]}: Ziele als Tabelle, Ziel-ID = Zeile|Spalte
UR.formAnmelden('zuordnen', {
  ohneLeer: true,
  html(t){
    const ding = d => `<button type="button" class="zo-ding" data-zo="${esc(d.id)}">${d.html}</button>`;
    const ziel = (id,text) => `<div class="zo-ziel" data-zo-ziel="${esc(id)}" role="button" tabindex="0">${text?`<span class="zo-titel">${text}</span>`:''}<div class="zo-drin"></div></div>`;
    const ziele = t.raster
      ? `<div class="zo-raster" style="grid-template-columns:auto repeat(${t.raster.spalten.length},minmax(0,1fr))"><span></span>${t.raster.spalten.map(([,s])=>`<span class="zo-kopf">${s}</span>`).join('')}${
          t.raster.zeilen.map(([z,zt])=>`<span class="zo-kopf zeile">${zt}</span>${t.raster.spalten.map(([s])=>ziel(`${z}|${s}`,'')).join('')}`).join('')}</div>`
      : `<div class="zo-ziele">${t.ziele.map(z=>ziel(z.id,z.text)).join('')}</div>`;
    return `${UR.aufgabeKopf(t)}<form class="selfform" id="multiForm" autocomplete="off">${t.dinge.map(d=>`<input type="hidden" data-feld data-zo-wert="${esc(d.id)}" value="">`).join('')}
      ${ziele}<p class="small muted">${T.zoHinweis}</p><div class="zo-ablage" data-zo-ablage role="button" tabindex="0"><span class="zo-titel">${T.zoAblage}</span><div class="zo-drin">${t.dinge.map(ding).join('')}</div></div>${okKnopf}</form>`;
  },
  bewerten(t,pre,raw){
    const l=Array.isArray(raw)?raw:[], richtig=t.dinge.map((d,i)=>l[i]===t.ans[d.id]);
    t.falsch=t.dinge.filter((d,i)=>!richtig[i]).map(d=>d.id);
    const k=richtig.filter(Boolean).length;
    return {ok:k===t.dinge.length, shown:T.zoRichtig(k,t.dinge.length), halb:k>0&&k<t.dinge.length};
  },
  loesung: t => t.dinge.map(d=>`${ohneTags(d.kurz||d.html)} → ${zielText(t,t.ans[d.id])}`).join(' · ')
});
function zielText(t,id){
  if(t.raster){ const [z,s]=String(id).split('|'); return ohneTags(`${(t.raster.zeilen.find(x=>x[0]===z)||[,z])[1]} · ${(t.raster.spalten.find(x=>x[0]===s)||[,s])[1]}`); }
  const z=t.ziele.find(x=>x.id===id); return z?ohneTags(z.text):id;
}
UR.bindungen.push(app=>{ if(!app.querySelector) return;   // Testumgebung ohne DOM
 
  const form=app.querySelector('#multiForm'); if(!form||!app.querySelector('[data-zo-ablage]')) return;
  let gewaehlt=null;
  const waehle = b => { app.querySelectorAll('.zo-ding.sel').forEach(x=>x.classList.remove('sel')); gewaehlt=b; if(b) b.classList.add('sel'); };
  const ablegen = (ort,zielId) => { if(!gewaehlt) return; ort.querySelector('.zo-drin').appendChild(gewaehlt);
    form.querySelector(`[data-zo-wert="${gewaehlt.dataset.zo}"]`).value=zielId; waehle(null); };
  app.querySelectorAll('.zo-ding').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); waehle(gewaehlt===b?null:b); }));
  app.querySelectorAll('[data-zo-ziel]').forEach(z=>z.addEventListener('click',()=>ablegen(z,z.dataset.zoZiel)));
  const ab=app.querySelector('[data-zo-ablage]'); ab.addEventListener('click',()=>ablegen(ab,''));
});

/* ---------- 'zahlen' ---------- */
// t.felder [{label, ans, tol | stellen | offen | exakt (Regel: UR.zahlPasst), ansText, einheit (fest daneben), einheiten (Tasten), einheitAns, auch:[weitere richtige Werte]}]
// Ein Fach kann je Feld eigene Eingabe und eigenes Lesen mitbringen (fachneutral, 20.11.2026):
//   f.feldHTML(id) → HTML mit genau einem Element [data-feld] (z. B. Bruchfeld), f.lesen(roh) → Zahl, null (leer) oder NaN,
//   f.formOk(roh) → false, wenn der Wert stimmt, die Form aber nicht (z. B. nicht gekürzt; Feld zählt dann als falsch).
const zahlText = s => String(s??'').trim();
// platz: Felder untereinander stehen bündig, auch wenn nur manche eine Einheit haben (Platz für die Einheit links und rechts)
UR.zahlFeldHTML = (f,i,platz) => `<label class="lbl" for="z${i}">${f.label}</label>
      <div class="answer${platz?' mitE':''}">${f.feldHTML?f.feldHTML('z'+i):`<input id="z${i}" class="zahl" data-feld inputmode="decimal" placeholder="?">`}${f.einheit?`<span class="einheit">${f.einheit}</span>`:platz?'<span class="einheit" aria-hidden="true"></span>':''}</div>${
      f.einheiten?`${UR.wahlFeld('e'+i)}${UR.wahlGruppe('e'+i,f.einheiten.map(e=>[e,e]),{klasse:'einheiten'})}`:''}`;
// liest die Felder aus der Liste l (verbraucht sie von vorn) und bewertet jedes Feld
// Einheit: gewählte Taste, sonst die dazugetippte. Bei Einheiten-Tasten ist sie gefragt: fehlt sie, ist das Feld falsch
// (fehltEinheit → Hinweis). Steht die Einheit fest daneben, genügt die Zahl;
// eine andere Einheit zählt nur richtig umgerechnet (Umrechnung liefert das Fach: UR.umrechner).
UR.zahlFelderBewerten = (felder,l,t) => felder.map(f=>{
  const roh0=l.shift(), wahl=f.einheiten?(l.shift()||''):null, {rest:roh, e:getippt}=UR.einheitAbtrennen(roh0);
  const soll=f.einheiten?f.einheitAns:f.einheit, e=f.einheiten?(wahl||getippt):getippt;
  const v=f.lesen?f.lesen(roh):UR.leseZahl(roh);
  const passt=(w,um)=>f.lesen ? w!==null&&w!==undefined&&!Number.isNaN(w)&&[f.ans,...(f.auch||[])].some(a=>Math.abs(w-a)<=(f.tol||0)+1e-9*Math.max(1,Math.abs(a)))
    : UR.zahlPasst(roh,w,f,t,um);
  const andere=!!e&&!!soll&&!UR.einheitGleich(e,soll);
  const um=andere&&UR.umrechner ? UR.umrechner(v,e,soll) : null, umOk=um!==null&&um!==undefined&&passt(um,true);
  const wertOk=passt(v)||umOk, formOk=!f.formOk||!wertOk||f.formOk(roh);
  return {roh:zahlText(roh), v, e:f.einheiten?e:getippt, wertOk, formOk, zahlOk:wertOk&&formOk, einheitOk:(!andere||umOk)&&!(f.einheiten&&!e),
    fehltEinheit:!!f.einheiten&&!e&&passt(v)};
});
// Teile einer Antwort für die Liste nach dem Check: jedes Feld grün oder rot, bei Rot mit der Lösung
// f.rohHTML(roh) / f.ansHTML: dasselbe als HTML (z. B. Brüche mit waagrechtem Strich, Mathe 21.11.2026)
UR.zahlStuecke = (felder,erg) => erg.map((x,i)=>({text:`${x.roh||'?'}${x.e?' '+x.e:felder[i].einheit?' '+felder[i].einheit:''}`,
  html:felder[i].rohHTML&&x.roh&&!x.e ? felder[i].rohHTML(x.roh) : undefined,
  ok:x.zahlOk&&x.einheitOk, soll:felder[i].ansText, sollHTML:felder[i].ansHTML}));
UR.einheitFehltHinweis = (felder,erg) => { const l=[...new Set(erg.map((x,i)=>x.fehltEinheit&&x.zahlOk?felder[i].einheitAns:null).filter(Boolean))];
  return l.length ? T.einheitDazu(l.join(', ')) : ''; };
// t.zeile {vor, zwischen, nach} (fachneutral, 21.11.2026): alle Felder in einer Zeile mit Text davor, dazwischen und danach,
// z. B. Mathe „P( … | … )“; die Beschriftung der Felder wird dann nur vorgelesen (aria-label)
// t.nachFeldern (fachneutral, 21.11.2026): HTML nach den Feldern, z. B. eine gemeinsame Taste; bei t.zeile rechts in der Zeile
const zeileHTML = t => `<div class="answer zeile"><span class="zt">${t.zeile.vor||''}</span>${t.felder.map((f,i)=>`${i?`<span class="zt">${t.zeile.zwischen||''}</span>`:''}<span class="zf" role="group" aria-label="${esc(ohneTags(f.label))}">${
  f.feldHTML?f.feldHTML('z'+i):`<input id="z${i}" class="zahl" data-feld inputmode="decimal" placeholder="?">`}</span>`).join('')}<span class="zt">${t.zeile.nach||''}</span>${t.nachFeldern||''}</div>`;
UR.formAnmelden('zahlen', {
  html: t => { const platz=t.felder.some(f=>f.einheit);
    return `${UR.aufgabeKopf(t)}<form class="selfform" id="multiForm" autocomplete="off">${t.zeile?zeileHTML(t)
      :t.felder.map((f,i)=>UR.zahlFeldHTML(f,i,platz)).join('')+(t.nachFeldern?`<div class="answer">${t.nachFeldern}</div>`:'')}${okKnopf}</form>`; },
  bewerten(t,pre,raw){
    const erg=UR.zahlFelderBewerten(t.felder, Array.isArray(raw)?[...raw]:[raw], t);
    t.ergebnis=erg;
    t.hinweis = t.hinweisNach ? t.hinweisNach(erg) : (erg.every(x=>x.zahlOk)&&erg.some(x=>!x.einheitOk&&!x.fehltEinheit) ? T.einheitFalsch : '');
    // optional: Felder hängen zusammen (z. B. Probe mit dem eigenen Ergebnis); t.zusammen(erg) → true/false
    const zus = !t.zusammen || t.zusammen(erg);
    if(!zus && erg.every(x=>x.zahlOk&&x.einheitOk) && t.zusammenHinweis) t.hinweis=t.zusammenHinweis;
    if(!t.hinweis) t.hinweis = UR.einheitFehltHinweis(t.felder, erg);
    const stuecke=UR.zahlStuecke(t.felder, erg);
    return {ok:zus&&erg.every(x=>x.zahlOk&&x.einheitOk), shown:stuecke.map(s=>s.text).join(' | '), stuecke:t.felder.length>1?stuecke:null};
  },
  loesung: t => t.felder.map(f=>f.ansText).join(' | '),
  loesungHTML: t => t.felder.map(f=>f.ansHTML||esc(f.ansText)).join(' | ')   // f.ansHTML: z. B. Bruch mit waagrechtem Strich
});

/* ---------- Papierfassungen für die LZK (kern/lzk.js) ----------
   Bild immer mit; Auswahl zum Ankreuzen, Reihenfolge zum Nummerieren, Zuordnen als Tabelle zum Eintragen. */
const P = () => UR.papier;
// Auswahl im Bild (imBild): auf Papier im Bild markieren, die Lösung zeigt das Lösungsbild
UR.formen.fragen.papier = t => {
  const imBild = t.gruppen.some(g=>g.imBild);
  const teil = r => t.gruppen.map(g=>`${g.frage?`<div class="pz-frage">${P().ohneTippen(g.frage)}</div>`:''}${g.imBild
    ? (r?`<div class="pz-loesung">${beschriftung(g,norm(g.ans,g))}</div>`:'')
    : P().ankreuzen(g.optionen, r?String(g.ans).split(','):null, g.klasse==='skizzen'?'bilder':'')}`).join('');
  const ganz = r => P().mitBild(P().angabe(t, imBild)+teil(r), r&&imBild&&t.loesungBild ? t.loesungBild : t.bild);
  return {aufgabe:ganz(false), loesung:ganz(true), statt:true, lead:t.lead||(t.gruppen.every(g=>g.imBild)?T.lzkMarkiere:T.lzkKreuze),
    aufwand:t.gruppen.length>1||t.bild?2:1};
};
UR.formen.reihenfolge.papier = t => {
  const nr = id => t.loesungen[0].indexOf(id)+1;
  const liste = r => `<div class="pz-karten">${t.karten.map(k=>`<div class="pz-karte"><span class="pz-box gross">${r?nr(k.id):''}</span><span>${k.text}</span></div>`).join('')}</div>`;
  const ganz = r => P().mitBild(P().angabe(t)+liste(r), t.bild);
  const andere = t.loesungen.length>1 ? `<div class="pz-loesung">${T.lzkAndereReihenfolge}</div>` : '';
  return {aufgabe:ganz(false), loesung:ganz(true)+andere, statt:true, kreuz:false, lead:t.lead||T.lzkNummeriere, aufwand:2};
};
UR.formen.zuordnen.papier = t => {
  const nr = {}; t.dinge.forEach((d,i)=>nr[d.id]=i+1);
  const inZiel = id => t.dinge.filter(d=>t.ans[d.id]===id).map(d=>nr[d.id]).join(', ');
  const dinge = `<div class="pz-dinge">${t.dinge.map(d=>`<div class="pz-ding">${/class="nr"/.test(d.html)?'':`<b>${nr[d.id]}</b> `}<span>${d.html}</span></div>`).join('')}</div>`;
  const tabelle = r => t.raster
    ? `<table class="pz-tab"><tr><th></th>${t.raster.spalten.map(([,s])=>`<th>${s}</th>`).join('')}</tr>${t.raster.zeilen.map(([z,zt])=>`<tr><th>${zt}</th>${
        t.raster.spalten.map(([s])=>`<td>${r?inZiel(`${z}|${s}`):''}</td>`).join('')}</tr>`).join('')}</table>`
    : `<table class="pz-tab">${t.ziele.map(z=>`<tr><th>${z.text}</th><td>${r?inZiel(z.id):''}</td></tr>`).join('')}</table>`;
  const kopf = `${P().angabe(t)}${dinge}`;
  // mit Bild (z. B. Nummern im Koordinatensystem, M-RaZa-G3): Bild rechts daneben, in der Lösung das Lösungsbild
  return {aufgabe:P().mitBild(kopf+tabelle(false), t.bild), loesung:P().mitBild(kopf+tabelle(true), t.loesungBild||t.bild), statt:true, kreuz:false, lead:t.lead||T.lzkOrdneZu, aufwand:3};
};
UR.formen.zahlen.papier = t => ({
  aufgabe:P().mitBild(`${P().angabe(t)}${P().platz(t.papierPlatz||(t.felder.length>1&&!t.bild?2:1))}${t.zeile
    ? `<div class="pz-feld pz-zeile">${t.zeile.vor||''}${t.felder.map(()=>'<span class="pz-strich"></span>').join(t.zeile.zwischen||'')}${t.zeile.nach||''}</div>`
    : t.felder.map(f=>P().linie(f.label, f.einheit||'')).join('')}`, t.bild),
  loesung:t.felder.map(f=>(f.ansHTML||f.ansText)+(f.tol>=0.1&&f.einheit?` (± ${String(f.tol).replace('.',',')} ${f.einheit})`:'')).join('<br>'), lead:t.lead||undefined, aufwand:t.felder.length>1||t.bild?2:1});
})(window.UR = window.UR || {});
</script>
<script>
/* kern/speicher.js */
/* Übungsraum, Kern: Fortschritt nur in diesem Browser (localStorage), keine Namen.
   Gespeichert wird je Kompetenz-ID: {checks:[…], stations:{…}, path:[…]}. */
(function(UR){
const KEY = 'uebungsraeume-v1';
const PILOT_KEY = 'uebungsraum-v1';   // Pilot RaZa-G2 (Oktober 2026), IDs noch ohne Fachkürzel

function lies(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function load(){
  const s = lies(KEY); if(s) return s;
  // Einmalige Übernahme aus dem Pilot: RaZa-G2 → M-RaZa-G2
  const alt = lies(PILOT_KEY), neu = {};
  if(alt && typeof alt==='object') Object.keys(alt).forEach(id=>{neu['M-'+id]=alt[id]});
  return neu;
}
UR.store = load();
UR.save = function(){try{localStorage.setItem(KEY,JSON.stringify(UR.store))}catch(e){}};
UR.comp = function(id){const s=UR.store;s[id]=s[id]||{checks:[],stations:{},path:null};return s[id]};
UR.lastFinal = c => {const f=c.checks.filter(x=>x.kind==='abschluss');return f[f.length-1]};
UR.lastCheck = c => c.checks[c.checks.length-1];
})(window.UR = window.UR || {});
</script>
<script>
/* kern/ablauf.js */
/* Übungsraum, Kern: Ablauf für ein Kind (LEITFADEN.md, „Ablauf für ein Kind“).
   Übersicht → Eingangscheck → Lernweg mit Stationen (Einstieg mit Hilfe, dann allein) → Abschlusscheck,
   Fortschritt und Verlauf; Plus-Aufgaben freiwillig. Checks werden aus den Kern-Typen zusammengesetzt. Fachneutral: Aufgaben, Stationen, Erklärung und Antwortformen kommen aus den
   angemeldeten Bausteinen (UR.kompetenzen, UR.formen). */
(function(UR){
const T = UR.TEXTE, esc = UR.esc, SYM = UR.SYM, lvlChip = UR.lvlChip;
const NEED_STREAK = 4;   // Station geschafft: so viele richtig hintereinander (nur Aufgaben ohne Hilfe)
const SCAFF = 2;         // so viele richtige Aufgaben mit Hilfe, danach alles allein

let app = null;
let view = {name:'hub'};

/* ---------- Zugriff auf Fach und Bausteine ---------- */
const B = id => UR.kompetenzen[id];
function findeK(id){for(const th of UR.fach.themen){const k=th.kompetenzen.find(x=>x.id===id);if(k)return k}}
const findStation = (id,sid) => B(id).stationen.find(s=>s.id===sid);
const isExtra = (id,sid) => {const s=findStation(id,sid);return !!(s&&s.extra)};
const form = t => UR.formen[t.kind];
// Eingangs- und Abschlusscheck sind parallel: je Kern-Typ gleich viele Aufgaben (jeTyp, sonst 1), neue Zufallswerte
const checkPlan = id => {const K=B(id);return K.kern.flatMap(t=>Array((K.jeTyp&&K.jeTyp[t])||1).fill(t))};
const stationVon = (id,t) => B(id).stationen.find(s=>!s.extra&&s.types.includes(t)).id;
// Üben: Typen mit Fehlern im letzten Check kommen dreimal so oft
const gewichtet = (types,fehler) => types.flatMap(t=>(fehler||[]).includes(t)?[t,t,t]:[t]);
/* Generatoren bekommen den Zusammenhang (fachneutral, Entscheidung der Lehrkraft 19.11.2026):
   modus 'check' | 'station' | 'plus'; nr = im Check die wievielte Aufgabe dieses Typs (jeTyp); einstieg = Station noch im Einstieg mit Hilfe; leicht = Einstieg mit der leichteren Fassung (Typen in k.leicht, die ersten
   SCAFF richtigen Aufgaben einer Station); folge = richtige Aufgaben hintereinander in der Station (z. B. Hilfen
   im Bild abbauen). Ohne Zusammenhang (LZK, Tests) gilt: wie im Check. */
function make(id,type,ctx){const t=B(id).typen[type](ctx||{modus:'check'});t.type=type;if(!t.kind)t.kind='num';return t}
const taskHTML = (t,st) => form(t).html(t, st||{stage:0});
// t.tipp: Hinweis, der auch bei richtiger Antwort erscheint (z. B. Einheit fehlt); die Form setzt ihn beim Bewerten
const evaluate = (t,pre,raw,self) => { t.tipp=''; return form(t).bewerten(t,pre,raw,self); };
// Liste nach dem Check: Antworten mit mehreren Teilen zeigen jeden Teil grün (richtig) oder rot (mit der Lösung)
// s.html / s.sollHTML (optional): dasselbe als HTML, z. B. Brüche mit waagrechtem Strich
const stueckHTML = s => s.ok ? `<b class="rv-ok">${s.html||esc(s.text)}</b>${s.tipp?` <span class="small muted">${T.ohneEinheit}</span>`:''}`
  : `<b class="rv-no">${s.html||esc(s.text)}</b>${s.soll?` → ${s.sollHTML||esc(s.soll)}`:''}`;
function antwortHTML(a){
  if(a.ok) return `<b class="rv-ok">${T.richtig}</b>${a.t.tipp?` <span class="small muted">${T.ohneEinheit}</span>`:''}`;
  if(a.stuecke&&a.stuecke.length) return a.stuecke.map(stueckHTML).join(' · ');
  return `<b class="${a.halb?'rv-halb':'rv-no'}">${esc(a.shown)}</b> → ${correctHTML(a.t)}`;
}
const correctText = t => form(t).loesung(t);
// Lösung zum Anzeigen: als HTML, wenn die Form das kann (z. B. Brüche mit waagrechtem Strich), sonst der Text
const correctHTML = t => form(t).loesungHTML ? form(t).loesungHTML(t) : esc(correctText(t));

function meterPct(id,c){
  const lf=UR.lastFinal(c); if(lf&&lf.rating==='ganz')return 100;
  const need=(c.path||[]).filter(s=>!isExtra(id,s)); const done=need.filter(s=>c.stations[s]&&c.stations[s].done).length;
  let p = c.checks.length?20:0; if(need.length)p+=60*done/need.length; else if(c.checks.length)p+=60;
  if(lf)p=Math.max(p,lf.pct*0.9); return Math.min(99,Math.round(p));
}

/* ---------- Ansicht ---------- */
function go(v){view=v;render();window.scrollTo({top:0})}
function render(){
  const r = {hub:renderHub,thema:renderThema,comp:renderComp,check:renderCheck,result:renderResult,explain:renderExplain,station:renderStation}[view.name];
  app.innerHTML = r(); UR.umbruchSetzen(app); bind();
}

/* Übersicht: Reiter je Gruppe (Mathe: GKÜ), darunter die Themen als Kacheln; ein Thema zeigt seine Kompetenzen */
const gruppen = () => [...new Set(UR.fach.themen.map(th=>th.gruppe))];
const themaVon = id => UR.fach.themen.find(th=>th.kompetenzen.some(k=>k.id===id));
// kleiner Sichern-Knopf oben rechts (kern/sicherung.js): Themen-, Kompetenz- und Ergebnisseite, nicht während Aufgaben
const sk = () => UR.sicherKnopfHTML ? UR.sicherKnopfHTML() : '';
const themaTitel = th => `${th.nummer?th.nummer+' ':''}${esc(th.name)}`;
const REITER_KEY = () => 'uebungsraeume-reiter-'+UR.fach.kuerzel;
let reiterWahl = null;   // gewählter Reiter, zusätzlich in localStorage (wenn erlaubt)
function reiter(){
  const gs=gruppen(); let r=reiterWahl; if(!r)try{r=localStorage.getItem(REITER_KEY())}catch(e){}
  return gs.includes(r)?r:gs[0];
}
function renderHub(){
  const gs=gruppen(), aktiv=reiter();
  const tabs = gs.length>1 ? `<div class="reiter" role="tablist">${gs.map(g=>`<button role="tab" aria-selected="${g===aktiv}" class="${g===aktiv?'an':''}" data-reiter="${esc(g)}">${esc(g)}</button>`).join('')}</div>` : '';
  const kacheln = UR.fach.themen.filter(th=>th.gruppe===aktiv).map(th=>{
    const da=th.kompetenzen.filter(k=>B(k.id)), jahr=th.jahr?` <span class="small muted">${T.jahr(th.jahr)}</span>`:'';
    if(!da.length) return `<div class="comp"><div class="txt"><div>${themaTitel(th)}${jahr}</div><div class="soon">${T.kommtBald}</div></div></div>`;
    const geschafft=da.filter(k=>{const lf=UR.lastFinal(UR.comp(k.id));return lf&&lf.rating==='ganz'}).length;
    const p=Math.round(da.reduce((s,k)=>s+meterPct(k.id,UR.comp(k.id)),0)/da.length);
    return `<button class="comp active" data-thema="${th.kuerzel}"><div class="txt"><div><b>${themaTitel(th)}</b>${jahr}</div>
      <div class="meter" aria-label="${T.fortschrittAria(p)}"><i style="width:${p}%"></i></div>
      <div class="small muted">${T.themaStand(geschafft,da.length,th.kompetenzen.length)}</div></div></button>`;
  }).join('');
  const fassung = UR.versionHTML ? UR.versionHTML() : '';   // kern/sicherung.js
  return `${fassung?fassung.oben:''}<header class="sheet"><h1>${UR.fach.titel}</h1>
    <p>${UR.fach.einleitung||T.einleitung}</p></header>
    <section class="sheet topic">${tabs}${kacheln}</section>
    <p class="small muted">${T.speicherHinweis}</p>
    ${UR.sicherungHTML?UR.sicherungHTML():''}${fassung?fassung.unten:''}`;
}
function renderThema(){
  const th=UR.fach.themen.find(x=>x.kuerzel===view.th);
  const items = th.kompetenzen.map(k=>{
    if(!B(k.id)) return `<div class="comp">${lvlChip(k.lvl)}<div class="txt"><div>${esc(k.text)}</div><div class="soon">${T.kommtBald}</div></div></div>`;
    const c=UR.comp(k.id), lf=UR.lastFinal(c), sym=lf?SYM[lf.rating]:SYM.nicht, p=meterPct(k.id,c);
    return `<button class="comp active" data-go-comp="${k.id}">${lvlChip(k.lvl)}<div class="txt"><div><b>${esc(k.text)}</b></div>
    <div class="meter" aria-label="${T.fortschrittAria(p)}"><i style="width:${p}%"></i></div>
    <div class="small muted">${c.checks.length?T.geschafftProzent(p):T.mitEingangStarten}</div></div>${sym}</button>`;
  }).join('');
  return `<div class="top"><button class="back" data-go="hub">${T.zurUebersicht}</button><span class="row"><span class="small muted">${esc(th.gruppe||'')}${th.jahr?' · '+T.jahr(th.jahr):''}</span>${sk()}</span></div>
    <section class="sheet topic"><h2>${themaTitel(th)}</h2>${items}</section>`;
}

function renderComp(){
  const k=findeK(view.id), K=B(k.id), c=UR.comp(k.id), lf=UR.lastFinal(c), p=meterPct(k.id,c);
  const ex=K.stationen.find(s=>s.extra);
  let next='';
  if(!c.checks.length){
    next=`<p>${T.ersterCheck(checkPlan(k.id).length)}</p>
      <div class="row"><button class="big" data-start="eingang">${T.eingangStarten}</button><button class="big alt" data-go="explain">${T.erklaerungZuerst}</button></div>`;
  } else if(lf&&lf.rating==='ganz'){
    next=`<div class="verdict">${SYM.ganz}<div><h3>${T.kannstDu}</h3><p>${T.kannstDuText}</p></div></div>
      <div class="row"><button class="big alt" data-go="hub">${T.zurNaechsten}</button>${ex?`<button class="big alt" data-station="${ex.id}">${ex.name}</button>`:''}</div>`;
  } else {
    const need=(c.path||[]).filter(s=>!(c.stations[s]&&c.stations[s].done)&&!isExtra(k.id,s));
    next = need.length
      ? `<p>${T.lernweg(NEED_STREAK)}</p>`
      : `<p>${T.lernwegFertig}</p><div class="row"><button class="big" data-start="abschluss">${T.abschlussStarten}</button></div>`;
  }
  const stations = c.checks.length? `<div class="stations">${K.stationen.map(s=>{
      const st=c.stations[s.id]||{}, need=(c.path||[]).includes(s.id)&&!s.extra;
      const badge= st.done?`<span class="badge b-done">${T.badge.geschafft}</span>`: need?`<span class="badge b-need">${T.badge.ueben}</span>`: s.extra?`<span class="badge b-opt">${T.badge.extra}</span>`:`<span class="badge b-done">${T.badge.sitzt}</span>`;
      return `<button class="station ${need&&!st.done?'need':''} ${st.done?'done':''}" data-station="${s.id}"><div class="txt"><b>${s.name}</b><div class="small muted">${s.hint}</div></div>${badge}</button>`;
    }).join('')}</div>`:'';
  const extra = c.checks.length && !(lf&&lf.rating==='ganz') && (c.path||[]).some(s=>!isExtra(k.id,s)&&!(c.stations[s]&&c.stations[s].done))
    ? `<div class="row"><button class="big alt" data-go="explain">${T.erklaerung}</button><button class="big alt" data-start="abschluss">${T.abschlussTrotzdem}</button></div>`
    : c.checks.length?`<div class="row"><button class="big alt" data-go="explain">${T.erklaerung}</button><button class="big alt" data-start="eingang">${T.eingangWiederholen}</button></div>`:'';
  return `<div class="top"><button class="back" data-go="hub">← ${esc(themaVon(k.id).name)}</button><span class="row">${lvlChip(k.lvl)}${sk()}</span></div>
    <section class="sheet"><h2>${esc(k.text)}</h2>
      <div class="meter"><i style="width:${p}%"></i></div>
      <div class="progress"><span>${T.fortschritt}</span><span><b>${p} %</b></span></div>
      ${next}${stations}${extra}</section>
    ${c.checks.length?renderHistory(c):''}
    ${c.checks.length?`<button class="reset" id="reset">${T.loeschen}</button>`:''}`;
}

function renderHistory(c){
  const W=420,H=170,pad=30,n=c.checks.length,bw=Math.min(46,(W-pad*2)/Math.max(n,1)-10);
  const y=v=>H-24-(v/100)*(H-44);
  const bars=c.checks.map((ch,i)=>{const x=pad+i*((W-pad*2)/Math.max(n,1))+5;const col=ch.kind==='abschluss'?'var(--g)':'var(--ink)';
    return `<rect x="${x}" y="${Math.min(y(ch.pct),H-27)}" width="${bw}" height="${Math.max(3,H-24-y(ch.pct))}" rx="5" fill="${col}" opacity="${ch.kind==='abschluss'?1:.55}"/>
      <text x="${x+bw/2}" y="${y(ch.pct)-6}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">${ch.pct}</text>
      <text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Date(ch.d).toLocaleDateString('de-AT',{day:'numeric',month:'numeric'})}</text>`}).join('');
  const grid=[50,90].map(v=>`<line x1="${pad}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${pad-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('');
  return `<section class="sheet hist"><h3>${T.verlauf}</h3>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T.verlaufAria}">${grid}<line x1="${pad}" x2="${W-8}" y1="${H-24}" y2="${H-24}" stroke="var(--line)"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--ink);opacity:.55"></i>${T.eingang}</span><span><i style="background:var(--g)"></i>${T.abschluss}</span><span>${T.verlaufLinien}</span></div></section>`;
}

/* ---------- Check (Eingang / Abschluss) ---------- */
// nr: die wievielte Aufgabe dieses Typs im Check (0, 1, …), z. B. je Richtung eine Aufgabe (M-RaZa-G1, 20.11.2026)
// Keine Wiederholung zwischen den Checks (LEITFADEN „Antwortprüfung und Vielfalt“, 20.11.2026): Jede Aufgabe bekommt
// einen kurzen Fingerabdruck dessen, was das Kind sieht (ohne Reihenfolge der Auswahlknöpfe). Der Check merkt sich die
// Fingerabdrücke (c.zuletzt); der nächste Check würfelt eine Aufgabe neu, wenn sie schon dort oder im selben Check vorkam.
// Bei Typen mit fester Auswahl (wenige verschiedene Aufgaben) bleibt nach 20 Versuchen die letzte.
function fingerabdruck(t){
  const s=JSON.stringify([t.type,t.lead,t.q,t.qh,t.bild,(t.felder||[]).map(f=>f.label),t.s1&&t.s1.label,t.s2&&t.s2.label,(t.gruppen||[]).map(g=>g.frage)]);
  let h=5381; for(let i=0;i<s.length;i++) h=(h*33+s.charCodeAt(i))|0; return (h>>>0).toString(36);
}
function startCheck(kind){
  const plan = checkPlan(view.id), c = UR.comp(view.id), schon = new Set(c.zuletzt||[]);
  const neu = (t,nr) => { let a; for(let n=0;n<20;n++){ a=make(view.id,t,{modus:'check',nr}); if(!schon.has(fingerabdruck(a))) break; } schon.add(fingerabdruck(a)); return a; };
  const items = plan.map((t,i)=>Object.assign(neu(t,plan.slice(0,i).filter(x=>x===t).length),{station:stationVon(view.id,t)})).sort(()=>Math.random()-.5);
  go({name:'check',id:view.id,kind,items,i:0,answers:[]});
}
function renderCheck(){
  const t=view.items[view.i], n=view.items.length;
  return `<div class="top"><button class="back" data-go="comp">${T.abbrechen}</button><span class="small muted">${view.kind==='eingang'?T.eingang:T.abschluss}</span></div>
    <section class="sheet pop"><div class="progress"><span>${T.aufgabeVon(view.i+1,n)}</span><span>${T.ohneZeitdruck}</span></div>
    <div class="meter"><i style="width:${Math.round(view.i/n*100)}%"></i></div>${taskHTML(t,{self:true})}
    ${form(t).ohneLeer?'':`<p class="small muted">${T.leerLassen}</p>`}</section>`;
}
function submitCheck(raw){
  const t=view.items[view.i];
  const e=evaluate(t,null,raw,true);
  view.answers.push(Object.assign({t},e));
  if(view.i+1<view.items.length){view.i++;render();return}
  const ok=view.answers.filter(a=>a.ok).length, pct=Math.round(ok/view.answers.length*100);
  const c=UR.comp(view.id); c.checks.push({kind:view.kind,d:Date.now(),pct,rating:UR.bewerte(pct)});
  c.fehlerTypen=[...new Set(view.answers.filter(a=>!a.ok).map(a=>a.t.type))];
  c.zuletzt=view.items.map(fingerabdruck);
  if(view.kind==='eingang'){
    const wrong=new Set(view.answers.filter(a=>!a.ok).map(a=>a.t.station));
    c.path=B(view.id).stationen.filter(s=>!s.extra&&wrong.has(s.id)).map(s=>s.id);
  }
  UR.save(); go({name:'result',id:view.id,kind:view.kind,answers:view.answers,pct});
}

function renderResult(){
  const c=UR.comp(view.id), r=UR.bewerte(view.pct), ok=view.answers.filter(a=>a.ok).length, n=view.answers.length;
  const ex=B(view.id).stationen.find(s=>s.extra);
  let head,actions;
  if(view.kind==='eingang'){
    if(r==='ganz'){head=`<div class="verdict">${SYM.ganz}<div><div class="pct">${view.pct} %</div><h2>${T.ehSchon}</h2></div></div>
      <p>${T.ehSchonText(ok,n)}</p>`;
      actions=`<button class="big" data-start="abschluss">${T.abschluss}</button>${ex?`<button class="big alt" data-station="${ex.id}">${ex.name}</button>`:''}<button class="big alt" data-go="hub">${T.naechsteKompetenz}</button>`;}
    else {const names=(c.path||[]).map(id=>findStation(view.id,id).name);
      head=`<div class="verdict">${SYM[r]}<div><div class="pct">${view.pct} %</div><h2>${T.lernwegSteht}</h2></div></div>
      <p>${T.lernwegStehtText(ok,n,names.join(', '))}</p>`;
      actions=`<button class="big" data-go="comp">${T.zuMeinemLernweg}</button><button class="big alt" data-go="explain">${T.erklaerungLesen}</button>`;}
  } else {
    head=`<div class="verdict">${SYM[r]}<div><div class="pct">${view.pct} %</div><h2>${T.abschlussTitel[r]}</h2></div></div>
      <p>${T.vonRichtig(ok,n)} ${T.abschlussText[r]}</p>`;
    if(r!=='ganz'){const wrong=new Set(view.answers.filter(a=>!a.ok).map(a=>a.t.station)); const c2=UR.comp(view.id);
      c2.path=B(view.id).stationen.filter(s=>!s.extra&&wrong.has(s.id)).map(s=>s.id); c2.path.forEach(id=>{if(c2.stations[id])c2.stations[id].done=false}); UR.save();}
    actions= r==='ganz'?`<button class="big" data-go="hub">${T.zurUebersichtKnopf}</button>`:`<button class="big" data-go="comp">${T.weiterUeben}</button>`;
  }
  const review=view.answers.map(a=>`<div><span>${esc(a.t.q.length>60?a.t.q.slice(0,58)+'…':a.t.q)}</span><span>${antwortHTML(a)}</span></div>`).join('');
  return `<div class="top"><span class="small muted">${view.kind==='eingang'?T.eingang:T.abschluss}</span>${sk()}</div>
    <section class="sheet pop">${head}<div class="row">${actions}</div></section>
    <section class="sheet"><h3>${T.deineAntworten}</h3><div class="review">${review}</div></section>`;
}

/* ---------- Erklärung (Inhalt kommt vom Baustein) ---------- */
function newExample(kind){B(view.id).erklaerung.neu(kind,view.ex);render()}
function renderExplain(){
  const E=B(view.id).erklaerung, k=findeK(view.id);
  if(!view.ex)view.ex=E.beispiele();
  return `<div class="top"><button class="back" data-go="comp">${T.zurueck}</button>${lvlChip(k.lvl)}</div>
  ${E.html(view.ex)}`;
}

/* ---------- Station üben ---------- */
function stState(){const c=UR.comp(view.id);return c.stations[view.sid]=c.stations[view.sid]||{streak:0,correct:0,tries:0,scaff:0,done:false}}
function newTask(){const s=findStation(view.id,view.sid), st=stState(), K=B(view.id);
  const typ=UR.pick(s.extra?s.types:gewichtet(s.types,UR.comp(view.id).fehlerTypen));
  // leichtere Fassung zum Einstieg: für Typen ohne zwei Schritte, die der Baustein in k.leicht nennt
  view.leicht = !s.extra && (K.leicht||[]).includes(typ) && (st.scaff||0)<SCAFF;
  view.task=make(view.id,typ,{modus:s.extra?'plus':'station',leicht:view.leicht,einstieg:!s.extra&&(st.scaff||0)<SCAFF,folge:st.streak||0});view.fb=null;view.stage=0;view.pre=null;
  view.self = view.leicht || !form(view.task).gefuehrt || (st.scaff||0)>=SCAFF;}
function startStation(sid){view={name:'station',id:view.id,sid};newTask();window.scrollTo({top:0});render()}
function renderStation(){
  const s=findStation(view.id,view.sid), st=stState();
  const dots=Array.from({length:NEED_STREAK},(_,i)=>`<i class="${i<Math.min(st.streak||0,NEED_STREAK)?'on':''}"></i>`).join('');
  const t=view.task, gef=!!form(t).gefuehrt, helped = (gef&&!view.self) || view.leicht;
  let body;
  if(view.fb){
    const f=view.fb;
    const parts = gef&&!view.leicht ? `<span>${t.schritt}: ${f.preOk?T.richtig:T.falsch} · ${T.ergebnis}: ${f.valOk?T.richtig:T.falsch}</span>` : '';
    body=`<div class="task ${t.text?'text':''}">${t.qh||esc(t.q)}</div>
      <div class="fb ${f.ok?'ok':'no'} pop"><b class="t">${f.ok?UR.pick(T.lob):T.nochNicht}</b>${parts}
      ${f.ok?'':`<span>${T.richtigIst(correctHTML(t))}</span>`}
      ${t.tipp?`<span><b>${t.tipp}</b></span>`:''}<span>${t.why}</span>${t.stepsh?`<span class="steps">${t.stepsh}</span>`:t.steps?`<span class="steps">${esc(t.steps)}</span>`:''}</div>
      ${t.zusatzRueckmeldung?t.zusatzRueckmeldung(f):''}
      ${f.nowSelf?`<div class="fb ok pop"><b class="t">${T.abJetztAllein}</b><span>${t.alleinText||T.abJetztVoll}</span></div>`:''}
      ${st.done&&f.justDone?`<div class="fb ok pop"><b class="t">${T.stationGeschafft}</b><span>${T.stationGeschafftText(NEED_STREAK)}</span></div>`:''}
      <div class="row"><button class="big" id="nextTask">${T.naechsteAufgabe}</button><button class="big alt" data-go="comp">${T.zumLernweg}</button></div>`;
  } else body=taskHTML(t,{stage:view.stage,pre:view.pre,preOk:t.pre&&view.pre===t.pre.ans,coach:true,self:view.self});
  const head = s.extra ? `<p class="small muted">${T.extraHinweis}</p>`
    : helped ? `<div class="progress"><span>${view.leicht?(t.einstiegText||T.leichtEinstieg):T.mitHilfe(t.schritt)}</span><span>${T.nochAufgaben(SCAFF-(st.scaff||0))}</span></div>`
    : `<div class="progress"><span>${T.hintereinander(NEED_STREAK)}</span><div class="dots" aria-label="${T.punkteAria(st.streak||0,NEED_STREAK)}">${dots}</div></div>`;
  return `<div class="top"><button class="back" data-go="comp">${T.zumLernwegPfeil}</button><span class="small muted">${s.name}</span></div>
    <section class="sheet">${head}${body}</section>`;
}
function submitStation(raw){
  const t=view.task, gef=!!form(t).gefuehrt;
  if(gef&&!view.self&&!view.stage){view.pre=raw;view.stage=1;render();return}
  const e=evaluate(t,view.pre,raw,view.self), st=stState();
  st.tries++; let justDone=false, nowSelf=false;
  if((gef&&!view.self)||view.leicht){ if(e.ok){st.scaff=(st.scaff||0)+1; nowSelf=st.scaff===SCAFF} }
  else { if(e.ok){st.correct++;st.streak++}else st.streak=0; if(!st.done&&st.streak>=NEED_STREAK){st.done=true;justDone=true} }
  UR.save(); view.fb={ok:e.ok,preOk:e.preOk,valOk:e.valOk,justDone,nowSelf}; render();
}

/* ---------- Ereignisse ---------- */
function bind(){
  // „hub“ führt aus einer Kompetenz zurück zu ihrem Thema, aus einem Thema zur Übersicht
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;
    if(g!=='hub')go({name:g,id:view.id}); else if(view.id)go({name:'thema',th:themaVon(view.id).kuerzel}); else go({name:'hub'})});
  app.querySelectorAll('[data-reiter]').forEach(b=>b.onclick=()=>{reiterWahl=b.dataset.reiter;try{localStorage.setItem(REITER_KEY(),reiterWahl)}catch(e){}render()});
  app.querySelectorAll('[data-thema]').forEach(b=>b.onclick=()=>go({name:'thema',th:b.dataset.thema}));

  const handler = view.name==='check'?submitCheck:view.name==='station'?submitStation:null;
  if(handler){
    const inp=document.getElementById('ans'), mid=document.getElementById('mid');
    const sb=document.getElementById('signBtn'); if(sb)sb.onclick=()=>{const s=inp.value.trim();inp.value=s.startsWith('-')||s.startsWith(UR.M)?s.slice(1):'-'+s;inp.focus()};
    app.querySelectorAll('[data-ins]').forEach(b=>b.onclick=()=>{const p=mid.selectionStart??mid.value.length;mid.value=mid.value.slice(0,p)+' '+b.dataset.ins+' '+mid.value.slice(mid.selectionEnd??p);mid.focus();const q=p+3;try{mid.setSelectionRange(q,q)}catch(e){}});
    app.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{mid.value=b.dataset.set;inp.focus()});
    const sf=document.getElementById('selfForm');
    if(sf){sf.onsubmit=e=>{e.preventDefault();handler({mid:mid.value,res:inp.value})};if(!mid.readOnly)setTimeout(()=>mid.focus({preventScroll:true}),30)}
    const form=document.getElementById('ansForm');
    if(form){form.onsubmit=e=>{e.preventDefault();handler(inp.value)};setTimeout(()=>inp.focus({preventScroll:true}),30)}
    // mehrere Lücken: Antwort = Liste der Felder [data-feld] in ihrer Reihenfolge
    const mf=document.getElementById('multiForm');
    if(mf){const felder=[...mf.querySelectorAll('[data-feld]')];mf.onsubmit=e=>{e.preventDefault();handler(felder.map(f=>f.value))};setTimeout(()=>felder[0]&&felder[0].focus({preventScroll:true}),30)}
    app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>handler(b.dataset.choice));
    app.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>handler(b.dataset.pre));
  }
  const nx=document.getElementById('nextTask'); if(nx){nx.onclick=()=>{newTask();render()};setTimeout(()=>nx.focus({preventScroll:true}),30)}
  UR.bindungen.forEach(fn=>fn(app));
  app.querySelectorAll('[data-newex]').forEach(b=>b.onclick=()=>newExample(b.dataset.newex));
  const rs=document.getElementById('reset'); if(rs)rs.onclick=()=>{if(rs.dataset.sure){delete UR.store[view.id];UR.save();go({name:'comp',id:view.id})}else{rs.dataset.sure='1';rs.textContent=T.loeschenSicher}};
}

/* ---------- Start ---------- */
UR.start = function(el){ app=el; if(UR.fach.seitentitel)document.title=UR.fach.seitentitel; render();
  if(UR.sicherungStart) UR.sicherungStart(); };
