<script>
/* kern/sicherung.js */
/* Übungsraum, Kern: Fortschritt in eine Datei sichern und daraus laden (Wunsch der Lehrkraft, 19.11.2026),
   dazu der Hinweis auf eine neue Fassung. Fachneutral; Dateiname und Webseite kommen aus dem Fach.
   - Der Fortschritt bleibt wie bisher automatisch im Browser (kern/speicher.js).
   - Chrome/Edge (File System Access API): Datei einmal wählen, danach geht jedes Sichern direkt dorthin.
     Die gewählte Datei merkt sich der Browser (IndexedDB). Solange die Erlaubnis gilt, wird nach jeder Änderung
     von selbst mitgesichert; nach einem Neustart des Browsers genügt ein Klick auf „Fortschritt sichern“.
   - Andere Browser (Firefox): Download mit festem Dateinamen.
   - Kleiner Knopf oben rechts auf Themen-, Kompetenz- und Ergebnisseite („✓ gesichert“ / „Sichern“), dazu in
     Chrome/Edge eine Rückfrage beim Schließen, wenn Neues noch nicht in der Datei ist (19.11.2026).
   - Laden führt zusammen: je Kompetenz bleibt alles, was schon da ist, dazu kommt alles aus der Datei.
   - Neue Fassung: Ist das Gerät online, wird die kleine Versionsdatei der Webseite abgefragt. Offline passiert nichts.
   Die Datei enthält keine Namen, nur den Fortschritt (wie im Browser). */
(function(UR){
const T = UR.TEXTE;
const FSA = typeof window!=='undefined' && typeof window.showSaveFilePicker==='function';
const dateiName = () => T.sicherDatei(UR.fach.name);
const HANDLE_KEY = () => 'fortschritt-'+UR.fach.kuerzel;
const META_KEY = () => 'uebungsraeume-sicherung-'+UR.fach.kuerzel;

let handle = null;        // gewählte Datei (nur Chrome/Edge)
let erlaubt = false;      // Schreiben ohne Rückfrage möglich
let meldung = '';         // letzte Rückmeldung unter den Knöpfen
let neueFassung = null;   // {nummer, datum}, wenn auf der Webseite eine neuere liegt

function lieMeta(){try{return JSON.parse(localStorage.getItem(META_KEY()))||{}}catch(e){return {}}}
function schreibMeta(m){try{localStorage.setItem(META_KEY(),JSON.stringify(m))}catch(e){}}
// Übersicht ganz neu zeichnen; anderswo nur den kleinen Knopf austauschen (keine Eingaben verlieren)
function neuZeichnen(){
  if(!UR.intern) return;
  if(UR.intern.view().name==='hub') return UR.intern.render();
  const k=typeof document!=='undefined'&&document.getElementById&&document.getElementById('sichernKlein');
  if(k){ k.outerHTML=UR.sicherKnopfHTML(); knopfBinden(document); }
}
// seit der letzten Sicherung in die Datei hat sich etwas geändert
const ungesichert = () => { const m=lieMeta(); return Object.keys(UR.store).length>0 && (m.geaendert||0)>(m.zuletzt||0); };
const zeit = d => { const x=new Date(d), z=n=>String(n).padStart(2,'0');
  return `${z(x.getDate())}.${z(x.getMonth()+1)}.${x.getFullYear()}, ${z(x.getHours())}:${z(x.getMinutes())}`; };

/* ---------- gemerkte Datei (IndexedDB) ---------- */
function db(){
  return new Promise((ok,fehler)=>{
    if(typeof indexedDB==='undefined') return fehler(new Error('kein IndexedDB'));
    const r=indexedDB.open('uebungsraeume',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('dateien');
    r.onsuccess=()=>ok(r.result); r.onerror=()=>fehler(r.error);
  });
}
async function handleLesen(){
  try{ const d=await db(); return await new Promise(ok=>{const q=d.transaction('dateien').objectStore('dateien').get(HANDLE_KEY());
    q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null);}); }catch(e){ return null; }
}
async function handleMerken(h){
  try{ const d=await db(); await new Promise(ok=>{const t=d.transaction('dateien','readwrite');t.objectStore('dateien').put(h,HANDLE_KEY());
    t.oncomplete=ok; t.onerror=ok;}); }catch(e){}
}

/* ---------- Inhalt der Datei ---------- */
const inhalt = () => JSON.stringify({app:'uebungsraeume', fach:UR.fach.kuerzel, format:1,
  fassung:UR.version?UR.version.nummer:null, gesichert:new Date().toISOString(), fortschritt:UR.store}, null, 1);

async function schreiben(){
  const w=await handle.createWritable(); await w.write(inhalt()); await w.close();
  const m=lieMeta(); m.zuletzt=Date.now(); m.datei=handle.name; schreibMeta(m);
  neuZeichnen();
}

/* Knopf „Fortschritt sichern“ */
async function sichern(neueDatei){
  if(!FSA){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([inhalt()],{type:'application/json'}));
    a.download=dateiName(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    const m=lieMeta(); m.zuletzt=Date.now(); schreibMeta(m);
    meldung=T.sicherDownload(dateiName()); neuZeichnen(); return;
  }
  try{
    if(!handle||neueDatei){
      handle=await window.showSaveFilePicker({suggestedName:dateiName(),
        types:[{description:T.sicherTyp, accept:{'application/json':['.json']}}]});
      await handleMerken(handle);
    }
    if(await handle.queryPermission({mode:'readwrite'})!=='granted' &&
       await handle.requestPermission({mode:'readwrite'})!=='granted'){ meldung=T.sicherNichtErlaubt; neuZeichnen(); return; }
    erlaubt=true; await schreiben(); meldung=T.sicherOk(handle.name);
  }catch(e){
    if(e && e.name==='AbortError') return;          // Auswahl abgebrochen
    meldung=T.sicherFehler; erlaubt=false;
  }
  neuZeichnen();
}

/* nach jeder Änderung von selbst mitsichern, wenn die Erlaubnis schon gilt */
let wartet = null;
function mitsichern(){
  if(!FSA||!handle||!erlaubt) return;
  clearTimeout(wartet);
  wartet=setTimeout(()=>{ wartet=null; schreiben().catch(()=>{erlaubt=false;neuZeichnen()}); },400);
}
const speichernAlt = UR.save;
UR.save = function(){
  speichernAlt();
  const m=lieMeta(); m.geaendert=Date.now(); schreibMeta(m);
  if(FSA&&handle&&erlaubt) mitsichern(); else neuZeichnen();
};

/* Rückfrage beim Schließen (nur Chrome/Edge, Wunsch der Lehrkraft 19.11.2026): nur wenn etwas Neues noch nicht in der
   Datei ist und gerade nicht von selbst gesichert werden kann. Text und Knöpfe legt der Browser fest. Firefox sichert
   nie von selbst (jedes Sichern ist ein Download), dort käme die Frage bei jedem Schließen, deshalb nicht. */
if(FSA) window.addEventListener('beforeunload', e=>{
  if(handle&&erlaubt){ if(wartet){ clearTimeout(wartet); wartet=null; schreiben().catch(()=>{}); } return; }
  if(ungesichert()){ e.preventDefault(); e.returnValue=''; }
});

/* ---------- Laden und zusammenführen ---------- */
// Je Kompetenz: Checks aus beiden (doppelte nur einmal), Stationen: geschafft bleibt geschafft, Zähler das Höhere,
// Lernweg vom zuletzt gemachten Check. So geht beim Laden einer älteren Datei nichts verloren.
UR.zusammenfuehren = function(hier, dort){
  const neu = {};
  for(const id of new Set([...Object.keys(hier||{}), ...Object.keys(dort||{})])){
    const a=hier&&hier[id], b=dort&&dort[id];
    if(!a||!b){ neu[id]=JSON.parse(JSON.stringify(a||b)); continue; }
    const checks=[...(a.checks||[])]; const schon=new Set(checks.map(c=>c.kind+'|'+c.d));
    (b.checks||[]).forEach(c=>{ if(!schon.has(c.kind+'|'+c.d)) checks.push(c); });
    checks.sort((x,y)=>x.d-y.d);
    const stations={};
    for(const sid of new Set([...Object.keys(a.stations||{}), ...Object.keys(b.stations||{})])){
      const x=(a.stations||{})[sid], y=(b.stations||{})[sid];
      if(!x||!y){ stations[sid]={...(x||y)}; continue; }
      const s={...x};
      for(const k of Object.keys(y)) s[k] = typeof y[k]==='number' ? Math.max(x[k]||0,y[k]) : typeof y[k]==='boolean' ? !!(x[k]||y[k]) : (k in x ? x[k] : y[k]);
      stations[sid]=s;
    }
    const letzter = c => (c.checks||[]).reduce((m,x)=>Math.max(m,x.d||0),0);
    const path = letzter(b)>letzter(a) ? b.path : a.path;
    neu[id]={...a, checks, stations, path: path?[...path]:null};
  }
  return neu;
};

function uebernehmen(text, h){
  let d; try{ d=JSON.parse(text); }catch(e){ d=null; }
  if(!d || d.app!=='uebungsraeume' || d.fach!==UR.fach.kuerzel || typeof d.fortschritt!=='object' || !d.fortschritt){
    meldung=T.ladenFalsch(UR.fach.name); neuZeichnen(); return;
  }
  const neu=UR.zusammenfuehren(UR.store, d.fortschritt);
  Object.keys(UR.store).forEach(k=>delete UR.store[k]); Object.assign(UR.store, neu);
  if(h){ handle=h; erlaubt=false; handleMerken(h); }
  UR.save();
  meldung=T.ladenOk(Object.keys(d.fortschritt).length) + (h?' '+T.ladenDatei(h.name):'');
  neuZeichnen();
}

/* Knopf „Fortschritt laden“ */
async function laden(){
  if(FSA && typeof window.showOpenFilePicker==='function'){
    try{
      const [h]=await window.showOpenFilePicker({types:[{description:T.sicherTyp, accept:{'application/json':['.json']}}]});
      uebernehmen(await (await h.getFile()).text(), h);
    }catch(e){ if(!(e&&e.name==='AbortError')){ meldung=T.ladenFehler; neuZeichnen(); } }
    return;
  }
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    f.text().then(t=>uebernehmen(t,null), ()=>{meldung=T.ladenFehler;neuZeichnen()}); };
  inp.click();
}

/* ---------- Anzeige auf der Übersicht ---------- */
UR.sicherungHTML = function(){
  const m=lieMeta();
  let stand;
  if(FSA && handle) stand = erlaubt ? T.sicherZiel(handle.name, m.zuletzt?zeit(m.zuletzt):null) : T.sicherNeuErlauben(handle.name);
  else stand = m.zuletzt ? T.sicherZuletzt(zeit(m.zuletzt)) : T.sicherNie;
  return `<section class="sheet sicherung"><h3>${T.sicherTitel}</h3>
    <p class="small muted">${T.sicherText}</p>
    <div class="row"><button class="big alt" id="sichernKnopf">${T.sichernKnopf}</button><button class="big alt" id="ladenKnopf">${T.ladenKnopf}</button></div>
    <p class="small" id="sicherStand">${meldung?`<b>${UR.esc(meldung)}</b><br>`:''}<span class="muted">${UR.esc(stand)}</span>
    ${FSA&&handle?` <button class="link" id="andereDatei">${T.andereDatei}</button>`:''}</p></section>`;
};
UR.versionHTML = function(){
  const v=UR.version; if(!v) return '';
  const neu = neueFassung ? `<div class="neuefassung" role="status"><b>${T.neueFassung(neueFassung.datum)}</b>
    <a href="${UR.esc(UR.fach.webseite)}" target="_blank" rel="noopener">${UR.esc(UR.fach.webseite.replace(/^https?:\/\//,'').replace(/\/$/,''))}</a>
    <div class="small">${T.neueFassungText}</div></div>` : '';
  return {oben:neu, unten:`<p class="small muted">${T.fassung(v.datum, v.nummer)}</p>`};
};
/* kleiner Knopf oben rechts auf Themen-, Kompetenz- und Ergebnisseite: zeigt den Stand, ein Tipp sichert */
UR.sicherKnopfHTML = function(){
  const ok = FSA ? !!(handle && erlaubt && !ungesichert()) : !ungesichert() && !!lieMeta().zuletzt;
  return `<button class="sicherklein ${ok?'ok':'offen'}" id="sichernKlein" title="${UR.esc(ok?T.kleinOkTitel:T.kleinOffenTitel)}">${ok?T.kleinOk:T.kleinOffen}</button>`;
};
function knopfBinden(el){ const k=el.querySelector&&el.querySelector('#sichernKlein'); if(k) k.onclick=()=>sichern(false); }
UR.bindungen.push(app=>{
  knopfBinden(app);
  const s=app.querySelector&&app.querySelector('#sichernKnopf'); if(s) s.onclick=()=>sichern(false);
  const l=app.querySelector&&app.querySelector('#ladenKnopf'); if(l) l.onclick=laden;
  const a=app.querySelector&&app.querySelector('#andereDatei'); if(a) a.onclick=()=>sichern(true);
});

/* ---------- Start: gemerkte Datei holen, nach neuer Fassung fragen ---------- */
// Vergleich „2026-11-19.2“: erst Datum, dann laufende Nummer
UR.neuer = (a,b) => { const t=s=>String(s).split('.'), x=t(a), y=t(b);
  return x[0]!==y[0] ? x[0]>y[0] : Number(x[1]||0)>Number(y[1]||0); };
function fassungPruefen(){
  if(!UR.version || !UR.fach.webseite || typeof fetch!=='function') return;
  if(typeof navigator!=='undefined' && navigator.onLine===false) return;
  const ab = typeof AbortController==='function' ? new AbortController() : null;
  if(ab) setTimeout(()=>ab.abort(), 8000);
  fetch(UR.fach.versionsdatei || UR.fach.webseite+'version.json', {cache:'no-store', signal:ab?ab.signal:undefined})
    .then(r=>r.ok?r.json():null)
    .then(v=>{ if(v && v.nummer && UR.neuer(v.nummer, UR.version.nummer)){ neueFassung=v; neuZeichnen(); } })
    .catch(()=>{});   // offline oder gesperrt: nichts anzeigen
}
UR.sicherungStart = function(){
  if(FSA) handleLesen().then(async h=>{
    if(!h) return; handle=h;
    try{ erlaubt = await h.queryPermission({mode:'readwrite'})==='granted'; }catch(e){ erlaubt=false; }
    neuZeichnen();
  });
  fassungPruefen();
};
})(window.UR = window.UR || {});
</script>
<script>
/* Mathe/fach.js */
/* Fach Mathe: Name, Kürzel und Kompetenzliste (Wortlaut aus dem Mathe Know How, gleich wie rawData im
   Kompetenzraster; der Aufgabentest prüft das). ID = Fachkürzel + ID im Kompetenzraster (M-RaZa-G2 ↔ RaZa-G2).
   Alle Themen wie in rawData; gruppe = Reiter in der Übersicht (GKÜ), nummer wie der Themenordner,
   jahr bei Wechselthemen (I = g, II = u). Kompetenzen ohne Baustein erscheinen als „kommt bald“. */
UR.fachAnmelden({
  kuerzel: 'M',
  name: 'Mathe',
  titel: 'Mathe-Übungsraum',
  seitentitel: 'Mathe-Übungsraum 7/8',
  einleitung: 'Wähle oben die GKÜ, dann ein Thema und eine Kompetenz. Zuerst kommt ein kurzer <b>Eingangscheck</b>. Danach weißt du, ob du sie schon kannst oder was du noch üben solltest.',
  fachseite: 'Mathematik',   // Name der Fach-Startseite im Lernportal (Rücklink auf der Downloadseite)

  minusTaste: true,          // eigene Taste für − (die Zahlentastatur am Handy hat keine)
  // Zahlenantworten (LEITFADEN „Antwortprüfung und Vielfalt“): ohne genannte Stelle gilt bei echten Größen (Einheit
  // oder Sachaufgabe) Fall B, offenes Ergebnis; reine Rechnungen nur exakt. Stelle genannt: Feld mit stellen: n.
  zahlFall: (f,t) => f.einheit||f.einheiten||f.einheitAns||t.text||t.unit ? 'offen' : 'exakt',
  themen: [
    {kuerzel:'RaZa', name:'Rationale Zahlen', gruppe:'1. GKÜ', nummer:'1.1', stufen:'7-8', kompetenzen:[
      {id:'M-RaZa-G1', lvl:'G', text:'Ich kenne wichtige Begriffe und Eigenschaften betreffend Rationale Zahlen und kann sie erklären.'},
      {id:'M-RaZa-G2', lvl:'G', text:'Ich kenne Regeln für das Rechnen mit Ganzen Zahlen und kann sie anwenden.'},
      {id:'M-RaZa-G3', lvl:'G', text:'Ich kann Rationale Zahlen für Darstellungen im Koordinatensystem verwenden.'},
      {id:'M-RaZa-V1', lvl:'V', text:'Ich kenne Regeln für das Rechnen mit Rationalen Zahlen und kann sie anwenden.'},
      {id:'M-RaZa-V2', lvl:'V', text:'Ich kenne die Vorrangregeln beim Rechnen mit Rationalen Zahlen und kann sie anwenden.'},

<script>

/* Mathe-Baustein: Zahlen schreiben und Zufallszahlen. Für alle Mathe-Kompetenzen. */
(function(UR){
const M = UR.M, rnd = UR.rnd;
UR.mathe = UR.mathe || {};
Object.assign(UR.mathe, {
  M, rnd, pick: UR.pick,

  P: n => n>0?`(+${n})`:n<0?`(${M}${-n})`:'0',                    // mit Klammer und Vorzeichen
  R: UR.zahl,                                                       // Ergebnis
  chip: (x,c='') => `<span class="sgn ${c}">${x}</span>`,           // allein stehendes + oder − als Chip

<script>
/* Mathe/bausteine/zahlengerade.js */
/* Mathe-Baustein: Zahlengerade mit Männchen (Modell Start – drehen – gehen, LEITFADEN.md „Zahlengerade“)
   und die kleinen Bilder für Bewegung in Plus- bzw. Minusrichtung. */
(function(UR){
const {M, P, R, chip, schr} = UR.mathe;

function walkSVG(a,b,op,shown){   // shown=true: alles sichtbar; sonst Schritt für Schritt per Klick
  const res=op==='+'?a+b:a-b, lo=Math.min(a,res,0)-1, hi=Math.max(a,res,0)+1, span=hi-lo;
  const W=440,H=250,L0=26,L1=W-26,Y=150,x=n=>L0+10+(n-lo)*(L1-L0-20)/span, step=span>40?10:span>16?5:span>8?2:1;
  let tk='';for(let n=lo;n<=hi;n++){const lab=n%step===0;tk+=`<line x1="${x(n)}" x2="${x(n)}" y1="${lab?Y-8:Y-5}" y2="${lab?Y+8:Y+5}" stroke="var(--muted)"/>${lab?`<text x="${x(n)}" y="${Y+25}" font-size="12" text-anchor="middle" fill="var(--text)">${R(n)}</text>`:''}`}
  const cross=(cx,col)=>`<path d="M${cx-7} ${Y-7} L${cx+7} ${Y+7} M${cx+7} ${Y-7} L${cx-7} ${Y+7}" stroke="${col}" stroke-width="3.2" stroke-linecap="round"/>`;
  const badge=(cx,cy,n,col)=>`<circle cx="${cx}" cy="${cy}" r="10" fill="${col}"/><text x="${cx}" y="${cy+4.5}" font-size="13" font-weight="800" text-anchor="middle" fill="var(--paper)">${n}</text>`;
  const ctext=(cx,y,txt,col)=>{const w=txt.length*7.4;const c=Math.min(W-4-w/2,Math.max(4+w/2,cx));return `<text x="${c}" y="${y}" font-size="13" font-weight="700" text-anchor="middle" fill="${col}">${txt}</text>`};
  const fx=x(a), d=op==='+'?1:-1;   // Blickrichtung aus dem Rechenzeichen: rechts = 1, links = -1
  const man=`<g stroke="var(--cop)" stroke-width="3" stroke-linecap="round" fill="none">
      <circle cx="${fx}" cy="${Y-56}" r="9" fill="var(--paper)"/>
      <line x1="${fx}" y1="${Y-47}" x2="${fx}" y2="${Y-28}"/>
      <line x1="${fx}" y1="${Y-42}" x2="${fx+12*d}" y2="${Y-36}"/><line x1="${fx}" y1="${Y-42}" x2="${fx-8*d}" y2="${Y-33}"/>
      <line x1="${fx}" y1="${Y-28}" x2="${fx+8*d}" y2="${Y-14}"/><line x1="${fx}" y1="${Y-28}" x2="${fx-6*d}" y2="${Y-14}"/></g>
    <circle cx="${fx+4*d}" cy="${Y-58}" r="2" fill="var(--cop)"/>
    <rect x="${fx-11}" y="${Y-91}" width="22" height="20" rx="5" fill="var(--cop-soft)"/><text x="${fx}" y="${Y-76}" font-size="16" font-weight="800" text-anchor="middle" fill="var(--cop)">${op==='+'?'+':M}</text>
    ${badge(Math.min(W-12,Math.max(12,fx-26*d)),Y-81,2,'var(--cop)')}
    <line x1="${fx+13*d}" y1="${Y-57}" x2="${fx+30*d}" y2="${Y-57}" stroke="var(--cop)" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#av)"/>`;
  const move=b>0?'vorwärts':'rückwärts', ay=Y-116, mx=(x(a)+x(res))/2;
  const lab=(cx,y,txt,col)=>{const anc=cx<70?'start':cx>W-70?'end':'middle';return `<text x="${cx}" y="${y}" font-size="13" font-weight="700" text-anchor="${anc}" fill="${col}">${txt}</text>`};
  const face=d>0?'rechts':'links', t=Math.sign(res-a), opS=op==='+'?'+':M;
  const svg=`<svg class="numline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zahlengerade: Start bei ${R(a)}, Blick nach ${face}, ${schr(Math.abs(b))} ${move}, Ergebnis ${R(res)}">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--c2)"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cop)"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text)"/></marker></defs>
    <line x1="${L0-14}" x2="${L1+14}" y1="${Y}" y2="${Y}" stroke="var(--text)" stroke-width="2" marker-start="url(#ax)" marker-end="url(#ax)"/>${tk}
    <g class="st st1">${cross(x(a),'var(--c1)')}${badge(x(a),Y+40,1,'var(--c1)')}${ctext(x(a),Y+64,`Start: ${P(a)}`,'var(--c1)')}</g>
    <g class="st st2">${man}</g>
    <g class="st st3"><line x1="${x(res)}" x2="${x(res)}" y1="${ay}" y2="${Y-10}" stroke="var(--c2)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="${x(a)}" x2="${x(res)}" y1="${ay}" y2="${ay}" stroke="var(--c2)" stroke-width="3" marker-end="url(#ah)"/>

    ${cross(x(res),'var(--text)')}${`<line x1="${x(res)}" x2="${x(res)}" y1="${Y+10}" y2="${Y+76}" stroke="var(--text)" stroke-width="1.2" stroke-dasharray="2 3"/>${ctext(x(res),Y+90,`Du landest bei ${R(res)}`,'var(--text)')}`}</g></svg>`;
  const t3 = shown

      <li><button type="button" class="stepbtn" data-step="3"><span class="num n3">3</span><span>${t3}</span></button></li></ol>`;
  return shown ? `<div class="walkbox s1 s2 s3">${svg}${legend}</div>`
    : `<div class="walkbox"><p class="small muted">Tippe nacheinander auf 1, 2 und 3.</p>${legend}${svg}</div>`;
}

function miniMove(face,dir,label){  // face/dir: 1 = rechts, -1 = links

      <line x1="${cx}" y1="18" x2="${cx+8*face}" y2="22"/><line x1="${cx}" y1="18" x2="${cx-5*face}" y2="23"/>
      <line x1="${cx}" y1="27" x2="${cx+5*face}" y2="35"/><line x1="${cx}" y1="27" x2="${cx-4*face}" y2="35"/>
      <line x1="${cx+8*face}" y1="9" x2="${cx+18*face}" y2="9" stroke-width="1.6" stroke-dasharray="2 2" marker-end="url(#avm)"/></g>
    <circle cx="${cx+2.5*face}" cy="7.5" r="1.3" fill="var(--cop)"/>
    <line x1="${ax1}" y1="44" x2="${ax2}" y2="44" stroke="var(--c2)" stroke-width="3" marker-end="url(#ahm)"/>
    <defs><marker id="avm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cop)"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--c2)"/></marker></defs></svg><figcaption>${cap}</figcaption></figure>`;
}

/* ---------- Zahlengerade mit Skala (M-RaZa-G1, 20.11.2026): ablesen, antippen, beschriften ----------
   o.start (ganze Zahl), o.schritt [Zähler, Nenner] je Strich, o.n Striche nach dem ersten (Strich k = start + k · schritt);
   o.beschriftet [k …]: diese Striche tragen ihre Zahl; o.tipp 'q0': jeder Strich ist antippbar (Form 'fragen', data-wert = k);
   o.marke k: Pfeil mit „?“ (ablesen); o.loesung [{k, text, farbe}]: X mit Beschriftung; o.pfeil: „größer →“ unter der Geraden;
   o.null: der Nullpunkt wird hervorgehoben. Punkte als X wie im Leitfaden, Pfeilspitzen links und rechts. */
// gemischte Zahl im Bild mit waagrechtem Bruchstrich (Leitfaden): Ganze links, Bruch rechts daneben; cx Mitte, y Grundlinie
function svgBruch(cx, y, q, farbe, klein){
  const neg=q[0]<0, a=Math.abs(q[0]), g=Math.floor(a/q[1]), r=a%q[1], vorne=(neg?UR.M:'')+(g?g:''), wv=vorne.length*8.5, wb=Math.max(String(r).length,String(q[1]).length)*7.5+4;
  const x0=cx-(wv+wb+2)/2, xb=x0+wv+2+wb/2;
  return `<g fill="${farbe}" font-weight="${klein?600:800}"${klein?' class="zg-blab"':''}>${vorne?`<text x="${x0+wv}" y="${y}" font-size="15" text-anchor="end">${vorne}</text>`:''}
    <text x="${xb}" y="${y-8}" font-size="12" text-anchor="middle">${r}</text><line x1="${xb-wb/2}" x2="${xb+wb/2}" y1="${y-5}" y2="${y-5}" stroke="${farbe}" stroke-width="1.6"/>
    <text x="${xb}" y="${y+6}" font-size="12" text-anchor="middle">${q[1]}</text></g>`;
}
function skalaSVG(o){
  const W=440, L0=34, L1=W-34, N=o.n, x=k=>L0+k*(L1-L0)/N, Y=58, [sz,sn]=o.schritt;
  const wert=k=>(o.start*sn+k*sz)/sn, ganz=k=>(o.start*sn+k*sz)%sn===0, halb=k=>((o.start*sn+k*sz)*2)%sn===0;
  const lab=new Set(o.beschriftet||[]);
  let s=`<defs><marker id="zgax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text)"/></marker></defs>
    <line x1="${L0-22}" x2="${L1+22}" y1="${Y}" y2="${Y}" stroke="var(--text)" stroke-width="2" marker-start="url(#zgax)" marker-end="url(#zgax)"/>`;
  for(let k=0;k<=N;k++){
    const h=ganz(k)?11:halb(k)&&sn>2?8:6, nul=o.null&&wert(k)===0;
    s+=`<line x1="${x(k)}" x2="${x(k)}" y1="${Y-h}" y2="${Y+h}" stroke="${nul?'var(--ink)':'var(--muted)'}" stroke-width="${ganz(k)?2:1.3}"/>`;
    // Beschriftung: ganze Zahlen und Dezimalzahlen als Text, Bruchteile (z. B. Halbe auf einer Viertel-Skala) mit waagrechtem Strich
    if(lab.has(k)){ const qk=[o.start*sn+k*sz, sn];
      if(sn!==10&&!ganz(k)) s+=svgBruch(x(k), Y+32, UR.raza.Q(...qk), 'var(--text)', true);
      else s+=`<text x="${x(k)}" y="${Y+31}" font-size="16" font-weight="${nul?800:600}" text-anchor="middle" fill="${nul?'var(--ink)':'var(--text)'}">${UR.raza.Z(wert(k))}</text>`; }
  }
  if(o.marke!==undefined){ const mx=x(o.marke);
    s+=`<path d="M${mx} ${Y-14} L${mx-7} ${Y-27} L${mx+7} ${Y-27} Z" fill="var(--cop)"/><line x1="${mx}" x2="${mx}" y1="${Y-27}" y2="${Y-44}" stroke="var(--cop)" stroke-width="3"/>`; }
  // Beschriftung der Lösung: p.q (Bruch) mit waagrechtem Bruchstrich, sonst p.text
  for(const p of o.loesung||[]){ const px=x(p.k), c=p.farbe||'var(--g)', cx=Math.min(W-24,Math.max(24,px));
    s+=`<path d="M${px-7} ${Y-7} L${px+7} ${Y+7} M${px+7} ${Y-7} L${px-7} ${Y+7}" stroke="${c}" stroke-width="3.2" stroke-linecap="round"/>`;
    if(p.q&&p.q[1]!==1) s+=svgBruch(cx, Y-22, p.q, c);
    else if(p.text) s+=`<text x="${cx}" y="${Y-20}" font-size="14" font-weight="800" text-anchor="middle" fill="${c}">${p.text}</text>`; }
  if(o.pfeil) s+=`<text x="${W/2-48}" y="${Y+57}" font-size="13" font-weight="700" text-anchor="end" fill="var(--ink)">größer</text>
    <line x1="${W/2-40}" x2="${W/2+30}" y1="${Y+52}" y2="${Y+52}" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#zgax)"/>`;
  if(o.tipp){ const d=(L1-L0)/N;
    for(let k=0;k<=N;k++) s+=`<rect class="zg-tipp" data-wg="${o.tipp}" data-wert="${k}" x="${x(k)-d/2}" y="${Y-30}" width="${d}" height="60" rx="4"/>`; }
  return `<svg class="numline skala" viewBox="0 0 ${W} ${o.pfeil?Y+62:Y+40}" role="img" aria-label="Zahlengerade">${s}</svg>`;
}

/* ---------- Zahlen als Punkte auf einer Geraden (Rückmeldungen: ordnen, vergleichen, Betrag, Gegenzahl) ----------
   werte [{v, text}]: v Zahl (Dezimal), text Beschriftung (ohne: die Zahl). Beschriftungen in Reihen abwechselnd, damit sie
   sich nicht überlappen. o.abstand v: Klammer von 0 bis v mit „Abstand“; o.spiegel v: Bogen von v zu −v. */
function punkteSVG(werte, o={}){
  const W=440, L0=30, L1=W-30, Y=64, vs=werte.map(p=>p.v).concat([0, o.spiegel!==undefined?-o.spiegel:0]);
  let lo=Math.min(...vs), hi=Math.max(...vs); const rand=(hi-lo||2)*0.12; lo-=rand; hi+=rand;
  const x=v=>L0+(v-lo)*(L1-L0)/(hi-lo);
  let s=`<defs><marker id="zgpx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text)"/></marker>
    <marker id="zgsp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--c2)"/></marker></defs>
    <line x1="${L0-16}" x2="${L1+16}" y1="${Y}" y2="${Y}" stroke="var(--text)" stroke-width="2" marker-start="url(#zgpx)" marker-end="url(#zgpx)"/>
    <line x1="${x(0)}" x2="${x(0)}" y1="${Y-10}" y2="${Y+10}" stroke="var(--ink)" stroke-width="2.4"/><text x="${x(0)}" y="${Y+28}" font-size="15" font-weight="800" text-anchor="middle" fill="var(--ink)">0</text>`;
  if(o.abstand!==undefined){ const a=x(0), b=x(o.abstand), yy=Y+44;
    s+=`<path d="M${a} ${yy-6} V${yy} H${b} V${yy-6}" fill="none" stroke="var(--c2)" stroke-width="2"/><text x="${(a+b)/2}" y="${yy+17}" font-size="15" font-weight="700" text-anchor="middle" fill="var(--c2)">Abstand ${UR.raza.Z(Math.abs(o.abstand))}</text>`; }
  if(o.spiegel!==undefined&&o.spiegel!==0){ const a=x(o.spiegel), b=x(-o.spiegel), m=(a+b)/2, h=Math.min(40,Math.abs(b-a)/2+10);
    s+=`<path d="M${a} ${Y-12} Q${m} ${Y-12-2*h} ${b} ${Y-12}" fill="none" stroke="var(--c2)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#zgsp)"/>`; }
  // Sprünge (M-RaZa-V1, 21.11.2026): o.spruenge = Werte der Reihe nach, je Sprung ein Pfeil unter der Geraden mit
  // Beschriftung (o.sprungText[i], z. B. „− 8“); jeder Sprung in einer eigenen Reihe, damit sich nichts überlappt
  const sp=o.spruenge||[];
  for(let i=0;i+1<sp.length;i++){ const a=x(sp[i]), b=x(sp[i+1]), yy=Y+44+i*30, t=(o.sprungText||[])[i]||'';
    s+=`<line x1="${a}" x2="${a}" y1="${Y+6}" y2="${yy}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="${a}" x2="${b}" y1="${yy}" y2="${yy}" stroke="var(--c2)" stroke-width="2.4" marker-end="url(#zgsp)"/>
      <text x="${Math.min(W-30,Math.max(30,(a+b)/2))}" y="${yy+17}" font-size="14" font-weight="700" text-anchor="middle" fill="var(--c2)">${t}</text>`; }
  // Beschriftungen: nach Lage sortiert, abwechselnd zwei Reihen über der Geraden
  const sort=werte.map((p,i)=>({...p,i})).sort((a,b)=>a.v-b.v);
  let letzte=[-1e9,-1e9];
  sort.forEach((p,j)=>{ const px=x(p.v), t=p.text||UR.raza.Z(p.v), w=t.length*9+8;
    let r=j%2; if(px-letzte[r]<w&&px-letzte[1-r]>=w) r=1-r; letzte[r]=px+0;
    const ty=Y-20-r*18;
    s+=`<path d="M${px-6} ${Y-6} L${px+6} ${Y+6} M${px+6} ${Y-6} L${px-6} ${Y+6}" stroke="${p.farbe||'var(--cop)'}" stroke-width="3" stroke-linecap="round"/>
      <line x1="${px}" x2="${px}" y1="${ty+3}" y2="${Y-8}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="${Math.min(W-16,Math.max(16,px))}" y="${ty}" font-size="15" font-weight="700" text-anchor="middle" fill="${p.farbe||'var(--cop)'}">${t}</text>`; });
  const unten=sp.length>1?Y+44+(sp.length-2)*30+26:o.abstand!==undefined?Y+70:Y+38, oben=o.spiegel!==undefined?-10:4;
  return `<svg class="numline" viewBox="0 ${oben} ${W} ${unten-oben}" role="img" aria-label="Zahlengerade mit Punkten">${s}</svg>`;
}

Object.assign(UR.mathe, {walkSVG, miniMove, skalaSVG, punkteSVG});
// Schritte 1, 2, 3 antippen: Zahlengerade baut sich auf
UR.bindungen.push(app=>app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>b.closest('.walkbox').classList.toggle('s'+b.dataset.step)));
})(window.UR = window.UR || {});
</script>
<script>
/* Mathe/bausteine/rechenschritte.js */
/* Mathe-Baustein: Rechnen in zwei Schritten (LEITFADEN.md „Rechenweg und Bewertung“).
   - Strichrechnung: Schritt 1 Klammern auflösen (Zwischenschritt), Schritt 2 Ergebnis.
   - Punktrechnung: Schritt 1 Vorzeichen bestimmen, Schritt 2 das ganze Ergebnis mit Vorzeichen.
   Richtig nur, wenn beide Schritte stimmen. Antwortform 'two' mit Einstieg mit Hilfe (gefuehrt). */
(function(UR){
const {M, P, R, chip, schr} = UR.mathe;
const T = UR.TEXTE;

// Strichrechnung a op b mit Klammern, op = '+' oder '-'
function strich(a,op,b){
  const t = op==='+' ? Math.sign(b) : -Math.sign(b);
  const res = op==='+' ? a+b : a-b;
  const sym = t>0?'+':M, opS = op==='+'?'+':M, bS = b>0?'+':M;
  const face = op==='+'?'rechts':'links', move = b>0?'vorwärts':'rückwärts';
  const qhc = `<span class="c1">${P(a)}</span> <b class="cop">${opS}</b> <span class="c2">(${bS}${Math.abs(b)})</span>`;
  const qh = `${P(a)} <span class="pairm"><b>${opS}</b> (<b>${bS}</b></span>${Math.abs(b)})`;
  const midh = s=>`${R(a)} <b class="hlm">${s}</b> ${Math.abs(b)}`;
  const walk = `Start bei ${R(a)}. Das Rechenzeichen <span class="nw">ist ${chip(opS)}:</span> Schau nach ${face}. Die zweite Zahl ist ${b>0?'positiv':'negativ'}: Geh ${move}. Blick nach ${face} und ${move} gehen ergibt insgesamt eine Bewegung in ${t>0?'Plusrichtung, also nach rechts':'Minusrichtung, also nach links'}. Du gehst ${schr(Math.abs(b))} nach ${t>0?'rechts':'links'} und landest bei ${R(res)}.`;
  return {kind:'two', mode:'strich', a, b, op, ans:res, qh, qhc, midh,
    q:`${P(a)} ${opS} ${P(b)}`,
    pre:{ans:sym, label:'Schritt 1: Löse die Klammern auf. Die markierten Zeichen treffen aufeinander. Welches Rechenzeichen entsteht?'},
    mid:s=>`${R(a)} ${s} ${Math.abs(b)}`,
    why:`${chip(opS,'y')} <span class="nw">und ${chip(bS,'y')}</span> <span class="nw">ergibt ${chip(sym,'y')}.</span>`,
    walk,
    stepsh:`${qh} = ${midh(sym)} = ${R(res)}`,
    schritt:'Zwischenschritt',
    alleinText:'Ab der nächsten Aufgabe schreibst du den Zwischenschritt selbst.',
    // in der Rückmeldung: Weg auf der Zahlengeraden, bei Fehlern sofort vollständig gezeichnet
    zusatzRueckmeldung:f=>`<div class="walk"><p class="small"><b>Auf der Zahlengeraden:</b> ${walk}</p>${f.ok?'':UR.mathe.walkSVG(a,b,op,true)}</div>`};
}

// Punktrechnung: q Aufgabentext, a und b die Zahlen, r das Ergebnis, calc die Rechnung ohne Vorzeichen
function punkt(q,a,b,r,opSym,calc){const same=Math.sign(a)===Math.sign(b), aS=a>0?'+':M, bS=b>0?'+':M, rS=r>0?'+':M;
  const qh=`(<b class="sg">${aS}</b>${Math.abs(a)}) ${opSym} (<b class="sg">${bS}</b>${Math.abs(b)})`;
  return {kind:'two', mode:'punkt', q, qh, ans:r, a, b, opSym,
    pre:{ans:rS, label:'Schritt 1: Bestimme zuerst das Vorzeichen des Ergebnisses. Schau auf die markierten Vorzeichen.'},
    mid:s=>s, midh:s=>chip(s,'y'),
    why:same?`${chip(aS,'y')} <span class="nw">und ${chip(bS,'y')}</span> sind gleich: Das Ergebnis ist positiv.`:`${chip(aS,'y')} <span class="nw">und ${chip(bS,'y')}</span> sind verschieden: Das Ergebnis ist negativ.`,
    stepsh:`${qh}: <span class="nw">Vorzeichen ${chip(rS,'y')},</span> dann ${calc}, also <b class="sg">${rS}</b>${Math.abs(r)}`,
    schritt:'Vorzeichen',
    alleinText:'Ab der nächsten Aufgabe bestimmst du das Vorzeichen und rechnest in einem Schritt.'};
}

/* ---------- Antwortform 'two' ---------- */
function preButtons(t){
  const opts = t.mode==='strich' ? [['+','+'],[M,M]] : [['+','+ positiv'],[M,M+' negativ']];
  return `<div class="choices">${opts.map(([v,l])=>`<button data-pre="${v}">${l}</button>`).join('')}</div>`;
}
function selfHTML(t){
  if(t.mode==='strich') return `<div class="task">${t.qh} =</div>
    <form class="selfform" id="selfForm" autocomplete="off">
      <label class="lbl" for="mid">Zwischenschritt ohne Klammern</label>
      <div class="answer"><input id="mid" class="wide" inputmode="numeric" placeholder="?"><button type="button" class="sign" data-ins="+">+</button><button type="button" class="sign" data-ins="${M}">${M}</button></div>
      <label class="lbl" for="ans">Ergebnis</label>
      <div class="answer"><button type="button" class="sign" id="signBtn" aria-label="${T.minusSetzen}">${M}</button><input id="ans" inputmode="numeric" placeholder="?"><button class="big" type="submit">${T.ok}</button></div>
    </form>`;
  return `<div class="task">${t.qh} =</div>
    <form class="selfform" id="selfForm" autocomplete="off">
      <label class="lbl" for="mid">Schritt 1: Vorzeichen des Ergebnisses</label>
      <div class="answer"><input id="mid" class="tiny" readonly placeholder="?"><button type="button" class="sign" data-set="+">+</button><button type="button" class="sign" data-set="${M}">${M}</button></div>
      <label class="lbl" for="ans">Schritt 2: Ergebnis mit Vorzeichen</label>
      <div class="answer"><button type="button" class="sign" id="signBtn" aria-label="${T.minusSetzen}">${M}</button><input id="ans" inputmode="numeric" placeholder="?"><button class="big" type="submit">${T.ok}</button></div>
    </form>`;
}
// Zwischenschritt wie „−7 + 11“ lesen
function parseMid(raw){
  const s=String(raw||'').replace(/−|–/g,'-').replace(/\s/g,'');
  const m=s.match(/^([+-]?\d+)([+-])(\d+)$/); if(!m)return null;
  return {first:Number(m[1]),op:m[2]==='-'?M:'+',second:Number(m[3])};
}
UR.formAnmelden('two', {
  gefuehrt: true,
  html(t,st){
    if(st.self) return selfHTML(t);
    if(!st.stage){
      const shown = t.mode==='strich' ? `${t.qh} =<br>${R(t.a)} <span class="slot">?</span> ${Math.abs(t.b)}` : `${t.qh} = <span class="slot">?</span> …`;
      return `<div class="task">${shown}</div><p class="muted">${t.pre.label}</p>${preButtons(t)}`;
    }
    const s = st.coach && !st.preOk ? t.pre.ans : st.pre;
    const note = st.coach ? (st.preOk?`<div class="fb ok"><span><b class="t">Richtig!</b> ${t.why}</span></div>`:`<div class="fb no"><span><b class="t">Achtung:</b> ${t.why} Rechne <span class="nw">mit ${chip(t.pre.ans,'y')}</span> weiter.</span></div>`) : '';
    if(t.mode==='strich') return `<div class="task">${t.qh} =<br>${t.midh(s)} =</div>${note}<p class="muted">Schritt 2: Rechne jetzt aus.</p>${UR.eingabeHTML(true)}`;
    return `<div class="task">${t.qh} =</div>${note}<p class="muted">Vorzeichen: ${t.midh(s)}. Schritt 2: Schreib jetzt das ganze Ergebnis mit Vorzeichen.</p>${UR.eingabeHTML(true)}`;
  },
  // allein: raw = {mid, res}; mit Hilfe: pre = gewähltes Zeichen, raw = Ergebnis
  bewerten(t,pre,raw,self){
    if(self){
      if(t.mode==='strich'){
        const m=parseMid(raw.mid), v=UR.leseZahl(raw.res);
        const preOk=!!m&&m.first===t.a&&m.op===t.pre.ans&&m.second===Math.abs(t.b), valOk=v===t.ans;
        return {ok:preOk&&valOk,preOk,valOk,shown:`${(raw.mid||'?').trim()} = ${v===null?'?':R(v)}`,
          stuecke:[{text:(raw.mid||'?').trim(), ok:preOk, soll:t.mid(t.pre.ans)}, {text:v===null?'?':R(v), ok:valOk, soll:R(t.ans)}]};
      }
      const sg=String(raw.mid||'').trim().replace(/−|–|-/,M), v=UR.leseZahl(raw.res);
      const preOk=sg===t.pre.ans, valOk=v===t.ans;
      return {ok:preOk&&valOk,preOk,valOk,shown:v===null?'?':R(v),
        stuecke:[{text:sg||'?', ok:preOk, soll:t.pre.ans}, {text:v===null?'?':R(v), ok:valOk, soll:R(t.ans)}]};
    }
    const v=UR.leseZahl(raw), preOk=pre===t.pre.ans, valOk=v===t.ans;
    if(t.mode==='strich') return {ok:preOk&&valOk,preOk,valOk,shown:`${t.mid(pre)} = ${v===null?'?':R(v)}`};
    return {ok:preOk&&valOk,preOk,valOk,shown:v===null?'?':R(v)};
  },
  loesung: t => t.mode==='strich' ? `${t.mid(t.pre.ans)} = ${R(t.ans)}` : R(t.ans),
  // LZK auf Papier: Rechnung, bei Strichrechnungen Platz für den Zwischenschritt
  papier: t => ({aufgabe:`<div class="pz-q">${t.qh} =</div>${UR.papier.platz(t.mode==='strich'?2:1)}`, loesung:t.stepsh, aufwand:1})
});

Object.assign(UR.mathe, {strich, punkt, parseMid});
})(window.UR = window.UR || {});

<script>
/* Mathe/bausteine/terme.js */
/* Mathe-Baustein: Terme (für alle Kompetenzen des Themas Terme, Steckbriefe Mathe/2.1 Terme/).
   - Term-Rechner: liest Eingaben der Kinder (Malpunkt darf fehlen, ² oder ^2, eckige Klammern, Komma),
     rechnet exakt mit Brüchen, vergleicht Terme und schreibt sie geordnet wie im Mathe Know How
     (alphabetisch, hohe Hochzahlen zuerst, Zahlen am Schluss).
   - Direkt nebeneinander Geschriebenes gehört zusammen: 7/2x = 7/(2x), 2x/3 = (2x)/3.
   - Antwortformen: 'term' (Term oder Zahl eintippen), 'termzwei' (Zwischenschritt und Ergebnis, Einstieg mit
     Hilfe), 'twahl' (Auswahl mit Text oder Term), 'felder' (mehrere Lücken).
   - Bewertung je Aufgabe (t.modus): genau = Kurzschreibweise und Reihenfolge, glieder = Kurzschreibweise, jede

/* ---------- Anteil-Figur: gleiche Teile, k davon gefärbt ---------- */
// art 'hundert' (10 × 10), 'rechteck'/'quadrat' (Zeilen × Spalten), 'kreis' (n Sektoren). Jeder Teil trägt class="ateil",
// gefärbte Teile zusätzlich „an“ (der Prüfer zählt sie im Bild).
const RASTER = {2:[1,2], 4:[2,2], 5:[1,5], 8:[2,4], 10:[2,5], 20:[4,5]};
function figur(art, n, an){
  const teil = (d,ist) => `<path class="ateil${ist?' an':''}" d="${d}"/>`;
  if(art==='kreis'){
    const r=90, c=100; let s='';
    for(let i=0;i<n;i++){
      const a0=-Math.PI/2+2*Math.PI*i/n, a1=-Math.PI/2+2*Math.PI*(i+1)/n, p=a=>`${(c+r*Math.cos(a)).toFixed(2)} ${(c+r*Math.sin(a)).toFixed(2)}`;
      s+= n===1 ? teil(`M${c-r} ${c}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`, an.includes(i)) : teil(`M${c} ${c}L${p(a0)}A${r} ${r} 0 0 1 ${p(a1)}Z`, an.includes(i));
    }
    return `<svg class="anteil" viewBox="0 0 200 200" role="img" aria-label="Kreis in ${n} gleiche Teile geteilt">${s}</svg>`;
  }
  const [zl,sp] = art==='hundert' ? [10,10] : RASTER[n], w=art==='quadrat'?180/Math.max(zl,sp):Math.min(56,300/sp), h=art==='quadrat'?w:art==='hundert'?w:Math.min(56,w*1.2);
  let s='';
  for(let i=0;i<zl;i++) for(let j=0;j<sp;j++) s+=teil(`M${4+j*w} ${4+i*h}h${w}v${h}h${-w}Z`, an.includes(i*sp+j));
  return `<svg class="anteil" viewBox="0 0 ${8+sp*w} ${8+zl*h}" role="img" aria-label="Figur in ${zl*sp} gleiche Teile geteilt">${s}</svg>`;
}
const gefaerbt = (n,k,verteilt) => verteilt ? mischen([...Array(n).keys()]).slice(0,k) : [...Array(k).keys()];

/* ---------- Komma verschieben (Prozent ↔ Dezimalzahl) als Bild ---------- */
// ziffern als Text ohne Komma, von/nach = Anzahl der Ziffern vor dem Komma
function kommaBild(ziffern, von, nach){
  const w=30, x0=14, x=k=>x0+k*w, H=86, y=62;
  const z=[...ziffern].map((d,i)=>`<text class="kb-z" x="${x(i)+w/2}" y="${y}">${d}</text>`).join('');
  const schritte=[]; const dir=nach>von?1:-1;
  for(let k=von;k!==nach;k+=dir){ const a=x(k), b=x(k+dir); schritte.push(`<path class="kb-pf" d="M${a} ${y-30}Q${(a+b)/2} ${y-52} ${b} ${y-30}" marker-end="url(#kbp)"/>`); }
  return `<svg class="kommabild" viewBox="0 0 ${2*x0+ziffern.length*w} ${H}" role="img" aria-label="Komma um ${Math.abs(nach-von)} Stellen nach ${dir<0?'links':'rechts'}">
    <defs><marker id="kbp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="kb-sp"/></marker></defs>
    ${z}<text class="kb-alt" x="${x(von)}" y="${y+4}">,</text><text class="kb-neu" x="${x(nach)}" y="${y+4}">,</text>${schritte.join('')}</svg>`;
}
// Prozent (als Dezimaltext mit Punkt, z. B. "6.5") → Bild „Komma 2 Stellen nach links“ und umgekehrt
function kommaSchritt(prozentText, richtung){
  let [g,d='']=prozentText.split('.'); g=g.padStart(3,'0');
  const ziffern=g+d, vorP=g.length, vorD=g.length-2;
  return richtung==='zuDezimal' ? kommaBild(ziffern, vorP, vorD) : kommaBild(ziffern, vorD, vorP);
}

// G, p, W immer in denselben Farben (Steckbrief M-Proz-G1)

/* ---------- Schlussrechnung: Dreisatz wie im Mathe Know How, darunter die Formel (Lehrkraft 20.11.2026) ----------
   sr = {gesucht:'W'|'p'|'G', G, p, W, basis:100|1000, zeichen:'%'|'‰', einheit, eins (Text „1 …“, wenn p gesucht ist),
         namen:{G,p,W} (Zinsrechnung K, p, Z), begriffe:{G,p,W}}.
   Werte links, Prozente rechts, dazwischen Punkte; gebogene Pfeile links und rechts mit derselben Rechnung.
   Prozentwert: : 100, dann · p. Prozentsatz: : G, dann · W (Zwischenzeile als Bruch). Grundwert: : p, dann · 100.
   Unter dem Dreisatz baut sich die Formel Pfeil für Pfeil auf (p = 100/35, p = 100 · 28/35 = 80 %, p = W · 100/G). */
const ROLLE = {G:'pg', p:'pp', W:'pw'};
const farbig = (r,x) => `<span class="${ROLLE[r]}">${x}</span>`;
const srNamen = sr => sr.namen || {G:'G', p:'p', W:'W'};
const srBegriffe = sr => sr.begriffe || {G:'Grundwert G', p:'Prozentsatz p', W:'Prozentwert W'};
// lange Einheiten (Personen, Mitglieder) dürfen am Handy unter die Zahl rutschen
const srWert = (sr,x) => sr.einheit==='€' ? (nachkomma(x)<=2 ? E(x) : `${Z(x)}${NB}€`) :   // Zwischenzeile darf mehr als Cent haben (0,802 €)
   `${Z(x)}${sr.einheit?(sr.einheit.length>3?' ':NB)+sr.einheit:''}`;
const srProz = (sr,x) => `${Z(x)}${NB}${sr.zeichen}`;
const nahe = (v,a) => v!==null&&v!==undefined&&!Number.isNaN(v)&&Math.abs(v-a)<=1e-9*Math.max(1,Math.abs(a));
// gleiche Zahlen dürfen nicht doppelt vorkommen (sonst wären Formel-Vorschläge gleich)
const srOk = sr => new Set([sr.G,sr.p,sr.W,sr.basis].map(rund)).size===4;
function srRechnung(sr){
  const {G:g, p, W:w, basis:b} = sr, n=srNamen(sr), z=sr.zeichen;
  const fz=(r,x)=>farbig(r,Z(x)), fn=r=>farbig(r,n[r]);
  if(sr.gesucht==='W') return {
    zeilen:[[farbig('G',srWert(sr,g)), srProz(sr,b)], [srWert(sr,rund(g/b)), srProz(sr,1)], [farbig('W',srWert(sr,w)), farbig('p',srProz(sr,p))]],
    ops:[`:${NB}${Z(b)}`, `·${NB}${Z(p)}`], zw:{wert:rund(g/b), seite:0, text:srWert(sr,rund(g/b))}, erg:{wert:w, seite:0, text:srWert(sr,w)},
    zaehler:[g,p], nenner:b, falsch:[[g*b/p, `Du hast durch ${Z(p)} dividiert. Im Dreisatz heißt es: erst :${NB}${Z(b)} (das ist 1${NB}${z}), dann ·${NB}${Z(p)}.`]],
    f1:`${fn('W')} = ${br(fz('G',g), Z(b))}`, f2:`${fn('W')} = ${br(`${fz('G',g)} · ${fz('p',p)}`, Z(b))} = ${farbig('W',srWert(sr,w))}`,
    allg:`${fn('W')} = ${br(`${fn('G')} · ${fn('p')}`, Z(b))}`,
    weg:`zuerst :${NB}${Z(b)} (das ist 1${NB}${z}), dann ·${NB}${Z(p)}`};
  if(sr.gesucht==='p') return {
    zeilen:[[farbig('G',srWert(sr,g)), srProz(sr,b)], [sr.eins||srWert(sr,1), `${br(Z(b),Z(g))}${NB}${z}`], [farbig('W',srWert(sr,w)), farbig('p',srProz(sr,p))]],
    ops:[`:${NB}${Z(g)}`, `·${NB}${Z(w)}`], zw:{wert:b/g, seite:1, bruch:true, text:`${Z(b)} : ${Z(g)}${NB}${z}`}, erg:{wert:p, seite:1, text:srProz(sr,p)},
    zaehler:[w,b], nenner:g, falsch:[[g*b/w, `Du hast ${n.G} und ${n.W} vertauscht. Das Ganze (${n.G}, ${Z(b)}${NB}${z}) ist ${srWert(sr,g)}.`]],
    f1:`${fn('p')} = ${br(Z(b), fz('G',g))}`, f2:`${fn('p')} = ${br(`${Z(b)} · ${fz('W',w)}`, fz('G',g))} = ${farbig('p',srProz(sr,p))}`,
    allg:`${fn('p')} = ${br(`${fn('W')} · ${Z(b)}`, fn('G'))}`,
    weg:`zuerst :${NB}${Z(g)} (das ist ${sr.eins||srWert(sr,1)}), dann ·${NB}${Z(w)}`};
  return {
    zeilen:[[farbig('W',srWert(sr,w)), farbig('p',srProz(sr,p))], [srWert(sr,rund(w/p)), srProz(sr,1)], [farbig('G',srWert(sr,g)), srProz(sr,b)]],
    ops:[`:${NB}${Z(p)}`, `·${NB}${Z(b)}`], zw:{wert:rund(w/p), seite:0, text:srWert(sr,rund(w/p))}, erg:{wert:g, seite:0, text:srWert(sr,g)},
    zaehler:[w,b], nenner:p, falsch:[[w*p/b, `Das Ganze ist größer als der Teil (wenn ${n.p} unter ${Z(b)}${NB}${z} ist): erst :${NB}${Z(p)}, dann ·${NB}${Z(b)}.`]],
    f1:`${fn('G')} = ${br(fz('W',w), fz('p',p))}`, f2:`${fn('G')} = ${br(`${fz('W',w)} · ${Z(b)}`, fz('p',p))} = ${farbig('G',srWert(sr,g))}`,
    allg:`${fn('G')} = ${br(`${fn('W')} · ${Z(b)}`, fn('p'))}`,
    weg:`zuerst :${NB}${Z(p)} (das ist 1${NB}${z}), dann ·${NB}${Z(b)}`};
}
// Dreisatz als Gitter: zeilen [[links, rechts] × 3], ops [Pfeil 1, Pfeil 2] oder null (Pfeile ohne Rechnung);
// ab: Zeilen und Pfeile erscheinen Schritt für Schritt (Erklärung)
function dsGitter(zeilen, ops, ab){
  const a = k => ab&&k ? ` data-ab="${k}"` : '';

  zeilen.forEach(([w,p],k)=>{ const r=`style="grid-row:${2*k+1}/span 2"`;

    h+=`<span class="op l" ${r}${a(k+1)}>${op}</span><span class="bg l${le}" ${r}${a(k+1)}><i></i></span><span class="bg r${le}" ${r}${a(k+1)}><i></i></span><span class="op r" ${r}${a(k+1)}>${op}</span>`; }
  return `<div class="ds" role="group" aria-label="Dreisatz">${h}</div>`;
}
const fzHTML = (r, ab) => { const a=k=>ab?` data-ab="${k}"`:'';
  return `<div class="fz"><div class="z"${a(1)}><span class="k">①${NB}${r.ops[0]}</span><span>${r.f1}</span></div>
    <div class="z"${a(2)}><span class="k">②${NB}${r.ops[1]}</span><span>${r.f2}</span></div>
    <div class="z allg"${a(3)}><span class="k">allgemein</span><span>${r.allg}</span></div></div>`; };
// ganzes Lösungsbild (Rückmeldung, LZK-Lösung); erklaerung: mit Knöpfen ① ② ③

    const mod = String(st.pre||'d')[0]==='f'?'f':'d', preOk = st.pre===t.wahl.ans[mod];

// Aufgabe mit Schlussrechnung. o: q, qh, lead, text, why (sonst Standard), wahl der Zwischenzeile im Einstieg
function schlussAufgabe(sr, o={}){
  if(!srOk(sr)) throw new Error('Schlussrechnung mit doppelten Zahlen');
  const r=srRechnung(sr), n=srNamen(sr), b=sr.basis, z=sr.zeichen, {G:g, p, W:w} = sr;
  // Einstieg: Zwischenzeile aus drei Vorschlägen (richtig, zehnmal so groß, ein Zehntel; p gesucht: Bruch verdreht)
  let dOpt;
  if(r.zw.bruch) dOpt = [[b,g],[g,b],[b,w],[b,g*10]].map(([x,y])=>({wert:x/y, html:`${br(Z(x),Z(y))}${NB}${z}`}));
  else dOpt = [r.zw.wert, rund(r.zw.wert*10), rund(r.zw.wert/10), rund(r.zw.wert*100)].map(x=>({wert:x, html:srWert(sr,x)}));
  const dWahl=[dOpt[0]]; for(const x of dOpt.slice(1)) if(dWahl.length<3&&!dWahl.some(y=>nahe(x.wert,y.wert))) dWahl.push(x);
  // Formel: dieselben drei Zahlen, richtig und zwei andere Anordnungen
  const zahlen=[...r.zaehler, r.nenner], fOpt=[[0,1,2],[0,2,1],[1,2,0]].map(([i,j,k])=>({wert:`${i}${j}${k}`, html:formelText(n[sr.gesucht], Z(zahlen[i]), Z(zahlen[j]), Z(zahlen[k]))}));
  const mische = (l,k) => mischen(l.map((x,i)=>({...x, richtig:i===0}))).map((x,i)=>({...x, v:k+i}));
  const dm=mische(dWahl,'d'), fm=mische(fOpt,'f');
  const wahl = {d:dm.map(x=>[x.v,x.html]), f:fm.map(x=>[x.v,x.html]), ans:{d:dm.find(x=>x.richtig).v, f:fm.find(x=>x.richtig).v}};
  const B=srBegriffe(sr);
  const why = o.why || `Gesucht ist der ${farbig(sr.gesucht, B[sr.gesucht])}. Dreisatz: ${r.weg}. Formel: ${r.allg}.`;
  return aufg(Object.assign({kind:'schluss', sr, r, wahl, pre:{ans:wahl.ans.d, optionen:wahl.d}, schritt:'Schritt 1', loesungBild:srBild(sr), why}, o));
}

/* ---------- Prozentstreifen und Kreisdiagramm (Teil 4, Mockup von der Lehrkraft freigegeben 20.11.2026) ----------
   teile = [[Name, Prozent], …]. Farben ft0 … ft4 (fach.css, für Farbsehschwäche geprüfte Palette). Namen stehen in einer
   Legende unter dem Bild, damit sich nie etwas überlappt. Streifen 10 cm × 1 cm, gezeichnet 300 Einheiten lang
   (1 % = 3 Einheiten); Skala im Einstieg (oben 0 bis 100 %, unten 0 bis 10 cm), sonst auf Wunsch Striche je cm. */
const legende = (teile, mitP=true) => `<div class="legende">${teile.map(([n,p],i)=>`<span><i class="ft${i%5}"></i>${n}${mitP?` ${P(p)}`:''}</span>`).join('')}</div>`;
function streifenSVG(teile, o={}){
  const L=300, H=34, x0=14, y0=o.skala?24:6; let x=x0, s='';
  teile.forEach(([n,p],i)=>{ const w=L*p/100;
    s+=`<rect class="st-ab ft${i%5}" x="${rund(x)}" y="${y0}" width="${rund(w)}" height="${H}"/>`;
    const txt = o.laengen ? (p<10?`${Z(p)} mm`:`${Z(p/10)} cm`) : o.zahlen!==false ? P(p) : '';
    if(txt && w>=(o.laengen?46:40)) s+=`<text class="st-t" x="${rund(x+w/2)}" y="${y0+H/2+5}">${txt}</text>`;
    x+=w; });
  if(o.skala||o.striche) for(let k=0;k<=10;k++){ const xx=x0+k*L/10;
    s+=`<line class="st-sk" x1="${xx}" x2="${xx}" y1="${y0-5}" y2="${y0+H+5}"/>`;
    if(o.skala&&k%2===0) s+=`<text class="st-s" x="${xx}" y="${y0-9}">${k*10}${k===10?'%':''}</text><text class="st-s" x="${xx}" y="${y0+H+19}">${k}${k===10?'cm':''}</text>`; }
  const h=y0+H+(o.skala?26:10);
  return `<div class="figur"><svg class="streifen" viewBox="0 0 ${L+2*x0} ${h}" role="img" aria-label="Prozentstreifen">${s}</svg>${o.legende===false?'':legende(teile, o.legendeP!==false)}</div>`;
}
// Kreisdiagramm: Winkel im Abschnitt (schmale außen), ohne: winkel:false; Namen in der Legende
function kreisSVG(teile, o={}){
  const R=100, c=130; let a=-90, s='', lab='';
  const rad=d=>d*Math.PI/180, Pt=(d,r)=>[c+r*Math.cos(rad(d)), c+r*Math.sin(rad(d))];
  teile.forEach(([n,p],i)=>{ const w=(o.grad?o.grad[i]:p*3.6), a1=a+w, [x1,y1]=Pt(a,R), [x2,y2]=Pt(a1,R);
    s+=`<path class="st-ab ft${i%5}" d="M${c} ${c}L${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 ${w>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z"/>`;
    if(o.winkel!==false){ const m=a+w/2, [tx,ty]=Pt(m, w>=30?R*.62:R+20); lab+=`<text class="st-t" x="${tx.toFixed(1)}" y="${(ty+5).toFixed(1)}">${Z(rund(w))}°</text>`; }
    a=a1; });
  s+=`<circle cx="${c}" cy="${c}" r="3" class="st-mp"/>`;
  return `<div class="figur"><svg class="kreisdia" viewBox="0 0 260 260" role="img" aria-label="Kreisdiagramm">${s}${lab}</svg>${o.legende===false?'':legende(teile, o.legendeP!==false)}</div>`;
}

<script>
/* Mathe/bausteine/rationale.js */
/* Mathe-Baustein Rationale Zahlen (M-RaZa-G1 bis V3, Entscheidungen der Lehrkraft 20.11.2026, Mathe/1.1 Rationale-Zahlen/):
   - exakte Bruchrechnung (Q), Zahlen schreiben mit Komma, echtem Minus und Tausender-Leerzeichen
   - Brüche immer mit waagrechtem Strich (HTML); in reinem Text (Kärtchen, Liste nach dem Check) als ¼, ½, ¾ …
   - Zahlfeld mit Vorzeichen-Taste (die Zahlentastatur am Handy hat kein Minus) für die Form 'zahlen'
   - Feld „gemischte Zahl“: Ganze, Zähler, Nenner, dazu die Vorzeichen-Taste. Ganze leer = Bruch. Auf Wunsch zählt nur
     vollständig gekürzt bzw. nur die gemischte Zahl (unechter Bruch: Wert stimmt, Form nicht → Hinweis). */
(function(UR){
const M = UR.M, NB = String.fromCharCode(160);

/* ---------- exakte Brüche [Zähler, Nenner] ---------- */
const ggT = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b) [a,b]=[b,a%b]; return a; };
const Q = (z,n=1) => { if(n<0){ z=-z; n=-n; } const g=ggT(z,n)||1; return [z/g, n/g]; };
const qadd = (a,b) => Q(a[0]*b[1]+b[0]*a[1], a[1]*b[1]);
const qsub = (a,b) => qadd(a, [-b[0], b[1]]);
const qmul = (a,b) => Q(a[0]*b[0], a[1]*b[1]);
const qdiv = (a,b) => Q(a[0]*b[1], a[1]*b[0]);
const qvgl = (a,b) => a[0]*b[1] - b[0]*a[1];          // < 0: a kleiner
const qwert = q => q[0]/q[1];
const rund = x => Number(Number(x).toPrecision(12));

/* ---------- Zahlen schreiben ---------- */
// Zahl mit Komma, echtem Minus und Tausender-Leerzeichen (2 476); plus: positive mit „+“
function Z(x, plus){
  const r=rund(x); let [g,d]=String(Math.abs(r)).split('.');
  if(g.length>=4) g=g.replace(/\B(?=(\d{3})+(?!\d))/g, NB);
  return (r<0?M:plus&&r>0?'+':'')+g+(d?','+d:'');
}
const BRUCH_TEXT = {'1/2':'½','1/3':'⅓','2/3':'⅔','1/4':'¼','3/4':'¾','1/5':'⅕','2/5':'⅖','3/5':'⅗','4/5':'⅘','1/8':'⅛','3/8':'⅜','5/8':'⅝','7/8':'⅞'};
const br = (z,n) => `<span class="bruch"><span>${z}</span><span>${n}</span></span>`;
// Bruch als gemischte Zahl, HTML (−1 ¾ mit waagrechtem Strich); plus: positive mit „+“
function gemHTML(q, plus){
  q=Q(...q); const s=q[0]<0?M:plus&&q[0]>0?'+':'', a=Math.abs(q[0]), g=Math.floor(a/q[1]), r=a%q[1];
  if(!r) return s+Z(g);

function produktFeld(label, neg, z, n){
  return {label, ans:0, ansText:`${neg?M:'+'}(${z.join(' · ')}) durch (${n.join(' · ')})`, ansHTML:produktHTML(neg,z,n), eingabe:`${neg?'-':''}(${z.join('*')})/(${n.join('*')})`,
    feldHTML:produktFeldHTML(z.length),
    rohHTML:roh=>{ const t=produktTeile(roh); return t&&!t.leer ? produktHTML(t.neg,t.z,t.n) : esc(String(roh??'')); },
    grund:roh=>{ const t=produktTeile(roh); if(!t||t.leer) return 'Fülle alle Zähler und Nenner aus.';
      if(gleicheListe(t.z,z)&&gleicheListe(t.n,n)&&t.neg!==neg) return 'Achte auf das Vorzeichen: gleiche Vorzeichen ergeben +, verschiedene ergeben −.';
      return 'Oben stehen alle Zähler, unten alle Nenner, jeweils mit · dazwischen.'; },
    lesen:roh=>{ const t=produktTeile(roh); if(t&&t.leer) return null; return t&&t.neg===neg&&gleicheListe(t.z,z)&&gleicheListe(t.n,n) ? 0 : 1; }};
}

/* ---------- Antwortform 'mehrschritt': Schritt für Schritt untereinander (M-RaZa-V1, Lehrkraft 21.11.2026) ----------
   t.schritte = [{label, felder (wie in 'zahlen'), ansText, ansHTML, hinweis(erg) → Text bei Fehlern}].
   Richtig nur, wenn jeder Schritt stimmt. t.einzeln (Einstieg): Die Schritte erscheinen nacheinander, nach jedem
   „Weiter“ gibt es sofort Rückmeldung (falsch: der richtige Schritt steht da, das Kind rechnet damit weiter). */

  if(fe.misch&&x.wertOk&&!x.formOk) return formHinweis(x.roh);
  if(s.hinweis){ const h=s.hinweis(erg); if(h) return h; }
  return fe.grund ? fe.grund(x.roh) : ''; };

/* ---------- Vorrangregeln (M-RaZa-V2, Lehrkraft 20.11.2026) ----------
   Term als Kette [Knoten, Zeichen, Knoten, …]. Knoten: Zahl {q, art ('ganz'|'dez'|'bruch'|'misch'), neu, von} oder
   Klammer {kl:'[', c:Kette}; Zeichen {op, id}. Regeln: Klammern zuerst (innen vor außen), dann Punkt vor Strich, sonst
   von links nach rechts. Rechenweg wie im Mathe Know How: je Zeile werden alle Rechnungen ausgeführt, die gerade
   Vorrang haben (jede Klammer, in jeder Kette von Punktrechnungen die erste); eine Klammer mit nur + und − wird in
   einem Schritt ausgerechnet. Die letzte Strichrechnung kommt zuerst ohne Klammern (12 + 20), dann das Ergebnis. */
const KREIS = '⓪①②③④⑤⑥⑦⑧⑨';
const PUNKT = o => o.op==='·'||o.op===':';
const istKl = n => !!n && n.kl!==undefined;
const istOp = n => !!n && n.op!==undefined;
const qneg = q => [-q[0], q[1]];
const rechneOp = (a,o,b) => o==='+'?qadd(a,b):o===M?qsub(a,b):o==='·'?qmul(a,b):qdiv(a,b);
const hatKl = c => c.some(istKl);
const hatPunkt = c => c.some(x=>istOp(x)&&PUNKT(x));
const nurStrich = c => c.length>1 && !hatKl(c) && !hatPunkt(c);
const klon = c => c.map(x=>istKl(x)?{kl:x.kl, c:klon(x.c)}:istOp(x)?x:Object.assign({}, x, {neu:false, vorher:!!x.neu}));
// Term bauen: spec = [Zahl, '·', Zahl, …], eine Klammer ist ein eingebettetes Array mit Zeichen; Zahl = [z, n] oder {q, art}
function vgTerm(spec, art='ganz'){
  let id=0;
  const istQ = x => Array.isArray(x) && x.length===2 && typeof x[0]==='number' && typeof x[1]==='number';
  const bau = a => a.map(x => typeof x==='string' ? {op:x, id:id++} : istQ(x) ? {q:Q(...x), art} : Array.isArray(x) ? {kl:'[', c:bau(x)} : {q:Q(...x.q), art:x.art||art});
  return bau(spec);
}
// Rechenweg: Zeilen {art:'zwischen'|'glieder', kette | glieder}, Ergebnis, Reihenfolge der Rechnungen (für die Nummern ①②③)
function vgWeg(kette){
  const reihe=[]; let nr=0, sauber=true;
  const tu = (a,o,b,grund) => { const w=rechneOp(a.q,o.op,b.q); nr++; reihe.push({id:o.id, nr, a, o, b, w, grund}); return {q:w, neu:true, von:nr}; };
  function zeile(c, inKl){
    if(hatKl(c)) return c.map(x=>istKl(x)?klammer(x):x);
    if(hatPunkt(c)){
      const strich=c.some(x=>istOp(x)&&!PUNKT(x)), out=[c[0]];
      for(let k=1;k<c.length;k+=2){ const o=c[k], r=c[k+1];
        if(PUNKT(o)&&(k===1||!PUNKT(c[k-2]))){ const l=out.pop(); out.push(tu(l,o,r, inKl?'klammer':strich?'punkt':'links')); } else out.push(o,r); }
      return out;
    }
    return null;
  }
  function klammer(b){
    if(nurStrich(b.c)){ let v=b.c[0]; for(let k=1;k<b.c.length;k+=2) v=tu(v,b.c[k],b.c[k+1],'klammer'); return v; }
    const r=zeile(b.c, true); return r.length===1 ? r[0] : {kl:b.kl, c:r};
  }
  const vorherDa = c => c.some(x=>istKl(x)?vorherDa(x.c):!istOp(x)&&x.vorher);
  const zeilen=[]; let cur=kette;
  for(let s=0; s<12; s++){
    if(cur.length===1 && !istKl(cur[0])) break;
    if(nurStrich(cur)){
      const gl=[Object.assign({}, cur[0])]; for(let k=1;k<cur.length;k+=2) gl.push(Object.assign({}, cur[k+1], {q:cur[k].op==='+'?cur[k+1].q:qneg(cur[k+1].q)}));
      let v=cur[0]; for(let k=1;k<cur.length;k+=2) v=tu(v,cur[k],cur[k+1],'strich');
      zeilen.push({art:'glieder', glieder:gl, kette:cur}); cur=[v]; break;
    }
    const nx=zeile(klon(cur), false);
    if(nx.length===1 && !istKl(nx[0])){ cur=nx; break; }
    // ein Teilergebnis, das in der nächsten Zwischenzeile unverändert stehen bliebe, würde die Lösung verraten
    if(vorherDa(nx)) sauber=false;
    zeilen.push({art:'zwischen', kette:nx}); cur=nx;
  }
  return {zeilen, ergebnis:cur[0].q, reihe, sauber, nrVon:id=>(reihe.find(s=>s.id===id)||{}).nr};
}
// erlaubte erste Rechnungen (einzeln, für Antippen und Reihenfolge): IDs der Zeichen
function vgErlaubt(c){
  if(hatKl(c)) return c.filter(istKl).flatMap(b=>nurStrich(b.c)?[b.c[1].id]:vgErlaubt(b.c));
  if(hatPunkt(c)) return c.filter((x,k)=>istOp(x)&&PUNKT(x)&&(k===1||!PUNKT(c[k-2]))).map(x=>x.id);
  return c.length>1 ? [c[1].id] : [];
}
// eine Rechnung ausführen (Zeichen-ID), liefert die neue Kette und den Schritt {a, o, b, w}
function vgEinzeln(c, id){
  let schritt=null;
  const geh = c => { const k=c.findIndex(x=>istOp(x)&&x.id===id);
    if(k>0){ const w=rechneOp(c[k-1].q,c[k].op,c[k+1].q); schritt={a:c[k-1], o:c[k], b:c[k+1], w}; return [...c.slice(0,k-1), {q:w}, ...c.slice(k+2)]; }
    return c.map(x=>{ if(!istKl(x)) return x; const r=geh(x.c); return r.length===1 ? r[0] : {kl:x.kl, c:r}; }); };
  return {kette:geh(c), schritt};
}
// alle richtigen Reihenfolgen der einzelnen Rechnungen
function vgOrdnungen(c){
  const ids=vgErlaubt(c); if(!ids.length) return [[]];
  return ids.flatMap(id=>vgOrdnungen(vgEinzeln(c,id).kette).map(r=>[id,...r]));
}
/* Anzeige: Zahlen in Vorzeichen-Klammern (+12), (−⅝) mit waagrechtem Strich; o.nr(id) → Nummer über dem Zeichen,
   o.tipp → Zeichen zum Antippen (Form 'fragen' im Bild), o.feld(knoten) → HTML für neue Teilergebnisse */
const betragH = n => { const a=[Math.abs(n.q[0]), n.q[1]]; return n.art==='misch'&&a[0]>a[1] ? gemHTML(a) : n.art==='dez' ? Z(qwert(a)) : bHTML(a); };
const betragT = n => { const a=[Math.abs(n.q[0]), n.q[1]]; return n.art==='misch'&&a[0]>a[1] ? gemText(a) : n.art==='dez' ? Z(qwert(a)) : bText(a); };
const vgZahlH = n => `(<b class="sg">${n.q[0]<0?M:'+'}</b>${betragH(n)})`;
const vgZahlT = n => `(${n.q[0]<0?M:'+'}${betragT(n)})`;
function vgHTML(c, o={}){
  return c.map(x=>{
    if(istKl(x)) return `[${vgHTML(x.c,o)}]`;
    if(istOp(x)){ const nr=o.nr&&o.nr(x.id);
      if(o.tipp) return ` <button type="button" class="vg-tipp" data-wg="${o.tipp}" data-wert="${x.id}" aria-label="Rechenzeichen ${x.op}">${x.op}</button> `;
      return nr ? ` <span class="vg-op" data-nr="${KREIS[nr]}">${x.op}</span> ` : ` ${x.op} `; }
    if(x.neu&&o.feld) return o.feld(x);
    return vgZahlH(x);
  }).join('').replace(/ {2,}/g,' ').trim();
}

    const ab=Math.round(Math.abs(qwert(q))/qwert(Q(...s.schritt))), seite=qwert(q)<0?'links':'rechts';
    const why=`${schrittWort(s)} Zähle die Striche von 0 aus: ${ab} ${ab===1?'Strich':'Striche'} nach ${seite}${qwert(q)<0?', also negativ':''}.`;
    const basis={q:'Welche Zahl ist auf der Zahlengeraden markiert?', papierLead:'Lies ab!', bild, loesungBild, daten:{s:{start:s.start, schritt:s.schritt, n:s.n}, k}, why};
    if(leicht){
      const kand=[s.q(k-1>=0?k-1:k+2), s.q(k+1<=s.n?k+1:k-2), Q(-q[0],q[1]), Q(q[0]+q[1],q[1]), Q(q[0]-q[1],q[1])]
        .filter(x=>qvgl(x,q)!==0);
      const ab4=[]; for(const x of mischen(kand)) if(ab4.length<3&&!ab4.some(y=>qvgl(x,y)===0)) ab4.push(x);
      const l=mischen([q,...ab4]);
      return aufg(Object.assign(basis,{kind:'fragen', lead:merk(RECHTS), gruppen:[{optionen:l.map(x=>[zahlText(s,x), zahlHTML(s,x)]), ans:zahlText(s,q)}]}));
    }
    const feld = s.art==='bruch' ? mischFeld('Zahl', q) : vzFeld('Zahl', qwert(q));
    return aufg(Object.assign(basis,{kind:'zahlen', felder:[feld]}));
  },
  // G1-A03 Zahlen der Größe nach ordnen; „größer und kleiner“: im Check Aufgabe 0 aufsteigend, Aufgabe 1 absteigend
  ordnen(ctx){
    const leicht=!!(ctx&&ctx.leicht);
    const auf = ctx&&ctx.nr!==undefined ? ctx.nr%2===0 : Math.random()<.5;
    const werte=versuche(()=>{
      const art=leicht?'klein':pick(['klein','dez','gross']), anz=leicht?3:art==='gross'?5:4;
      let l;
      if(art==='klein') l=Array.from({length:anz},()=>rnd(-9,9));
      else if(art==='gross') l=Array.from({length:anz},()=>rnd(10,999)*(Math.random()<.6?-1:1));
      else { const a=rnd(-10,9); l=[a, a-0.5, ...Array.from({length:anz-2},()=>rnd(-99,99)/10)]; }
      l=l.map(x=>Math.round(x*10)/10);

      return l;
    });
    const plus=Math.random()<.4, karten=werte.map((v,i)=>({id:'k'+i, text:Z(v,plus)}));
    const sortiert=[...karten].sort((a,b)=>(werte[+a.id.slice(1)]-werte[+b.id.slice(1)])*(auf?1:-1));
    const richtung = auf ? 'von der kleinsten bis zur größten' : 'von der größten bis zur kleinsten';
    const zeichen = auf ? ' < ' : ' > ';
    const negs=werte.filter(v=>v<0).sort((a,b)=>a-b);
    return aufg({kind:'reihenfolge', qh:`Ordne die Zahlen <b>${richtung}</b>!`, q:`Ordne ${richtung}: ${karten.map(k=>k.text).join('; ')}`,
      lead: leicht ? merk(RECHTS) : '', karten, loesungen:[sortiert.map(k=>k.id)], fest:leicht?1:0, auf,
      loesungBild:punkteSVG(werte.map(v=>({v, text:Z(v,plus)}))),
      why:`${RECHTS} Achtung bei negativen Zahlen: ${Z(negs[0])} ist kleiner als ${Z(negs[1])}, weil ${Z(negs[0])} weiter links liegt.`,
      steps:sortiert.map(k=>k.text).join(zeichen)});
  },
  // G1-A04 <, = oder > setzen (Dezimalzahlen mit verschiedener Stellenzahl, negativ und positiv)
  vergleichen(ctx){
    const leicht=!!(ctx&&ctx.leicht);
    const [a,b,art]=versuche(()=>{
      const art=leicht?pick(['nah','vz']):pick(['nah','stellen','tausch','gleich','vz']);
      const sg=Math.random()<.65?-1:1;
      if(art==='nah'){ const x=rnd(-99,99)/10, y=Math.round((x+pick([-1,1])*rnd(1,3)/10)*10)/10; return [Z(x),Z(y),art]; }
      if(art==='stellen'){ const g=rnd(0,12), d=rnd(1,9); return [Z(sg*(g+d/10)), Z(sg*(g+d/100)), art]; }        // −3,9 und −3,09
      if(art==='tausch'){ const p=rnd(1,9), q=rnd(1,9); if(p===q) return null; return [Z(sg*(10+p+q/10)), Z(sg*(10+q+p/10)), art]; }   // −12,3 und −13,2
      if(art==='gleich'){ const x=sg*rnd(1,199)/10; const t=Z(x), t0=t.includes(',')?t+'0':t+',0'; return Math.random()<.5 ? [t, t0, art] : [t0, t, art]; }
      const x=rnd(1,99)/10, y=rnd(1,99)/10; return Math.random()<.5 ? [Z(-x),Z(y),art] : [Z(x),Z(-y),art];
    });
    const va=alsQ(Number(a.replace(M,'-').replace(',','.'))), vb=alsQ(Number(b.replace(M,'-').replace(',','.')));
    const c=qvgl(va,vb), ans=c<0?'<':c>0?'>':'=';
    const why = ans==='=' ? 'Eine Null am Ende nach dem Komma ändert nichts: Beide Zahlen sind gleich groß.'
      : `Weiter links ist kleiner: ${ans==='<'?a:b} liegt weiter links als ${ans==='<'?b:a}.`;
    return aufg({kind:'fragen', q:`${a} ☐ ${b}`, qh:`${a} <span class="luecke">☐</span> ${b}`, lead:leicht?merk('Weiter links auf der Zahlengeraden ist kleiner.'):'Setze das richtige Zeichen!', art,
      gruppen:[{optionen:[['<','<'],['=','='],['>','>']], ans, klasse:'drei'}],

  },
  // G1-A05 Betrag bestimmen
  betrag(){

      loesungBild:punkteSVG([{v}], {abstand:v}),

  },
  // G1-A06 Gegenzahl angeben (ganze Zahlen bis 4 Stellen)
  gegenzahl(){

      loesungBild:punkteSVG([{v, text:Z(v,true)},{v:-v, text:Z(-v,true), farbe:'var(--c2)'}], {spiegel:v}),
      why:'Gegenzahlen haben den gleichen Abstand von 0, aber verschiedene Vorzeichen.', steps:`Gegenzahl von ${Z(v,true)} = ${Z(-v,true)}`});
  },
  // G1-A07 Tabelle: Zahl, Gegenzahl, Betrag (je Zeile eine andere Spalte vorgegeben)
  tabelle(){

      else if(art==='gegen'){ zeilen.push(['?',P(-z),'?']); felder.push(vzFeld(`Zeile ${nr}: Zahl`, z, {plus:true}), vzFeld(`Zeile ${nr}: Betrag`, Math.abs(z))); }

    return aufg({kind:'zahlen', qh:`Ergänze die Tabelle!${tab}`, q:`Ergänze die Tabelle: ${zeilen.map(r=>r.join(' | ')).join(' ; ')}`, felder, zeilen, arten, werte,
      why:'Die Gegenzahl hat das andere Vorzeichen. Der Betrag ist der Abstand von 0, also nie negativ.',
      steps:arten.map((a,i)=>`${Z(werte[i],true)} | ${Z(-werte[i],true)} | ${Z(Math.abs(werte[i]))}`).join(' · ')});
  },

  zeichen(ctx){

    const z=teile.filter(x=>x.c);

      gruppen:z.map((x,i)=>({frage:`Zeichen ${KREIS[i]} <span class="sgn">${x.c}</span>`, optionen:[['V','Vorzeichen'],['R','Rechenzeichen']], ans:x.art})),
      loesungBild:`<div class="vrblock"><div class="task vrterm">${termHTML(teile,true)}</div><p class="small muted">V = Vorzeichen, R = Rechenzeichen</p></div>`,
      why:VR_REGEL});
  },
  // G1-N01 Begriffe in Lücken (Auswahl je Lücke); leicht: ein Satz, drei Wörter
  luecken(ctx){

      lead:'Ergänze die Sätze mit den richtigen Begriffen!',
      gruppen:saetze.map((s,i)=>({frage:saetze.length>1?`Lücke ${KREIS[i]}`:'', optionen:mischen([s[1],...mischen(s[2]).slice(0,leicht?2:3)]).map(x=>[x,x]), ans:s[1]})),
      why:saetze.map(s=>satzHTML(s[0].replace('…',s[1]))).join(' ')});

  /* ---------- Plus ---------- */
  // G1-A09 zwei Zahlen mit gegebenem Betrag (Reihenfolge egal)
  mitBetrag(){

    const felder=[vzFeld('1. Zahl', b, {auch:[-b], plus:true}), vzFeld('2. Zahl', -b, {auch:[b], plus:true})];
    return aufg({kind:'zahlen', q:`Finde zwei Zahlen mit dem Betrag ${Z(b)}!`, felder, betrag:b,

      why:'Zwei Zahlen haben den gleichen Betrag: die Zahl und ihre Gegenzahl.', steps:`|${Z(b,true)}| = |${Z(-b)}| = ${Z(b)}`});

  // V1-A03 Brüche addieren und subtrahieren, Schritt für Schritt (Lehrkraft 21.11.2026): gemischte Zahlen umwandeln,

  // V1-A04 Brüche multiplizieren (Lehrkraft 21.11.2026): gemischte Zahlen umwandeln, ein Bruchstrich mit Vorzeichen

  // V1-A05 Brüche dividieren (Lehrkraft 21.11.2026): gemischte Zahlen umwandeln, aus der Division eine Multiplikation

  s+=`<line x1="${xb-74}" x2="${W-4}" y1="${y(-1)}" y2="${y(-1)}" stroke="var(--text)" stroke-width="2.2"/>
    <text x="4" y="${y(-1)-4}" font-size="10" fill="var(--muted)">Erdboden</text>
    <rect x="${xs}" y="${y(og)}" width="18" height="${(og+u+1)*zh}" fill="none" stroke="var(--muted)" stroke-dasharray="3 2"/>`;
  if(o.start!==undefined) s+=`<rect x="${xs+2}" y="${y(o.start)+2}" width="14" height="${zh-4}" rx="2" fill="var(--c1)"/>`;
  (o.wege||[]).forEach((p,i)=>{ const x=222+i*18, ya=y(p.a)+zh/2, yb=y(p.b)+zh/2;
    s+=`<line x1="${x}" x2="${x}" y1="${ya}" y2="${yb+(p.b>p.a?6:-6)}" stroke="var(--c2)" stroke-width="2.6" marker-end="url(#v3pa)"/>${badge(x,ya,i+1,'var(--c2)')}`; });
