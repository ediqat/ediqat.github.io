    if(art==='winkel') return aufg(Object.assign(basis,{q:`Tippe den Winkel ${GR[e]} an.`, bild:zeichne(P,{ecken:true, tippWinkel:'q0'}),
      gruppen:[{imBild:true, optionen:WINK, ans:e}]}));
    if(art==='verbindet'){ const [x,y]=gegen[e]; return aufg(Object.assign(basis,{q:`Welche Seite verbindet die Ecken ${[x,y].sort().join(' und ')}? Tippe sie an.`,
      bild:zeichne(P,{ecken:true, tippSeiten:'q0'}), gruppen:[{imBild:true, optionen:SEITEN, ans:KL[e]}]})); }
    if(art==='ecke') return aufg(Object.assign(basis,{q:'Wie heißt die Ecke mit dem Fragezeichen?', bild:zeichne(P,{ecken:true, frageEcke:e}),
      gruppen:[{optionen:[['A','A'],['B','B'],['C','C']], ans:e, klasse:'drei'}]}));
    return aufg(Object.assign(basis,{q:'Wie heißt die markierte Seite?', bild:zeichne(P,{ecken:true, markiereSeite:KL[e]}),
      gruppen:[{optionen:[['a','a'],['b','b'],['c','c']], ans:KL[e], klasse:'drei'}]}));
  },
  // G1-A05 Höhe erkennen: drei Strecken von einer Ecke (Höhe, Seitenhalbierende, schiefe Strecke) oder eine Höhe benennen
  hoehe(ctx){
    const leicht=ctx&&ctx.leicht;
    return versuche(()=>{
      const [w,s]=pick(KOMBIS.filter(k=>k[1]!=='gleichseitig')), {P}=dreieckFuer(w,s), X=pick(['A','B','C']), [Y,Z]=gegen[X];
      const {F,t:tf}=lot(P[X],P[Y],P[Z]), lang=dist(P[Y],P[Z]), innen=tf>1e-6&&tf<1-1e-6;
      if(dist(F,P[Y])<.12*lang||dist(F,P[Z])<.12*lang) return null;              // Höhe fällt fast mit einer Seite zusammen
      const verl = innen ? [] : [[tf<0?P[Y]:P[Z], vplus(F,mal(minus(F,tf<0?P[Y]:P[Z]),.15))]];
      if(leicht || Math.random()<.65){
        const Mi=mal(vplus(P[Y],P[Z]),.5), ts=pick([.15,.85]), Sch=vplus(P[Y],mal(minus(P[Z],P[Y]),ts));
        if(dist(F,Mi)<.2*lang||dist(F,Sch)<.2*lang||dist(Mi,Sch)<.2*lang) return null;
        // alle drei Strecken gleich gezeichnet, sonst verrät das Bild die Höhe
        const nr=mischen(['1','2','3']), str=mischen([{bis:F,art:'hilf',nr:nr[0]},{bis:Mi,art:'hilf',nr:nr[1]},{bis:Sch,art:'hilf',nr:nr[2]}])
          .map(x=>Object.assign(x,{von:P[X], wg:'q0', wert:x.nr}));
        const gr=[{imBild:true, optionen:[['1','Strecke ①'],['2','Strecke ②'],['3','Strecke ③']], ans:nr[0]}];
        if(!leicht) gr.push({frage:`Auf welche Seite steht ${sub('h',KL[X])} normal?`, optionen:[['a','a'],['b','b'],['c','c']], ans:KL[X], klasse:'drei'});
        return aufg({kind:'fragen', q:`Welche Strecke ist die Höhe h${KL[X]}?`, qh:`Welche Strecke ist die Höhe ${sub('h',KL[X])}? Tippe sie an.`, text:true, bild:zeichne(P,{ecken:true, strecken:str, verlaengern:verl}), gruppen:gr,
          daten:{P, X, F}, pruef:'hoehe_a',
          why:`Die Höhe ${sub('h',KL[X])} geht von der Ecke ${X} normal (im rechten Winkel) auf die gegenüberliegende Seite ${KL[X]}${innen?'':'; hier liegt sie außerhalb, die Seite wird verlängert'}.`,
          loesungBild:zeichne(P,{ecken:true, seitenNamen:true, strecken:[{von:P[X],bis:F,art:'hoehe',text:sub('h',KL[X]),fussRecht:true}], verlaengern:verl})});
      }
      return aufg({kind:'fragen', q:'Welche Höhe ist eingezeichnet?', text:true,
        bild:zeichne(P,{ecken:true, strecken:[{von:P[X],bis:F,art:'hoehe'}], verlaengern:verl}),
        gruppen:[{frage:'Welche Höhe ist das?', optionen:['a','b','c'].map(x=>[x,sub('h',x)]), ans:KL[X], klasse:'drei'},
          {frage:'Wo liegt sie?', optionen:[['innen','innerhalb des Dreiecks'],['aussen','außerhalb des Dreiecks']], ans:innen?'innen':'aussen', klasse:'lang'}],
        daten:{P, X, F}, pruef:'hoehe_b',
        why:`Die Höhe geht durch die Ecke ${X} und steht normal auf die Seite ${KL[X]}: Sie heißt ${sub('h',KL[X])}. ${innen?'Sie liegt innerhalb des Dreiecks.':'Sie liegt außerhalb; die Seite wird verlängert. Das passiert im stumpfwinkeligen Dreieck.'}`,
        loesungBild:zeichne(P,{ecken:true, seitenNamen:true, strecken:[{von:P[X],bis:F,art:'hoehe',text:sub('h',KL[X]),fussRecht:true}], verlaengern:verl})});
    });
  },
  // G1-N01 (Plus) Stimmt das?
  stimmt_das(){
    const [aussage,wahr,grund,falsch]=pick(STIMMT), g=mischen([['g0',grund],['g1',falsch[0]],['g2',falsch[1]]]), name=pick(NAMEN);
    return aufg({kind:'fragen', q:`${name}: ${aussage.replace(/h_([abc])/g,'h$1')}`, qh:`${name}: ${anzeige(aussage)}`, text:true, pruef:'stimmt', wahr,
      gruppen:[{frage:'Stimmt das?', optionen:[['ja','Stimmt'],['nein','Stimmt nicht']], ans:wahr?'ja':'nein'}, {frage:'Warum?', optionen:g.map(([v,l])=>[v,anzeige(l)]), ans:'g0', klasse:'lang'}],
      why:anzeige(grund)});
  },
  // G1-N02 (Plus) Gibt es das?
  gibt_es_das(){
    const [was,ja,grund,falsch]=pick(GIBT_ES), g=mischen([['g0',grund],['g1',falsch[0]],['g2',falsch[1]]]);
    return aufg({kind:'fragen', q:`Gibt es ein Dreieck mit dieser Eigenschaft: ${was}?`, text:true, pruef:'gibtes', was, ja,
      gruppen:[{frage:'Gibt es das?', optionen:[['ja','Ja'],['nein','Nein']], ans:ja?'ja':'nein'}, {frage:'Warum?', optionen:g, ans:'g0', klasse:'lang'}],
      why:`${grund} Die Winkelsumme ist immer 180°; gleichseitig heißt drei Winkel zu 60°.`});
  },
  // G1-N03 (Plus) Dreiecke im Alltag
  alltag(){
    const [text,nach,ans,W]=pick(ALLTAG), opt=nach==='W'?WART:SART;
    return aufg({kind:'fragen', q:`${text}: Was für ein Dreieck ist das?`, text:true, bild:zeichne(lage(ausWinkeln(...mischen(W))),{hilfe:'farbe'}),
      pruef:'alltag', W, nach, gruppen:[{frage:nach==='W'?'Nach den Winkeln':'Nach den Seiten', optionen:opt, ans, klasse:'drei'}],
      why:nach==='W'?WARUM_W:WARUM_S});
  },
  // G1-N04 (Plus) Dreiecks-Memory: Begriff und Erklärung verbinden
  memory(){
    const paare=mischen(MEMORY).slice(0,4);
    return aufg({kind:'zuordnen', q:'Verbinde jeden Begriff mit der passenden Erklärung.', text:true, pruef:'memory',
      dinge:paare.map(([b],i)=>({id:'m'+i, html:anzeige(b), kurz:b})), ziele:mischen(paare.map(([,e],i)=>({id:'e'+i, text:anzeige(e)}))),
      ans:Object.fromEntries(paare.map((p,i)=>['m'+i,'e'+i])), paare, why:'Jeder Begriff hat genau eine passende Erklärung.'});
  },
  // G1-N05 (Plus) Winkel-Puzzle: Welche drei Winkel ergeben ein Dreieck?
  winkel_puzzle(){
    const karten=[];
    const passt=mischen([true,true,true,false,false,false]);
    for(let i=0;i<6;i++) karten.push(versuche(()=>{
      const zehntel=Math.random()<.5, a=zehntel?rnd(100,1500):rnd(10,150)*10, b=zehntel?rnd(100,1500):rnd(10,150)*10;
      let c=1800-a-b; if(!passt[i]) c+=(Math.random()<.5?-1:1)*rnd(1,5)*10;
      if(c<100||c>1500) return null; return [a/10,b/10,c/10];
    }));
    return aufg({kind:'zuordnen', q:'Welche Winkel ergeben zusammen ein Dreieck? Ordne jede Karte zu.', text:true, pruef:'puzzle',
      dinge:karten.map((k,i)=>({id:'k'+i, html:k.map(x=>D(x)+'°').join(' · ')})), ziele:[{id:'ja',text:'passt (180°)'},{id:'nein',text:'passt nicht'}],
      ans:Object.fromEntries(karten.map((k,i)=>['k'+i, passt[i]?'ja':'nein'])), karten,
      why:'Rechne die drei Winkel zusammen. Nur wenn genau 180° herauskommt, passen sie zu einem Dreieck.'});
  }
};

    if(W.some(v=>!(v>=25&&v<=125))||L.some(v=>!(v>=lo*.75&&v<=hi*1.25))||Math.max(...L)>3*Math.min(...L)) return null;
    // gegebene Werte deutlich verschieden (sonst gibt es keine falschen Skizzen durch Vertauschen)
    const gs=geg.filter(k=>k===kl(k)).map(k=>({x,y,z})[k]), gw=geg.filter(k=>k!==kl(k)).map(k=>({X,Y,Z})[k]);
    if(gs.some((v,i)=>gs.some((u,j)=>j>i&&Math.abs(u-v)<.5))||gw.some((v,i)=>gw.some((u,j)=>j>i&&Math.abs(u-v)<8))) return null;
    const N=mischen(['A','B','C']), kan={X:N[0], Y:N[1], Z:N[2]}, S={}, Wi={};
    S[kl(kan.X)]=x; S[kl(kan.Y)]=y; S[kl(kan.Z)]=z; Wi[kan.X]=X; Wi[kan.Y]=Y; Wi[kan.Z]=Z;
    return {fall, kan, S, W:Wi, geg:geg.map(k=>k===kl(k)?kl(kan[k.toUpperCase()]):kan[k]), P:ausSeiten(S.a,S.b,S.c)};
  });
}
const istSeite = k => k===kl(k);
// Angabe: erst die Seiten, dann die Winkel, jeweils alphabetisch
const angabe = d => [...d.geg].sort((p,q)=>(istSeite(q)-istSeite(p))||p.localeCompare(q)).map(k=>istSeite(k)?`${k} = ${cm(d.S[k])}`:`${GR[k]} = ${D(d.W[k])}°`).join(', ');
const seitenTexte = (d,keys) => Object.fromEntries(keys.filter(istSeite).map(k=>[k,cm(d.S[k])]));
const winkelTexte = (d,keys) => Object.fromEntries(keys.filter(k=>!istSeite(k)).map(k=>[k,`${D(d.W[k])}°`]));
// Planskizze: Ecken beschriftet, gegebene Stücke mit ihren Werten (wahlweise farbig)
function skizze(d, o={}){
  const P=o.phi!==undefined?drehen(d.P,o.phi):d.P;
  return zeichne(P, Object.assign({ecken:true, seitenNamen:false, seitenText:o.seitenText||seitenTexte(d,d.geg), winkelText:o.winkelText||winkelTexte(d,d.geg),
    markSeiten:o.farbig?d.geg.filter(istSeite):[], markWinkel:o.farbig?d.geg.filter(k=>!istSeite(k)):[]}, o.extra||{}));
}

/* ---------- Konstruktionsablauf je Fall ---------- */
function ablauf(d){
  const {X,Y,Z}=d.kan, x=kl(X), y=kl(Y), z=kl(Z), S=d.S, W=d.W;
  const basis={id:'basis', text:`Zeichne die Seite ${z} = ${cm(S[z])}. Die Enden heißen ${X} und ${Y}.`, kurz:`${z} zeichnen`};
  const kreis=(P,s)=>({id:'kreis'+P, text:`Zeichne einen Kreisbogen um ${P} mit dem Radius ${s} = ${cm(S[s])}.`, kurz:`Kreisbogen um ${P}`});
  const winkel=V=>({id:'winkel'+V, text:`Trage bei ${V} den Winkel ${GR[V]} = ${D(W[V])}° an.`, kurz:`${GR[V]} bei ${V} antragen`});
  if(d.fall==='SSS') return [basis, kreis(X,y), kreis(Y,x), {id:'schnitt', text:`Der Schnittpunkt der zwei Kreisbögen ist ${Z}.`, kurz:`Schnittpunkt ${Z}`},
    {id:'verbinde', text:`Verbinde ${Z} mit ${X} und mit ${Y}.`, kurz:`${Z} verbinden`}];
  if(d.fall==='SWS') return [basis, winkel(X), {id:'abtragen', text:`Trage auf dem freien Schenkel ${y} = ${cm(S[y])} ab. Der Endpunkt ist ${Z}.`, kurz:`${y} abtragen`},
    {id:'verbinde', text:`Verbinde ${Z} mit ${Y}.`, kurz:`${Z} verbinden`}];
  if(d.fall==='WSW') return [basis, winkel(X), winkel(Y), {id:'schnitt', text:`Der Schnittpunkt der zwei freien Schenkel ist ${Z}.`, kurz:`Schnittpunkt ${Z}`}];
  return [basis, winkel(Y), kreis(X,y), {id:'schnitt', text:`Der Schnittpunkt von Kreisbogen und freiem Schenkel ist ${Z}.`, kurz:`Schnittpunkt ${Z}`},
    {id:'verbinde', text:`Verbinde ${Z} mit ${X}.`, kurz:`${Z} verbinden`}];
}
// gleichwertige Reihenfolgen: die zwei Kreisbögen (SSS), die zwei Winkel (WSW), Winkel und Kreisbogen (SsW)
function loesungen(d){
  const ids=ablauf(d).map(s=>s.id), l=[ids];
  if(d.fall!=='SWS'){ const t=[...ids]; [t[1],t[2]]=[t[2],t[1]]; l.push(t); }
  return l;
}
// Bild nach k Schritten (k = Länge des Ablaufs: fertiges Dreieck mit allen Konstruktionslinien)
function konstruktion(d, k, o={}){
  const {X,Y,Z}=d.kan, P=d.P, schritte=ablauf(d).slice(0,k), z=kl(Z), y=kl(Y), x=kl(X);
  const opt={ecken:true, eckenNur:[X,Y], nurSeiten:[z], boegen:[], strahlen:[], markWinkel:[], punkte:[], seitenNamen:false,
    seitenText:{[z]:cm(d.S[z])}, winkelText:{}, breite:o.breite||320, pad:o.pad||30, hoeheMax:o.hoeheMax||240};
  const schenkel = V => ({von:P[V], bis:vplus(P[V],mal(minus(P[Z],P[V]),1.3))});
  for(const s of schritte){
    if(s.id.startsWith('kreis')){ const M=s.id.slice(5); opt.boegen.push({mitte:P[M], r:dist(P[M],P[Z]), durch:P[Z]}); }
    if(s.id.startsWith('winkel')){ const V=s.id.slice(6); opt.strahlen.push(schenkel(V)); opt.markWinkel.push(V); opt.winkelText[V]=`${D(d.W[V])}°`; }
    if(s.id==='abtragen'){ opt.boegen.push({mitte:P[X], r:dist(P[X],P[Z]), durch:P[Z], spanne:12}); opt.nurSeiten.push(y); opt.seitenText[y]=cm(d.S[y]); opt.eckenNur.push(Z); }
    if(s.id==='schnitt'){ opt.eckenNur.push(Z); opt.punkte.push({p:P[Z]}); }
    if(s.id==='verbinde'){ opt.nurSeiten.push(...[x,y].filter(v=>!opt.nurSeiten.includes(v))); }
  }
  if(k>=ablauf(d).length){ opt.nurSeiten=null; Object.assign(opt.seitenText, seitenTexte(d,d.geg)); if(o.gesucht) Object.assign(opt.seitenText,o.gesucht.s||{}), Object.assign(opt.winkelText,o.gesucht.w||{}); }
  if(!opt.nurSeiten) delete opt.nurSeiten;
  return zeichne(P, opt);
}
function schrittBilder(d){
  const l=ablauf(d);
  return `<div class="kon-schritte">${l.map((s,i)=>`<figure class="kon-schritt"><figcaption>${i+1}. ${s.kurz}</figcaption>${konstruktion(d,i+1,{breite:220,pad:24,hoeheMax:160})}</figure>`).join('')}</div>`;
}

/* ---------- Aufgabentypen ---------- */

      bild:leicht?skizze(d):'', pruef:'messwert', d, gesucht:k,

    const g=ja?`α + β = ${s}° ist kleiner als 180°: Für γ bleiben ${180-s}°.`:`α + β = ${s}° ist größer als 180°: Für γ bleibt nichts übrig.`;
    const opt=mischen([['g0',g],['g1','Die Winkel müssen zusammen 360° ergeben.'],['g2',ja?'Ein Dreieck darf keinen Winkel über 90° haben.':'Zwei Winkel dürfen nicht verschieden groß sein.']]);
    return aufg({kind:'fragen', q:`α = ${al}°, β = ${be}°. Lässt sich ein Dreieck mit diesen Winkeln konstruieren?`, text:true, pruef:'konstruierbar',
      gruppen:[{frage:'Gibt es das Dreieck?', optionen:[['ja','Ja'],['nein','Nein']], ans:ja?'ja':'nein'}, {frage:'Warum?', optionen:opt, ans:'g0', klasse:'lang'}],
      why:'Die Winkelsumme im Dreieck ist 180°. Zwei Winkel zusammen müssen also kleiner als 180° sein.'});
  },
  // V1-N02 (Plus) Fehler in der Konstruktion finden: ein Schritt ist falsch ausgeführt, Nummer im Bild antippen
  fehler_konstruktion(){
    return versuche(()=>{
      const d=dreieck(pick(Object.keys(FAELLE))), {X,Y,Z}=d.kan, x=kl(X), y=kl(Y), z=kl(Z), S=d.S, W=d.W;
      // Schritte: [Art, Wert wie ausgeführt]; einer wird verfälscht
      const zwei = d.fall==='SSS' ? [['kreis',X,y],['kreis',Y,x]] : d.fall==='SWS' ? [['winkel',X],['abtragen',X,y]] : d.fall==='WSW' ? [['winkel',X],['winkel',Y]] : [['winkel',Y],['kreis',X,y]];
      const plan=[{art:'basis', v:S[z]}, ...zwei.map(([art,P,s])=>({art, P, s, v:art==='winkel'?W[P]:S[s]}))];
      const i=rnd(0,2), f=plan[i]; let fehler;
      if(f.art==='basis'){ f.v=rund(f.v+pick([-1,1])*zehntel(1,2),1); fehler=`Die Seite ${z} ist ${cm(S[z])} lang, nicht ${cm(f.v)}.`; }
      else if(f.art==='winkel'){ const andere=d.geg.find(k=>!istSeite(k)&&k!==f.P); f.v = andere&&Math.random()<.5 ? W[andere] : 180-W[f.P];
        if(Math.abs(f.v-W[f.P])<10) return null; fehler=`Bei ${f.P} gehört der Winkel ${GR[f.P]} = ${D(W[f.P])}°, nicht ${D(f.v)}°.`; }
      else { const andere=d.geg.find(k=>istSeite(k)&&k!==f.s); f.v=andere?S[andere]:rund(f.v+1.5,1); if(Math.abs(f.v-S[f.s])<.5) return null;
        fehler=f.art==='kreis'?`Der Radius um ${f.P} muss ${f.s} = ${cm(S[f.s])} sein, nicht ${cm(f.v)}.`:`Abgetragen wird ${f.s} = ${cm(S[f.s])}, nicht ${cm(f.v)}.`; }
      // falsche Konstruktion ausführen: X = (0|0), Y = (Basis|0), dritte Ecke oberhalb
      const bas=plan[0].v, PX=[0,0], PY=[bas,0], dir=(V,w)=>V===X?[Math.cos(rad(w)),Math.sin(rad(w))]:[-Math.cos(rad(w)),Math.sin(rad(w))];
      const kreisSchnitt=(r1,r2)=>{ const u=(r1*r1-r2*r2+bas*bas)/(2*bas), h2=r1*r1-u*u; return h2>0?[u,Math.sqrt(h2)]:null; };

      if(fl<0) P={A:[P.A[0],-P.A[1]],B:[P.B[0],-P.B[1]],C:[P.C[0],-P.C[1]]};      // spiegeln: A, B, C gegen den Uhrzeigersinn
      const wi=UR.dreiecke.winkel(P); if(Object.values(wi).some(v=>v<15)) return null;
      const opt={ecken:true, seitenNamen:false, boegen:[], strahlen:[], markWinkel:[], nummern:[{seite:z, nr:'1', wg:'q0'}], winkelText:{}};

        if(p.art==='winkel'){ opt.strahlen.push({von:P[p.P], bis:vplus(P[p.P],mal(minus(P[Z],P[p.P]),1.25)), nr, wg:'q0'}); opt.markWinkel.push(p.P); opt.winkelText[p.P]=`${D(p.v)}°`; zeilen.push(`${sym} Winkel ${GR[p.P]} = ${D(p.v)}° bei ${p.P} angetragen`); }

      });
      const name=pick(NAMEN), ans=String(i+1);
      return aufg({kind:'fragen', q:`Gegeben: ${angabe(d)}. ${name} hat so konstruiert: ${zeilen.join('; ')}. Welcher Schritt ist falsch?`,
        qh:`Gegeben: ${angabe(d)}. ${name} hat so konstruiert:<ol class="kon-liste ohne">${zeilen.map(z=>`<li>${z}</li>`).join('')}</ol>Welcher Schritt ist falsch? Tippe seine Nummer im Bild an.`, text:true,
        bild:zeichne(P,opt), pruef:'fehler_konstruktion', d, zeilen,
        gruppen:[{imBild:true, optionen:[['1','Schritt ①'],['2','Schritt ②'],['3','Schritt ③']], ans}],
        why:`Schritt ${'①②③'[i]} ist falsch: ${fehler}`, loesungBild:konstruktion(d, ablauf(d).length)});

  }

        why, steps:`${GR[E3]} = 180° − (${D(W3[0])}° + ${D(W3[1])}°) = ${D(W3[2])}°; größter Winkel ${D(Math.max(...W3))}° → ${s2.ansText}`});
    });
  },
  // V2-A04 Höhe im gleichschenkeligen Dreieck (halbe Basis, dann Pythagoras)
  hoehe_gleichschenkelig(ctx){

  // V2-A05 Basis aus Schenkel und Höhe (c : 2 mit Pythagoras, dann verdoppeln; manchmal zuerst umrechnen)
  basis_aus_hoehe(ctx){

  mehrere_groessen(){

  // V2-N01 (Plus) Bild aufhängen
  bild_aufhaengen(){
    const ab=rnd(30,75)*2, hh=rnd(40,100), half=ab/2, s=Math.sqrt(half*half+hh*hh), L=2*s;
    const K=1.6, W=ab*K/1.2, svg=`<svg class="dreieck" viewBox="-20 -10 ${rund(W+40,1)} ${rund(hh*K/1.2+110,1)}" role="img" aria-label="Bild an einer Schnur">
      <rect class="dr" x="0" y="${rund(hh*K/1.2,1)}" width="${rund(W,1)}" height="90"/><path class="dr-hilf" d="M0,${rund(hh*K/1.2,1)} L${rund(W/2,1)},0 L${rund(W,1)},${rund(hh*K/1.2,1)}" fill="none"/>
      <line class="dr-hoehe" x1="${rund(W/2,1)}" y1="0" x2="${rund(W/2,1)}" y2="${rund(hh*K/1.2,1)}"/><circle class="dr-punkt" cx="${rund(W/2,1)}" cy="0" r="4"/>
      <text class="dr-t klein" x="${rund(W/2+30,1)}" y="${rund(hh*K/2.4+5,1)}">${hh} cm</text><text class="dr-t klein" x="${rund(W/2,1)}" y="${rund(hh*K/1.2+50,1)}">${ab} cm</text></svg>`;
    return aufg({kind:'zahlen', q:`Ein Bild hat oben zwei Ösen im Abstand von ${ab} cm. Die Schnur geht von Öse zu Öse über einen Haken, der genau über der Mitte ${hh} cm über der Oberkante des Bildes ist. Wie lang ist die Schnur? (eine Nachkommastelle)`, text:true,
      bild:svg.replace(/\s+/g,' '), pruef:'bild', felder:[{label:'Länge der Schnur', ans:rund(L,6), stellen:1, einheit:'cm', ansText:`${ungefaehr(L,1)} ${D(rund(L,1))} cm`}],
      why:'Der Haken und die Mitte der Oberkante teilen das Schnur-Dreieck in zwei rechtwinkelige Teildreiecke. Eine Hälfte der Schnur ist die längste Seite: √((Abstand : 2)² + Höhe²). Die Schnur ist doppelt so lang.',
      stepsh:wurzelStrich(`${half}² + ${hh}² = ${half*half+hh*hh}, √${half*half+hh*hh} ${ungefaehr(s,2)} ${D(rund(s,2))} cm, Schnur = 2 · ${D(rund(s,2))} ${ungefaehr(L,1)} ${D(rund(L,1))} cm`)});

  // V2-N02 (Plus) Fehler im Rechenweg: falsche Zeile antippen, dann ihr richtiges Ergebnis eintippen

      pruef:'fehler_rechenweg', zeilen:v.zeilen, angabe:v.angabe,
      s1:{label:'Schritt 1: In welcher Zeile ist der erste Fehler?', kurz:'Zeile', art:'wahl', wahl:opt, ans:String(v.i+1), ansText:`Zeile ${v.i+1}`},
      s2:{label:'Schritt 2: Wie lautet das richtige Ergebnis dieser Zeile?', ans:rund(r,6), stellen:v.stellen, einheit:v.einheit[v.i], einheitAns:v.einheit[v.i], ansText:`${D(rund(r,2))}${v.einheit[v.i]==='°'?'°':' '+v.einheit[v.i]}`},
      pre:{ans:String(v.i+1), optionen:opt}, schritt:'Zeile', why:`Fehler in Zeile ${v.i+1}: ${anz(v.warum)}`, stepsh:anz(v.weg)});
  },
  // V2-N03 (Plus) Dachgiebel
  dachgiebel(){
    const [w,s]=Math.random()<.5 ? (([k,h,sp])=>[2*k,sp])(pick([[3,4,5],[4,3,5],[6,8,10],[5,12,13],[4,3,5],[6,2.5,6.5],[2.4,3.2,4],[3.6,4.8,6]]))
      : versuche(()=>{ const w=rnd(4,14), s=zehntel(w/2+.5,w/2+5); return [w,s]; });
    const h=Math.sqrt(s*s-(w/2)**2);
    const K=22, svg=`<svg class="dreieck" viewBox="-40 -10 ${rund(w*K+80,1)} ${rund(h*K+50,1)}" role="img" aria-label="Dachgiebel">
      <path class="dr" d="M0,${rund(h*K,1)} L${rund(w*K/2,1)},0 L${rund(w*K,1)},${rund(h*K,1)} Z"/><line class="dr-hoehe" x1="${rund(w*K/2,1)}" y1="0" x2="${rund(w*K/2,1)}" y2="${rund(h*K,1)}"/>
      <text class="dr-t klein" x="${rund(w*K/2,1)}" y="${rund(h*K+24,1)}">${D(w)} m</text><text class="dr-t klein" x="${rund(w*K/4-18,1)}" y="${rund(h*K/2,1)}">${D(s)} m</text>
      <text class="dr-t klein" x="${rund(w*K/2+14,1)}" y="${rund(h*K/2+20,1)}">h</text></svg>`;
    return aufg({kind:'zahlen', q:`Ein Dach ist ${D(w)} m breit (Spannweite), die schrägen Sparren sind ${D(s)} m lang. Wie hoch ist der Giebel? (eine Nachkommastelle)`, text:true,
      bild:svg.replace(/\s+/g,' '), pruef:'dach', felder:[{label:'Höhe des Giebels', ans:rund(h,6), stellen:1, einheit:'m', ansText:`h ${ungefaehr(h,1)} ${D(rund(h,1))} m`}],
      why:'Die Höhe teilt den Giebel in zwei rechtwinkelige Dreiecke. Der Sparren ist die längste Seite, die halbe Spannweite eine Kathete: h = √(Sparren² − (Spannweite : 2)²).',
      stepsh:wurzelStrich(`${D(w)} : 2 = ${D(w/2)}, h = √(${D(s)}² − ${D(w/2)}²) = √${D(rund(s*s-w*w/4))} ${ungefaehr(h,1)} ${D(rund(h,1))} m`)});

// V2-A05: mit gemischten Einheiten (o.aM) zuerst umrechnen, dann c : 2 und c; sonst c : 2, dann c
function basisAufgabe(a,h,half,u,_,o){
  const H2=rund(half,2), c=2*half;

    lead:'',
    why:`Die Höhe ${hc} teilt c in zwei gleiche Teile. Im Teildreieck ist a die längste Seite: c : 2 = √(a² − ${hc}²). Dann verdoppeln: c = 2 · (c : 2).`,
    stepsh:`${o?`${D(o.aM)} m = ${D(a)} dm<br>`:''}c : 2 = √(${D(a)}² − ${D(h)}²) = ${wurzel(D(rund(a*a-h*h)))} ${ungefaehr(half,2)} ${D(H2)} ${u}<br>c = 2 · ${D(H2)} ${ungefaehr(c,1)} ${D(rund(c,1))} ${u}`};
  if(o) return aufg(Object.assign(basis,{q:`Gleichschenkeliges Dreieck: a = b = ${D(o.aM)} m, h_c = ${D(h)} dm. Berechne c in dm.`,
    qh:`Gleichschenkeliges Dreieck: a = b = ${D(o.aM)} m, ${hc} = ${D(h)} dm. Berechne c in dm.`,
    s1:{label:`Schritt 1: Rechne a = ${D(o.aM)} m in dm um.`, kurz:'a in dm', art:'zahl', wert:a, einheit:'dm', ans:D(a), ansText:`${D(o.aM)} m = ${D(a)} dm`},
    s2:{label:'Schritt 2: Berechne c : 2 und c.', felder:[zahlFeld('c : 2 (zwei Nachkommastellen) =', half, 'dm', {stellen:2}), laengenFeld('c (eine Nachkommastelle) =', c, 'dm', {stellen:1, auch:[2*H2]})],
      ansText:`c : 2 ${ungefaehr(half,2)} ${D(H2)} dm, c ${ungefaehr(c,1)} ${D(rund(c,1))} dm`},
    pre:{ans:D(a), optionen:vorschlag('dm', a, o.aM*100, o.aM)}, schritt:'Umrechnen', alleinText:'Ab der nächsten Aufgabe rechnest du selbst um.'}));
  return aufg(Object.assign(basis,{q:`Gleichschenkeliges Dreieck: a = b = ${D(a)} ${u}, h_c = ${D(h)} ${u}. Berechne c (eine Nachkommastelle).`,
    qh:`Gleichschenkeliges Dreieck: a = b = ${D(a)} ${u}, ${hc} = ${D(h)} ${u}. Berechne c (eine Nachkommastelle).`,
    s1:{label:`Schritt 1: c : 2 = √(a² − ${hc}²), auf zwei Nachkommastellen`, kurz:'c : 2', art:'zahl', wert:half, stellen:2, einheit:u, ans:D(H2), ansText:`c : 2 ${ungefaehr(half,2)} ${D(H2)} ${u}`},
    s2:{label:'Schritt 2: c = 2 · (c : 2), mit Einheit', ans:rund(c,6), stellen:1, auch:[2*H2], einheitAns:u, ansText:`c ${ungefaehr(c,1)} ${D(rund(c,1))} ${u}`, fehler:fehlerC},
    pre:{ans:D(H2), optionen:vorschlag(u, H2, Math.sqrt(a*a+h*h), a-h)}, schritt:'c : 2', alleinText:'Ab der nächsten Aufgabe rechnest du c : 2 selbst.'}));
}

/* ---------- Fehler im Rechenweg: acht Fehlerarten ---------- */
const TRIPEL = [[5,3,4],[10,6,8],[13,5,12],[17,8,15],[25,7,24],[15,9,12],[20,12,16]];   // Schenkel, halbe Basis, Höhe
function hoehenWeg(art){
  const [a,k,h]=pick(art==='halb'?TRIPEL.filter(([a,k])=>a>2*k):TRIPEL), c=2*k, u=pick(['cm','m']);
  const richtig=[k, a*a-k*k, h], z=[`c : 2 = ${c} : 2 = ${k} ${u}`, `${'h_c'}² = ${a}² − ${k}² = ${a*a-k*k}`, `h_c = √${a*a-k*k} = ${h} ${u}`];
  let i, warum;
  if(art==='halb'){ i=1; const q=a*a-c*c; z[1]=`h_c² = ${a}² − ${c}² = ${q}`; z[2]=`h_c = √${q} ≈ ${D(rund(Math.sqrt(q),2))} ${u}`; warum=`Im Teildreieck ist die Kathete die halbe Basis c : 2 = ${k}, nicht c = ${c}.`; }
  if(art==='plus'){ i=1; const q=a*a+k*k; z[1]=`h_c² = ${a}² + ${k}² = ${q}`; z[2]=`h_c = √${q} ≈ ${D(rund(Math.sqrt(q),2))} ${u}`; warum='a ist die längste Seite (Hypotenuse): h_c² = a² − (c : 2)², also minus.'; }
  if(art==='wurzel'){ i=2; z[2]=`h_c = ${a*a-k*k} ${u}`; warum=`h_c² = ${a*a-k*k}, also h_c = √${a*a-k*k} = ${h}. Die Wurzel fehlt.`; }
  return {angabe:`Gleichschenkeliges Dreieck: a = b = ${a} ${u}, c = ${c} ${u}. Berechne h_c.`, zeilen:z, richtig, i, einheit:[u,u+'²',u], warum,
    weg:`c : 2 = ${k} ${u}, h_c² = ${a}² − ${k}² = ${a*a-k*k}, h_c = √${a*a-k*k} = ${h} ${u}`};
}
const FEHLERWEGE = [
  () => hoehenWeg('halb'), () => hoehenWeg('plus'), () => hoehenWeg('wurzel'),
  () => { const a=rnd(20,90), b=rnd(20,150-a), s=a+b, plus10=pick([10,-10]);       // Winkelsumme: Rechenfehler beim Addieren
    return {angabe:`α = ${a}°, β = ${b}°. Berechne γ.`, zeilen:[`α + β = ${a}° + ${b}° = ${s+plus10}°`, `γ = 180° − ${s+plus10}° = ${180-s-plus10}°`], richtig:[s,180-s], i:0, einheit:['°','°'],
      warum:`${a}° + ${b}° = ${s}°.`, weg:`α + β = ${s}°, γ = 180° − ${s}° = ${180-s}°`}; },
  () => { const a=rnd(20,90), b=rnd(20,150-a), s=a+b;                               // Winkelsumme 360° statt 180°
    return {angabe:`α = ${a}°, β = ${b}°. Berechne γ.`, zeilen:[`α + β = ${a}° + ${b}° = ${s}°`, `γ = 360° − ${s}° = ${360-s}°`], richtig:[s,180-s], i:1, einheit:['°','°'],
      warum:'Die Winkelsumme im Dreieck ist 180°, nicht 360°.', weg:`γ = 180° − ${s}° = ${180-s}°`}; },
  () => { const x=rnd(20,80);                                                       // Basiswinkel nicht verdoppelt
    return {angabe:`Gleichschenkelig mit a = b, α = ${x}°. Berechne γ.`, zeilen:[`β = α = ${x}°`, `γ = 180° − ${x}° = ${180-x}°`], richtig:[x,180-2*x], i:1, einheit:['°','°'],
      warum:'Beide Basiswinkel abziehen: γ = 180° − 2 · α.', weg:`γ = 180° − 2 · ${x}° = ${180-2*x}°`}; },
  () => { const g=rnd(10,70)*2;                                                      // Spitze: nicht halbiert
    return {angabe:`Gleichschenkelig mit a = b, γ = ${g}°. Berechne α und β.`, zeilen:[`α + β = 180° − ${g}° = ${180-g}°`, `α = β = ${180-g}°`], richtig:[180-g,(180-g)/2], i:1, einheit:['°','°'],
      warum:`α und β sind gleich groß und teilen sich ${180-g}°: ${180-g}° : 2 = ${(180-g)/2}°.`, weg:`α = β = ${180-g}° : 2 = ${(180-g)/2}°`}; },
  () => { const a=rnd(2,20), u=pick(['cm','dm']), q=a*a-a*a/4, h=Math.sqrt(q);                // gleichseitig: Wurzel vergessen
    return {angabe:`Gleichseitiges Dreieck: a = ${a} ${u}. Berechne h (zwei Nachkommastellen).`, zeilen:[`a : 2 = ${D(a/2)} ${u}`, `h² = ${a}² − ${D(a/2)}² = ${D(q)}`, `h = ${D(q)} ${u}`],
      richtig:[a/2,q,h], i:2, stellen:2, einheit:[u,u+'²',u], warum:`h = √${D(q)} ≈ ${D(rund(h,2))}. Die Wurzel fehlt.`, weg:`h = √${D(q)} ≈ ${D(rund(h,2))} ${u}`}; }
];

/* ---------- Stationen des Lernwegs (nur Kern-Typen) ---------- */
const stationen = [
  {id:'S1', name:'Winkel berechnen', hint:'α + β + γ = 180°', types:['winkel','art_winkel']},
  {id:'S2', name:'Winkel im gleichschenkeligen Dreieck', hint:'die Basiswinkel sind gleich groß', types:['basiswinkel']},
  {id:'S3', name:'Höhe mit dem Satz des Pythagoras', hint:'h² + (c : 2)² = a²', types:['hoehe_gleichschenkelig','hoehe_gleichseitig']},
  {id:'S4', name:'Mehrere Größen berechnen', hint:'Pythagoras, dann Fläche und Umfang', types:['basis_aus_hoehe','mehrere_groessen']}
];
const kern = ['winkel','basiswinkel','art_winkel','hoehe_gleichschenkelig','basis_aus_hoehe','hoehe_gleichseitig','mehrere_groessen'];
const plus = ['bild_aufhaengen','fehler_rechenweg','dachgiebel'];
const plusHint = 'Bild aufhängen · Fehler im Rechenweg · Dachgiebel';
const lzk = {aufwand:{basiswinkel:2, art_winkel:2, hoehe_gleichschenkelig:2, hoehe_gleichseitig:2, basis_aus_hoehe:3, mehrere_groessen:3}};

/* ---------- Erklärung ---------- */
const bspH = () => pick([[5,6],[13,10],[10,12],[17,16],[15.6,12],[15,16],[8,10]]);
const erklaerung = {
  beispiele: ()=>({h:bspH()}),
  neu(kind,E){ if(kind==='hoehe') E.h=bspH(); },
  html(E){
    const [a,c]=E.h, k=c/2, q=rund(a*a-k*k), h=Math.sqrt(q);

    <div class="rule"><h3>Gleichschenkelig</h3><p>Den gleich langen Seiten liegen gleich große Winkel gegenüber, die <b>Basiswinkel</b>. Bei a = b ist α = β.</p>
      <p class="ex">γ = 180° − 2 · α &nbsp;&nbsp; α = β = ${bruch('180° − γ','2')}</p><p>Beispiel: γ = 68,4° → α = β = ${bruch('111,6°','2')} = 55,8°.</p></div>
    <div class="rule"><h3>Höhe mit dem Satz des Pythagoras</h3><p>Die Höhe ${hc} teilt die Basis c in zwei gleiche Teile. So entsteht ein rechtwinkeliges Teildreieck: a ist die längste Seite, c : 2 und ${hc} sind die Katheten.</p>
      ${isoBild(c,h,{seitenText:{a:`${D(a)} cm`, b:`${D(a)} cm`, c:`c = ${D(c)} cm`}})}
      <p class="ex">c : 2 = ${D(k)} cm<br>${hc} = √(${D(a)}² − ${D(k)}²) = ${wurzel(D(q))} ${ungefaehr(h,2)} ${D(rund(h,2))} cm</p>
      <button class="newex" data-newex="hoehe">Neues Beispiel</button>
      <p>Umgekehrt: Kennst du a und ${hc}, ist c : 2 = √(a² − ${hc}²); dann verdoppeln. Kennst du c und ${hc}, ist a = √((c : 2)² + ${hc}²).</p></div>
    <div class="rule"><h3>Gleichseitig</h3><p>Alle Winkel sind 60°. Die Höhe halbiert die Seite: h = √(a² − (a : 2)²), z. B. a = 10 cm: h = √(100 − 25) = ${wurzel(75)} ≈ 8,66 cm.</p></div>
    <div class="rule"><h3>Runden</h3><p>Runde auf zwei Nachkommastellen, wenn nichts anderes verlangt ist.</p></div>
    <p class="small muted">Das steht auch in deinem Mathe Know How Dreiecke.</p>
    <div class="row"><button class="big" data-go="comp">Weiter</button></div></section>`;
  }
};

UR.kompetenzAnmelden({id:'M-Drei-V2', typen, stationen, kern, plus, plusHint, erklaerung, lzk});

<script>

   sie konstruieren.“ Steckbrief: M-Drei-X1.md, Auswahl der Lehrkraft: AUSWAHL.md (19.11.2026).
   Entscheidungen (19.11.2026): X1-A01 als Bild mit einer Linienart und ihrem Schnittpunkt (das Kind benennt Linien und
   Punkt); Konstruieren auf Papier mit Messwert ist Kern (fest in cm, ± 0,2 cm, wie V1-A04); antippen statt ziehen.
   Fachbegriffe: Höhe, Schwerlinie (Seitenhalbierende), Streckensymmetrale, Winkelsymmetrale, Radien ρ (Inkreis) und r (Umkreis), bestätigt 20.11.2026 (KONZEPT 8.3).
   Gerechnet wird in Rechenkoordinaten (y nach oben), gezeichnet mit A, B, C gegen den Uhrzeigersinn. */
(function(UR){
const {rnd, pick} = UR;
const {rund, D, mischen, versuche, sub, GR, rad, plus: vplus, minus, mal, dist, ausWinkeln, ausSeiten, lage, lot, gegen, merkwuerdig, zeichne, hilfe, aufg} = UR.dreiecke;

const ARTEN = ['H','S','U','I'];
const LINIEN = {H:'Höhen', S:'Schwerlinien (Seitenhalbierende)', U:'Streckensymmetralen', I:'Winkelsymmetralen'};
const LINIE1 = {H:'Höhe', S:'Schwerlinie', U:'Streckensymmetrale', I:'Winkelsymmetrale'};
const PUNKT = {H:'Höhenschnittpunkt H', S:'Schwerpunkt S', U:'Umkreismittelpunkt U', I:'Inkreismittelpunkt I'};
const LINIE_WAS = {
  H:'Eine Höhe geht durch eine Ecke und steht normal auf die gegenüberliegende Seite.',
  S:'Eine Schwerlinie verbindet eine Ecke mit der Mitte der gegenüberliegenden Seite.',

};

/* ---------- Dreiecke ---------- */
// spitzwinkelig und deutlich ungleichseitig (Winkel 42° bis 78°, je mindestens 12° verschieden), zufällige Lage
function spitzDreieck(){
  return versuche(()=>{ const a=rnd(42,78), b=rnd(42,78), c=180-a-b, w=[a,b,c].sort((x,y)=>x-y);

function artDreieck(art){

  const w = versuche(()=>{
    if(art==='recht'){ const b=rnd(30,60); return Math.abs(b-(90-b))>=12 ? [90,b,90-b] : null; }
    const g=rnd(105,130), b=rnd(20,180-g-20), c=180-g-b; return c>=20&&Math.abs(b-c)>=10 ? [g,b,c] : null; });

}

/* ---------- Linien und Bilder ---------- */
// die drei Linien einer Art als Strecken (Rechenkoordinaten); rechte: rechte Winkel einzeichnen
function linien(P, art, o={}){
  const mp=merkwuerdig(P), l=[], gross=Math.max(...['a','b','c'].map(s=>{ const [p,q]=gegen[s.toUpperCase()]; return dist(P[p],P[q]); }));
  for(const E of 'ABC'){
    const [Y,Z]=gegen[E];
    if(art==='H'){ const {F}=lot(P[E],P[Y],P[Z]); l.push({von:P[E], bis:F, art:'ml', fussRecht:o.rechte}); }
    if(art==='S') l.push({von:P[E], bis:mitte(P[Y],P[Z]), art:'ml'});
    if(art==='I'){ const y=dist(P[E],P[Y]), z=dist(P[E],P[Z]); l.push({von:P[E], bis:vplus(P[Y],mal(minus(P[Z],P[Y]),y/(y+z))), art:'ml'}); }
    if(art==='U'){
      // Normale in der Seitenmitte M, nach innen gerichtet; reicht über U und ein Stück über das Dreieck hinaus
      const M=mitte(P[Y],P[Z]), d=minus(P[Z],P[Y]); let n=[-d[1],d[0]]; const ln=Math.hypot(...n); n=[n[0]/ln,n[1]/ln];
      if((P[E][0]-M[0])*n[0]+(P[E][1]-M[1])*n[1]<0) n=mal(n,-1);
      const tU=(mp.U[0]-M[0])*n[0]+(mp.U[1]-M[1])*n[1], tE=(P[E][0]-M[0])*n[0]+(P[E][1]-M[1])*n[1], e=.12*gross;
      const t1=Math.max(tU,.75*tE)+e, t0=Math.min(0,tU)-.4*e;      // außen nur ein kurzes Stück (Platz für die Seitenbeschriftung)
      l.push({von:vplus(M,mal(n,t1)), bis:M, art:'ml', fussRecht:o.rechte}, {von:M, bis:vplus(M,mal(n,t0)), art:'ml'});
    }
  }
  return l;
}
// Bild mit Linien, Punkt (Name oder ?), wahlweise Kreis und Radius
function punktBild(P, art, o={}){
  const mp=merkwuerdig(P), opt={ecken:true, strecken:linien(P,art,{rechte:o.rechte!==false}), punkte:[{p:mp[art], text:o.name??art}], kreise:[]};
  if(o.kreis&&art==='U') opt.kreise.push({mitte:mp.U, r:mp.R});
  if(o.kreis&&art==='I') opt.kreise.push({mitte:mp.I, r:mp.rho});
  if(o.radius){ const F=art==='U'?P[o.radius.ecke]:lot(mp.I,P[gegen[o.radius.ecke][0]],P[gegen[o.radius.ecke][1]]).F;
    opt.strecken.push({von:mp[art], bis:F, art:'radius', text:o.radius.text}); }
  return zeichne(P, Object.assign(opt, o.extra||{}));
}

/* ---------- Konstruktionsablauf je Punkt ---------- */
// Kärtchen mit Voraussetzungen (nach); alle Reihenfolgen, die die Voraussetzungen einhalten, sind richtig
function ablauf(art){
  const [x,y]=mischen(['a','b','c']).slice(0,2), X=x.toUpperCase(), Y=y.toUpperCase(), z='abc'.replace(x,'').replace(y,'');
  if(art==='S') return [
    {id:'m'+x, text:`Konstruiere die Mitte ${sub('M',x)} der Seite ${x}.`, kurz:`Mitte von ${x}`, nach:[]},
    {id:'v'+x, text:`Verbinde ${sub('M',x)} mit der Ecke ${X}.`, kurz:`Mitte von ${x} mit ${X} verbinden`, nach:['m'+x]},
    {id:'m'+y, text:`Konstruiere die Mitte ${sub('M',y)} der Seite ${y}.`, kurz:`Mitte von ${y}`, nach:[]},
    {id:'v'+y, text:`Verbinde ${sub('M',y)} mit der Ecke ${Y}.`, kurz:`Mitte von ${y} mit ${Y} verbinden`, nach:['m'+y]},
    {id:'schnitt', text:'Der Schnittpunkt der zwei Schwerlinien ist S.', kurz:'Schnittpunkt S', nach:['v'+x,'v'+y]}];
  if(art==='U') return [
    {id:'s'+x, text:`Konstruiere die Streckensymmetrale der Seite ${x}.`, kurz:`Streckensymmetrale von ${x}`, nach:[]},
    {id:'s'+y, text:`Konstruiere die Streckensymmetrale der Seite ${y}.`, kurz:`Streckensymmetrale von ${y}`, nach:[]},
    {id:'schnitt', text:'Der Schnittpunkt der zwei Streckensymmetralen ist U.', kurz:'Schnittpunkt U', nach:['s'+x,'s'+y]},
    {id:'zirkel', text:'Stich mit dem Zirkel in U ein und öffne ihn bis zu einer Ecke.', kurz:'Zirkel in U bis zu einer Ecke', nach:['schnitt']},
    {id:'kreis', text:'Zeichne den Umkreis. Er geht durch alle drei Ecken.', kurz:'Umkreis zeichnen', nach:['zirkel']}];
  if(art==='I') return [
    {id:'w'+X, text:`Konstruiere die Winkelsymmetrale von ${GR[X]}.`, kurz:`Winkelsymmetrale von ${GR[X]}`, nach:[]},
    {id:'w'+Y, text:`Konstruiere die Winkelsymmetrale von ${GR[Y]}.`, kurz:`Winkelsymmetrale von ${GR[Y]}`, nach:[]},
    {id:'schnitt', text:'Der Schnittpunkt der zwei Winkelsymmetralen ist I.', kurz:'Schnittpunkt I', nach:['w'+X,'w'+Y]},
    {id:'lot', text:`Fälle von I das Lot auf die Seite ${z}. Der Fußpunkt heißt F.`, kurz:`Lot von I auf ${z}`, nach:['schnitt']},
    {id:'kreis', text:'Zeichne den Inkreis um I durch F. Er berührt alle drei Seiten.', kurz:'Inkreis zeichnen', nach:['lot']}];
  return [
    {id:'h'+x, text:`Zeichne die Höhe ${sub('h',x)}: Sie geht durch ${X} und steht normal auf ${x}.`, kurz:`Höhe auf ${x}`, nach:[]},
    {id:'h'+y, text:`Zeichne die Höhe ${sub('h',y)}: Sie geht durch ${Y} und steht normal auf ${y}.`, kurz:`Höhe auf ${y}`, nach:[]},
    {id:'schnitt', text:'Der Schnittpunkt der zwei Höhen ist H.', kurz:'Schnittpunkt H', nach:['h'+x,'h'+y]},
    {id:'kontrolle', text:`Zur Kontrolle: Auch die dritte Höhe ${sub('h',z)} geht durch H.`, kurz:'Kontrolle mit der dritten Höhe', nach:['schnitt']}];
}
function reihenfolgen(karten){
  const l=[], perm=(rest,weg)=>{ if(!rest.length){ l.push(weg); return; }
    rest.forEach(k=>{ if(k.nach.every(n=>weg.includes(n))) perm(rest.filter(r=>r!==k),[...weg,k.id]); }); };
  perm(karten,[]); return l;
}

/* Baustein M-Drei-X2: „Ich kann Formeln für Berechnungen im Dreieck herleiten und begründen.“
   Steckbrief: M-Drei-X2.md, Auswahl der Lehrkraft: AUSWAHL.md (19.11.2026). X2-N03 (freie Herleitung) ist Plus, weil
   nicht automatisch auswertbar (Selbstkontrolle mit Kernpunkten).
   Zeilen der Herleitungen stehen als Text mit / (Bruch), √(…), ², · und hc (= h mit Index c); angezeigt mit waagrechtem
   Bruchstrich (UR.terme.bruchAnzeige). Lücken heißen im Text [1], [2], … Der Prüfer rechnet jede Zeile mit Zahlen nach. */
(function(UR){
const {rnd, pick} = UR;
const {rund, D, Df, mischen, versuche, bruch, sub, wurzelStrich, plus: vplus, mal, ausSeiten, zeichne, EINHEITEN, aufg} = UR.dreiecke;

const NR = ['①','②','③'];
const merk = s => `<span class="merk">${s}</span>`;
const zehntel = (a,b) => rnd(a*10,b*10)/10;
const mitte = (p,q) => mal(vplus(p,q),.5);
const ungefaehr = (x,n) => Math.abs(rund(x,n)-x)<1e-9 ? '=' : '≈';
// Text → Anzeige: Brüche waagrecht, hc mit Index, Lücken als Kästchen
// Klammern um einen Bruch vor ² und nach √ bleiben stehen (❨ ❩ schützen sie vor bruchAnzeige); √(…) mit Strich darüber
const F = s => UR.terme.bruchAnzeige(String(s).replace(/√\(([^()]*)\)/g,'√❨$1❩').replace(/\(([^()]*\/[^()]*)\)²/g,'❨$1❩²'))
  .replace(/√❨(.*?)❩/g,'<span class="wurzel">√<span>$1</span></span>').replace(/❨/g,'(').replace(/❩/g,')')
  .replace(/hc/g, sub('h','c')).replace(/\[(\d)\]/g, (m,i)=>`<span class="luecke">${NR[i-1]}</span>`).replace(/[^]*/, wurzelStrich);
// Aufgabe mit √3 usw. in Hinweis und Erklärung: Strich über die Zahl
const aufgW = o => aufg(Object.assign(o, {lead:o.lead&&wurzelStrich(o.lead), why:o.why&&wurzelStrich(o.why)}));
// Kurzfassung für die Rückmeldung (reiner Text): Bruch als „:“
const kurzText = s => s.replace(/\//g,' : ');
const zeilenListe = (l, cls='') => `<ol class="herleitung ${cls}">${l.map(z=>`<li>${F(z)}</li>`).join('')}</ol>`;

/* ---------- Bilder ---------- */
function gsBild(){ const P=ausSeiten(1,1,1);
  return zeichne(P,{ecken:true, ohneNamen:true, seitenText:{a:'a', b:'a', c:'a'}, strecken:[{von:P.C, bis:mitte(P.A,P.B), art:'hoehe', fussRecht:true, text:'h'}], breite:260, hoeheMax:190}); }
function gkBild(){ const P=ausSeiten(5,5,6);
  return zeichne(P,{ecken:true, ohneNamen:true, seitenText:{a:'a', b:'a', c:'c'}, strecken:[{von:P.C, bis:mitte(P.A,P.B), art:'hoehe', fussRecht:true, text:sub('h','c')}], breite:260, hoeheMax:170}); }
// in Aufgaben etwas kleiner (das Bild ist nur eine Erinnerung an die Bezeichnungen)
const klein = f => () => `<div class="dr-bild-klein">${f()}</div>`;
const BILD = {gs:klein(gsBild), gk:klein(gkBild)};
const DREIECK = {gs:'gleichseitigen Dreieck (Seite a, Höhe h)', gk:'gleichschenkeligen Dreieck (Schenkel a = b, Basis c, Höhe hc)'};

/* ---------- Herleitungen zum Ordnen (X2-A01) ---------- */
// zeilen: [Text, Kurzfassung]; loesungen: Reihenfolgen als Indizes (mehr als eine, wo die Logik es zulässt)
const ORDNEN = [
  {titel:'Höhe im gleichseitigen Dreieck', k:'gs', zeilen:[
    ['Die Höhe h teilt das Dreieck in zwei gleiche rechtwinkelige Dreiecke.', 'Höhe teilt in zwei Hälften'],
    ['Im Teildreieck ist a die Hypotenuse, a/2 und h sind die Katheten.', 'a/2 und h sind Katheten'],
    ['h² + (a/2)² = a²', 'h² + (a/2)² = a²'],
    ['h² = a² − a²/4 = 3a²/4', 'h² = a² − a²/4 = 3a²/4'],
    ['h = √(3a²/4) = a/2 · √3', 'h = √(3a²/4) = a/2 · √3']], loesungen:[[0,1,2,3,4]]},
  {titel:'Fläche des gleichseitigen Dreiecks', k:'gs', zeilen:[
    ['Flächenformel: A = (a · h)/2', 'A = (a · h)/2'],
    ['Für h setzt man a/2 · √3 ein.', 'h = a/2 · √3 einsetzen'],
    ['A = (a · a)/(2 · 2) · √3', 'A = (a · a)/(2 · 2) · √3'],
    ['A = a²/4 · √3', 'A = a²/4 · √3']], loesungen:[[0,1,2,3]]},
  {titel:'Höhe im gleichschenkeligen Dreieck', k:'gk', zeilen:[
    ['Die Höhe hc teilt das Dreieck in zwei gleiche rechtwinkelige Dreiecke und halbiert die Basis c.', 'hc teilt in zwei Hälften'],
    ['Im Teildreieck ist a die Hypotenuse, c/2 und hc sind die Katheten.', 'c/2 und hc sind Katheten'],
    ['hc² + (c/2)² = a²', 'hc² + (c/2)² = a²'],
    ['hc² = a² − c²/4', 'hc² = a² − c²/4'],
    ['hc = √(a² − c²/4)', 'hc = √(a² − c²/4)']], loesungen:[[0,1,2,3,4]]},
  {titel:'Fläche des gleichschenkeligen Dreiecks', k:'gk', zeilen:[
    ['Flächenformel: A = (c · hc)/2', 'A = (c · hc)/2'],
    ['Im Teildreieck gilt hc² + (c/2)² = a².', 'hc² + (c/2)² = a²'],
    ['Also ist hc = √(a² − c²/4).', 'hc = √(a² − c²/4)'],
    ['A = c/2 · √(a² − c²/4)', 'A = c/2 · √(a² − c²/4)']], loesungen:[[0,1,2,3],[1,2,0,3]]}
];

/* ---------- Herleitungen mit Lücken (X2-A02) ---------- */
// zeilen: Text; luecken: je Zeile höchstens eine mögliche Lücke {z: Zeile, text: Zeile mit [#], ans}
function lueckenPool(){
  const a=2*rnd(2,10), k=a/2, q=a*a-k*k, h=Math.sqrt(q);
  const A=rnd(5,20), c=2*rnd(2,A-1), kc=c/2, qc=A*A-kc*kc, hc=Math.sqrt(qc);
  return [
    {titel:'Höhe im gleichseitigen Dreieck', k:'gs', angabe:'', tasten:['a'], zeilen:['h² + (a/2)² = a²', 'h² = a² − a²/4 = 3a²/4', 'h = √(3a²/4) = a/2 · √3'],
      luecken:[[{z:0, text:'h² + ([#])² = a²', ans:'a/2'}], [{z:1, text:'h² = a² − [#] = 3a²/4', ans:'a²/4'}, {z:1, text:'h² = a² − a²/4 = [#]', ans:'3a²/4'}],
               [{z:2, text:'h = √([#]) = a/2 · √3', ans:'3a²/4'}, {z:2, text:'h = √(3a²/4) = [#] · √3', ans:'a/2'}, {z:2, text:'h = √(3a²/4) = a/2 · √([#])', ans:'3'}]]},
    {titel:'Fläche des gleichseitigen Dreiecks', k:'gs', angabe:'', tasten:['a','h'], zeilen:['A = (a · h)/2', 'h = a/2 · √3', 'A = (a · a)/(2 · 2) · √3', 'A = a²/4 · √3'],
      luecken:[[{z:0, text:'A = (a · [#])/2', ans:'h'}], [{z:1, text:'h = [#] · √3', ans:'a/2'}], [], [{z:3, text:'A = [#] · √3', ans:'a²/4'}]]},
    {titel:'Höhe im gleichschenkeligen Dreieck', k:'gk', angabe:'', tasten:['a','c'], zeilen:['hc² + (c/2)² = a²', 'hc² = a² − c²/4', 'hc = √(a² − c²/4)'],
      luecken:[[{z:0, text:'hc² + ([#])² = a²', ans:'c/2'}], [{z:1, text:'hc² = a² − [#]', ans:'c²/4'}], [{z:2, text:'hc = √(a² − [#])', ans:'c²/4'}]]},
    {titel:'Fläche des gleichschenkeligen Dreiecks', k:'gk', angabe:'', tasten:['a','c'], zeilen:['A = (c · hc)/2', 'hc = √(a² − c²/4)', 'A = c/2 · √(a² − c²/4)'],
      luecken:[[], [{z:1, text:'hc = √(a² − [#])', ans:'c²/4'}], [{z:2, text:'A = [#] · √(a² − c²/4)', ans:'c/2'}]]},
    {titel:'Höhe im gleichseitigen Dreieck mit Zahlen', k:'gs', angabe:`a = ${a} cm`, tasten:[], zeilen:[`h² + ${k}² = ${a}²`, `h² = ${a*a} − ${k*k} = ${q}`, `h = √${q} ${ungefaehr(h,2)} ${Df(h,2)}`],
      luecken:[[{z:0, text:`h² + [#]² = ${a}²`, ans:String(k)}], [{z:1, text:`h² = ${a*a} − [#] = ${q}`, ans:String(k*k)}, {z:1, text:`h² = ${a*a} − ${k*k} = [#]`, ans:String(q)}],
               [{z:2, text:`h = √([#]) ${ungefaehr(h,2)} ${Df(h,2)}`, ans:String(q)}]]},
    {titel:'Höhe im gleichschenkeligen Dreieck mit Zahlen', k:'gk', angabe:`a = b = ${A} cm, c = ${c} cm`, tasten:[], zeilen:[`hc² + ${kc}² = ${A}²`, `hc² = ${A*A} − ${kc*kc} = ${qc}`, `hc = √${qc} ${ungefaehr(hc,2)} ${Df(hc,2)}`],
      luecken:[[{z:0, text:`hc² + [#]² = ${A}²`, ans:String(kc)}], [{z:1, text:`hc² = ${A*A} − [#] = ${qc}`, ans:String(kc*kc)}, {z:1, text:`hc² = ${A*A} − ${kc*kc} = [#]`, ans:String(qc)}],
               [{z:2, text:`hc = √([#]) ${ungefaehr(hc,2)} ${Df(hc,2)}`, ans:String(qc)}]]}
  ];
}
// Lösung einer Lücke lesbar (mit / für den waagrechten Bruchstrich in der Anzeige)
const ansText = (i,ans) => `${NR[i]} ${ans}`;

/* ---------- Begründungen (X2-A05) ---------- */
const BEGRUENDUNG = [
  {q:'Warum halbiert die Höhe h im gleichseitigen Dreieck die Seite a?', k:'gs',
    r:'Die zwei Teildreiecke haben dieselbe Hypotenuse a und dieselbe Kathete h. Darum sind sie kongruent, und die zwei Teile von a sind gleich lang.',
    f:['Weil jede Höhe in jedem Dreieck die gegenüberliegende Seite halbiert.', 'Weil die Höhe immer genau in der Mitte des Dreiecks liegt, egal wie es aussieht.']},
  {q:'Warum ist die Höhe h im gleichseitigen Dreieck kürzer als die Seite a?', k:'gs',
    r:'Im rechtwinkeligen Teildreieck ist h eine Kathete und a die Hypotenuse. Die Hypotenuse ist die längste Seite.',
    f:['Weil h genau halb so lang ist wie a.', 'Weil im Dreieck alle Linien kürzer sind als die Seiten.']},
  {q:'Warum darf man im Teildreieck den Satz des Pythagoras verwenden?', k:'gs',
    r:'Die Höhe steht normal auf die Seite. Darum hat jedes Teildreieck einen rechten Winkel.',
    f:['Weil das Dreieck gleichseitig ist und alle Winkel 60° haben.', 'Weil man den Satz des Pythagoras in jedem Dreieck verwenden darf.']},
  {q:'Warum steht in der Herleitung die halbe Seite zum Quadrat und nicht a²?', qt:'Warum steht in der Herleitung (a/2)² und nicht a²?', k:'gs',
    r:'Die Höhe teilt a in zwei gleiche Teile. Die Kathete im Teildreieck ist nur die halbe Seite.',
    f:['Weil man die Seite immer durch 2 teilt, damit die Zahl kleiner wird.', 'Weil es zwei Teildreiecke gibt und man ihre Flächen zusammenzählt.']},
  {q:'Warum rechnet man bei der Höhe mit Minus?', qt:'Warum rechnet man h² = a² − (a/2)² mit Minus?', k:'gs',
    r:'Gesucht ist eine Kathete: Kathete zum Quadrat = Hypotenuse zum Quadrat minus die andere Kathete zum Quadrat.',
    f:['Weil man beim Satz des Pythagoras immer subtrahiert.', 'Weil die Höhe innerhalb des Dreiecks liegt.']},
  {q:'Woher kommt die Flächenformel des gleichseitigen Dreiecks?', qt:'Warum gilt im gleichseitigen Dreieck A = a²/4 · √3?', k:'gs',
    r:'Man setzt die Höhe h aus der Herleitung in die Flächenformel A = a · h : 2 ein und vereinfacht.',
    f:['Weil man a² auf die vier Ecken und Seiten aufteilt.', 'Weil das gleichseitige Dreieck genau ein Viertel eines Quadrats ist.']},
  {q:'Warum halbiert im gleichschenkeligen Dreieck die Höhe auf die Basis die Basis c?', qt:'Warum halbiert im gleichschenkeligen Dreieck die Höhe hc die Basis c?', k:'gk',
    r:'Die zwei Teildreiecke haben gleich lange Hypotenusen (die Schenkel a = b) und dieselbe Kathete hc. Darum sind sie kongruent.',
    f:['Weil die Basis c immer die längste Seite ist.', 'Weil eine Höhe immer durch die Mitte jeder Seite geht.']}
];

/* ---------- Fehlerhafte Herleitungen (X2-N02) ---------- */
function fehlerPool(){
  const a=2*rnd(2,10);
  return [
    {k:'gs', angabe:'', zeilen:['h² + (a/2)² = a²', 'h² = a² − a²/2', 'h² = a²/2', 'h = √(a²/2)'], f:1, grund:'(a/2)² = a²/4, nicht a²/2: Auch der Nenner 2 wird quadriert.'},
    {k:'gs', angabe:`a = ${a} cm`, zeilen:[`a = ${a} cm`, 'h = a/2 · √3', `h = ${a} · √3 ≈ ${Df(a*Math.sqrt(3),2)} cm`], f:2, grund:`a wurde nicht durch 2 geteilt: h = ${a/2} · √3 ≈ ${Df(a/2*Math.sqrt(3),2)} cm. Die Höhe kann nicht länger als die Seite sein.`},
    {k:'gs', angabe:'', zeilen:['h² + (a/2)² = a²', 'h² = a² + a²/4', 'h² = 5a²/4', 'h = √(5a²/4)'], f:1, grund:'Gesucht ist eine Kathete, also minus: h² = a² − a²/4.'},
    {k:'gs', angabe:'', zeilen:['h² + (a/2)² = a²', 'h² = 3a²/4', 'h = 3a²/4'], f:2, grund:'Die Wurzel fehlt: Aus h² = 3a²/4 folgt h = √(3a²/4) = a/2 · √3.'},
    {k:'gs', angabe:'', zeilen:['h² = a² − a²/4', 'h² = 3a²/4', 'h = 3a/2'], f:2, grund:'√(3a²/4) = a/2 · √3: Die Wurzel aus a² ist a, die Wurzel aus 4 ist 2, die Wurzel aus 3 bleibt stehen.'},
    {k:'gs', angabe:'', zeilen:['A = (a · h)/2', 'h = a/2 · √3', 'A = a · a/2 · √3', 'A = a²/2 · √3'], f:2, grund:'Das „durch 2“ der Flächenformel fehlt: A = (a · a/2 · √3)/2 = a²/4 · √3.'},
    {k:'gk', angabe:'', zeilen:['hc² + c² = a²', 'hc² = a² − c²', 'hc = √(a² − c²)'], f:0, grund:'Im Teildreieck ist die Kathete nur die halbe Basis c/2: hc² + (c/2)² = a².'},
    {k:'gk', angabe:'', zeilen:['hc² + (c/2)² = a²', 'hc² = a² − c²/4', 'hc = a − c/2'], f:2, grund:'Die Wurzel aus einer Differenz ist nicht die Differenz der Wurzeln: hc = √(a² − c²/4).'}
  ];
}

/* ---------- Aufgabentypen ---------- */
const lang = (ctx) => !(ctx&&(ctx.leicht||ctx.einstieg)) && Math.random()<.5;   // später auch eine Nachkommastelle
const typen = {
  // X2-A01 Herleitung ordnen
  herleitung_ordnen(ctx){
    const h=pick(ORDNEN), karten=h.zeilen.map(([text,kurz],i)=>({id:'z'+i, text:F(text), kurz:kurzText(kurz)}));
    return aufg({kind:'reihenfolge', q:`Herleitung: ${h.titel}. Bring die Zeilen in die richtige Reihenfolge.`, text:true,
      bild:BILD[h.k](), karten:mischen(karten), loesungen:h.loesungen.map(l=>l.map(i=>'z'+i)), fest:ctx&&ctx.leicht?1:0,
      pruef:'x2_ordnen', titel:h.titel,
      why:`So geht die Herleitung (${h.titel}):${zeilenListe(h.zeilen.map(z=>z[0]))}${h.loesungen.length>1?'Die Flächenformel darf auch erst nach der Höhe stehen.':''}`});
  },
  // X2-A02 Lücken in der Herleitung: jede Lücke ein Bruchfeld, jeder gleichwertige Term zählt
  herleitung_luecken(ctx){
    const leicht=ctx&&ctx.leicht;
    return versuche(()=>{
      const h=pick(lueckenPool()), moegl=h.luecken.map(l=>l.length?pick(l):null).filter(Boolean);
      const n=leicht?1:Math.min(moegl.length,rnd(2,3)); if(moegl.length<n||n<1) return null;
      const gew=mischen(moegl).slice(0,n).sort((x,y)=>x.z-y.z), zeilen=[...h.zeilen];
      gew.forEach((l,i)=>{ zeilen[l.z]=l.text.replace('[#]',`[${i+1}]`); });
      return aufg({kind:'luecken', q:`Lücken in der Herleitung: ${h.titel}${h.angabe?` (${h.angabe})`:''}`, text:true,
        qh:`<b>${h.titel}</b>${h.angabe?`: ${h.angabe}`:''}. Ergänze die Lücken.${zeilenListe(zeilen)}`,
        lead:leicht?merk('Schau ins Bild: Die Höhe teilt das Dreieck in zwei rechtwinkelige Hälften.'):'',
        bild:BILD[h.k](), tasten:h.tasten, pruef:'x2_luecken', k:h.k, angabe:h.angabe, zeilenText:zeilen, ganz:h.zeilen,
        felder:gew.map((l,i)=>({label:`Lücke ${NR[i]}`, ans:l.ans, ansText:ansText(i,l.ans), bruch:!h.angabe})),
        eingabeHinweis:h.angabe?'':'Brüche: oben der Zähler, unten der Nenner. Ohne Bruch bleibt der Nenner leer.',
        why:`Die ganze Herleitung:${zeilenListe(h.zeilen)}`});
    });
  },
  // X2-A03 Formel anwenden und mit dem Satz des Pythagoras prüfen
  formel_anwenden(ctx){
    const a=lang(ctx)?zehntel(2,20):rnd(2,20), u=pick(['cm','cm','m','dm']), h=a/2*Math.sqrt(3), H=rund(h,2);
    const halb=bruch('a','2');
    return aufgW({kind:'zahlen', q:`Gleichseitiges Dreieck: a = ${D(a)} ${u}. Berechne die Höhe h mit der Formel und mach die Probe mit dem Satz des Pythagoras.`, text:true,
      lead:`Formel: h = ${halb} · √3. Probe: h² + (${halb})² muss ungefähr a² ergeben.`, bild:BILD.gs(), pruef:'x2_anwenden', a, u,
      felder:[{label:'h (auf zwei Nachkommastellen)', ans:rund(h,6), stellen:2, einheiten:EINHEITEN, einheitAns:u, ansText:`h ≈ ${Df(H,2)} ${u}`},
              {label:`Probe mit deinem h: h² + (${halb})² =`, ans:rund(a*a,6), tol:.3, einheit:`${u}²`, ansText:`${Df(H,2)}² + ${D(a/2)}² ≈ ${D(rund(H*H+a*a/4,2))} ${u}² (a² = ${D(rund(a*a,4))} ${u}²)`}],
      // die Probe muss zum eigenen h passen (gerechnet mit dem eingetippten h, in der Einheit der Angabe)
      zusammen:erg=>{ const v=erg[0].e&&erg[0].e!==u?UR.umrechner(erg[0].v,erg[0].e,u):erg[0].v; return v!==null&&erg[1].v!==null&&Math.abs(erg[1].v-(v*v+a*a/4))<=.06; },
      zusammenHinweis:'Rechne die Probe mit deinem eigenen h: h² + (a : 2)².',
      why:`h = ${halb} · √3 = ${D(a)} : 2 · √3 ≈ ${Df(H,2)} ${u}. Probe: ${Df(H,2)}² + ${D(a/2)}² ≈ ${D(rund(H*H+a*a/4,2))}, also ungefähr a² = ${D(rund(a*a,4))}. Wegen der Rundung von h stimmt die Probe nur ungefähr.`});
  },
  // X2-A04 Fläche des gleichseitigen Dreiecks
  flaeche_gleichseitig(ctx){
    const a=lang(ctx)?zehntel(2,20):rnd(2,20), u=pick(['cm','cm','m','dm']), A=a*a/4*Math.sqrt(3);
    return aufgW({kind:'zahlen', q:`Gleichseitiges Dreieck: a = ${D(a)} ${u}. Berechne die Fläche A (auf zwei Nachkommastellen).`, text:true,
      lead:`Formel: A = ${bruch('a²','4')} · √3`, bild:BILD.gs(), pruef:'x2_flaeche', a, u,
      felder:[{label:'A', ans:rund(A,6), stellen:2, einheiten:EINHEITEN, einheitAns:`${u}²`, ansText:`A ≈ ${Df(A,2)} ${u}²`}],
      why:`Die Formel kommt aus A = ${bruch('a · h','2')} mit h = ${bruch('a','2')} · √3. Hier: A = ${bruch(`${D(a)}²`,'4')} · √3 = ${D(rund(a*a/4,6))} · √3 ≈ ${Df(A,2)} ${u}².`});
  },
  // X2-N01 (Kern) Seitenlänge aus der Höhe
  seite_aus_hoehe(){
    const h=rnd(2,20), u=pick(['cm','cm','m','dm']), a=2*h/Math.sqrt(3);
    return aufgW({kind:'zahlen', q:`Ein gleichseitiges Dreieck hat die Höhe h = ${h} ${u}. Berechne die Seitenlänge a (auf zwei Nachkommastellen).`, text:true,
      lead:`Forme h = ${bruch('a','2')} · √3 nach a um.`, bild:BILD.gs(), pruef:'x2_seite', h, u,
      felder:[{label:'a', ans:rund(a,6), stellen:2, einheiten:EINHEITEN, einheitAns:u, ansText:`a ≈ ${Df(a,2)} ${u}`}],
      why:`Aus h = ${bruch('a','2')} · √3 folgt a = ${bruch('2 · h','√3')} = ${bruch(`2 · ${h}`,'√3')} ≈ ${Df(a,2)} ${u}. Probe: ${Df(a,2)} : 2 · √3 ≈ ${D(rund(rund(a,2)/2*Math.sqrt(3),2))} ${u}.`});
  },
  // X2-A05 Begründung wählen
  begruendung(ctx){

<script>
/* Mathe/2.3 Prozentrechnung/M-Proz-G2.js */
/* Baustein M-Proz-G2: „Ich kann geeignete Prozentangaben als Brüche oder Dezimalzahlen darstellen und umgekehrt.“
   Steckbrief: M-Proz-G2.md, Auswahl der Lehrkraft: AUSWAHL.md (20.11.2026). Brüche immer mit waagrechtem Strich
   (auch bei der Eingabe), Drittel mit Periodenpunkt (Taste „Periodenpunkt“, Notiz der Lehrkraft). */
(function(UR){
const {rnd, pick} = UR;
const {Z, P, NB, br, mischen, versuche, ggT, kuerzen, rund, dezimal, prozentText, bruchFeld, periodeFeld, figur, gefaerbt, RASTER,
  kommaSchritt, aufg, merk} = UR.prozent;

/* ---------- geeignete Anteile wie im Mathe Know How (als gekürzter Bruch) ---------- */
const MKH = [[1,100],[1,20],[1,10],[17,100],[1,5],[1,4],[2,5],[1,2],[3,5],[3,4],[4,5]];
const DRITTEL = [[1,3],[2,3]];
const MERKTABELLE = [[1,2],[1,4],[3,4],[1,5],[1,10],[1,20],[1,100],[1,3],[2,3]];
const zeile = ([z,n]) => `${prozentText(z,n)} = ${br(z,n)} = ${dezimal(z,n)}`;
const HUNDERT = '% heißt „je Hundert“: p % = p Hundertstel.';
const PERIODE = d => `Die ${d} wiederholt sich unendlich oft; das zeigt der Periodenpunkt.`;
const KUERZEN = 'Der Bruch stimmt, aber du musst ihn noch vollständig kürzen.';
const benannt = felder => felder.map(f=>Object.assign(f,{ansText:`${f.label} ${f.ansText}`}));   // „Richtig ist …“ mit Feldnamen

// Felder je Darstellung
const feldProzent = ([z,n],label='Prozent') => periodeFeld(label, z*100/n, dezimal(z*100,n), '%');
const feldBruch = ([z,n],label='gekürzter Bruch') => bruchFeld(label, z, n, {gekuerzt:true});
const feldDezimal = ([z,n],label='Dezimalzahl') => periodeFeld(label, z/n, dezimal(z,n));
// Hinweise nach dem Bewerten der Felder (Form 'zahlen'): nicht gekürzt, Periodenpunkt vergessen
function hinweise(felder, r){
  return erg => {
    const i=erg.findIndex((x,k)=>felder[k].bruch&&x.wertOk&&!x.formOk); if(i>=0) return KUERZEN;
    if(r[1]%3===0 && erg.some((x,k)=>!x.zahlOk&&felder[k].lesen&&!felder[k].bruch&&x.roh&&!x.roh.includes(UR.prozent.PUNKT))) return PERIODE(dezimal(r[0],r[1]).slice(-2,-1));
    return '';
  };
}

/* ---------- Aufgabentypen ---------- */
const typen = {
  // G2-A01 Anteil im Bild ablesen
  anteil_bild(){
    return versuche(()=>{
      // nicht zu oft Hälften und Viertel: Quadrat seltener, mehr Teile (Durchsicht 20.11.2026)
      const art=pick(['hundert','hundert','rechteck','rechteck','kreis','kreis','quadrat']);
      const n = art==='hundert'?100 : art==='quadrat'?4 : art==='kreis'?pick([4,5,8,10,20]) : pick([5,8,10,20]);
      const k=rnd(1,n-1), r=kuerzen(k,n);
      if(r[1]===2&&Math.random()<.7) return null;
      if(Math.round(k*1000/n)!==k*1000/n) return null;                                   // höchstens eine Nachkommastelle in %
      const felder=benannt([{label:'Prozent', ans:k*100/n, ansText:P(k*100/n), einheit:'%'}, feldBruch(r), {label:'Dezimalzahl', ans:k/n, ansText:Z(rund(k/n))}]);
      const bild=figur(art, n, gefaerbt(n,k,art==='rechteck'||art==='quadrat'));
      return aufg({kind:'zahlen', q:'Welcher Anteil der Figur ist gefärbt? Gib Prozent, gekürzten Bruch und Dezimalzahl an!', bild, felder,
        hinweisNach:hinweise(felder,r),
        why:`Zähle alle Teile (${n}) und die gefärbten Teile (${k}): ${k} von ${n} = ${br(k,n)}${r[1]!==n?` = ${br(r[0],r[1])}`:''} = ${Z(rund(k/n))} = ${P(k*100/n)}.`});
    });
  },
  // G2-A02 Tabelle: Prozent, Bruch, Dezimalzahl (eine Darstellung gegeben, Drittel mit Periodenpunkt)
  tabelle(){
    const r = Math.random()<.2 ? pick(DRITTEL) : pick(MKH), geg=pick(['p','b','d']);
    const anzeige = {p:prozentText(...r), b:br(...r), d:dezimal(...r)}[geg];
    const felder = benannt([geg!=='p'&&feldProzent(r), geg!=='b'&&feldBruch(r), geg!=='d'&&feldDezimal(r)].filter(Boolean));
    return aufg({kind:'zahlen', qh:`gegeben: <b>${anzeige}</b>`, q:`gegeben: ${UR.prozent.ohneTags(anzeige)}`, wert:r,
      lead:'Stelle als Prozentangabe, gekürzten Bruch und Dezimalzahl dar!', felder, hinweisNach:hinweise(felder,r),
      why:`Merke: ${zeile(r)}`});
  },
  // G2-A03 Prozent ↔ Dezimalzahl (Komma um zwei Stellen verschieben)
  proz_dezimal(ctx){
    const p = Math.random()<.3 ? rnd(10,999)/10 : Math.random()<.8 ? rnd(1,99) : rnd(100,150);
    const d=rund(p/100), zuD=Math.random()<.5, pT=String(p);
    const bild=kommaSchritt(pT, zuD?'zuDezimal':'zuProzent');
    const t = zuD
      ? {q:`${P(p)} als Dezimalzahl`, felder:[{label:'Dezimalzahl', ans:d, ansText:Z(d)}], steps:`${P(p)} = ${Z(d)}`,
         why:'Prozent → Dezimalzahl: Komma um zwei Stellen nach links (durch 100).'}
      : {q:`${Z(d)} in Prozent`, felder:[{label:'Prozent', ans:p, ansText:P(p), einheit:'%'}], steps:`${Z(d)} = ${P(p)}`,
         why:'Dezimalzahl → Prozent: Komma um zwei Stellen nach rechts (mal 100).'};
    // Einstieg: dasselbe Bild an einem anderen Beispiel (sonst stünde die Lösung schon da)
    if(ctx&&ctx.leicht){ let b; do{ b=rnd(2,98); }while(b===p); const bd=rund(b/100);
      t.bild=kommaSchritt(String(b), zuD?'zuDezimal':'zuProzent'); t.lead=`${t.why} Beispiel: ${zuD?`${P(b)} = ${Z(bd)}`:`${Z(bd)} = ${P(b)}`}`; }
    return aufg(Object.assign({kind:'zahlen', loesungBild:bild}, t));
  },
  // G2-A04 Prozent als gekürzter Bruch (Schritt 1 Nenner 100, Schritt 2 kürzen)
  proz_bruch(){
    const p=versuche(()=>{ const x=rnd(2,98); return ggT(x,100)>1 ? x : null; }), r=kuerzen(p,100);
    const opt=mischen([[`${p}/100`,br(p,100)],[`100/${p}`,br(100,p)],[`${p}/10`,br(p,10)]]);
    return aufg({kind:'zweischritt', q:`${P(p)} als Bruch`, qh:`${P(p)} = ?`, lead:'Schreibe als Bruch mit dem Nenner 100 und kürze!', schritt:'Schritt 1',
      s1:{label:'Schritt 1: Bruch mit dem Nenner 100', kurz:'Schritt 1', felder:[bruchFeld('',p,100,{nenner:100})], ansText:`${p}/100`},
      s2:{label:'Schritt 2: vollständig gekürzt', felder:[bruchFeld('',r[0],r[1],{gekuerzt:true})], ansText:`${r[0]}/${r[1]}`},
      pre:{ans:`${p}/100`, optionen:opt},
      hinweisNach:(e1,e2)=>e2[0].wertOk&&!e2[0].formOk?KUERZEN:'',
      why:`p % = p Hundertstel: ${P(p)} = ${br(p,100)}. Dann Zähler und Nenner durch ${100/r[1]} dividieren: ${br(r[0],r[1])}.`,
      stepsh:`${P(p)} = ${br(p,100)} = ${br(r[0],r[1])}`, steps:`${P(p)} = ${p}/100 = ${r[0]}/${r[1]}`});
  },
  // G2-A05 Bruch erweitern, dann Prozent
  bruch_proz(){
    return versuche(()=>{
      // der gegebene Bruch ist gekürzt; etwa jede fünfte Aufgabe liegt über 1 (bis 200 %)
      const n=pick([2,4,5,10,20,25,50]), z=Math.random()<.2?rnd(n+1,2*n-1):rnd(1,n-1); if(ggT(z,n)!==1) return null;
      const f=100/n, e=z*f, falsch=[z+100-n, z*n].filter(x=>x!==e&&x>0);
      if(new Set(falsch).size<2) return null;
      const opt=mischen([e,...falsch].map(x=>[String(x),br(x,100)]));
      return aufg({kind:'zweischritt', q:`${z}/${n} in Prozent`, qh:`${br(z,n)} = ?`, lead:'Erweitere den Bruch auf den Nenner 100 und schreibe ihn in Prozent!', schritt:'Schritt 1',
        s1:{label:`Schritt 1: erweitert auf den Nenner 100: Zähler über ${br('?',100)}`, kurz:'Schritt 1', felder:[{label:'Zähler', ans:e, ansText:`${e}/100`}], ansText:`${e}/100`},
        s2:{label:'Schritt 2: in Prozent', felder:[{label:'', ans:e, ansText:P(e), einheit:'%'}], ansText:P(e)},
        pre:{ans:String(e), optionen:opt},
        why:`Erweitere mit 100 : ${n} = ${f}: ${br(z,n)} = ${br(e,100)} = ${P(e)}. Zähler über 100 ist gleich Zähler %.`,
        stepsh:`${br(z,n)} = ${br(e,100)} = ${P(e)}`, steps:`${z}/${n} = ${e}/100 = ${e} %`});
    });
  },
  // G2-A07 Anteil bemalen (Raster antippen, es zählt nur die Anzahl)
  anteil_bemalen(){
    return versuche(()=>{
      const N=pick([20,24,36,40,50]), lay={20:[4,5],24:[4,6],36:[6,6],40:[5,8],50:[5,10]}[N];
      const p=pick([5,10,12.5,15,20,25,30,40,50,60,70,75,80,90]), k=N*p/100;
      if(!Number.isInteger(k)||k<=0||k>=N) return null;
      return aufg({kind:'bemalen', q:`Male ${P(p)} der Felder an!`, zeilen:lay[0], spalten:lay[1], ans:k, prozent:p,
        why:`Alle Felder · p : 100 = ${N} · ${Z(p)} : 100 = ${k} Felder.`, steps:`${N} · ${Z(p)} : 100 = ${k}`});
    });
  },
  // G2-N01 Memory als Zuordnen-Tabelle: zu 4 Prozentkarten je Bruch und Dezimalzahl
  memory(){
    const POOL=[[1,2],[1,4],[3,4],[1,5],[1,10],[2,5],[3,5],[4,5],[1,20],[1,100],[3,10],[7,10]];
    const l=mischen(POOL).slice(0,4), ans={};
    const dinge=mischen(l.flatMap(([z,n],i)=>[{id:'b'+i, html:br(z,n), kurz:`${z}/${n}`},{id:'d'+i, html:dezimal(z,n), kurz:dezimal(z,n)}]));
    l.forEach((_,i)=>{ ans['b'+i]=`r${i}|b`; ans['d'+i]=`r${i}|d`; });
    return aufg({kind:'zuordnen', q:'Finde die zusammengehörigen Karten!', lead:'Lege zu jeder Prozentkarte den Bruch und die Dezimalzahl.',
      dinge, ans, raster:{zeilen:l.map((r,i)=>['r'+i, prozentText(...r)]), spalten:[['b','Bruch'],['d','Dezimalzahl']]}, karten:l,
      why:l.map(zeile).join(' · ')});
  },
  // G2-A06 (Plus) Lückentext Prozent, Hundert, Dezimalzahl
  lueckentext(){
    const p=rnd(1,99), d=rund(p/100);
    if(Math.random()<.5) return aufg({kind:'zahlen', q:`${P(p)} sind ① von Hundert oder ②.`, lead:'Fülle den Lückentext aus!',
      felder:[{label:'① von Hundert', ans:p, ansText:String(p)},{label:'② als Dezimalzahl', ans:d, ansText:Z(d)}],
      why:`${P(p)} sind ${p} von Hundert oder ${Z(d)}.`});
    return aufg({kind:'zahlen', q:`① sind ${p} von Hundert oder ②.`, lead:'Fülle den Lückentext aus!',
      felder:[{label:'① in Prozent', ans:p, ansText:P(p), einheit:'%'},{label:'② als Dezimalzahl', ans:d, ansText:Z(d)}],
      why:`${P(p)} sind ${p} von Hundert oder ${Z(d)}.`});
  },
  // G2-N02 (Plus) Was ist größer?
  groesser(){
    return versuche(()=>{
      const POOL=[[1,2],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,10],[3,10],[7,10],[9,10],[1,20],[3,20],[9,20],[11,20],[13,20],[17,20]];
      const a=pick(POOL), b=pick(POOL), pa=a[0]*100/a[1], pb=b[0]*100/b[1];
      if(Math.abs(pa-pb)<5||Math.abs(pa-pb)>20) return null;   // nicht zu weit auseinander
      const [fa,fb]=mischen(['p','b','d']), zeig=(r,f)=>({p:prozentText(...r), b:br(...r), d:dezimal(...r)}[f]);
      const opt=[['a',zeig(a,fa)],['b',zeig(b,fb)]];
      return aufg({kind:'fragen', q:'Welche Zahl ist größer?', gruppen:[{optionen:opt, ans:pa>pb?'a':'b'}], werte:[a,b],
        why:`In Prozent: ${zeig(a,fa)} = ${prozentText(...a)}, ${zeig(b,fb)} = ${prozentText(...b)}.`});
    });
  },
  // G2-N03 (Plus) Drittel und Sechstel
  drittel(){
    return versuche(()=>{
      const r=pick([[1,3],[2,3],[1,6],[5,6]]), inP=Math.random()<.5;
      const rich = inP ? prozentText(...r) : dezimal(...r);
      const ohne = rich.replace(UR.prozent.PUNKT,''), zehn = inP ? `${dezimal(r[0]*10,r[1])}${NB}%` : dezimal(r[0]*10,r[1]);
      const kurz = inP ? P(Math.floor(r[0]*100/r[1])) : Z(rund(Math.floor(r[0]*100/r[1])/100));
      const l=[rich,ohne,zehn,kurz]; if(new Set(l).size<4) return null;
      return aufg({kind:'fragen', qh:`Welche Schreibweise passt zu ${br(...r)}${inP?' in Prozent':' als Dezimalzahl'}?`, q:`Welche Schreibweise passt zu ${r[0]}/${r[1]}?`, wert:r,
        gruppen:[{optionen:mischen(l).map(x=>[x,x]), ans:rich}], why:`${br(...r)} = ${zeile(r)}. ${PERIODE(dezimal(...r).slice(-2,-1))}`});
    });
  }
};

/* ---------- Stationen (nur Kern-Typen) ---------- */
const stationen = [
  {id:'S1', name:'Prozent und Dezimalzahl', hint:'97 % = 0,97', types:['proz_dezimal']},
  {id:'S2', name:'Prozent und Bruch', hint:'72 % = 72 Hundertstel = 18 Fünfundzwanzigstel', types:['proz_bruch','bruch_proz']},
  {id:'S3', name:'Anteile im Bild', hint:'6 von 8 Teilen = 75 %', types:['anteil_bild','anteil_bemalen']},
  {id:'S4', name:'Alles gemischt', hint:`Ein Drittel = 33,3${UR.prozent.PUNKT} % = 0,3${UR.prozent.PUNKT}`, types:['tabelle','memory']}
];
const kern = ['anteil_bild','tabelle','proz_dezimal','proz_bruch','bruch_proz','anteil_bemalen','memory'];
const leicht = ['proz_dezimal'];   // Einstieg: Komma-Verschieben als Bild
const plus = ['lueckentext','groesser','drittel'];
const plusHint = 'Lückentext · Was ist größer? · Drittel und Sechstel';

/* ---------- Erklärung ---------- */
const hundertBsp = () => { const k=pick([5,10,20,25,35,40,50,60,75]), r=kuerzen(k,100); return {k, r}; };
const erklaerung = {
  beispiele: ()=>({h:hundertBsp(), p:typen.proz_dezimal({modus:'check'})}),
  neu(kind,E){ if(kind==='hundert') E.h=hundertBsp(); if(kind==='komma') E.p=typen.proz_dezimal({modus:'check'}); },
  html: E => `<section class="sheet"><h2>Prozent, Bruch und Dezimalzahl</h2>
    <div class="rule"><h3>1. Prozent heißt „je Hundert“</h3>
      <p>p % = ${br('p',100)} = p : 100. ${HUNDERT}</p>
      <div class="bild">${figur('hundert',100,gefaerbt(100,E.h.k))}</div>
      <div class="ex">${E.h.k} von 100 Feldern = ${P(E.h.k)} = ${br(E.h.k,100)} = ${br(...E.h.r)} = ${Z(E.h.k/100)}</div>
      <button class="newex" data-newex="hundert">Neues Beispiel</button></div>
    <div class="rule"><h3>2. Merktabelle</h3>
      <div class="merktab">${MERKTABELLE.map(r=>`<div class="ex">${zeile(r)}</div>`).join('')}</div>
      <p>Bei den Dritteln wiederholt sich eine Ziffer unendlich oft: 0,333… schreibt man 0,3${UR.prozent.PUNKT}. Den Punkt über der Ziffer setzt die Taste <b>Periodenpunkt</b>: erst die Ziffer tippen, dann die Taste.</p></div>
    <div class="rule"><h3>3. Komma verschieben</h3>
      <p>Prozent → Dezimalzahl: Komma um zwei Stellen nach links. Dezimalzahl → Prozent: Komma um zwei Stellen nach rechts.</p>
      <div class="ex">${E.p.steps}</div><div class="bild">${E.p.loesungBild}</div>
      <button class="newex" data-newex="komma">Neues Beispiel</button></div>
    <div class="rule"><h3>4. Bruch und Prozent</h3>
      <p>Prozent → Bruch: Nenner 100, dann kürzen: 72 % = ${br(72,100)} = ${br(18,25)}.<br>Bruch → Prozent: auf den Nenner 100 erweitern: ${br(7,25)} = ${br(28,100)} = 28 %.</p></div>
    <p class="small muted">Das steht auch in deinem Mathe Know How Prozentrechnung.</p>
    <div class="row"><button class="big" data-go="comp">Weiter</button></div></section>`
};

const lzk = {merkmal:{anteil_bild:'anteil_bild', anteil_bemalen:'anteil_bild', tabelle:'tabelle', memory:'tabelle', proz_dezimal:'proz_dezimal',
  proz_bruch:'proz_bruch', bruch_proz:'proz_bruch'}};
UR.kompetenzAnmelden({id:'M-Proz-G2', typen, stationen, kern, leicht, plus, plusHint, erklaerung, lzk, festeAuswahl:['memory']});
})(window.UR = window.UR || {});

<script>
/* Mathe/2.3 Prozentrechnung/M-Proz-G3.js */
/* Baustein M-Proz-G3: „Ich kann Prozentrechnungen lösen.“
   Steckbrief: M-Proz-G3.md, Auswahl der Lehrkraft: AUSWAHL.md (20.11.2026). Schlussrechnung wie im Mathe Know How
   (Dreisatz mit Pfeilen links und rechts, darunter die Formel), Umschalter Dreisatz/Formel, beides zählt gleich.
   G3-A07 Sachaufgabe: nur das Ergebnis, Dreisatz und Formel stehen in der Rückmeldung. */
(function(UR){
const {rnd, pick} = UR;
const {Z, E, P, NB, br, mischen, versuche, rund, nachkomma, aufg, merk, G, Pz, W, srWert, srOk, srBild, schlussAufgabe, wahlSchritt1} = UR.prozent;

const mitE = (x,e) => e==='€' ? E(x) : `${Z(x)}${e?NB+e:''}`;
const ganzOder = (x,nk) => nachkomma(x)<=nk;
const MERK = merk(`${W('W')} = ${br(`${G('G')} · ${Pz('p')}`,'100')} · ${Pz('p')} = ${br(`${W('W')} · 100`,G('G'))} · ${G('G')} = ${br(`${W('W')} · 100`,Pz('p'))}`);
const ERKENNEN = `„von …“ ist der ${G('Grundwert G')} (das Ganze, 100${NB}%). Die Zahl mit % ist der ${Pz('Prozentsatz p')}. Der Anteil in Zahlen ist der ${W('Prozentwert W')}.`;

/* ---------- Zahlen für die Schlussrechnung ---------- */
const EINH = ['kg','€','m','ml','km²','l'];
function wertAufgabe(e){
  return versuche(()=>{
    e = e || pick(EINH);
    const g = pick([rnd(2,80)*10, rnd(20,999), rnd(100,8000)]);
    const p = Math.random()<.25 ? rnd(11,999)/10 : rnd(1,99), w=rund(g*p/100);
    if(!ganzOder(w,2)||!ganzOder(rund(g/100),2)) return null;
    const sr={gesucht:'W', G:g, p, W:w, basis:100, zeichen:'%', einheit:e}; return srOk(sr) ? sr : null;
  });
}
const STUECK = {Stück:`1${NB}Stück`, Punkte:`1${NB}Punkt`, Kinder:`1${NB}Kind`, Personen:`1${NB}Person`, Lose:`1${NB}Los`, Äpfel:`1${NB}Apfel`, Mitglieder:`1${NB}Mitglied`, Versuche:`1${NB}Versuch`, Seiten:`1${NB}Seite`};
function satzAufgabe(e){
  return versuche(()=>{
    e = e || pick(['€','kg','m','l','Stück']);
    const g = pick([rnd(2,99)*10, rnd(20,500), rnd(10,80)*50]);
    const p = Math.random()<.15 ? rnd(101,150) : Math.random()<.2 ? rnd(11,999)/10 : rnd(1,99), w=rund(g*p/100);
    if(!ganzOder(w, STUECK[e]?0:2)) return null;

const PROZ_SACH = [5,10,12,15,20,25,30,35,40,45,50,60,65,70,75,80,85,90];
function sachAufgabe(art){
  return versuche(()=>{
    const v=pick(SACH.filter(x=>!art||x.art===art)), [a,b,s]=v.g, g=rnd(a/s,b/s)*s, p=pick(PROZ_SACH), w=rund(g*p/100);

    if(!srOk(sr)) return null;
    const wt = x => mitE(x, v.e), q = v.art==='W' ? v.s(wt(g), P(p)) : v.art==='p' ? v.s(wt(g), wt(w)) : v.s(wt(w), P(p));

      loesungBild:srBild(sr), why:woran, lead:'Lies genau: Ist G, p oder W gesucht?'});
  });
}

<script>
/* Mathe/2.3 Prozentrechnung/M-Proz-G4.js */
/* Baustein M-Proz-G4: „Ich kann Prozentsätze in Form eines Prozentstreifens darstellen.“
   Steckbrief: M-Proz-G4.md, Auswahl der Lehrkraft: AUSWAHL.md (20.11.2026). Streifen immer 10 cm × 1 cm, 1 % ≙ 1 mm;
   Einstieg mit Skala; Längen mit Einheiten-Tasten mm und cm; Zeichnen auf Papier mit Selbstkontrolle (G4-A06). */
(function(UR){
const {rnd, pick} = UR;
const {Z, P, NB, rund, mischen, versuche, aufg, merk, legende, streifenSVG} = UR.prozent;

const MERK = merk(`Streifen 10${NB}cm × 1${NB}cm · 100${NB}% ≙ 10${NB}cm · 1${NB}% ≙ 1${NB}mm · zusammen immer 100${NB}%`);
const mitMerk = (t,ctx) => { if(ctx&&(ctx.leicht||ctx.einstieg)) t.lead = `${t.lead?t.lead+' ':''}${MERK}`; return t; };
const laenge = p => p<10 ? `${Z(p)}${NB}mm` : `${Z(p/10)}${NB}cm`;
const KONTEXTE = [
  ['Lieblingsfarbe', ['Grün','Rot','Blau','Gelb','Lila']], ['Schulweg', ['Bus','zu Fuß','Rad','Auto']],
  ['Sportanlage', ['Sportplätze','Tennis','Gebäude','Parkplatz']], ['Schokolade', ['Füllung','Kakao','Milch','Fruchtsirup','Zucker']],
  ['Mürbteig', ['Mehl','Butter','Zucker']], ['Grundstück', ['Wald','Acker','Baugrund','Grünfläche']],
  ['Freizeit', ['Sport','Musik','Lesen','Spielen','Basteln']], ['Haustiere', ['Hund','Katze','Fisch','Vogel']]
];
// k Abschnitte mit ganzen Prozent, zusammen 100, jeder mindestens min und höchstens max, schritt = Vielfache
function teilung(k, {min=3, schritt=1}={}){
  return versuche(()=>{
    const ps=[]; let rest=100;
    for(let i=0;i<k-1;i++){ const p=rnd(Math.ceil(min/schritt), Math.floor((rest-min*(k-1-i))/schritt))*schritt; if(p<min) return null; ps.push(p); rest-=p; }
    if(rest<min||rest%schritt) return null; ps.push(rest);
    if(ps.filter(p=>p===50||p===25).length>1) return null;   // nicht zu oft Hälften und Viertel
    return ps;
  });
}
const daten = (k, o) => { const [titel, namen]=pick(KONTEXTE), n=mischen(namen).slice(0, Math.min(k, namen.length)), ps=teilung(n.length, o);
  return {titel, teile:n.map((x,i)=>[x, ps[i]])}; };
const liste = teile => teile.map(([n,p])=>`${n} ${P(p)}`).join(', ');

/* ---------- G4-A01: Regeln (Lücken wie im Mathe Know How) ---------- */
const REGELN = [
  {s:'Der Streifen hat die Form eines Rechtecks mit ① Länge und ② Höhe.', l:[['10 cm',['10 cm','1 cm','5 cm','100 cm']],['1 cm',['1 cm','10 cm','1 mm','2 cm']]]},
  {s:'Die Prozentsätze müssen addiert genau ① ergeben.', l:[['100 %',['100 %','10 %','1 000 %','50 %']]]},
  {s:'Für jeden Prozentsatz gilt: 1 % ≙ ①.', l:[['1 mm',['1 mm','1 cm','10 cm','0,1 mm']]]},
  {s:'Die einzelnen Abschnitte müssen ① werden und können gefärbt werden.', l:[['beschriftet',['beschriftet','gleich lang','rund','durchgestrichen']]]},
  {s:'100 % entsprechen der ganzen Länge von ①, 10 % entsprechen ②.', l:[['10 cm',['10 cm','100 cm','1 cm','100 mm²']],['1 cm',['1 cm','1 mm','10 mm²','10 cm']]]}
].map(r=>({s:r.s.replace(/ (cm|mm|%)/g, NB+'$1'), l:r.l.map(([a,o])=>[a.replace(' ',NB), o.map(x=>x.replace(/ (cm|mm|%|000)/g, NB+'$1'))])}));

/* ---------- Aufgabentypen ---------- */
const typen = {
  // G4-A01 Regeln für den Prozentstreifen
  regeln(ctx){
    const r=pick(REGELN);
    return aufg(mitMerk({kind:'fragen', q:r.s, lead:'Ergänze die Regel für den Prozentstreifen!',
      gruppen:r.l.map(([a,o],i)=>({frage:'①②'[i], optionen:mischen(o).map(x=>[x,x]), ans:a, klasse:'drei'})),
      why:`Regeln: Der Streifen ist 10${NB}cm lang und 1${NB}cm hoch. Alle Prozentsätze zusammen ergeben 100${NB}%. 1${NB}% ≙ 1${NB}mm. Jeder Abschnitt wird beschriftet.`, bild:streifenSVG([['A',40],['B',35],['C',25]],{skala:true, legende:false})}, ctx));
  },
  // G4-A02 Länge der Abschnitte (Einheiten-Tasten mm und cm)
  laengen(ctx){

      bild:streifenSVG(teile,{skala:leicht}),
      felder:teile.map(([n,p])=>({label:n, ans:p/10, ansText:`${n}: ${laenge(p)}`, einheiten:['mm','cm'], einheitAns:'cm'})),
      why:`1${NB}% ≙ 1${NB}mm, also p${NB}% ≙ p${NB}mm: ${teile.map(([n,p])=>`${n} ${P(p)} ≙ ${Z(p)}${NB}mm${p>=10?` = ${Z(p/10)}${NB}cm`:''}`).join(' · ')}.`}, ctx));
  },
  // G4-A03 Fehlenden Prozentsatz ergänzen (der Rest)
  rest(ctx){
    const {titel, teile}=versuche(()=>{ const d=daten(rnd(3,5)); const r=d.teile[d.teile.length-1][1]; return r>=1&&r<=40 ? d : null; });
    const geg=teile.slice(0,-1), [rn,rp]=teile[teile.length-1];
    return aufg(mitMerk({kind:'zahlen', text:true, q:`${titel}: ${liste(geg)}, der Rest ist ${rn}. Wie viel Prozent sind ${rn}?`, teile,
      lead:'Die Prozentsätze müssen genau 100 % ergeben.', bild:ctx&&ctx.leicht?streifenSVG([...geg,['?',rp]],{skala:true}):undefined,
      felder:[{label:rn, ans:rp, ansText:P(rp), einheit:'%'}],
      why:`100 ${geg.map(([,p])=>`${UR.M} ${Z(p)}`).join(' ')} = ${P(rp)}.`}, ctx));
  },
  // G4-A04 Prozentsatz zum Abschnitt (Länge als Text oder im Bild mit Skala)
  ablesen(ctx){
    if(Math.random()<.5){ const p=pick([rnd(1,9), rnd(2,19)*5, rnd(11,99)]), mm=Math.random()<.4||p<10;
      return aufg(mitMerk({kind:'zahlen', q:`Ein Abschnitt ist ${mm?`${Z(p)}${NB}mm`:`${Z(p/10)}${NB}cm`} lang.`, lead:'Der Streifen ist 10 cm lang. Welcher Prozentsatz gehört zum Abschnitt?',
        felder:[{label:'Prozentsatz', ans:p, ansText:P(p), einheit:'%'}], why:`1${NB}mm ≙ 1${NB}%, 1${NB}cm ≙ 10${NB}%: ${mm?`${Z(p)}${NB}mm`:`${Z(p/10)}${NB}cm = ${Z(p)}${NB}mm`} ≙ ${P(p)}.`}, ctx)); }
    const {titel, teile}=daten(rnd(3,4), {min:5, schritt:5}), [n,p]=pick(teile);
    return aufg(mitMerk({kind:'zahlen', q:`${titel}: Wie viel Prozent sind ${n}?`, lead:'Lies am Streifen mit Skala ab!', teile, gefragt:n,
      bild:streifenSVG(teile,{skala:true, zahlen:false, legendeP:false}),
      felder:[{label:n, ans:p, ansText:P(p), einheit:'%'}], why:`${n} ist ${Z(p/10)}${NB}cm lang. 1${NB}cm ≙ 10${NB}%, also ${P(p)}.`}, ctx));
  },
  // G4-A05 Passenden Streifen wählen (drei Bilder)
  waehlen(ctx){
    return versuche(()=>{
      const {titel, teile}=daten(rnd(3,4), {min:10, schritt:5}), ps=teile.map(x=>x[1]), k=ps.length;
      const varianten=[];
      const i=rnd(0,k-2); if(ps[i]!==ps[i+1]){ const v=[...ps]; [v[i],v[i+1]]=[v[i+1],v[i]]; varianten.push({ps:v, warum:`${teile[i][0]} und ${teile[i+1][0]} sind vertauscht.`}); }
      const j=rnd(0,k-1); { const v=[...ps]; v[j]-=pick([5,10]); if(v[j]>0) varianten.push({ps:v, warum:`Zusammen nur ${P(v.reduce((a,b)=>a+b,0))}: Der Streifen ist zu kurz.`}); }
      const a=rnd(0,k-1), b=(a+1)%k; { const v=[...ps]; v[a]+=10; v[b]-=10; if(v[b]>0) varianten.push({ps:v, warum:`${teile[a][0]} ist zu lang und ${teile[b][0]} zu kurz.`}); }
      const falsch=mischen(varianten).filter((v,x,l)=>l.findIndex(w=>w.ps.join()===v.ps.join())===x&&v.ps.join()!==ps.join()).slice(0,2);

        why:`Der Rest: 100 ${teile.slice(0,-1).map(([,p])=>`${UR.M} ${Z(p)}`).join(' ')} = ${P(ps[k-1])}. Richtig ist ${alle.find(v=>v.richtig).id}. ${alle.filter(v=>!v.richtig).map(v=>`${v.id}: ${v.warum}`).join(' ')}`}, ctx));
    });

  zeichnen_streifen(ctx){

      why:`p${NB}% ≙ p${NB}mm: ${teile.map(([n,p])=>`${n} ${laenge(p)}`).join(' · ')}. Wenn es nicht passt: Rechne p${NB}% ≙ p${NB}mm und miss nochmals.`});
  },

  fehler_streifen(){

      const falsch = art==='mal10' ? (p<=9?`${Z(p)}${NB}cm`:null) : art==='durch10' ? (p>=10?`${Z(p/10)}${NB}mm`:null) : `${Z(p/10+1)}${NB}cm`;

  anzahlen(){

      const [was,wer]=pick([['bei Fußball','Kindern'],['Schwimmer*innen','Kindern'],['gehen zu Fuß','Schüler*innen'],['haben ein Haustier','Kindern']]);

        s1:{label:'Schritt 1: Prozentsatz', kurz:'Prozentsatz', felder:[{label:'', ans:p, ansText:P(p), einheit:'%'}], ansText:P(p)},
        s2:{label:'Schritt 2: Länge im Streifen', felder:[{label:'', ans:p/10, ansText:`${Z(p/10)}${NB}cm`, einheit:'cm'}], ansText:`${Z(p/10)}${NB}cm`},
        pre:{ans:String(p), optionen:mischen([p, rund(p/10), 100-p, p+10, p+5].filter((x,i,l)=>x>0&&l.indexOf(x)===i).slice(0,3).map(x=>[String(x),P(x)]))},
        why:`p = ${w} · 100 : ${g} = ${P(p)}; ${P(p)} ≙ ${Z(p)}${NB}mm = ${Z(p/10)}${NB}cm.`});
    });
  }
};

/* ---------- Stationen (nur Kern-Typen) ---------- */
const stationen = [
  {id:'S1', name:'Regeln für den Prozentstreifen', hint:'10 cm lang, 1 % ≙ 1 mm', types:['regeln']},

];

      <li>Jeder Abschnitt: p${NB}% ≙ p${NB}mm</li><li>Jeden Abschnitt beschriften (und färben)</li></ul></div>

};

<script>

   und ihn für Berechnungen nutzen.“ Steckbrief: M-Proz-V1.md, Auswahl der Lehrkraft: AUSWAHL.md (20.11.2026).
   Änderungsfaktor wie im Mathe Know How: erhöht 1 + p/100, vermindert 1 − p/100; neuer Wert = alter Wert · ÄF in einer
   Rechnung (500 · 0,75 = 375 €). Einstieg mit Merkkarte, Schritt 1 aus Vorschlägen. */
(function(UR){

const mitMerk = (t,ctx) => { if(ctx&&ctx.einstieg) t.lead = `${t.lead?t.lead+' ':''}${MERK}`; return t; };
const af = (p,rauf) => rund(rauf ? 1+p/100 : 1-p/100);

// Prozentsatz: meist ganz, manchmal mit einer Nachkommastelle

const afVorschlaege = (p,rauf) => { const l=[];
  for(const x of [af(p,rauf), af(p,!rauf), rund(p/100), rund(rauf?1+p/10:1-p/1000), rund(p/10)]) if(l.length<3&&x>0&&!l.includes(x)) l.push(x);
  return mischen(l.map(x=>[String(x), Z(x)])); };
const afFeld = (p,rauf) => ({label:'Schritt 1: Änderungsfaktor', kurz:'Änderungsfaktor', felder:[{label:'ÄF =', ans:af(p,rauf), ansText:Z(af(p,rauf)), exakt:true}], ansText:Z(af(p,rauf))});

/* ---------- Sachaufgaben (V1-A04): Signalwörter wechseln; große Zahlen mit Runden ---------- */
// g: [von, bis, Schritt], e: Einheit, nk: Nachkommastellen des Ergebnisses (ohne Runden), runde: Stellen beim Runden
const SACH = [
  {rauf:false, e:'€', g:[20,300,1], s:(g,p)=>`Ein Schihelm um ${g} wird um ${p} verbilligt. Wie viel kostet er jetzt?`},

  {rauf:false, e:'l', nk:2, g:[40,120,1], d:10, s:(g,p)=>`Ein Auto braucht ${g} Benzin auf 100 km. Das neue Modell braucht um ${p} weniger. Wie viel braucht es auf 100 km?`},
