  {rauf:false, e:'Mio.', runde:2, g:[12,95,1], d:10, s:(g,p)=>`Ein Land hat ${g} Einwohner*innen. Die Zahl nimmt um ${p} ab. Wie viele Millionen sind es dann? Runde auf zwei Nachkommastellen!`}
];
const mitE = (x,e) => e==='€' ? E(x) : `${Z(x)}${NB}${e}`;
const gerundet = (x,k) => Math.round(rund(x*10**k))/10**k;

/* ---------- Aufgabentypen ---------- */
const typen = {
  // V1-A01 Änderungsfaktor bestimmen (Schritt 1 Formel wählen, Schritt 2 ÄF)
  faktor(ctx){
    const rauf=Math.random()<.5, p=rauf ? prozent(100) : prozent(99), f=af(p,rauf);
    const t={kind:'zweischritt', q:`Der Wert wird um ${P(p)} ${rauf?'erhöht':'vermindert'}.`, lead:'Gib den Änderungsfaktor an!', schritt:'Formel',
      s1:{label:'Schritt 1: Welche Formel passt?', kurz:'Formel', wahl:[['plus',`ÄF = 1 + ${br('p',100)}`],['minus',`ÄF = 1 ${M} ${br('p',100)}`]], ans:rauf?'plus':'minus', ansText:rauf?'1 + p : 100':`1 ${M} p : 100`},
      s2:{label:'Schritt 2: Änderungsfaktor', felder:[{label:'ÄF =', ans:f, ansText:Z(f), exakt:true}], ansText:Z(f)},
      hinweisNach:(e1,e2)=>e2[0].v!==null&&Math.abs(e2[0].v-af(p,!rauf))<1e-9 ? `Achtung: ${rauf?'Erhöht → ÄF größer als 1':'Vermindert → ÄF kleiner als 1'}.` : '',
      why:`${rauf?'Erhöht':'Vermindert'} um ${P(p)}: ${afWeg(p,rauf)}. ${rauf?'Bei einer Erhöhung ist der ÄF größer als 1.':'Bei einer Verminderung ist der ÄF kleiner als 1.'}`};
    return aufg(mitMerk(wahlSchritt1(t),ctx));
  },
  // V1-A02 Aus dem ÄF die Änderung lesen (Erhöhung/Verminderung wählen, Prozent eintippen)
  lesen(ctx){
    return versuche(()=>{
      const f = Math.random()<.25 ? rnd(500,1500)/1000 : rnd(50,150)/100; if(f===1||nachkomma(f)>3) return null;
      const rauf=f>1, p=rund(Math.abs(f-1)*100);
      const t={kind:'zweischritt', q:`Der Änderungsfaktor ist ${Z(f)}. Um wie viel Prozent ändert sich der Wert?`, schritt:'Richtung',
        s1:{label:'Schritt 1: Erhöhung oder Verminderung?', kurz:'Richtung', wahl:[['E','Erhöhung'],['V','Verminderung']], ans:rauf?'E':'V', ansText:rauf?'Erhöhung':'Verminderung'},
        s2:{label:'Schritt 2: um wie viel Prozent?', felder:[{label:'um', ans:p, ansText:P(p), einheit:'%'}], ansText:P(p)},
        why:`ÄF ${rauf?'größer':'kleiner'} als 1 → ${rauf?'Erhöhung':'Verminderung'}. ${rauf?`${Z(f)} ${M} 1`:`1 ${M} ${Z(f)}`} = ${Z(rund(Math.abs(f-1)))}, mal 100: ${P(p)}.`};
      return aufg(mitMerk(wahlSchritt1(t),ctx));
    });
  },
  // V1-A03 Neuen Wert berechnen (ÄF, dann alter Wert · ÄF)
  neuer_wert(ctx){
    return versuche(()=>{
      const g=pick([rnd(4,300)*10, rnd(40,999)]), rauf=Math.random()<.5, p=rauf?prozent(60,.25):prozent(90,.25), f=af(p,rauf), w=rund(g*f);
      if(!ok2(w)) return null;
      return aufg(mitMerk({kind:'zweischritt', q:`${E(g)} werden um ${P(p)} ${rauf?'erhöht':'vermindert'}.`, lead:'Bestimme den Änderungsfaktor und den neuen Wert!', schritt:'Schritt 1',
        s1:afFeld(p,rauf), s2:{label:'Schritt 2: neuer Wert', felder:[{label:'', ans:w, ansText:E(w), einheit:'€'}], ansText:E(w)},
        pre:{ans:String(f), optionen:afVorschlaege(p,rauf)},
        hinweisNach:(e1,e2)=>e2[0].v!==null&&Math.abs(e2[0].v-g*p/100)<0.006 ? `Das ist nur die Änderung (${E(rund(g*p/100))}). Mit dem Änderungsfaktor kommst du gleich auf den neuen Wert: ${Z(g)} · ${Z(f)}.` : '',
        why:`${afWeg(p,rauf)}. Neuer Wert: ${Z(g)} · ${Z(f)} = ${E(w)}.`, stepsh:`${Z(g)} · ${Z(f)} = ${E(w)}`}, ctx));
    });
  },
  // V1-A04 Sachaufgabe mit Änderungsfaktor
  sach_af(ctx){
    return versuche(()=>{
      const v=pick(SACH), [a,b,s]=v.g, g=rund(rnd(a/s,b/s)*s/(v.d||1)), p=prozent(v.runde?15:30,.3), f=af(p,v.rauf), w=rund(g*f);
      const erg = v.runde ? gerundet(w,v.runde) : w;
      if(v.runde ? nachkomma(w)<=v.runde : !(nachkomma(w)<=(v.nk??2))) return null;   // Runden nur, wo es nötig ist
      const ganz = v.e==='Mrd.'?`${Z(g)}${NB}Milliarden`:v.e==='Mio.'?`${Z(g)}${NB}Millionen`:mitE(g,v.e);
      return aufg(mitMerk({kind:'zweischritt', text:true, q:v.s(ganz, P(p)), lead:'Bestimme zuerst den Änderungsfaktor und rechne dann!', schritt:'Schritt 1',
        s1:afFeld(p,v.rauf), s2:{label:`Schritt 2: Ergebnis${v.runde?' (gerundet)':''}`, felder:[{label:'', ans:erg, ansText:mitE(erg,v.e), einheit:v.e, stellen:v.runde}], ansText:mitE(erg,v.e)},
        pre:{ans:String(f), optionen:afVorschlaege(p,v.rauf)},
        hinweisNach:(e1,e2)=>v.runde&&e2[0].v!==null&&Math.abs(e2[0].v-w)<1e-9 ? `Richtig gerechnet, aber noch auf ${v.runde===1?'eine Nachkommastelle':'zwei Nachkommastellen'} runden.` : '',
        why:`${v.rauf?'Erhöht':'Vermindert'}: ${afWeg(p,v.rauf)}. ${Z(g)} · ${Z(f)} = ${Z(w)}${v.runde?` ≈ ${Z(erg)}`:''} → ${mitE(erg,v.e)}.`}, ctx));
    });
  },
  // V1-A05 (Plus) Erst rauf, dann runter
  rauf_runter(){

      const g=rnd(10,100)*10, p1=rnd(1,10)*5, p2=rnd(1,10)*5, erst=Math.random()<.5;
      const f1=af(p1,erst), f2=af(p2,!erst), f=rund(f1*f2), w=rund(g*f); if(!ok2(w)||nachkomma(f)>4) return null;
      const l=[]; for(const x of [f, rund(f1+f2-1), 1, f1, f2]) if(l.length<3&&!l.includes(x)) l.push(x);   // typisch: Prozente verrechnet, „wieder gleich“
      const opt=mischen(l.map(x=>[String(x),Z(x)]));
      return aufg({kind:'zweischritt', text:true, q:`Eine Ware kostet ${E(g)}. Der Preis wird erst um ${P(p1)} ${erst?'erhöht':'gesenkt'}, dann um ${P(p2)} ${erst?'gesenkt':'erhöht'}. Was kostet die Ware am Ende?`,
        schritt:'Schritt 1', s1:{label:'Schritt 1: Änderungsfaktor insgesamt', kurz:'ÄF insgesamt', felder:[{label:'ÄF =', ans:f, ansText:Z(f), exakt:true}], ansText:Z(f)},
        s2:{label:'Schritt 2: Preis am Ende', felder:[{label:'', ans:w, ansText:E(w), einheit:'€'}], ansText:E(w)}, pre:{ans:String(f), optionen:opt},
        why:`Die zwei Änderungsfaktoren werden multipliziert: ${Z(f1)} · ${Z(f2)} = ${Z(f)}. ${Z(g)} · ${Z(f)} = ${E(w)}. Erst + und dann − gleich viele Prozent ergibt nicht wieder den alten Preis.`});
    });
  },
  // V1-A06 (Plus) Rückwärts zum alten Wert
  rueckwaerts(){

      const alt=rnd(20,900), rauf=Math.random()<.35, p=rauf?rnd(2,30):rnd(5,40), f=af(p,rauf), neu=rund(alt*f); if(!ok2(neu)) return null;
      const q = rauf ? `Nach einer Preiserhöhung um ${P(p)} kostet eine Ware ${E(neu)}. Wie viel kostete sie vorher?` : `Nach ${P(p)} Nachlass kostet eine Ware ${E(neu)}. Wie viel kostete sie vorher?`;
      const falsch=rund(neu*af(p,!rauf));

        s2:{label:'Schritt 2: alter Preis', felder:[{label:'', ans:alt, ansText:E(alt), einheit:'€'}], ansText:E(alt)}, pre:{ans:String(f), optionen:afVorschlaege(p,rauf)},
        hinweisNach:(e1,e2)=>e2[0].v!==null&&Math.abs(e2[0].v-falsch)<0.006 ? `Du hast ${P(p)} vom neuen Preis gerechnet. Die ${P(p)} gehören zum alten Preis: alter Preis = neuer Preis : ÄF.` : '',
        why:`${afWeg(p,rauf)}. Alter Preis · ${Z(f)} = neuer Preis, also alter Preis = ${Z(neu)} : ${Z(f)} = ${E(alt)}.`});
    });
  },
  // V1-A07 (Plus) Mehrwertsteuer und Skonto
  mwst_skonto(){

        return aufg({kind:'zweischritt', text:true, q:`Eine Rechnung über ${E(b)} wird bar mit ${P(s)} Skonto bezahlt. Wie viel ist zu zahlen?`, schritt:'Schritt 1', s1:afFeld(s,false),
          s2:{label:'Schritt 2: zu zahlen', felder:[{label:'', ans:w, ansText:E(w), einheit:'€'}], ansText:E(w)}, pre:{ans:String(f), optionen:afVorschlaege(s,false)},
          why:`Skonto vermindert: ${afWeg(s,false)}. ${Z(b)} · ${Z(f)} = ${E(w)}.`}); }
      const m=pick([10,20]), f=af(m,true), netto=rnd(1000,150000)/100, brutto=rund(netto*f); if(!ok2(brutto)) return null;
      if(art==='brutto') return aufg({kind:'zweischritt', text:true, q:`Ein Gerät kostet ${E(netto)} ohne Mehrwertsteuer (netto). Dazu kommen ${P(m)} Mehrwertsteuer. Wie viel kostet es mit Mehrwertsteuer (brutto)?`,
        schritt:'Schritt 1', s1:afFeld(m,true), s2:{label:'Schritt 2: Preis brutto', felder:[{label:'', ans:brutto, ansText:E(brutto), einheit:'€'}], ansText:E(brutto)},

      return aufg({kind:'zweischritt', text:true, q:`Ein Gerät kostet ${E(brutto)} mit ${P(m)} Mehrwertsteuer (brutto). Wie viel kostet es ohne Mehrwertsteuer (netto)?`,
        schritt:'Schritt 1', s1:afFeld(m,true), s2:{label:'Schritt 2: Preis netto', felder:[{label:'', ans:netto, ansText:E(netto), einheit:'€'}], ansText:E(netto)},
        pre:{ans:String(f), optionen:afVorschlaege(m,true)},
        hinweisNach:(e1,e2)=>e2[0].v!==null&&Math.abs(e2[0].v-brutto*af(m,false))<0.006 ? `Nicht ${P(m)} vom Bruttopreis abziehen: Die ${P(m)} gehören zum Nettopreis. Netto = brutto : ${Z(f)}.` : '',
        why:`Netto · ${Z(f)} = brutto, also netto = brutto : ${Z(f)}: ${Z(brutto)} : ${Z(f)} = ${E(netto)}.`});
    });

  fehler_af(){

      if(!ok2(rund(g*p/100))) return null;

        felder:[{label:'richtiges Ergebnis', ans:w, ansText:E(w), einheit:'€'}], why:`${warum} Richtig: ${Z(g)} · ${Z(f)} = ${E(w)}.`});
    });
  }

const bsp = rauf => versuche(()=>{ const g=rnd(5,60)*10, p=rauf?pick([4,6.5,8,12,15,20,25]):pick([10,15,20,25,30,40]), f=af(p,rauf), w=rund(g*f); return ok2(w)?{g,p,f,w,rauf}:null; });

<script>
/* Mathe/2.3 Prozentrechnung/M-Proz-V2.js */
/* Baustein M-Proz-V2: „Ich kann Prozentsätze in Form eines Kreisdiagramms darstellen.“
   Steckbrief: M-Proz-V2.md, Auswahl der Lehrkraft: AUSWAHL.md (20.11.2026). 1 % ≙ 3,6°, 100 % ≙ 360°; Einstieg mit Merkkarte
   und Kontrolle „zusammen 360°“; Zeichnen auf Papier mit Selbstkontrolle (V2-A06). */
(function(UR){
const {rnd, pick, M} = UR;
const {Z, P, NB, rund, mischen, versuche, aufg, merk, legende, kreisSVG} = UR.prozent;

const MERK = merk(`1${NB}% ≙ 3,6° (weil 360° : 100 = 3,6°) · 100${NB}% ≙ 360° · Kontrolle: alle Winkel zusammen 360°`);
const mitMerk = (t,ctx) => { if(ctx&&(ctx.leicht||ctx.einstieg)) t.lead = `${t.lead?t.lead+' ':''}${MERK}`; return t; };
const G_ = x => `${Z(rund(x))}°`;
const KONTEXTE = [
  ['Grundstück', ['Wald','Acker','Baugrund','Grünfläche']], ['Urlaub', ['Winterurlaub','Sommerurlaub','keine Urlaubsfahrt']],
  ['Körper', ['Muskeln','Knochen','Fett','Anderes']], ['Butter', ['Fett','Wasser','fettfreie Masse']],
  ['Lieblingssport', ['Fußball','Schwimmen','Tanzen','Radfahren','Klettern']], ['Schulweg', ['Bus','zu Fuß','Rad','Auto']],
  ['Taschengeld', ['Sparen','Süßes','Spiele','Kleidung']]
];
function teilung(k, {min=2, schritt=1}={}){
  return versuche(()=>{ const ps=[]; let rest=100;
    for(let i=0;i<k-1;i++){ const p=rnd(Math.ceil(min/schritt), Math.floor((rest-min*(k-1-i))/schritt))*schritt; if(p<min) return null; ps.push(p); rest-=p; }

}
const daten = (k,o) => { const [titel,namen]=pick(KONTEXTE), n=mischen(namen).slice(0,Math.min(k,namen.length)), ps=teilung(n.length,o); return {titel, teile:n.map((x,i)=>[x,ps[i]])}; };
const liste = teile => teile.map(([n,p])=>`${n} ${P(p)}`).join(', ');

const kontrolle = teile => `${teile.map(([,p])=>G_(p*3.6)).join(' + ')} = 360°`;

/* ---------- V2-N01 (Plus): Streifen oder Kreis? (eigener Schlüssel im Prüfer) ---------- */
const WAHL = [
  ['Anteile von 3 Antworten in einer Umfrage, man will den Anteil am Ganzen sehen','Kreisdiagramm','Wenige Teile eines Ganzen: Das Kreisdiagramm zeigt den Anteil am Ganzen auf einen Blick.'],
  ['Stimmen für 8 Parteien, die man genau vergleichen will','Prozentstreifen','Viele Teile: Im Streifen kann man die Längen leichter vergleichen und abmessen.'],

  ['Zusammensetzung der Luft, schnell mit dem Lineal zu zeichnen','Prozentstreifen','Mit dem Lineal geht der Streifen am schnellsten: 1 % ≙ 1 mm.'],
  ['Wie das Taschengeld aufgeteilt wird (Sparen, Süßes, Spiele)','Kreisdiagramm','Wenige Teile eines Ganzen: Kreisdiagramm.'],

/* ---------- Aufgabentypen ---------- */
const typen = {
  // V2-A01 Prozent in Grad (Schritt 1 Rechnung wählen, Schritt 2 Winkel)
  grad(ctx){
    const p=rnd(1,99), w=rund(p*3.6);
    const t={kind:'zweischritt', q:`${P(p)} im Kreisdiagramm`, lead:'Wie groß ist der Winkel?', schritt:'Rechnung',

    return aufg(mitMerk({kind:'zahlen', text:true, q:text, lead:'Berechne die Winkel für alle Abschnitte!', teile, felder,
      loesungBild:kreisSVG(teile), why:`${mitRest?`Rest: 100 ${teile.slice(0,-1).map(([,p])=>`${M} ${Z(p)}`).join(' ')} = ${P(rp)}. `:''}${rechnungen(teile)}. Kontrolle: ${kontrolle(teile)}.`}, ctx));
  },
  // V2-A04 Kreisdiagramm lesen (Prozent eines Abschnitts oder größter Abschnitt)
  ablesen_kreis(ctx){
    const {titel, teile}=daten(rnd(3,4), {min:5});
    if(Math.random()<.6){ const [n,p]=pick(teile);
      return aufg(mitMerk({kind:'zahlen', q:`${titel}: Wie viel Prozent sind ${n}?`, lead:'Lies aus dem Kreisdiagramm ab!', teile, gefragt:n,
        bild:kreisSVG(teile,{legendeP:false}), felder:[{label:n, ans:p, ansText:P(p), einheit:'%'}],
        why:`Winkel : 3,6 = Prozent: ${G_(p*3.6)} : 3,6 = ${P(p)}.`}, ctx)); }
    const max=Math.max(...teile.map(x=>x[1])); if(teile.filter(x=>x[1]===max).length>1) return typen.ablesen_kreis(ctx);
    const gross=teile.find(x=>x[1]===max);
    return aufg(mitMerk({kind:'fragen', q:`${titel}: Welcher Abschnitt ist am größten?`, lead:'Lies aus dem Kreisdiagramm ab!', teile,
      bild:kreisSVG(teile,{legendeP:false}), gruppen:[{optionen:teile.map(([n])=>[n,n]), ans:gross[0]}],
      why:`Der größte Winkel (${G_(max*3.6)}) ist der größte Anteil: ${gross[0]} mit ${P(max)}.`}, ctx));
  },
  // V2-A05 Passendes Kreisdiagramm wählen (drei Bilder)
  kreis_waehlen(ctx){
    return versuche(()=>{
      const {titel, teile}=daten(rnd(2,4), {min:10, schritt:5}), ps=teile.map(x=>x[1]), k=ps.length;
      const v=[];
      if(k>2||ps[0]!==ps[1]){ const i=rnd(0,k-2); if(ps[i]!==ps[i+1]){ const q=[...ps]; [q[i],q[i+1]]=[q[i+1],q[i]]; v.push({grad:q.map(x=>x*3.6), warum:`${teile[i][0]} und ${teile[i+1][0]} sind vertauscht.`}); } }
      v.push({grad:ps.map(x=>x), warum:'Die Winkel sind p° statt p · 3,6°: Der Kreis ist nicht voll.'});
      { const j=rnd(0,k-1), q=ps.map(x=>x*3.6); q[j]+=pick([-36,-18]); if(q[j]>0) v.push({grad:q, warum:`Der Winkel für ${teile[j][0]} ist zu klein, zusammen sind es nicht 360°.`}); }
      const falsch=mischen(v).slice(0,2); if(falsch.length<2) return null;
      const alle=mischen([{grad:ps.map(x=>x*3.6), richtig:true}, ...falsch]).map((x,i)=>({...x, id:'ABC'[i]}));
      const rest=teile[k-1][0];
      return aufg(mitMerk({kind:'fragen', text:true, q:`${titel}: ${liste(teile.slice(0,-1))}, der Rest ist ${rest}. Welches Kreisdiagramm passt?`, teile, varianten:alle,
        bild:legende(teile,false),
        gruppen:[{optionen:alle.map(x=>[x.id, `<span class="wahlnr">${x.id}</span>${kreisSVG(teile,{grad:x.grad, winkel:false, legende:false})}`]), ans:alle.find(x=>x.richtig).id, klasse:'kreise'}],
        why:`Richtig ist ${alle.find(x=>x.richtig).id}: ${rechnungen(teile)}. ${alle.filter(x=>!x.richtig).map(x=>`${x.id}: ${x.warum}`).join(' ')}`}, ctx));
    });
  },
  // V2-A06 Kreisdiagramm zeichnen (Papier, Selbstkontrolle)
  zeichnen_kreis(ctx){
    const {titel, teile}=daten(rnd(2,5), {min:5}), r=pick([3,4,5]);
    return aufg({kind:'zeichnen', text:true, zeug:'Du brauchst Papier, Zirkel, Geodreieck und Buntstifte.', teile,
      q:`Zeichne das Kreisdiagramm (Radius ${r}${NB}cm), färbe und beschrifte die Abschnitte! ${titel}: ${liste(teile)}`,
      lead:ctx&&ctx.leicht?`Rechne zuerst: ${rechnungen(teile)}`:undefined,
      loesungBild:kreisSVG(teile),
      pruefliste:[`Kreis mit Radius ${r}${NB}cm und Mittelpunkt`, `Winkel (± 2°): ${teile.map(([n,p])=>`${n} ${G_(p*3.6)}`).join(' · ')}`, 'alle Abschnitte beschriftet'],
      why:`${rechnungen(teile)}. Wenn es nicht passt: Rechne p · 3,6 und miss vom letzten Schenkel weiter.`});
  },
  // V2-A02 (Plus) Grad in Prozent
  grad_proz(){
    const p=rnd(1,99), w=rund(p*3.6);
    return aufg({kind:'zahlen', q:`Ein Abschnitt im Kreisdiagramm hat ${G_(w)}.`, lead:'Wie viel Prozent gehören zum Winkel?', felder:[{label:'Prozent', ans:p, ansText:P(p), einheit:'%'}],
      why:`Winkel : 3,6: ${G_(w)} : 3,6 = ${P(p)}.`});
  },
  // V2-A07 (Plus) Kinder im Kreisdiagramm
  kinder(){
    const g=pick([360,200]), ps=teilung(3,{min:10,schritt:5}), namen=['Bus','zu Fuß','Rad'];
    const felder=namen.flatMap((n,i)=>[{label:`${n}: Kinder`, ans:g*ps[i]/100, ansText:`${n}: ${Z(g*ps[i]/100)} Kinder`}, {label:`${n}: Winkel`, ans:rund(ps[i]*3.6), ansText:G_(ps[i]*3.6), einheit:'°'}]);
    return aufg({kind:'zahlen', text:true, q:`Von ${g} Kindern fahren ${P(ps[0])} mit dem Bus, ${P(ps[1])} gehen zu Fuß, ${P(ps[2])} fahren mit dem Rad. Wie viele Kinder sind das, und wie groß sind die Winkel?`,
      felder, why:`Kinder: ${g} · p : 100. Winkel: p · 3,6.${g===360?' Bei 360 Kindern ist der Winkel gleich der Kinderzahl.':''}`});
  },
  // V2-A08 (Plus) Zusammensetzung des Menschen
  mensch(){
    return versuche(()=>{
      const m=rnd(40,90), teile=[['Wasser',60],['Eiweiß',20],['Fett',14],['andere Stoffe',6]];
      const felder=teile.map(([n,p])=>({label:n, ans:rund(m*p/100), ansText:`${n}: ${Z(rund(m*p/100))} kg`, einheit:'kg'}));
      return aufg({kind:'zahlen', text:true, q:`Ein Mensch wiegt ${m} kg. Davon sind ${liste(teile)}. Berechne die Massen!`, felder,
        why:`W = G · p : 100: ${teile.map(([n,p])=>`${m} · ${p} : 100 = ${Z(rund(m*p/100))} kg`).join(' · ')}. Zusammen ${m} kg.`});
    });
  },
  // V2-N01 (Plus) Streifen oder Kreis?
  streifen_kreis(){
    const [s,a,w]=pick(WAHL);
    return aufg({kind:'fragen', q:`${s}: Welche Darstellung passt besser?`, gruppen:[{optionen:[['Kreisdiagramm','Kreisdiagramm'],['Prozentstreifen','Prozentstreifen']], ans:a, klasse:'lang'}], why:w});
  }
};

/* ---------- Stationen (nur Kern-Typen) ---------- */
const stationen = [
  {id:'S1', name:'Prozent in Grad', hint:'45 % → 45 · 3,6 = 162°', types:['grad']},
  {id:'S2', name:'Winkel für alle Abschnitte', hint:'zusammen immer 360°', types:['winkel_alle']},
  {id:'S3', name:'Kreisdiagramme lesen und wählen', hint:'36° = 10 %', types:['ablesen_kreis','kreis_waehlen']},
  {id:'S4', name:'Kreisdiagramm zeichnen', hint:'zeichnen, vergleichen, selbst kontrollieren', types:['zeichnen_kreis']}
];
const kern = ['grad','winkel_alle','ablesen_kreis','kreis_waehlen','zeichnen_kreis'];
const leicht = ['winkel_alle','ablesen_kreis','kreis_waehlen','zeichnen_kreis'];   // Merkkarte bzw. Winkel vorgerechnet
const plus = ['grad_proz','kinder','mensch','streifen_kreis'];
const plusHint = 'Grad in Prozent · Kinder im Kreisdiagramm · Zusammensetzung des Menschen · Streifen oder Kreis?';

/* ---------- Erklärung ---------- */
const erklaerung = {
  beispiele: ()=>({b:{titel:'Körper', teile:[['Muskeln',45],['Knochen',15],['Fett',15],['Anderes',25]]}}),
  neu(kind,E){ if(kind==='kreis') E.b=daten(rnd(3,4)); },
  html: E => `<section class="sheet"><h2>Das Kreisdiagramm</h2>
    <div class="rule"><h3>1. Warum 3,6°?</h3>${MERK}</div>
    <div class="rule"><h3>2. Prozent in Grad</h3><p>${E.b.titel}: ${liste(E.b.teile)}</p>
      <div class="ex">${rechnungen(E.b.teile)}</div><div class="bild">${kreisSVG(E.b.teile)}</div>
      <p>Kontrolle: ${kontrolle(E.b.teile)}</p><button class="newex" data-newex="kreis">Neues Beispiel</button></div>
    <div class="rule"><h3>3. Ablesen</h3><p>Winkel : 3,6 = Prozent. Der größte Winkel ist der größte Anteil.</p></div>
    <div class="rule"><h3>4. Kreis oder Streifen?</h3><p>Wenige Teile eines Ganzen: Kreisdiagramm. Viele Teile, genau vergleichen oder schnell mit dem Lineal: Prozentstreifen.</p></div>
    <div class="rule"><h3>5. Selbst zeichnen</h3><p>Zeichne mit Zirkel und Geodreieck, tippe „Fertig gezeichnet“ und vergleiche mit dem Lösungsbild. Dann sagst du selbst, ob es richtig ist.</p></div>
    <p class="small muted">Das steht auch in deinem Mathe Know How Prozentrechnung.</p>
    <div class="row"><button class="big" data-go="comp">Weiter</button></div></section>`
};

const lzk = {merkmal:{grad:'grad', winkel_alle:'winkel_alle', ablesen_kreis:'ablesen_kreis', kreis_waehlen:'kreis_waehlen', zeichnen_kreis:'zeichnen'}};
UR.kompetenzAnmelden({id:'M-Proz-V2', typen, stationen, kern, leicht, plus, plusHint, erklaerung, lzk});
})(window.UR = window.UR || {});
</script>
<script>
/* Mathe/2.3 Prozentrechnung/M-Proz-X1.js */
/* Baustein M-Proz-X1: Promillerechnung.
   Steckbrief: M-Proz-X1.md, Auswahl der Lehrkraft: AUSWAHL.md (20.11.2026, X1-A06 weggelassen, kein Plus-Paket).
   Rechnen wie bei G3 mit der Schlussrechnung (Dreisatz/Formel), nur mit 1 000 statt 100. */
(function(UR){
const {rnd, pick} = UR;
const {Z, P, NB, br, mischen, versuche, rund, nachkomma, aufg, merk, G, Pz, W, srOk, srBild, schlussAufgabe} = UR.prozent;

const PM = x => `${Z(x)}${NB}‰`;
const mitE = (x,e) => `${Z(x)}${NB}${e}`;
const BEGRIFFE = {G:'Grundwert G', p:'Promillesatz p', W:'Promillewert W'};
const MERK = merk(`Prozent = je 100 · Promille = je 1${NB}000 · 1${NB}‰ = 0,1${NB}% · 10${NB}‰ = 1${NB}%`);
const sr = o => Object.assign({basis:1000, zeichen:'‰', begriffe:BEGRIFFE}, o);

/* ---------- X1-A01: Fragen zu Promille (Pool) ---------- */
const FRAGEN = [
  ['Promille (‰) bedeutet …', ['je 1 000','je 100','je 10','je 10 000']],
  ['1 ‰ ist wie viel Prozent?', ['0,1 %','1 %','10 %','0,01 %']],
  ['10 ‰ sind wie viel Prozent?', ['1 %','10 %','0,1 %','100 %']],
  ['1 % sind wie viel Promille?', ['10 ‰','1 ‰','0,1 ‰','100 ‰']],
  ['Wo gibt man Anteile oft in Promille an?', ['beim Blutalkohol','bei der Schuhgröße','bei der Uhrzeit','bei der Temperatur']],
  ['0,5 ‰ Blutalkohol bedeutet: In 1 000 ml Blut sind …', ['0,5 ml Alkohol','5 ml Alkohol','50 ml Alkohol','0,05 ml Alkohol']],
  ['Wofür verwendet man Promille statt Prozent?', ['für sehr kleine Anteile','für sehr große Anteile','nur für Geldbeträge','nur für Längen']],
  ['1 000 ‰ sind …', ['das Ganze (100 %)','10 %','1 %','1 000 %']],
  ['Die Geburtenrate einer Stadt ist 9 ‰. Das heißt: …', ['9 Geburten je 1 000 Einwohner*innen','9 Geburten je 100 Einwohner*innen','9 Geburten je 10 Einwohner*innen','9 Geburten je 10 000 Einwohner*innen']],
  ['Meerwasser enthält etwa 35 ‰ Salz. Das sind …', ['35 g Salz in 1 kg Meerwasser','35 g Salz in 100 g Meerwasser','3,5 g Salz in 1 kg Meerwasser','35 kg Salz in 100 kg Meerwasser']],
  ['Welches Zeichen steht für Promille?', ['‰','%','°','#']],
  ['Eine Straße hat 50 ‰ Steigung. Auf 1 000 m Strecke steigt sie um …', ['50 m','5 m','500 m','0,5 m']]
].map(([f,o])=>[f.replace(/ (‰|%|ml|m|g|kg)\b/g, NB+'$1').replace(/(\d) (\d{3})/g,'$1'+NB+'$2'), o.map(x=>x.replace(/ (‰|%|ml|m|g|kg)/g, NB+'$1').replace(/(\d) (\d{3})/g,'$1'+NB+'$2'))]);

/* ---------- X1-A05 und X1-N01: Sachtexte ---------- */
// Grundwert gesucht: W und p gegeben (ganze G)
const GRUND = [
  {e:'kg', p:[30,32,35,38,40], g:[20,400,10], s:(w,p)=>`Meerwasser enthält ${p} Salz. In einem Becken sind ${w} Salz gelöst. Wie viel kg Meerwasser sind im Becken?`},
  {e:'Autos', p:[8,12,15,20,25], g:[1000,20000,500], s:(w,p)=>`${p} aller Autos in einer Stadt sind rot, das sind ${w}. Wie viele Autos gibt es in der Stadt?`},
  {e:'ml', p:[0.2,0.4,0.5,0.6,0.8,1.2], g:[4000,7000,500], s:(w,p)=>`Bei ${p} Blutalkohol sind ${w} Alkohol im Blut. Wie viel ml Blut hat dieser Mensch?`},
  {e:'Geburten', p:[8,9,10,11,12], g:[1000,20000,500], s:(w,p)=>`In einer Gemeinde gab es ${w} in einem Jahr, das sind ${p} der Einwohner*innen. Wie viele Einwohner*innen hat die Gemeinde?`},
  {e:'Teile', p:[2,4,5,8,12,15], g:[1000,50000,500], s:(w,p)=>`In einer Fabrik sind ${w} fehlerhaft, das sind ${p} aller Teile. Wie viele Teile wurden produziert?`},
  {e:'m', p:[20,40,50,60,80,120], g:[200,3000,50], s:(w,p)=>`Eine Straße steigt um ${w}, die Steigung ist ${p}. Wie lang ist die Straße?`},
  {e:'g', p:[333,585,750], g:[2,40,2], s:(w,p)=>`Ein Schmuckstück enthält ${p} Gold, das sind ${w}. Wie schwer ist das ganze Schmuckstück?`}
];
// Promillewert gesucht (Alltag, nur Ergebnis): G und p gegeben
const ALLTAG = [
  {e:'Kinder', p:[8,9,10,11,12], g:[1000,30000,500], nk:0, s:(g,p)=>`Die Geburtenrate einer Gemeinde ist ${p}. Die Gemeinde hat ${g} Einwohner*innen. Wie viele Kinder werden in einem Jahr geboren?`},
  {e:'m', p:[20,40,50,60,80,120], g:[100,2000,50], nk:1, s:(g,p)=>`Eine Straße hat ${p} Steigung. Wie viele Meter Höhenunterschied sind es auf ${g} Strecke?`},
  {e:'m', km:true, p:[8,10,12,15,20,25], g:[1,9,1], nk:1, s:(g,p)=>`Eine Straße mit ${p} Gefälle ist ${g} lang. Wie viele Meter Höhenunterschied hat sie? (1${NB}km = 1${NB}000${NB}m)`},
  {e:'g', p:[30,32,35,38,40], g:[200,5000,100], nk:1, s:(g,p)=>`Meerwasser enthält ${p} Salz. Wie viel g Salz sind in ${g} Meerwasser?`},
  {e:'ml', p:[0.3,0.4,0.5,0.6,0.8,1.2], g:[4000,7000,500], nk:2, s:(g,p)=>`Der Blutalkohol beträgt ${p}. Wie viel ml Alkohol sind in ${g} Blut?`},
  {e:'Schrauben', p:[2,3,4,5,8], g:[1000,50000,500], nk:0, s:(g,p)=>`Eine Fabrik stellt ${g} her. ${p} davon sind fehlerhaft. Wie viele Schrauben sind das?`},
  {e:'g', p:[333,585,750], g:[2,40,2], nk:2, s:(g,p)=>`Ein Ring wiegt ${g} und enthält ${p} Gold. Wie viel g Gold sind das?`},
  {e:'Mitglieder', p:[5,8,10,12,15], g:[400,6000,200], nk:0, s:(g,p)=>`Ein Verein hat ${g}. ${p} davon sind Ehrenmitglieder. Wie viele Ehrenmitglieder sind das?`}
];
const grundAufgabe = () => versuche(()=>{
  const v=pick(GRUND), [a,b,s]=v.g, g=rnd(a/s,b/s)*s, p=pick(v.p), w=rund(g*p/1000);
  if(nachkomma(w)>2||nachkomma(rund(w/p))>4) return null;
  const x=sr({gesucht:'G', G:g, p, W:w, einheit:v.e}); if(!srOk(x)) return null;
  return {x, q:v.s(mitE(w,v.e), PM(p))};
});

/* ---------- Aufgabentypen ---------- */
const typen = {
  // X1-A01 Was heißt Promille?
  begriff(){
    const [f,o]=pick(FRAGEN);
    return aufg({kind:'fragen', q:f, gruppen:[{optionen:mischen(o).map(x=>[x,x]), ans:o[0], klasse:o.some(x=>x.length>14)?'lang':''}],
      why:`Promille heißt „je 1${NB}000“: 1${NB}‰ = ${br(1,'1 000')} = 0,1${NB}%. Man nimmt Promille für sehr kleine Anteile (Blutalkohol, Steigung, Salzgehalt, Geburtenrate).`});
  },
  // X1-A02 Promille, Prozent, Dezimalzahl
  umrechnen(){
    return versuche(()=>{
      const pm = Math.random()<.5 ? rnd(1,99) : Math.random()<.5 ? rnd(1,99)/10 : rnd(1,99)/100, pr=rund(pm/10), d=rund(pm/1000);
      if(nachkomma(d)>5) return null;
      if(Math.random()<.6) return aufg({kind:'zahlen', q:`${PM(pm)} in Prozent und als Dezimalzahl`, lead:'Stelle als Prozent und als Dezimalzahl dar!',
        felder:[{label:'in Prozent', ans:pr, ansText:P(pr), einheit:'%', exakt:true},{label:'als Dezimalzahl', ans:d, ansText:Z(d), exakt:true}],
        why:`‰ : 10 = %: ${PM(pm)} = ${P(pr)}. ‰ : 1${NB}000 = Dezimalzahl: ${PM(pm)} = ${Z(d)}.`});
      return aufg({kind:'zahlen', q:`${P(pr)} in Promille und als Dezimalzahl`, lead:'Stelle als Promille und als Dezimalzahl dar!',
        felder:[{label:'in Promille', ans:pm, ansText:PM(pm), einheit:'‰', exakt:true},{label:'als Dezimalzahl', ans:d, ansText:Z(d), exakt:true}],
        why:`% · 10 = ‰: ${P(pr)} = ${PM(pm)}. % : 100 = Dezimalzahl: ${P(pr)} = ${Z(d)}.`});
    });
  },
  // X1-A03 Promillewert (Blutalkohol)
  promillewert(){
    return versuche(()=>{
      const l=pick([4,4.5,5,5.5,6,6.5,7]), g=l*1000, p=pick([rnd(3,12)/10, rnd(30,120)/100]), w=rund(g*p/1000);
      if(nachkomma(w)>2) return null;
      const x=sr({gesucht:'W', G:g, p, W:w, einheit:'ml'}); if(!srOk(x)) return null;
      return schlussAufgabe(x, {text:true, q:`Ein Mensch hat ${Z(l)} Liter Blut, das sind ${mitE(g,'ml')}. Der Blutalkohol beträgt ${PM(p)}. Wie viel ml Alkohol sind im Blut?`,
        lead:'Berechne den Promillewert!'});
    });
  },
  // X1-A04 Anteil in Promille (Kontrollen, Fabrik)
  anteil(){
    return versuche(()=>{
      const g=rnd(5,50)*100, p=pick([rnd(1,80), rnd(5,300)/10]), w=rund(g*p/1000);
      if(!Number.isInteger(w)||w<1) return null;
      const fab=Math.random()<.4;
      const x=sr({gesucht:'p', G:g, p, W:w, einheit:fab?'Teile':'Personen', eins:fab?`1${NB}Teil`:`1${NB}Person`}); if(!srOk(x)) return null;
      const q = fab ? `Eine Maschine stellt ${Z(g)} Teile her. ${Z(w)} davon sind fehlerhaft. Wie viel Promille sind das?`
        : `Bei einer Verkehrskontrolle werden ${Z(g)} Autofahrer*innen überprüft. ${Z(w)} davon haben zu viel Alkohol im Blut. Wie viel Promille sind das?`;
      return schlussAufgabe(x, {text:true, q, lead:'Berechne den Anteil in Promille!'});
    });
  },
  // X1-A05 Grundwert aus Promille
  grundwert(){ const {x,q}=grundAufgabe(); return schlussAufgabe(x, {text:true, q, lead:'Wie groß ist das Ganze?'}); },
  // X1-N01 Promille im Alltag (nur Ergebnis)
  alltag(){
    return versuche(()=>{
      const v=pick(ALLTAG), [a,b,s]=v.g, gz=rnd(a/s,b/s)*s, g=v.km?gz*1000:gz, p=pick(v.p), w=rund(g*p/1000);
      if(nachkomma(w)>v.nk||w<=0) return null;
      const x=sr({gesucht:'W', G:g, p, W:w, einheit:v.e}); if(!srOk(x)) return null;
      return aufg({kind:'zahlen', text:true, q:v.s(mitE(gz, v.km?'km':v.e), PM(p)), sr:x, felder:[{label:'Ergebnis', ans:w, ansText:mitE(w,v.e), einheit:v.e}],
        why:`${W('W')} = ${br(`${G('G')} · ${Pz('p')}`, `1${NB}000`)} = ${br(`${Z(g)} · ${Z(p)}`, `1${NB}000`)} = ${mitE(w,v.e)}${v.km?` (${Z(gz)}${NB}km = ${Z(g)}${NB}m)`:''}.`,
        loesungBild:srBild(x)});
    });
  }
};

/* ---------- Stationen (nur Kern-Typen) ---------- */
const stationen = [
  {id:'S1', name:'Was ist Promille?', hint:'‰ heißt je 1 000', types:['begriff']},
  {id:'S2', name:'Promille, Prozent, Dezimalzahl', hint:'5 ‰ = 0,5 % = 0,005', types:['umrechnen']},
  {id:'S3', name:'Promillewert und Anteil', hint:'1 ‰ von 6 000 ml = 6 ml', types:['promillewert','anteil']},
  {id:'S4', name:'Grundwert und Alltag', hint:'35 ‰ sind 2,1 kg → 1 000 ‰ sind 60 kg', types:['grundwert','alltag']}
];
const kern = ['begriff','umrechnen','promillewert','anteil','grundwert','alltag'];
const leicht = [];

/* ---------- Erklärung ---------- */
const bspW = () => { const t=typen.promillewert(); return t.sr; };
const bspG = () => grundAufgabe().x;
const erklaerung = {
  beispiele: ()=>({W:bspW(), G:bspG()}),
  neu(kind,E){ if(kind==='W') E.W=bspW(); if(kind==='G') E.G=bspG(); },
  html: E => `<section class="sheet"><h2>Promillerechnung</h2>
    <div class="rule"><h3>1. Promille heißt „je 1${NB}000“</h3>${MERK}
      <p>Beispiel Blutalkohol: 0,5${NB}‰ heißt 0,5${NB}ml Alkohol in 1${NB}000${NB}ml Blut. Promille nimmt man für sehr kleine Anteile.</p></div>
    <div class="rule"><h3>2. Umrechnen</h3><p>‰ : 10 = %, zum Beispiel 5${NB}‰ = 0,5${NB}%.<br>‰ : 1${NB}000 = Dezimalzahl, zum Beispiel 5${NB}‰ = 0,005.</p></div>
    <div class="rule"><h3>3. Rechnen wie bei Prozent, nur mit 1${NB}000</h3>
      <p>Das Ganze sind 1${NB}000${NB}‰. Pfeil ①: durch 1${NB}000, so kommst du auf 1${NB}‰. Pfeil ②: mal ${Z(E.W.p)}. Tippe ①, ② und ③!</p>
      ${srBild(E.W,true)}<button class="newex" data-newex="W">Neues Beispiel</button></div>
    <div class="rule"><h3>4. Das Ganze gesucht</h3><p>Pfeil ①: durch ${Z(E.G.p)}, so kommst du auf 1${NB}‰. Pfeil ②: mal 1${NB}000.</p>
      ${srBild(E.G,true)}<button class="newex" data-newex="G">Neues Beispiel</button></div>
    <p>Beim Üben kannst du oben zwischen <b>Dreisatz</b> und <b>Formel</b> umschalten. Beides zählt gleich.</p>
    <div class="row"><button class="big" data-go="comp">Weiter</button></div></section>`
};

const lzk = {merkmal:{begriff:'begriff_promille', umrechnen:'umrechnen_promille', promillewert:'promillewert', anteil:'promillesatz', grundwert:'grundwert_promille', alltag:'promille_alltag'}};
UR.kompetenzAnmelden({id:'M-Proz-X1', typen, stationen, kern, leicht, erklaerung, lzk, festeAuswahl:['begriff']});
})(window.UR = window.UR || {});
</script>
<script>
/* Mathe/2.3 Prozentrechnung/M-Proz-X2.js */
/* Baustein M-Proz-X2: Zinsrechnung.
   Steckbrief: M-Proz-X2.md, Auswahl der Lehrkraft: AUSWAHL.md (20.11.2026). Zinsrechnung = Prozentrechnung mit anderen
   Wörtern (Kapital K, Zinssatz p, Zinsen Z); Jahreszinsen mit der Schlussrechnung (Dreisatz/Formel), Monate (: 12) und
   Tage (1 Jahr = 360 Tage), Endkapital immer mit Zinseszins (Taschenrechner, ± 1 Cent). X2-N01 ist in X2-A05 aufgegangen. */
(function(UR){
const {rnd, pick} = UR;
const {Z, E, P, NB, br, mischen, versuche, rund, nachkomma, aufg, merk, G, Pz, W, srOk, srBild, schlussAufgabe} = UR.prozent;

const NAMEN = {G:'K', p:'p', W:'Z'}, BEGRIFFE = {G:'Kapital K', p:'Zinssatz p', W:'Zinsen Z'};
const MERK = merk(`${G('Kapital K')} = Grundwert · ${Pz('Zinssatz p')} = Prozentsatz · ${W('Zinsen Z')} = Prozentwert · 1 Jahr = 12 Monate = 360 Tage`);
const sr = o => Object.assign({basis:100, zeichen:'%', einheit:'€', namen:NAMEN, begriffe:BEGRIFFE, eins:`1${NB}€`}, o);
const ZF = merk(`${W('Z')} = ${br(`${G('K')} · ${Pz('p')}`, '100')} (für 1 Jahr)`);

// Kapital und Zinssatz mit Jahreszinsen auf Cent
const jahr = () => versuche(()=>{
  const k=pick([rnd(10,160)*50, rnd(5,80)*100]), p=rnd(5,30)/10, z=rund(k*p/100);
  return nachkomma(z)<=2&&z!==100&&k!==100 ? {k,p,z} : null;
});
// Schritt 1 im Einstieg: Jahreszinsen aus drei Vorschlägen
const vorschlaege = z => mischen([z, rund(z*10), rund(z/10)].map(x=>[String(x), E(x)]));

/* ---------- Aufgabentypen ---------- */
const typen = {
  // X2-A01 Begriffe der Zinsrechnung
  begriffe(){
    const dinge=[['K','Kapital K'],['p','Zinssatz p'],['Z','Zinsen Z'],['t','Zeit t']].map(([id,text])=>({id, html:text, kurz:text}));
    const ziele=[{id:'G',text:'Grundwert G'},{id:'P',text:'Prozentsatz p'},{id:'W',text:'Prozentwert W'},{id:'X',text:'kein Gegenstück (Teil des Jahres)'}];
    return aufg({kind:'zuordnen', q:'Ordne die Begriffe der Zinsrechnung den Begriffen der Prozentrechnung zu!', dinge:mischen(dinge), ziele:mischen(ziele),
      ans:{K:'G', p:'P', Z:'W', t:'X'}, why:`Zinsrechnung ist Prozentrechnung mit anderen Wörtern. ${MERK}`});
  },
  // X2-A02 Jahreszinsen (Schlussrechnung mit K, p, Z)
  jahreszinsen(){
    const {k,p,z}=jahr(), x=sr({gesucht:'W', G:k, p, W:z});
    return schlussAufgabe(x, {text:true, q:`${E(k)} werden 1 Jahr lang zu ${P(p)} angelegt. Wie hoch sind die Zinsen?`, lead:'Berechne die Jahreszinsen!'});
  },
  // X2-A03 Zinsen für Monate
  monate(){
    return versuche(()=>{
      const {k,p,z}=jahr(), t=rnd(1,11), zm=rund(z*t/12); if(nachkomma(zm)>2) return null;
      return aufg({kind:'zweischritt', text:true, q:`${E(k)} werden ${t} ${t===1?'Monat':'Monate'} lang zu ${P(p)} angelegt. Wie hoch sind die Zinsen?`,
        lead:'Berechne zuerst die Zinsen für 1 Jahr, dann für die Monate!', schritt:'Schritt 1',
        s1:{label:'Schritt 1: Zinsen für 1 Jahr', kurz:'Zinsen für 1 Jahr', felder:[{label:'', ans:z, ansText:E(z), einheit:'€'}], ansText:E(z)},
        s2:{label:`Schritt 2: Zinsen für ${t} ${t===1?'Monat':'Monate'}`, felder:[{label:'', ans:zm, ansText:E(zm), einheit:'€'}], ansText:E(zm)},
        pre:{ans:String(z), optionen:vorschlaege(z)},
        why:`Erst ein Jahr: ${Z(k)} · ${Z(p)} : 100 = ${E(z)}. Dann der Teil des Jahres (1 Jahr = 12 Monate): ${E(z)} · ${t} : 12 = ${E(zm)}.`});
    });
  },
  // X2-A04 Zinsen für Tage (1 Jahr = 360 Tage)
  tage(){
    return versuche(()=>{
      const {k,p,z}=jahr(), t=rnd(3,33)*10, zt=rund(z*t/360); if(nachkomma(zt)>2) return null;
      return aufg({kind:'zweischritt', text:true, q:`${E(k)} werden ${t} Tage lang zu ${P(p)} angelegt. Wie hoch sind die Zinsen? (1 Jahr = 360 Tage)`,
        lead:'Berechne zuerst die Zinsen für 1 Jahr, dann für die Tage!', schritt:'Schritt 1',
        s1:{label:'Schritt 1: Zinsen für 1 Jahr', kurz:'Zinsen für 1 Jahr', felder:[{label:'', ans:z, ansText:E(z), einheit:'€'}], ansText:E(z)},
        s2:{label:`Schritt 2: Zinsen für ${t} Tage`, felder:[{label:'', ans:zt, ansText:E(zt), einheit:'€'}], ansText:E(zt)},
        pre:{ans:String(z), optionen:vorschlaege(z)},
        why:`Erst ein Jahr: ${Z(k)} · ${Z(p)} : 100 = ${E(z)}. Dann der Teil des Jahres (1 Jahr = 360 Tage, 1 Monat = 30 Tage): ${E(z)} · ${t} : 360 = ${E(zt)}.`});
    });
  },
  // X2-A05 Endkapital mit Zinseszins (Taschenrechner, ± 1 Cent)
  zinseszins(){
    return versuche(()=>{
    const k=pick([rnd(10,200)*50, rnd(5,100)*100]), p=rnd(5,40)/10, n=rnd(2,10), af=rund(1+p/100), genau=k*Math.pow(af,n)*100;
    if(Math.abs(genau%1-.5)<.01) return null;   // nicht knapp an einem halben Cent (Rundung eindeutig)
    const end=Math.round(genau)/100, einfach=rund(k+n*k*p/100);
    const opt=mischen([[String(af),Z(af)],[String(rund(p/100)),Z(rund(p/100))],[String(rund(1+p/10)),Z(rund(1+p/10))]]);
    return aufg({kind:'zweischritt', text:true, q:`${E(k)} werden ${n} Jahre lang zu einem fixen Zinssatz von ${P(p)} angelegt. Die Zinsen werden jedes Jahr dazugezählt (Zinseszins). Wie groß ist das Endkapital?`,
      lead:'Du brauchst einen Taschenrechner.', schritt:'Schritt 1',
      s1:{label:'Schritt 1: Änderungsfaktor', kurz:'Änderungsfaktor', felder:[{label:'', ans:af, ansText:Z(af), exakt:true}], ansText:Z(af)},
      s2:{label:'Schritt 2: Endkapital (auf Cent)', felder:[{label:'', ans:end, stellen:2, ansText:E(end), einheit:'€'}], ansText:E(end)},
      pre:{ans:String(af), optionen:opt}, einfach,
      hinweisNach:(e1,e2)=>e2[0].v!==null&&Math.abs(e2[0].v-einfach)<0.006 ? `Das sind einfache Zinsen (${E(einfach)}). Beim Zinseszins werden die Zinsen jedes Jahr mitverzinst: ${Z(k)} · ${Z(af)}<sup>${n}</sup>.` : '',
      why:`Änderungsfaktor = 1 + ${br(Z(p),'100')} = ${Z(af)}. Jedes Jahr wird mit ${Z(af)} multipliziert: ${Z(k)} · ${Z(af)}<sup>${n}</sup> = ${E(end)}. Zum Vergleich ohne Zinseszins: ${E(einfach)}.`});
    });
  },
  // X2-A06 (Plus) Kapital oder Zinssatz gesucht
  kapital_zinssatz(){
    const {k,p,z}=jahr();
    if(Math.random()<.5) return schlussAufgabe(sr({gesucht:'G', G:k, p, W:z}), {text:true, q:`Für 1 Jahr gibt es ${E(z)} Zinsen bei einem Zinssatz von ${P(p)}. Wie groß ist das Kapital?`, lead:'Berechne das Kapital K!'});
    return schlussAufgabe(sr({gesucht:'p', G:k, p, W:z}), {text:true, q:`${E(k)} bringen in 1 Jahr ${E(z)} Zinsen. Wie hoch ist der Zinssatz?`, lead:'Berechne den Zinssatz p!'});
  },
  // X2-A07 (Plus) Welche Bank zahlt mehr Zinsen?
  bankvergleich(){
    return versuche(()=>{
      const k=pick([rnd(4,80)*100, rnd(10,100)*50]);
      const bank = () => { const art=pick(['j','m','t']), p=rnd(5,30)/10, t=art==='j'?1:art==='m'?rnd(2,18):rnd(3,30)*10;
        const z=rund(k*p/100*(art==='j'?1:art==='m'?t/12:t/360));
        return {p, art, t, z, text:`${P(p)} Zinsen pro Jahr, das Geld liegt ${art==='j'?'1 Jahr':art==='m'?`${t} Monate`:`${t} Tage`}`}; };
      const a=bank(), b=bank(); if(!(nachkomma(a.z)<=2&&nachkomma(b.z)<=2)||Math.abs(a.z-b.z)<1) return null;
      return aufg({kind:'fragen', text:true, q:`Du legst ${E(k)} an. Bank A: ${a.text}. Bank B: ${b.text}. Welche Bank zahlt mehr Zinsen? (1 Jahr = 12 Monate = 360 Tage)`,
        gruppen:[{optionen:[['A','Bank A'],['B','Bank B']], ans:a.z>b.z?'A':'B'}], why:`Bank A: ${E(a.z)} · Bank B: ${E(b.z)}.`});
    });
  }
};

/* ---------- Stationen (nur Kern-Typen) ---------- */
const stationen = [
  {id:'S1', name:'Begriffe der Zinsrechnung', hint:'Kapital = Grundwert', types:['begriffe']},
  {id:'S2', name:'Zinsen für ein Jahr', hint:'3 750 € zu 0,8 % → 30 €', types:['jahreszinsen']},
  {id:'S3', name:'Zinsen für Monate und Tage', hint:'30 € · 8 : 12 = 20 €', types:['monate','tage']},
  {id:'S4', name:'Endkapital mit Zinseszins', hint:'2 000 · 1,02³ = 2 122,42 €', types:['zinseszins']}
];
const kern = ['begriffe','jahreszinsen','monate','tage','zinseszins'];
const plus = ['kapital_zinssatz','bankvergleich'];
const plusHint = 'Kapital oder Zinssatz gesucht · Welche Bank zahlt mehr?';

/* ---------- Erklärung ---------- */
const bspJ = () => { const {k,p,z}=jahr(); return sr({gesucht:'W', G:k, p, W:z}); };
const zze = () => { const k=pick([1000,2000,3000,5000]), p=pick([1,1.5,2,2.5,3]), af=rund(1+p/100);
  const jahre=[k]; for(let i=1;i<=3;i++) jahre.push(Math.round(jahre[i-1]*af*100)/100); return {k,p,af,jahre, einfach:rund(k+3*k*p/100)}; };
const erklaerung = {
  beispiele: ()=>({J:bspJ(), Z:zze()}),
  neu(kind,E){ if(kind==='J') E.J=bspJ(); if(kind==='Z') E.Z=zze(); },
  html: E => `<section class="sheet"><h2>Zinsrechnung</h2>
    <div class="rule"><h3>1. Zinsrechnung ist Prozentrechnung</h3>${MERK}</div>
    <div class="rule"><h3>2. Zinsen für ein Jahr</h3>${ZF}<p>Tippe ①, ② und ③!</p>${srBild(E.J,true)}<button class="newex" data-newex="J">Neues Beispiel</button></div>
    <div class="rule"><h3>3. Zinsen für einen Teil des Jahres</h3><p>Erst die Zinsen für 1 Jahr, dann den Teil des Jahres (1 Jahr = 12 Monate = 360 Tage, 1 Monat = 30 Tage):</p>
      <div class="ex">für Monate: ${W('Z')} · ${br('Monate',12)}</div><div class="ex">für Tage: ${W('Z')} · ${br('Tage',360)}</div></div>
    <div class="rule"><h3>4. Zinseszins</h3><p>Bleibt das Geld liegen, werden die Zinsen dazugezählt und im nächsten Jahr mitverzinst. Jedes Jahr wird mit dem
      Änderungsfaktor 1 + ${br('p',100)} multipliziert.</p>
      <div class="ex">${E.Z.jahre.map(E_).join(' → ')}</div>
      <p>Kurz mit dem Taschenrechner: ${Z(E.Z.k)} · ${Z(E.Z.af)}<sup>3</sup> = ${E_(E.Z.jahre[3])}. Ohne Zinseszins wären es nur ${E_(E.Z.einfach)}.</p>
      <button class="newex" data-newex="Z">Neues Beispiel</button></div>
    <p>Beim Üben kannst du bei den Jahreszinsen oben zwischen <b>Dreisatz</b> und <b>Formel</b> umschalten. Beides zählt gleich.</p>
    <div class="row"><button class="big" data-go="comp">Weiter</button></div></section>`
};
const E_ = E;

const lzk = {merkmal:{begriffe:'begriffe_zins', jahreszinsen:'jahreszinsen', monate:'zinsen_teil', tage:'zinsen_teil', zinseszins:'zinseszins'}};
UR.kompetenzAnmelden({id:'M-Proz-X2', typen, stationen, kern, plus, plusHint, erklaerung, lzk, festeAuswahl:['begriffe']});
})(window.UR = window.UR || {});
</script>
<script>UR.start(document.getElementById('app'));</script>
