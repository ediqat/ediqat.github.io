// Zahlengerade mit zwei Werten und dem Abstand dazwischen (V3-N02)
function abstandSVG(lo, hi, e, mitAbstand){
  const span=hi-lo, step=[1,2,5,10,20,25,50,100,200,250,500,1000].find(x=>span/x<=8)||1000;
  const a=Math.floor(Math.min(lo,0)/step)*step-step, b=Math.ceil(Math.max(hi,0)/step)*step+step, W=340, L=22, R=W-22, Y=62, x=v=>L+(v-a)*(R-L)/(b-a);
  let s=`<line x1="${L-12}" x2="${R+12}" y1="${Y}" y2="${Y}" stroke="var(--text)" stroke-width="2" marker-start="url(#v3pz)" marker-end="url(#v3pz)"/>`;
  for(let v=a;v<=b;v+=step) s+=`<line x1="${x(v)}" x2="${x(v)}" y1="${Y-6}" y2="${Y+6}" stroke="var(--muted)"/><text x="${x(v)}" y="${Y+20}" font-size="11" text-anchor="middle" fill="var(--muted)"${v===0?' font-weight="800"':''}>${Z(v)}</text>`;
  const kreuz=(v,f)=>`<path d="M${x(v)-6} ${Y-6}l12 12M${x(v)+6} ${Y-6}l-12 12" stroke="${f}" stroke-width="3" stroke-linecap="round"/>`;
  const txt=(v,f,yy)=>{ const c=Math.min(W-40,Math.max(40,x(v))); return `<text x="${c}" y="${yy}" font-size="13" font-weight="700" text-anchor="middle" fill="${f}">${mit(v,e)}</text>`; };
  const nah=Math.abs(x(hi)-x(lo))<80;
  s+=kreuz(lo,'var(--c1)')+kreuz(hi,'var(--cop)')+txt(lo,'var(--c1)',Y+40)+txt(hi,'var(--cop)',nah?Y+58:Y+40);
  if(mitAbstand) s+=`<path d="M${x(lo)} ${Y-12}v-10H${x(hi)}v10" fill="none" stroke="var(--c2)" stroke-width="2"/><text x="${(x(lo)+x(hi))/2}" y="${Y-30}" font-size="13" font-weight="700" text-anchor="middle" fill="var(--c2)">Abstand ${mit(hi-lo,e)}</text>`;
  return `<svg class="v3-bild" viewBox="0 ${mitAbstand?0:34} ${W} ${Y+(nah?66:50)-(mitAbstand?0:34)}" role="img" aria-label="Zahlengerade mit ${mit(lo,e)} und ${mit(hi,e)}">
    <defs><marker id="v3pz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--text)"/></marker></defs>${s}</svg>`;
}
const bildBox = h => `<div class="bild">${h}</div>`;

/* ---------- Aufgabe mit zwei Schritten: Rechnung wählen, Ergebnis eintippen ---------- */
// o.rechnungen = [{h: HTML, w: Wert}] (die erste ist richtig), o.feld, o.weg (Rechenweg), o.satz (Antwortsatz)
function sach(o){
  const r=o.rechnungen;
  if(new Set(r.map(x=>ohneTags(x.h))).size!==r.length) return null;
  if(r.slice(1).some(x=>Math.abs(x.w-r[0].w)<1e-9)) return null;
  const t={kind:'zweischritt', text:true, q:ohneTags(o.qh), qh:o.qh, lead:o.lead||'', schritt:'Schritt 1', bild:o.bild, art:o.art, daten:o.daten,
    s1:{label:'Schritt 1: Welche Rechnung passt?', kurz:'Rechnung', wahl:mischen(r.map((x,i)=>[String(i), x.h])), ans:'0', ansText:ohneTags(r[0].h), ansHTML:r[0].h},
    s2:{label:o.s2label||'Schritt 2: Rechne aus! Gib auch die Einheit an.', felder:[o.feld], ansText:o.feld.ansText, ansHTML:o.feld.ansHTML},
    hinweisNach:(e1,e2)=>einheitHinweis(e2),
    why:`${o.why} <span class="nw">${o.weg}.</span> ${o.satz}`, weg:o.weg, satz:o.satz, bildVoll:o.bildVoll, legendeVoll:o.legende||'',
    papierLead:o.lead||undefined};
  if(o.bildVoll) t.zusatzRueckmeldung = f => f.ok ? '' : bildBox(o.bildVoll)+(o.legende||'');
  return wahlSchritt1(t);
}

/* ---------- V3-A01 Schulden und Raten ---------- */
function schulden(art){
  return versuche(()=>{
    const [wer,pr]=pick(PERS), Pr=gross(pr), e=x=>mit(x,'€');
    const S=rnd(30,150)*10, r=rnd(4,20)*5, n=rnd(2,12);
    if(art==='rest'){ const rest=S-n*r; if(rest<20) return null;
      return sach({art, daten:{S,r,n}, qh:`${wer} hat ${e(S)} Schulden. ${Pr} zahlt ${n} Monate lang jeden Monat ${e(r)} zurück. Wie hoch sind die restlichen Schulden?`,
        rechnungen:[{h:`(${M}${Z(S)}) + ${n} · ${Z(r)}`, w:-rest}, {h:`(${M}${Z(S)}) ${M} ${n} · ${Z(r)}`, w:-S-n*r}, {h:`(${M}${Z(S)}) + ${n} + ${Z(r)}`, w:-S+n+r}],
        feld:ergFeld('Restliche Schulden', rest, '€', {auch:[-rest]}),
        why:`Schulden sind negativ: ${M}${e(S)}. Jede Rückzahlung verringert die Schulden, also kommt ${n} · ${e(r)} dazu (Punkt vor Strich).`,
        weg:`(${M}${Z(S)}) + ${n} · ${Z(r)} = (${M}${Z(S)}) + ${Z(n*r)} = ${M}${Z(rest)}`, satz:`Es bleiben ${e(rest)} Schulden.`});
    }
    if(art==='rate'){ const rate=rnd(4,20)*5, S2=rate*n; if(S2<300||S2>1500) return null;
      return sach({art, daten:{S:S2,n}, qh:`${wer} hat ${e(S2)} Schulden und zahlt sie in ${n} gleich hohen Monatsraten zurück. Wie hoch ist eine Rate?`,
        rechnungen:[{h:`(${M}${Z(S2)}) : ${n}`, w:-rate}, {h:`(${M}${Z(S2)}) · ${n}`, w:-S2*n}, {h:`(${M}${Z(S2)}) ${M} ${n}`, w:-S2-n}],
        feld:ergFeld('Eine Rate', rate, '€', {auch:[-rate]}),
        why:`Schulden sind negativ: ${M}${e(S2)}. Die Schulden werden auf ${n} gleiche Raten aufgeteilt, also geteilt durch ${n}.`,
        weg:`(${M}${Z(S2)}) : ${n} = ${M}${Z(rate)}`, satz:`Eine Rate beträgt ${e(rate)}.`});
    }
    if(art==='restRate'){ const m=rnd(2,10), rest=S-n*r; if(rest<40||rest%m) return null; const rate=rest/m; if(rate<10) return null;
      return sach({art, daten:{S,r,n,m}, qh:`${wer} hat ${e(S)} Schulden. ${Pr} zahlt ${n} Monate lang jeden Monat ${e(r)} zurück. Den Rest will ${pr} in ${m} gleich hohen Raten zahlen. Wie hoch ist eine dieser Raten?`,
        rechnungen:[{h:`[(${M}${Z(S)}) + ${n} · ${Z(r)}] : ${m}`, w:-rate}, {h:`(${M}${Z(S)}) + ${n} · ${Z(r)} : ${m}`, w:-S+n*r/m}, {h:`[(${M}${Z(S)}) ${M} ${n} · ${Z(r)}] : ${m}`, w:(-S-n*r)/m}],
        feld:ergFeld('Eine Rate', rate, '€', {auch:[-rate]}),
        why:`Schulden sind negativ: ${M}${e(S)}. Zuerst die restlichen Schulden berechnen (Klammer), dann durch ${m} teilen.`,
        weg:`[(${M}${Z(S)}) + ${n} · ${Z(r)}] : ${m} = [(${M}${Z(S)}) + ${Z(n*r)}] : ${m} = (${M}${Z(rest)}) : ${m} = ${M}${Z(rate)}`, satz:`Eine Rate beträgt ${e(rate)}.`});
    }
    // Kontostand im Minus, mehrmals eingezahlt
    const K=rnd(5,90)*10, res=-K+n*r; if(res===0) return null;
    return sach({art:'konto', daten:{K,r,n}, qh:`Das Konto von ${wer} steht bei ${M}${e(K)}. ${Pr} zahlt ${n}-mal je ${e(r)} ein. Wie hoch ist der Kontostand danach?`,
      rechnungen:[{h:`(${M}${Z(K)}) + ${n} · ${Z(r)}`, w:res}, {h:`(${M}${Z(K)}) ${M} ${n} · ${Z(r)}`, w:-K-n*r}, {h:`${Z(K)} + ${n} · ${Z(r)}`, w:K+n*r}],
      feld:ergFeld('Kontostand', res, '€'),
      why:`Ein Konto im Minus ist negativ: ${M}${e(K)}. Einzahlen ist positiv: + ${n} · ${e(r)}.`,
      weg:`(${M}${Z(K)}) + ${n} · ${Z(r)} = (${M}${Z(K)}) + ${Z(n*r)} = ${Z(res)}`, satz:`Der Kontostand beträgt ${e(res)}.`});
  });
}

/* ---------- V3-A02 Temperatur steigt und fällt (Zehntel als ganze Zahlen) ---------- */
function temperatur(art, ctx){
  const hilfe=!!(ctx&&ctx.einstieg);
  return versuche(()=>{
    const z=x=>x/10, T0=rnd(-150,100), d1=rnd(5,150), d2=rnd(5,150);
    if(T0===0||(T0%10===0&&d1%10===0)) return null;
    const start={w:z(T0), text:`Start: ${C(z(T0))}`, farbe:'var(--c1)'};
    if(art==='steigt'||art==='faellt'){ const s=art==='steigt'?1:-1, res=T0+s*d1;
      const op=s>0?'+':M, gegen=s>0?M:'+';
      const qh = art==='steigt'
        ? `Am Morgen zeigt das Thermometer ${C(z(T0))}. Bis zum Mittag steigt die Temperatur um ${C(z(d1))}. Wie warm ist es zu Mittag?`
        : `Am Abend zeigt das Thermometer ${C(z(T0))}. Bis Mitternacht fällt die Temperatur um ${C(z(d1))}. Welche Temperatur hat es um Mitternacht?`;
      return sach({art, daten:{T0,d1}, qh, bild:hilfe?thermoSVG([start]):undefined,
        rechnungen:[{h:`${kl(z(T0))} ${op} ${Z(z(d1))}`, w:z(res)}, {h:`${kl(z(T0))} ${gegen} ${Z(z(d1))}`, w:z(T0-s*d1)}, {h:`${kl(z(-T0))} ${op} ${Z(z(d1))}`, w:z(-T0+s*d1)}],
        feld:ergFeld(art==='steigt'?'Temperatur zu Mittag':'Temperatur um Mitternacht', z(res), '°C'),
        why:`Start bei ${C(z(T0))}. ${s>0?`Die Temperatur steigt: ${chip('+')}.`:`Die Temperatur fällt: ${chip(M)}.`}`,
        weg:`${kl(z(T0))} ${op} ${Z(z(d1))} = ${Z(z(res))}`, satz:`Es hat ${C(z(res))}.`,
        bildVoll:thermoSVG([start, {w:z(res), text:`Ziel: ${C(z(res))}`, farbe:'var(--text)'}], [{a:z(T0), b:z(res)}]),
        legende:legende([`${s>0?'steigt':'fällt'} um ${C(z(d1))}`])});
    }
    if(art==='beides'){ const mitte=T0+d1, res=mitte-d2; if(res===mitte||Math.abs(res)>250) return null;
      return sach({art, daten:{T0,d1,d2}, qh:`Am Morgen zeigt das Thermometer ${C(z(T0))}. Bis zum Mittag steigt die Temperatur um ${C(z(d1))}, bis zum Abend fällt sie um ${C(z(d2))}. Welche Temperatur hat es am Abend?`,
        bild:hilfe?thermoSVG([start]):undefined,
        rechnungen:[{h:`${kl(z(T0))} + ${Z(z(d1))} ${M} ${Z(z(d2))}`, w:z(res)}, {h:`${kl(z(T0))} ${M} ${Z(z(d1))} + ${Z(z(d2))}`, w:z(T0-d1+d2)}, {h:`${kl(z(T0))} + ${Z(z(d1))} + ${Z(z(d2))}`, w:z(T0+d1+d2)}],
        feld:ergFeld('Temperatur am Abend', z(res), '°C'),
        why:`Start bei ${C(z(T0))}. Steigen ist ${chip('+')}, fallen ist ${chip(M)}. Von links nach rechts rechnen.`,
        weg:`${kl(z(T0))} + ${Z(z(d1))} ${M} ${Z(z(d2))} = ${Z(z(mitte))} ${M} ${Z(z(d2))} = ${Z(z(res))}`, satz:`Am Abend hat es ${C(z(res))}.`,
        bildVoll:thermoSVG([start, {w:z(mitte), text:`Mittag: ${C(z(mitte))}`, farbe:'var(--c2)'}, {w:z(res), text:`Ziel: ${C(z(res))}`, farbe:'var(--text)'}], [{a:z(T0), b:z(mitte)}, {a:z(mitte), b:z(res)}]),
        legende:legende([`steigt um ${C(z(d1))}`, `fällt um ${C(z(d2))}`])});
    }
    // Unterschied: um wie viel ist es kälter geworden? (größer − kleiner)
    const T1=rnd(-80,80), T2=rnd(-200,-5); if(T2>=T1||T1===0||(T1%10===0&&T2%10===0)) return null; const res=T1-T2;
    const m1={w:z(T1), text:`Abend: ${C(z(T1))}`, farbe:'var(--c1)'}, m2={w:z(T2), text:`Mitternacht: ${C(z(T2))}`, farbe:'var(--text)'};
    return sach({art:'unterschied', daten:{T1,T2}, qh:`Am Abend hat es ${C(z(T1))}. Um Mitternacht zeigt das Thermometer ${C(z(T2))}. Um wie viel Grad ist die Temperatur gefallen?`,
      bild:hilfe?thermoSVG([m1,m2]):undefined,
      rechnungen:[{h:`${kl(z(T1))} ${M} ${kl(z(T2))}`, w:z(res)}, {h:`${kl(z(T1))} + ${kl(z(T2))}`, w:z(T1+T2)}, {h:`${kl(z(T2))} ${M} ${kl(z(T1))}`, w:z(T2-T1)}],
      feld:ergFeld('Die Temperatur ist gefallen um', z(res), '°C'),
      why:`Unterschied = höhere Temperatur ${M} tiefere Temperatur.`,
      weg:`${kl(z(T1))} ${M} ${kl(z(T2))} = ${kl(z(T1))} + ${Z(z(-T2))} = ${Z(z(res))}`, satz:`Die Temperatur ist um ${C(z(res))} gefallen.`,
      bildVoll:thermoSVG([m1,m2], [{a:z(T1), b:z(T2)}]), legende:legende([`fällt um ${C(z(res))}`])});
  });
}

/* ---------- V3-A03 Aufzug und Stockwerke (keine Einheit) ---------- */
const imStock = n => n>0 ? `im ${n}. Stock` : n<0 ? `im ${-n}. Untergeschoss` : 'im Erdgeschoss';
const vomStock = n => n>0 ? `vom ${n}. Stock` : n<0 ? `vom ${-n}. Untergeschoss` : 'vom Erdgeschoss';
const inStock = n => n>0 ? `in den ${n}. Stock` : n<0 ? `ins ${-n}. Untergeschoss` : 'ins Erdgeschoss';
const zahlWort = ['','ein','zwei','drei'];
const gebaeude = (u,og) => `Ein Bürogebäude hat ein Erdgeschoss, ${og} Stockwerke darüber und ${zahlWort[u]} Untergeschoss${u>1?'e':''}.`;
const fahrt = m => `${Math.abs(m)} ${Math.abs(m)===1?'Stockwerk':'Stockwerke'} ${m>0?'hinauf':'hinunter'}`;
function aufzug(art, ctx){
  const hilfe=!!(ctx&&ctx.einstieg);
  return versuche(()=>{
    const u=rnd(1,3), og=rnd(5,12);
    if(art==='ende'){
      const k=rnd(2,4), s=rnd(-u,og), wege=[], pos=[s];
      for(let i=0;i<k;i++){ const m=pick([1,-1])*rnd(1,7), p=pos[pos.length-1]+m; if(p<-u||p>og) return null; wege.push(m); pos.push(p); }
      const ende=pos[pos.length-1]; if(ende===s||Math.min(...pos)>=0) return null;
      const term=(st,ms)=>[kl(st), ...ms.map(m=>`${m>0?'+':M} ${Math.abs(m)}`)].join(' ');
      const i=rnd(0,k-1), j=s!==0?-1:(i+1+rnd(0,k-2))%k;
      const f1=wege.map((m,x)=>x===i?-m:m), f2=j<0?wege:wege.map((m,x)=>x===j?-m:m), st2=j<0?-s:s;
      const summe=(st,ms)=>ms.reduce((a,m)=>a+m,st);
      return sach({art, daten:{u,og,s,wege}, qh:`${gebaeude(u,og)} Der Aufzug steht ${imStock(s)}. Er fährt ${wege.map(fahrt).join(', dann ')}. In welchem Stockwerk steht er jetzt?`,
        bild:gebaeudeSVG(u,og,{start:s}), s2label:'Schritt 2: Rechne aus! (Erdgeschoss = 0, Untergeschosse negativ)',
        rechnungen:[{h:term(s,wege), w:ende}, {h:term(s,f1), w:summe(s,f1)}, {h:term(st2,f2), w:summe(st2,f2)}],
        feld:zahlFeld('Stockwerk', ende),
        why:`Erdgeschoss = 0, Stockwerke darüber positiv, Untergeschosse negativ. Start ${imStock(s)}: ${kl(s)}. Hinauf ist ${chip('+')}, hinunter ist ${chip(M)}.`,
        weg:`${term(s,wege)} = ${Z(ende)}`, satz:`Der Aufzug steht ${imStock(ende)}.`,
        bildVoll:gebaeudeSVG(u,og,{start:s, ziel:ende, wege:wege.map((m,x)=>({a:pos[x], b:pos[x+1]}))}),
        legende:legende(wege.map(m=>`${m>0?'+':M}${Math.abs(m)}`))});
    }
    // Wie viele Stockwerke fährt der Aufzug von a nach b? (größer − kleiner)
    const unten=-rnd(1,u), oben=rnd(1,og), hinab=Math.random()<.5, a=hinab?oben:unten, b=hinab?unten:oben, res=oben-unten;
    return sach({art:'etagen', daten:{u,og,a,b}, qh:`${gebaeude(u,og)} Wie viele Stockwerke fährt der Aufzug ${vomStock(a)} ${inStock(b)}?`,
      bild:gebaeudeSVG(u,og,hilfe?{start:a, ziel:b}:{start:a}), s2label:'Schritt 2: Rechne aus!',
      rechnungen:[{h:`${Z(oben)} ${M} (${M}${-unten})`, w:res}, {h:`${Z(oben)} ${M} ${-unten}`, w:oben+unten}, {h:`(${M}${-unten}) ${M} ${Z(oben)}`, w:unten-oben}],
      feld:zahlFeld('Anzahl der Stockwerke', res),
      why:`Untergeschosse sind negativ: ${imStock(unten).replace('im ','das ')} ist ${M}${-unten}. Anzahl der Stockwerke = oberes Stockwerk ${M} unteres Stockwerk.`,
      weg:`${Z(oben)} ${M} (${M}${-unten}) = ${Z(oben)} + ${-unten} = ${Z(res)}`, satz:`Der Aufzug fährt ${res} Stockwerke.`,
      bildVoll:gebaeudeSVG(u,og,{start:a, ziel:b, wege:[{a,b}]}), legende:legende([`${b>a?'+':M}${res}`])});
  });
}

/* ---------- V3-A05 Bruchteil und Absenken (Pegel), Rechnen in mm (ganzzahlig, exakt) ---------- */
const BRUCHTEILE = [[1,2,'um die Hälfte'],[1,4,'um ein Viertel'],[1,5,'um ein Fünftel'],[3,4,'um drei Viertel']];
const mm = x => Z(x/1000), mmM = x => mit(x/1000,'m');
const cmT = x => mit(x/10,'cm');
// kaufmännisch auf k Nachkommastellen in Metern (k = 1, 2), gerechnet in mm
const rmm = (x,k) => { const f=10**(3-k); return Math.sign(x)*Math.floor(Math.abs(x)/f+0.5)*f; };
const mitRund = l => [...new Set(l.flatMap(x=>[x, rmm(x,1), rmm(x,2)]))];
function pegel(ctx){
  const einzeln=!!(ctx&&ctx.leicht);
  return versuche(()=>{
    const P=rnd(40,300)*10, [b0,b1,bw]=pick(BRUCHTEILE), lage=pick(['see','see','fluss','becken','schnee']);
    if((P*b0)%b1) return null;
    const Zu=P*b0/b1, r1=lage==='schnee'?1:pick([1,-1]), r2=-r1, Cm=rnd(10,160)*5;   // Cm in mm (0,5 cm genau)
    const P2=P+r1*Zu, P3=P2+r2*Cm;
    if(P3<100||Cm>=P2||Zu<20) return null;
    if(Cm%10===0&&Math.random()<.5) return null;                                          // oft halbe Zentimeter
    const auf=r1>0, wort=auf?'steigt':'sinkt';
    const texte={
      see: auf ? `Der Pegelstand eines Sees liegt bei ${mmM(P)}. Nach starkem Regen steigt er ${bw} an. Danach sinkt das Wasser um ${cmT(Cm)}. Wie hoch ist der Pegelstand am Ende?`
        : `Der Pegelstand eines Sees liegt bei ${mmM(P)}. In einem heißen Sommer sinkt er ${bw}. Nach einem Gewitter steigt das Wasser wieder um ${cmT(Cm)}. Wie hoch ist der Pegelstand am Ende?`,
      fluss: auf ? `Ein Fluss ist ${mmM(P)} tief. Nach der Schneeschmelze steigt der Wasserstand ${bw}. Danach sinkt er um ${cmT(Cm)}. Wie tief ist der Fluss am Ende?`
        : `Ein Fluss ist ${mmM(P)} tief. In einer trockenen Woche sinkt der Wasserstand ${bw}. Danach steigt er um ${cmT(Cm)}. Wie tief ist der Fluss am Ende?`,
      becken: auf ? `In einem Schwimmbecken steht das Wasser ${mmM(P)} hoch. Beim Befüllen steigt es ${bw}. Danach werden ${cmT(Cm)} abgelassen. Wie hoch steht das Wasser am Ende?`
        : `In einem Schwimmbecken steht das Wasser ${mmM(P)} hoch. Beim Reinigen sinkt es ${bw}. Danach steigt es beim Befüllen um ${cmT(Cm)}. Wie hoch steht das Wasser am Ende?`,
      schnee: `Auf dem Dach einer Hütte liegt ${mmM(P)} Schnee. Über Nacht wird die Schneedecke ${bw} höher. Am Tag schmelzen ${cmT(Cm)}. Wie hoch liegt der Schnee am Ende?`};
    const was={see:'der Pegelstand', fluss:'der Wasserstand', becken:'der Wasserstand', schnee:'die Schneedecke'}[lage];
    const c1=mitRund([Zu]), c2=c1.map(z=>P+r1*z), c3=mitRund(c2).map(y=>y+r2*Cm);
    const auch=(l,soll)=>[...new Set(l)].filter(x=>x!==soll).map(x=>x/1000);
    const h = erg => einheitHinweis(erg, 'm oder cm');
    const bruch = `${mm(P)}${NB}m · ${br(b0,b1)}`;
    const schritte=[
      {label:`Um wie viel ${wort} ${was} zuerst? (${gross(bw.replace(/^um /,''))} vom Anfangswert)`, felder:[ergFeld('', Zu/1000, 'm')], ansText:`${mm(Zu)} m`, ansHTML:`${bruch} = ${mmM(Zu)}`,
        hinweis:erg=>h(erg)||`Rechne ${bw.replace(/^um /,'')} vom Anfangswert: ${bruch}.`},
      {label:`Wie hoch ist ${was} danach?`, felder:[ergFeld('', P2/1000, 'm', {auch:auch(c2,P2)})], ansText:`${mm(P2)} m`, ansHTML:`${mm(P)} ${auf?'+':M} ${mm(Zu)} = ${mmM(P2)}`,
        hinweis:erg=>h(erg)||`${auf?'Steigen':'Sinken'} ist ${auf?'+':M}: Anfangswert ${auf?'+':M} ${auf?'Zunahme':'Abnahme'}.`},
      {label:`Wie hoch ist ${was} am Ende?`, felder:[ergFeld('', P3/1000, 'm', {auch:auch(c3,P3)})], ansText:`${mm(P3)} m`, ansHTML:`${mm(P2)} ${r2>0?'+':M} ${mm(Cm)} = ${mmM(P3)}`,
        hinweis:erg=>h(erg)||`Rechne zuerst um: ${cmT(Cm)} = ${mmM(Cm)}.`}];
    const t={kind:'mehrschritt', text:true, q:ohneTags(texte[lage]), qh:texte[lage], lead:'Rechne Schritt für Schritt! Gib bei jedem Schritt auch die Einheit an.',
      papierLead:'Rechne Schritt für Schritt!', schritte, einzeln, art:lage, daten:{P,b0,b1,r1,Cm},
      why:`${gross(was)} ${wort} zuerst ${bw}: ${bruch} = ${mmM(Zu)}. Dann ${mm(P)} ${auf?'+':M} ${mm(Zu)} = ${mmM(P2)}. Einheiten umrechnen: ${cmT(Cm)} = ${mmM(Cm)} (100 cm = 1 m). Am Ende ${mm(P2)} ${r2>0?'+':M} ${mm(Cm)} = ${mmM(P3)}.`,
      stepsh:`${bruch} = ${mmM(Zu)}<br>${mm(P)} ${auf?'+':M} ${mm(Zu)} = ${mmM(P2)}<br>${cmT(Cm)} = ${mmM(Cm)}<br>${mm(P2)} ${r2>0?'+':M} ${mm(Cm)} = ${mmM(P3)}`};
    // Rückmeldung: Hinweis zum ersten falschen Schritt (die Form setzt t.hinweis)
    t.zusatzRueckmeldung = f => !f.ok&&t.hinweis ? `<div class="fb no pop"><span>${t.hinweis}</span></div>` : '';
    return t;
  });
}

/* ---------- V3-N02 Wie weit ist es zwischen …? ---------- */
function abstand(ctx){
  const leicht=!!(ctx&&ctx.leicht);
  return versuche(()=>{
    const art=pick(['temp','kuehl','tauchen','konto','fehlt','kalt']), dez=Math.random()<.35;
    let lo, hi, e, qh, frage;
    const z=x=>x/10;
    if(art==='temp'){ lo=dez?z(rnd(-200,-10)):-rnd(1,20); hi=dez?z(rnd(-40,150)):rnd(-4,15); e='°C';
      qh=`Am Montag war die höchste Temperatur ${C(hi)}, die tiefste ${C(lo)}. Wie groß ist der Unterschied zwischen den beiden Temperaturen?`; frage='Unterschied'; }
    else if(art==='kuehl'){ hi=rnd(2,8); lo=-rnd(15,26); e='°C';
      qh=`Im Kühlschrank hat es ${C(hi)}, im Tiefkühlfach ${C(lo)}. Um wie viel Grad ist es im Tiefkühlfach kälter?`; frage='Unterschied'; }
    else if(art==='kalt'){ lo=dez?z(-rnd(60,200)):-rnd(6,20); hi=dez?z(-rnd(5,50)):-rnd(1,5); e='°C';
      qh=`Um 6 Uhr hatte es ${C(lo)}, um 10 Uhr ${C(hi)}. Um wie viel Grad ist es wärmer geworden?`; frage='Unterschied'; }
    else if(art==='tauchen'){ lo=-rnd(3,40); hi=rnd(3,80)*(Math.random()<.3?5:1); e='m';
      qh=`Eine Taucherin ist in einer Tiefe von ${mit(lo,'m')}. Direkt über ihr fliegt eine Möwe in ${mit(hi,'m')} Höhe. Wie weit sind die beiden voneinander entfernt?`; frage='Entfernung'; }
    else if(art==='konto'){ lo=-rnd(4,100)*5; hi=(Math.random()<.6?1:-1)*rnd(1,100)*5; e='€';
      qh=`Am Monatsanfang stand das Konto bei ${mit(lo,'€')}, am Monatsende bei ${mit(hi,'€')}. Um wie viel Euro ist der Kontostand gestiegen?`; frage='Der Kontostand ist gestiegen um'; }
    else { lo=-rnd(4,100)*5; hi=rnd(1,60)*5; e='€';
      qh=`Das Konto steht bei ${mit(lo,'€')}. Wie viel Geld muss eingezahlt werden, damit der Kontostand ${mit(hi,'€')} beträgt?`; frage='Einzahlung'; }
    if(hi<=lo||lo>=0||(art!=='kalt'&&hi===0)) return null;
    const d=Math.round((hi-lo)*10)/10;
    const MERK='Abstand = größerer Wert − kleinerer Wert.';
    return {kind:'zahlen', text:true, art, lo, hi, einheit:e, q:ohneTags(qh), qh, lead:leicht?merk(MERK):'', bild:leicht?abstandSVG(lo,hi,e,false):undefined,
      felder:[ergFeld(frage, d, e)], papierLead:'Berechne!',
      zusatzRueckmeldung: f => f.ok ? '' : bildBox(abstandSVG(lo,hi,e,true)),
      why:`${MERK} <span class="nw">${Z(hi)} ${M} ${kl(lo)} = ${Z(hi)} + ${Z(-lo)} = ${mit(d,e)}.</span>`, stepsh:`${Z(hi)} ${M} ${kl(lo)} = ${mit(d,e)}`};
  });
}

/* ---------- Plus: V3-A04 Mittelwert negativer Zahlen ---------- */
function mittelwert(){
  return versuche(()=>{
    const n=pick([3,3,4]), art=pick(['salz','tage','see']), l=Array.from({length:n},()=>art==='salz'?rnd(-160,-90):art==='see'?rnd(-20,45):rnd(-160,30));
    if(l.filter(x=>x<0).length<2||new Set(l).size<n||l.some(x=>x===0)||l.every(x=>x%10===0)) return null;
    const S=l.reduce((a,x)=>a+x,0), ganz=(S*100)%n===0 ? null : 2;     // S in Zehnteln; bricht S/n nicht ab: auf Hundertstel
    if(S===0) return null;
    const mw=S/(n*10), sw=S/10;
    const liste=l.map(x=>C(x/10)), auf=liste.slice(0,-1).join(', ')+' und '+liste[liste.length-1];
    const qh = art==='salz' ? `Der Gefrierpunkt einer Salz-Eis-Mischung wurde in ${n===3?'drei':'vier'} Versuchen gemessen: ${auf}. Berechne den Mittelwert!`
      : art==='tage' ? `Die Tiefsttemperaturen an ${n===3?'drei':'vier'} Wintertagen waren ${auf}. Wie hoch war die Tiefsttemperatur im Durchschnitt?`
      : `Auf einem Berggipfel wurde an ${n===3?'drei':'vier'} Tagen um 7 Uhr die Temperatur gemessen: ${auf}. Berechne den Mittelwert!`;
    const flip=l.findIndex(x=>x<0), S1=S-2*l[flip], S2=-l.reduce((a,x)=>a+Math.abs(x),0);
    const opt=[S, S1, S2===S?-S:S2].map(x=>x/10);
    if(new Set(opt).size<3) return null;
    const optionen=mischen(opt.map((x,i)=>[String(i), C(x)]));
    const s2label = ganz ? 'Schritt 2: Mittelwert, auf Hundertstel gerundet' : 'Schritt 2: Mittelwert';
    const sollMw = ganz ? UR.runde(mw,2) : mw;
    const t={kind:'zweischritt', text:true, q:ohneTags(qh), qh, lead:'Berechne zuerst die Summe, dann den Mittelwert! Gib auch die Einheit an.', schritt:'Schritt 1', werte:l, rund:ganz,
      s1:{label:'Schritt 1: Summe aller Werte', kurz:'Summe', felder:[ergFeld('', sw, '°C')], ansText:`${Z(sw)} °C`, ansHTML:C(sw)},
      s2:{label:s2label, felder:[ergFeld('', mw, '°C', {stellen:ganz||undefined, text:ganz?Z(sollMw):undefined})], ansText:`${Z(sollMw)} °C`, ansHTML:C(sollMw)},
      pre:{ans:'0', optionen},
      hinweisNach:(e1,e2)=>einheitHinweis([...(e1||[]),...e2]),
      why:`Mittelwert = Summe : Anzahl. Summe: <span class="nw">${l.map((x,i)=>i?(x<0?`${M} ${Z(-x/10)}`:`+ ${Z(x/10)}`):Z(x/10)).join(' ')} = ${C(sw)}.</span> Mittelwert: <span class="nw">${kl(sw)} : ${n} = ${ganz?`${Z(UR.runde(mw,3))}… ≈ ${Z(sollMw)}`:Z(mw)}${NB}°C.</span>`};
    return t;
  });
}

/* ---------- Plus: V3-A06 Kontostand mit mehreren Buchungen (Cent, ganzzahlig) ---------- */
function konto(){
  return versuche(()=>{
    const art=pick(['abheben','gemischt','cent']);
    let G, buch, qh;
    const liste=l=>l.slice(0,-1).join(', ')+' und '+l[l.length-1];
    if(art==='abheben'){ G=rnd(150,500)*1000; buch=Array.from({length:rnd(3,4)},()=>-rnd(5,150)*1000);
      qh=`Auf einem Konto sind ${E(G)}. Es werden ${liste(buch.map(x=>E(-x)))} abgehoben. Wie hoch ist der Kontostand danach?`; }
    else if(art==='cent'){ G=rnd(80000,300000); const n=rnd(3,9), x=rnd(2,10)*1000, y=rnd(30000,200000); buch=[...Array(n).fill(-x), -y];
      qh=`Auf einem Konto sind ${E(G)}. Es werden ${n}-mal je ${E(x)} abgehoben, dann wird eine Rechnung über ${E(y)} abgebucht. Wie hoch ist der Kontostand danach?`; }
    else { G=(Math.random()<.4?-1:1)*rnd(10,200)*500; const posten=mischen([['Gehalt',rnd(1200,2600)*100],['Miete',-rnd(400,900)*100],['Strom',-rnd(3000,12000)],['Einkauf',-rnd(2000,25000)]]).slice(0,3);
      buch=posten.map(p=>p[1]);
      qh=`Das Konto steht bei ${E(G)}. Dann wird gebucht: ${liste(posten.map(([w,b])=>`${w} ${b<0?M:'+'}${E(Math.abs(b))}`))}. Wie hoch ist der Kontostand danach?`; }
    const S=buch.reduce((a,x)=>a+x,0), neu=G+S; if(neu===0) return null;
    const eu=c=>c/100;
    return {kind:'mehrschritt', text:true, q:ohneTags(qh), qh, art, start:G, buchungen:buch, lead:'Rechne Schritt für Schritt! Gib auch die Einheit an.',
      schritte:[{label:'Summe aller Buchungen (Abbuchungen negativ)', felder:[ergFeld('', eu(S), '€', {text:eurZ(S)})], ansText:`${eurZ(S)} €`, ansHTML:E(S), hinweis:erg=>einheitHinweis(erg,'€')||'Abbuchungen sind negativ, Einzahlungen positiv. Zähle alle Buchungen zusammen.'},
        {label:'Kontostand danach', felder:[ergFeld('', eu(neu), '€', {text:eurZ(neu)})], ansText:`${eurZ(neu)} €`, ansHTML:E(neu), hinweis:erg=>einheitHinweis(erg,'€')||'Kontostand am Anfang + Summe der Buchungen.'}],
      why:`Buchungen: <span class="nw">${buch.map((x,i)=>i?`${x<0?M:'+'} ${eurZ(Math.abs(x))}`:eurZ(x)).join(' ')} = ${E(S)}.</span> Kontostand: <span class="nw">${G<0?`(${eurZ(G)})`:eurZ(G)} ${S<0?M:'+'} ${eurZ(Math.abs(S))} = ${E(neu)}.</span>`};
  });
}

/* ---------- Plus: V3-A07 Jahresverdienst und Mittel (Gehalt), Cent ganzzahlig ---------- */
function gehalt(){
  return versuche(()=>{
    const [wer,pr]=pick(PERS.filter(p=>!/Familie/.test(p[0]))), art=pick(['netto','monat','miete','mittel']);
    let qh, ans, weg;
    if(art==='netto'){ const B=rnd(120,300)*1000, p=rnd(15,30), s=B*p/100; if(s%1) return null; ans=(B-s)*12;
      qh=`${wer} verdient im Monat ${E(B)} brutto. Davon gehen ${E(s)} für Steuern und Versicherung ab. Wie viel verdient ${pr} netto in einem Jahr (12 Monate)?`;
      weg=`(${eurZ(B)} ${M} ${eurZ(s)}) · 12 = ${eurZ(B-s)} · 12 = ${E(ans)}`; }
    else if(art==='monat'){ const m=rnd(120,300)*1000, n=rnd(3,8); ans=m;
      qh=`${wer} hat in ${n} Monaten insgesamt ${E(m*n)} verdient, jeden Monat gleich viel. Wie viel ist das im Monat?`;
      weg=`${eurZ(m*n)} : ${n} = ${E(m)}`; }
    else if(art==='miete'){ const m=rnd(300,950)*100+pick([0,0,50]), n=rnd(3,12); ans=m*n;
      qh=`Die Miete für eine Wohnung beträgt ${E(m)} im Monat. Wie viel Miete ist in ${n} Monaten zu zahlen?`;
      weg=`${eurZ(m)} · ${n} = ${E(ans)}`; }
    else { const l=[0,1,2].map(()=>rnd(1500,3200)*100+rnd(0,99)); const S=l.reduce((a,x)=>a+x,0); if(S%3) return null; ans=S/3;
      qh=`${wer} verdiente im Jänner ${E(l[0])}, im Februar ${E(l[1])} und im März ${E(l[2])}. Wie viel verdiente ${pr} im Durchschnitt pro Monat?`;
      weg=`(${l.map(eurZ).join(' + ')}) : 3 = ${eurZ(S)} : 3 = ${E(ans)}`; }
    return {kind:'zahlen', text:true, art, q:ohneTags(qh), qh, lead:'Gib auch die Einheit an!', felder:[ergFeld('Ergebnis', ans/100, '€', {text:eurZ(ans)})],
      why:`Gerechnet: <span class="nw">${weg}.</span>`};
  });
}

/* ---------- Plus: V3-N01 Passt die Rechnung zur Geschichte? ---------- */
const GESCH = {
  f1:{h:(a,b)=>`(${M}${a}) ${M} ${b}`, w:(a,b)=>-a-b, t:[(a,b)=>`Es hat ${M}${a} °C. Die Temperatur fällt um ${b} °C.`, (a,b)=>`Ein Taucher ist bei ${M}${a} m und taucht ${b} m tiefer.`]},
  f2:{h:(a,b)=>`(${M}${a}) + ${b}`, w:(a,b)=>-a+b, t:[(a,b)=>`Das Konto steht bei ${M}${a} €. Es werden ${b} € eingezahlt.`, (a,b)=>`Ein Taucher ist bei ${M}${a} m und steigt ${b} m auf.`, (a,b)=>`Es hat ${M}${a} °C. Die Temperatur steigt um ${b} °C.`]},
  f3:{h:(a,b)=>`${a} ${M} ${b}`, w:(a,b)=>a-b, t:[(a,b)=>`Auf dem Konto sind ${a} €. Es werden ${b} € abgehoben.`, (a,b)=>`Eine Möwe fliegt ${a} m über dem Meer und sinkt um ${b} m.`]},
  f4:{h:(a,b)=>`${b} ${M} (${M}${a})`, w:(a,b)=>b+a, t:[(a,b)=>`Am Morgen hat es ${M}${a} °C, zu Mittag ${b} °C. Um wie viel Grad ist es wärmer geworden?`, (a,b)=>`Das Konto stand bei ${M}${a} €, jetzt steht es bei ${b} €. Um wie viel Euro ist es gestiegen?`]},
  f5:{h:(a,b)=>`(${M}${a}) + (${M}${b})`, w:(a,b)=>-a-b, t:[(a,b)=>`Familie Huber hat ${a} € Schulden und macht noch ${b} € neue Schulden.`]}
};
function geschichte(){
  return versuche(()=>{
    const a=rnd(2,15), b=rnd(2,15); if(a===b) return null;
    const formen=mischen(Object.keys(GESCH)).slice(0,3);
    if(formen.includes('f1')&&formen.includes('f5')) return null;            // gleicher Wert, andere Schreibweise: zu verwirrend
    const paare=formen.map((f,i)=>({id:'r'+i, z:'g'+i, f, h:GESCH[f].h(a,b), w:GESCH[f].w(a,b), text:pick(GESCH[f].t)(a,b)}));
    const ans={}; paare.forEach(p=>ans[p.id]=p.z);
    return {kind:'zuordnen', q:'Welche Rechnung passt zu welcher Geschichte? Ordne zu!', qh:'Welche Rechnung passt zu welcher Geschichte? Ordne zu!', a, b, paare,
      dinge:mischen(paare.map(p=>({id:p.id, html:p.h, kurz:p.h}))), ziele:paare.map(p=>({id:p.z, text:p.text})), ans,
      why:paare.map(p=>`<span class="nw">${p.text}</span> → <span class="nw">${p.h} = ${Z(p.w)}.</span>`).join(' ')};
  });
}

/* Baustein M-Term-G1: „Ich kenne wichtige algebraische Begriffe und kann sie erklären.“
   Steckbrief: M-Term-G1.md, Auswahl der Lehrkraft: AUSWAHL.md (23.10.2026). Monom, Binom, Polynom nur im Plus-Paket. */
(function(UR){
const {M, rnd, pick, nz, R} = UR.mathe;
const {glied, summe, optionen, versuche, aufg, mischen, buchst} = UR.terme;

const ROLLEN = ['Variable','Konstante','Koeffizient'];
const derDie = r => r==='Koeffizient' ? 'der Koeffizient' : `die ${r}`;
const NAMEN = ['Lea','Tom','Mia','Jonas','Emil','Sara'];
const WARUM_ROLLE = 'Die Variable ist der Buchstabe (Platzhalter für einen veränderlichen Wert). Der Koeffizient ist die Zahl direkt vor der Variablen, das Vorzeichen gehört dazu. Die Konstante ist eine Zahl allein (fixer Wert).';

// Term k·v + c in zufälliger Reihenfolge; Koeffizient und Konstante verschieden, damit „Was ist 7?“ eindeutig ist
function termTeile(){
  return versuche(()=>{
    const v=pick(['a','b','m','n','p','s','t','x','y','z']), k=nz(-12,12), c=nz(-40,40);
    if(Math.abs(k)<2||Math.abs(k)===Math.abs(c)) return null;
    const kvorn=Math.random()<.65, g=[glied(k,{[v]:1}), glied(c)], text=summe(kvorn?g:[g[1],g[0]]);
    return {v,k,c,text,kvorn};
  });
}
const teilVon = (t,r) => r==='Variable' ? t.v : r==='Koeffizient' ? R(t.k) : R(t.c);
const FORMELN = ['A = a·b','u = 2a + 2b','V = a·b·c','A = a²','u = 4a','P = 9·n','s = v·t'];
const TERME = ['a·b','2a + 2b','a²','4·a','v·t','9·n'];
const SAETZE = [
  ['Die Zahl, die als Faktor direkt vor der Variablen steht, heißt …','Koeffizient'],
  ['Werden zwei Terme mit = verbunden, entsteht eine …','Gleichung'],
  ['Ein fixer Zahlenwert heißt …','Konstante'],
  ['Ein Platzhalter für einen veränderlichen Wert heißt …','Variable'],
  ['Ein Rechenausdruck ohne = heißt …','Term'],
  ['Ein Term mit genau einem Glied heißt …','Monom'],
  ['Ein Term mit genau zwei Gliedern heißt …','Binom'],
  ['Ein Term mit mehr als zwei Gliedern heißt …','Polynom'],
  ['Die Zahl vor der Variablen, mit der die Variable multipliziert wird, heißt …','Koeffizient'],
  ['Eine Zahl, die allein steht und sich nicht verändert, heißt …','Konstante'],
  ['Bei einer Taxifahrt ist die Grundgebühr, die immer gleich bleibt, die …','Konstante'],
  ['Ein Buchstabe, für den man verschiedene Zahlen einsetzen kann, heißt …','Variable'],
  ['Bei einer Taxifahrt sind die gefahrenen Kilometer, die sich ändern können, die …','Variable'],
  ['Zahlen, Variablen und Rechenzeichen ohne Gleichheitszeichen bilden einen …','Term'],
  ['Steht zwischen zwei Termen ein Gleichheitszeichen, so ist das eine …','Gleichung'],
  ['Eine Formel wie A = a·b ist eine …','Gleichung']
];
const WOERTER = [...new Set(SAETZE.map(s=>s[1]))];
// Lückensätze mit Zufallszahlen (Vielfalt, LEITFADEN „Antwortprüfung und Vielfalt“, 20.11.2026)
const SATZVORLAGEN = [
  (v,k,c) => [`Im Term ${glied(k,{[v]:1})} + ${c} heißt die Zahl ${R(k)} …`, 'Koeffizient'],
  (v,k,c) => [`Im Term ${glied(k,{[v]:1})} + ${c} heißt die Zahl ${c} …`, 'Konstante'],
  (v,k,c) => [`Im Term ${glied(k,{[v]:1})} + ${c} heißt der Buchstabe ${v} …`, 'Variable'],
  (v,k,c) => [`„${glied(k,{[v]:1})} + ${c} = ${c+k*rnd(2,9)}“ enthält ein Gleichheitszeichen, also ist es eine …`, 'Gleichung'],
  (v,k,c) => [`„${glied(k,{[v]:1})} + ${c}“ enthält kein Gleichheitszeichen, also ist es ein …`, 'Term']
];
// Monom, Binom und Polynom sind auch Terme: in Sätzen über „Term“ (und umgekehrt) nicht als falsche Wahl
const NOM = ['Monom','Binom','Polynom'];
const passtAuch = (wort, w) => (wort==='Term'&&NOM.includes(w)) || (NOM.includes(wort)&&w==='Term');
function lueckenSatz(){
  if(Math.random()<.5) return pick(SAETZE);
  const v=pick(['a','b','m','n','p','s','t','x','y','z']), k=rnd(2,12), c=versuche(()=>{ const z=rnd(1,40); return z!==k&&z; });
  return pick(SATZVORLAGEN)(v,k,c);
}

/* ---------- Aufgabentypen ---------- */
const typen = {
  // G1-A01 Term oder Gleichung?
  term_gleichung(){
    const t=termTeile(), art=pick(['term','term','gleichung','gleichung','formel','formelterm']);
    const q = art==='term' ? t.text
      : art==='gleichung' ? `${t.text} = ${pick([R(rnd(-60,60)), summe([glied(nz(-9,9),{[t.v]:1}), glied(nz(-30,30))])])}`
      : art==='formel' ? pick(FORMELN) : pick(TERME);
    const gl=q.includes('=');
    return aufg({kind:'twahl', q, lead:'Ist das ein Term oder eine Gleichung?', optionen:[['Term','Term'],['Gleichung','Gleichung']],
      ans:gl?'Gleichung':'Term', pruef:'term_gleichung',
      why:gl?'Eine Gleichung besteht aus zwei Termen, die mit = verbunden sind.':'Ein Term ist ein Rechenausdruck ohne =.'});
  },
  // G1-A02 Variable, Konstante oder Koeffizient?
  teile_einordnen(){
    const t=termTeile(), r=pick(ROLLEN), teil=teilVon(t,r);
    return aufg({kind:'twahl', q:t.text, teil, lead:`Was ist <b>${teil}</b> in diesem Term?`, optionen:ROLLEN.map(x=>[x,x]), ans:r, pruef:'rolle',
      why:WARUM_ROLLE, steps:`${t.text}: ${R(t.k)} ist der Koeffizient, ${t.v} die Variable, ${R(t.c)} die Konstante.`});
  },
  // G1-A03 Gleichung aus vorgegebenen Teilen bauen (viele richtige Lösungen; geprüft werden die Teile)
  gleichung_bauen(){
    return versuche(()=>{
      const [v1,v2]=buchst(2).sort(), k1=nz(-30,30), k2=nz(-30,30), c1=nz(-30,30), c2=nz(-30,30);
      if([k1,k2].some(k=>Math.abs(k)<2)||k1===k2||c1===c2) return null;
      const ans=`${summe([glied(k1,{[v1]:1}),glied(c1)])} = ${summe([glied(k2,{[v2]:1}),glied(c2)])}`;
      return aufg({kind:'term', modus:'gleichung', text:true,
        q:`Variablen ${v1} und ${v2} · Konstanten ${R(c1)} und ${R(c2)} · Koeffizienten ${R(k1)} und ${R(k2)}`,
        lead:'Bilde eine Gleichung, in der genau diese Teile vorkommen.', ans, loesung:`z. B. ${ans}`,
        teile:{vars:[v1,v2], konst:[c1,c2], koeff:[k1,k2]}, tasten:[v1,v2,'=','+',M], pruef:'gleichung',
        why:'Jeder Koeffizient steht direkt vor einer Variablen, die Konstanten stehen allein. Mit = werden zwei Terme zu einer Gleichung.'});
    });
  },
  // G1-A04 Begriffe in Lücken
  begriffe_luecke(){
    const [satz,wort]=lueckenSatz(), andere=mischen(WOERTER.filter(w=>w!==wort&&!passtAuch(wort,w))).slice(0,3);
    return aufg({kind:'twahl', text:true, q:satz, lead:'Welches Wort gehört in die Lücke?', optionen:optionen([wort,...andere]), ans:'o0', pruef:'pool',
      why:`Richtig ist „${wort}“. ${WARUM_ROLLE}`});
  },
  // G1-N02 Stimmt das? (richtig oder falsch, mit Begründung)
  stimmt_das(){
    const name=pick(NAMEN), art=pick(['rolle','rolle','vorzeichen','term']);
    if(art==='rolle'){
      const t=termTeile(), wahr=pick(ROLLEN), teil=teilVon(t,wahr), behauptet=Math.random()<.4?wahr:pick(ROLLEN.filter(r=>r!==wahr));
      const andere=ROLLEN.filter(r=>r!==behauptet);
      const labels=['Stimmt.', ...andere.map(r=>`Stimmt nicht: ${teil} ist ${derDie(r)}.`)];
      const richtig = behauptet===wahr ? 0 : 1+andere.indexOf(wahr);
      return aufg({kind:'twahl', text:true, q:`${name}: „In ${t.text} ist ${teil} ${derDie(behauptet)}.“`, lead:'Stimmt das?',
        optionen:labels.map((l,i)=>[i===richtig?'ja':'n'+i,l]), ans:'ja', pruef:'stimmt', aussage:{art, term:t.text, teil, behauptet}, why:WARUM_ROLLE});
    }
    if(art==='vorzeichen'){
      const t=versuche(()=>{const x=termTeile();return x.k<0?x:null}), richtig=Math.random()<.4, gesagt=richtig?t.k:-t.k;
      return aufg({kind:'twahl', text:true, q:`${name}: „In ${t.text} ist der Koeffizient ${R(gesagt)}.“`, lead:'Stimmt das?',
        optionen:[[richtig?'ja':'n0','Stimmt.'],[richtig?'n1':'ja',`Stimmt nicht: Der Koeffizient ist ${R(-gesagt)}.`]], ans:'ja', pruef:'stimmt',
        aussage:{art, term:t.text, teil:R(gesagt), behauptet:'Koeffizient'}, why:'Das Vorzeichen gehört zum Koeffizienten.'});
    }
    const t=termTeile(), gl=Math.random()<.5, q=gl?`${t.text} = ${R(rnd(-60,60))}`:t.text, sagt=pick(['Term','Gleichung']);
    const istTerm=!gl, stimmt=(sagt==='Term')===istTerm;
    return aufg({kind:'twahl', text:true, q:`${name}: „${q} ist ${sagt==='Term'?'ein Term':'eine Gleichung'}.“`, lead:'Stimmt das?',
      optionen:[[stimmt?'ja':'n0','Stimmt.'],[stimmt?'n1':'ja',`Stimmt nicht: Das ist ${istTerm?'ein Term':'eine Gleichung'}.`]], ans:'ja', pruef:'stimmt',
      aussage:{art, ausdruck:q, behauptet:sagt}, why:'Ein Term hat kein =. Eine Gleichung besteht aus zwei Termen, die mit = verbunden sind.'});
  },
  // G1-A05 Monom, Binom oder Polynom? (Kern seit 23.10.2026, Entscheidung der Lehrkraft)
  nom_zuordnen(){
    const n=pick([1,2,3,4]), vs=buchst(3).sort();
    const kinds=mischen([{[vs[0]]:1},{[vs[1]]:1},{[vs[2]]:1},{[vs[0]]:2},{}]).slice(0,n);
    const q=summe(kinds.map(e=>Object.keys(e).length?glied(nz(-12,12),e):glied(nz(-30,30))));
    const ans=n===1?'Monom':n===2?'Binom':'Polynom';
    return aufg({kind:'twahl', q, lead:'Monom, Binom oder Polynom?', optionen:[['Monom','Monom'],['Binom','Binom'],['Polynom','Polynom']], ans, pruef:'nom',
      why:'Zähle die Glieder: ein Glied = Monom, zwei Glieder = Binom, mehr als zwei Glieder = Polynom.'});
  },
  // G1-N01 (Plus) Begriffe-Paare
  begriffe_memory(){
    const PAARE=[['Koeffizient','Zahl, die als Faktor bei der Variablen steht'],['Konstante','fixer Zahlenwert'],['Variable','Platzhalter für einen veränderlichen Wert'],
      ['Gleichung','zwei Terme, mit = verbunden'],['Term','Rechenausdruck ohne ='],['Binom','Term mit zwei Gliedern']];
    const [w,d]=pick(PAARE), andere=mischen(PAARE.filter(p=>p[0]!==w)).slice(0,2).map(p=>p[1]);
    return aufg({kind:'twahl', text:true, q:`„${w}“`, lead:'Welche Erklärung passt?', optionen:optionen([d,...andere]), ans:'o0', pruef:'pool',
      why:`${w}: ${d}.`});
  },
  // G1-N03 (Plus) Begriffe in Alltagsformeln
  alltagsformel(){
    const f=pick([
      ()=>{const k=rnd(6,14);return {ort:`Kinokarten: P = ${k}·n`, teile:{[k]:'Koeffizient',n:'Variable'}, sinn:{[k]:'Preis pro Karte',n:'Anzahl der Karten'}}},
      ()=>{const a=rnd(2,4),b=rnd(5,9);return {ort:`Taxi: K = ${a}·s + ${b}`, teile:{[a]:'Koeffizient',[b]:'Konstante',s:'Variable'}, sinn:{[a]:'Preis pro Kilometer',[b]:'Grundgebühr',s:'gefahrene Kilometer'}}},
      ()=>{const a=rnd(3,8),b=rnd(10,30);return {ort:`Schwimmbad für eine Gruppe: E = ${a}·x + ${b}`, teile:{[a]:'Koeffizient',[b]:'Konstante',x:'Variable'}, sinn:{[a]:'Eintritt pro Kind',[b]:'Preis für die Begleitung',x:'Anzahl der Kinder'}}}
    ])();
    const teil=pick(Object.keys(f.teile)), r=f.teile[teil];
    return aufg({kind:'twahl', text:true, q:f.ort, teil, lead:`Was ist <b>${teil}</b>?`, optionen:ROLLEN.map(x=>[x,x]), ans:r, pruef:'rolle',
      why:`${teil} ist ${derDie(r)} (${f.sinn[teil]}).`});
  }
};

/* ---------- Stationen des Lernwegs (nur Kern-Typen) ---------- */
const stationen = [
  {id:'S1', name:'Term oder Gleichung?', hint:'3·y + 28 oder A = a·b', types:['term_gleichung']},
  {id:'S2', name:'Variable, Konstante, Koeffizient', hint:'7x + 35: 7, x und 35', types:['teile_einordnen','gleichung_bauen']},
  {id:'S3', name:'Begriffe erklären', hint:'Lückensätze, Stimmt das?', types:['begriffe_luecke','stimmt_das']},
  {id:'S4', name:'Monom, Binom, Polynom', hint:'2x − 4y: zwei Glieder', types:['nom_zuordnen']}
];
const kern = ['term_gleichung','teile_einordnen','gleichung_bauen','begriffe_luecke','stimmt_das','nom_zuordnen'];
const jeTyp = {term_gleichung:2};
const plus = ['begriffe_memory','alltagsformel'];
const plusHint = 'Begriffe-Paare · Formeln aus dem Alltag';

/* ---------- Erklärung ---------- */
function farbig(t){   // Teile des Terms einfärben wie im Mathe Know How
  const gk=`<span class="tc">${R(t.k)}</span><span class="tv">${t.v}</span>`, zk=`<span class="tc">${Math.abs(t.k)}</span><span class="tv">${t.v}</span>`;
  return t.kvorn ? `${gk} ${t.c<0?M:'+'} <span class="tk">${Math.abs(t.c)}</span>` : `<span class="tk">${R(t.c)}</span> ${t.k<0?M:'+'} ${zk}`;
}
const erklaerung = {
  beispiele: ()=>({term:termTeile()}),
  neu(kind,E){ if(kind==='term') E.term=termTeile(); },
  html: E => `<section class="sheet"><h2>Wichtige Begriffe</h2>
    <div class="rule"><h3>Variable, Koeffizient, Konstante</h3>
      <p class="exhead">Beispiel: ${farbig(E.term)}</p>
      <ul class="moves"><li><span class="tv">Variable</span> (${E.term.v}): Platzhalter für einen veränderlichen Wert</li>
        <li><span class="tc">Koeffizient</span> (${R(E.term.k)}): Zahl, die als Faktor direkt vor der Variablen steht. Das Vorzeichen gehört dazu.</li>
        <li><span class="tk">Konstante</span> (${R(E.term.c)}): fixer Wert, eine Zahl allein</li></ul>
      <button class="newex" data-newex="term">Neues Beispiel</button></div>
    <div class="rule"><h3>Term oder Gleichung?</h3>
      <p><b>Term:</b> ein Rechenausdruck ohne =, z. B. 3·y + 28.</p>
      <p><b>Gleichung:</b> zwei Terme, mit = verbunden, z. B. 5x + 3 = 18 oder A = a·b.</p></div>
    <div class="rule"><h3>Monom, Binom, Polynom</h3>
      <p>Glieder werden durch + oder ${M} getrennt. <b>Monom:</b> ein Glied (2,52n). <b>Binom:</b> zwei Glieder (2x ${M} 4y). <b>Polynom:</b> mehr als zwei Glieder (9a + 7x ${M} 8y).</p></div>
    <p class="small muted">Das steht auch in deinem Mathe Know How Terme.</p>
    <div class="row"><button class="big" data-go="comp">Weiter</button></div></section>`
};

UR.kompetenzAnmelden({id:'M-Term-G1', typen, stationen, kern, jeTyp, plus, plusHint, erklaerung, festeAuswahl:['begriffe_memory']});
})(window.UR = window.UR || {});
</script>
<script>
/* Mathe/2.1 Terme/M-Term-G2.js */
/* Baustein M-Term-G2: „Ich kenne Regeln der mathematischen Symbolsprache und kann allgemeine Sachverhalte mit
   Variablen beschreiben.“ Steckbrief: M-Term-G2.md, Auswahl der Lehrkraft: AUSWAHL.md (23.10.2026).
   Kurzschreibweise und Ordnen werden genau bewertet; beim Übersetzen zählt jeder gleichwertige Term. */
(function(UR){
const {M, rnd, pick, nz, R} = UR.mathe;
const {glied, summe, text, optionen, versuche, aufg, mischen, buchst, hoch, gleichwertig, glieder} = UR.terme;

const NAMEN = ['Lea','Tom','Mia','Jonas','Emil','Sara'];
const ORDNEN = 'Ordnen: alphabetisch, hohe Hochzahlen zuerst, Zahlen am Schluss.';
const KURZ = 'Kurz schreiben: Malpunkt zwischen Zahl und Variable weglassen, 1 vor der Variablen weglassen, Hochzahl 1 weglassen.';

// ein Glied in langer Schreibweise: 5·n, 1·m, s¹, (−1)·a
function lang(k,e){
  const vs=Object.keys(e).sort(), v=vs.map(x=>x+(e[x]===1?pick(['','','¹']):hoch(e[x]))).join(pick(['','·']));
  if(!vs.length) return R(k);
  const z = k===1 ? pick(['1·','','1·']) : k===-1 ? pick([`${M}1·`,M]) : `${R(k)}·`;
  return z+v;
}

/* Übersetzen Text ↔ Term: Satz, richtiger Term, zwei typische Fehler (nicht gleichwertig) */
const WORT = {2:'Doppelte',3:'Dreifache',4:'Vierfache',5:'Fünffache',10:'Zehnfache'};
const VORLAGEN = [
  (x,k,c)=>[`Das ${WORT[k]} der Zahl ${x} soll um ${c} vermindert werden.`, `${k}${x} ${M} ${c}`, [`${c} ${M} ${k}${x}`, `${k}${x} + ${c}`]],
  (x,k,c)=>[`Zum ${WORT[k]}n einer Zahl ${x} soll ${c} addiert werden.`, `${k}${x} + ${c}`, [`${k}·(${x} + ${c})`, `${x} + ${k}·${c}`]],
  (x,k,c)=>[`Die Summe aus einer Zahl ${x} und ${c} soll halbiert werden.`, `(${x} + ${c}) : 2`, [`${x} + ${c} : 2`, `(${x} + ${c})·2`]],
  (x,k,c)=>[`Von einer Zahl ${x} wird ${c} abgezogen.`, `${x} ${M} ${c}`, [`${c} ${M} ${x}`, `${x} + ${c}`]],
  (x,k,c)=>[`Die Hälfte von ${x} soll um ${c} verringert werden.`, `${x} : 2 ${M} ${c}`, [`(${x} ${M} ${c}) : 2`, `2${x} ${M} ${c}`]],
  (x,k,c)=>[`Die Differenz aus einer Zahl ${x} und ${c} soll mit ${k} multipliziert werden.`, `${k}·(${x} ${M} ${c})`, [`${k}${x} ${M} ${c}`, `${k}·(${c} ${M} ${x})`]],
  (x,k,c)=>[`Das Produkt aus ${k} und einer Zahl ${x} wird um ${c} vergrößert.`, `${k}${x} + ${c}`, [`${k}·(${x} + ${c})`, `${k} + ${x} + ${c}`]],
  (x,k,c)=>[`Eine Zahl ${x} wird durch ${k} dividiert.`, `${x} : ${k}`, [`${k} : ${x}`, `${k}${x}`]]
];
const WOERTER = 'Summe +, Differenz −, Produkt ·, Quotient :, das Dreifache 3·, <span class="nw">die Hälfte : 2</span>. Wird eine Summe oder Differenz weiterverarbeitet, kommt sie in Klammern.';
function uebersetzen(){
  return versuche(()=>{
    const x=pick(['x','a','f','n','y','z']), k=pick([2,3,4,5,10]), c=Math.random()<.15?Number(`${rnd(2,40)}.${rnd(1,9)}`):rnd(2,80);
    const cT=String(c).replace('.',','), v=pick(VORLAGEN)(x,k,cT);
    if(v[2].some(f=>gleichwertig(f,v[1]))) return null;
    return {x, satz:v[0], term:v[1], falsch:v[2]};
  });
}

/* ---------- Aufgabentypen ---------- */
const typen = {
  // G2-A01 Kurz schreiben
  kurz_schreiben(){
    return versuche(()=>{
      const vs=buchst(rnd(1,2)), k=pick([1,1,-1,nz(-12,12)]), e={}; vs.forEach(v=>{e[v]=pick([1,1,2,3])});
      const q=lang(k,e), ans=glied(k,e);
      if(q===ans) return null;
      return aufg({kind:'term', modus:'genau', q, ans, lead:'Schreib kurz!', tasten:[...vs.sort(),'²','³',M], pruef:'umformen',
        why:KURZ, steps:`${q} = ${ans}`});
    });
  },
  // G2-A02 Vereinfachen und ordnen
  vereinfachen_ordnen(){
    return versuche(()=>{
      let mon;
      if(Math.random()<.5){ const vs=buchst(rnd(2,3)); mon=[...vs.map(v=>({[v]:1})), ...(Math.random()<.8?[{}]:[])]; }
      else { const v=buchst(1)[0]; mon=[...mischen([1,2,3,4]).slice(0,rnd(2,3)).map(n=>({[v]:n})), ...(Math.random()<.7?[{}]:[])]; }
      const gl=mischen(mon).map(e=>({k:Object.keys(e).length?pick([1,1,-1,nz(-9,9)]):nz(-30,30), e}));
      const q=summe(gl.map(g=>lang(g.k,g.e))), ans=text(q);
      if(q===ans||glieder(ans).length<3) return null;
      return aufg({kind:'term', modus:'genau', q, ans, lead:'Schreib kurz und ordne!', tasten:[...new Set(mon.flatMap(Object.keys))].sort().concat(['²','³','⁴',M]),
        pruef:'umformen', why:`${KURZ} ${ORDNEN}`, steps:`${q} = ${ans}`});
    });
  },
  // G2-A03 Text → Term (jede gleichwertige Schreibweise zählt)
  text_term(){
    const u=uebersetzen();
    return aufg({kind:'term', modus:'gleich', text:true, q:u.satz, ans:u.term, lead:'Schreib als Term!', tasten:[u.x,'(',')',':','·',M],
      pruef:'text', why:WOERTER, steps:u.term});
  },
  // G2-A04 Text und Term verbinden
  text_term_zuordnen(){
    const u=uebersetzen();
    return aufg({kind:'twahl', text:true, q:u.satz, lead:'Welcher Term passt?', optionen:optionen([u.term,...u.falsch]), ans:'o0', pruef:'textwahl',
      why:WOERTER, steps:u.term});
  },
  // G2-N01 (Plus) Glieder ordnen
  glieder_ordnen(){
    return versuche(()=>{
      const vs=buchst(3), gl=mischen([...vs.map(v=>glied(nz(-9,9),{[v]:1})), glied(nz(-20,20))]);

  // G2-N04 (Plus) Sachverhalt mit Variablen
  sachverhalt_term(){

<script>
/* Mathe/2.1 Terme/M-Term-G3.js */
/* Baustein M-Term-G3: „Ich kenne Regeln für das Rechnen mit Termen und kann sie anwenden.“
   Steckbrief: M-Term-G3.md, Auswahl der Lehrkraft: AUSWAHL.md (23.10.2026): mehrteilige Aufgaben (G3-A03, G3-A06)
   bleiben Kern bei G3; Ergebnisse werden geordnet verlangt; G3-N03 (Umfang und Fläche) ist zu V1 gewandert. */
(function(UR){
const {M, rnd, pick, nz, R} = UR.mathe;
const {glied, summe, text, fak, optionen, versuche, aufg, mischen, buchst, glieder, zwischenAufgabe, qText, Q, hoch, wertVon, einsetzen, einsetzenWert} = UR.terme;

const NAMEN = ['Lea','Tom','Mia','Jonas','Emil','Sara'];
const REGEL1 = 'Nur Gleiches zusammen: gleiche Variablen mit gleicher Hochzahl. Die Variable und die Hochzahl bleiben, nur die Zahlen werden gerechnet.';
const REGEL2M = `Minus vor der Klammer dreht jedes Zeichen in der Klammer um.`;
const REGEL2P = 'Plus vor der Klammer: Die Klammer fällt weg, die Zeichen bleiben.';
const REGEL3 = 'Zahlen mal Zahlen, Variablen alphabetisch, gleiche Variablen: Hochzahlen addieren.';
const REGEL4 = 'Setze die Zahl für die Variable ein (negative Zahlen und Kommazahlen in Klammern), dann Klapustri: Klammer, Punkt, Strich.';
const ORDNE = 'Fasse zusammen und ordne!';
const tastenFuer = s => [...new Set(s.match(/[a-z]/g)||[])].sort().concat(['²','³',M]);

// Glied mit Variable v (Hochzahl n) oder Zahl
const gl = (k,v,n=1) => v ? glied(k,{[v]:n}) : glied(k);

/* ---------- Aufgabentypen ---------- */
const typen = {
  // G3-A01 Zwei gleichartige Glieder
  zwei_gleichartige(){
    return versuche(()=>{
      const v=buchst(1)[0], n=pick([1,1,2,3]), k1=nz(-20,20), k2=rnd(1,20), op=pick(['+',M]);
      if((op==='+'?k1+k2:k1-k2)===0) return null;
      const q=`${gl(k1,v,n)} ${op} ${gl(k2,v,n)}`, ans=text(q);
      return aufg({kind:'term', modus:'genau', q, ans, lead:'Fasse zusammen!', tasten:tastenFuer(q), pruef:'umformen', why:REGEL1, steps:`${q} = ${ans}`});
    });
  },
  // G3-A02 Zusammenfassen oder nicht?
  geht_oder_nicht(){
    return versuche(()=>{
      const [v,w]=buchst(2), art=pick(['gleich','gleich','var','hoch']), n=pick([1,2]), k1=nz(-15,15), k2=rnd(1,15), op=pick(['+',M]);
      const s=op==='+'?k1+k2:k1-k2;
      const zweites = art==='var' ? gl(k2,w,n) : art==='hoch' ? gl(k2,v,n+1) : gl(k2,v,n);
      const q=`${gl(k1,v,n)} ${op} ${zweites}`;

      else { if(!s) return null; labels=[`bleibt ${q}`, gl(s,v,2*n+1), gl(s,v,n+1)]; }
      const o=optionen(labels); if(!o) return null;
      return aufg({kind:'twahl', q, lead:'Kann man das zusammenfassen? Wähle das Ergebnis.', optionen:o, ans:'o0', pruef:'geht',
        why: art==='gleich' ? REGEL1 : art==='var' ? 'Verschiedene Variablen: Die Glieder bleiben getrennt.' : `Gleiche Variable, aber verschiedene Hochzahlen: Die Glieder bleiben getrennt.`});
    });
  },
  // G3-A03 Mehrere Glieder zusammenfassen (mehrteilig, Entscheidung der Lehrkraft: Kern bei G3)
  mehrere_glieder(){
    return versuche(()=>{
      const [v,w]=buchst(2), arten = Math.random()<.5 ? [[v,1],[w,1]] : [[v,2],[v,1]];
      if(Math.random()<.3) arten.push([null,0]);
      const n=rnd(4,6), liste=arten.map(a=>a);
      while(liste.length<n) liste.push(pick(arten));
      const q=summe(mischen(liste).map(([x,h])=>gl(nz(-10,10),x,h||1))), ans=text(q);
      if(ans==='0'||glieder(ans).length<1||glieder(q).length===glieder(ans).length) return null;
      return aufg({kind:'term', modus:'genau', q, ans, lead:ORDNE, tasten:tastenFuer(q), pruef:'umformen', why:`${REGEL1} Ordnen: alphabetisch, hohe Hochzahlen zuerst, Zahlen am Schluss.`, steps:`${q} = ${ans}`});
    });
  },
  // G3-A04 Minus vor der Klammer
  minus_klammer(){ return klammer(M); },
  // G3-A05 Plus vor der Klammer
  plus_klammer(){ return klammer('+'); },
  // G3-A06 Mehrere Klammern (LZK-Niveau, Kern bei G3)
  mehrere_klammern(){
    return versuche(()=>{
      const [v,w]=buchst(2), arten=[[v,rnd(1,3)],[w,rnd(1,3)],[null,0]];
      const g=()=>{const [x,h]=pick(arten);return gl(nz(-15,15),x,h||1)};
      const vor=[pick(['+',M]),pick(['+',M])]; if(!vor.includes(M)) vor[rnd(0,1)]=M;
      const k1=summe([g(),g()]), k2=summe([g(),g()]);
      if(glieder(k1).length<2||glieder(k2).length<2) return null;
      const frei=[g()], q = Math.random()<.5
        ? `${frei[0]} ${vor[0]} (${k1}) ${vor[1]} (${k2})`
        : `${frei[0]} ${vor[0]} (${k1}) ${pick(['+',M])} ${g().replace(M,'')} ${vor[1]} (${k2})`;
      const ans=text(q); if(ans==='0') return null;
      return zwischenAufgabe(q, {lead:'Löse die Klammern auf, fasse zusammen und ordne!', tasten:tastenFuer(q), pruef:'umformen', why:`${REGEL2M} ${REGEL2P}`});
    });
  },
  // G3-A07 Zwei Monome multiplizieren: Schritt 1 Vorzeichen, Schritt 2 ganzes Ergebnis (LEITFADEN „Punktrechnungen“)
  monome_mal(){
    return versuche(()=>{
      const vs=buchst(3), mon=()=>{const e={};mischen(vs).slice(0,rnd(1,2)).forEach(v=>{e[v]=rnd(1,3)});return e};
      const k1=nz(-15,15), k2=nz(-15,15); if(Math.abs(k1*k2)>200||(Math.abs(k1)===1&&Math.abs(k2)===1)) return null;
      const q=`${fak(glied(k1,mon()))} · ${fak(glied(k2,mon()))}`, ans=text(q), vz=k1*k2>0?'+':M;
      return aufg({kind:'termzwei', q, ausdruck:q, ans, modus:'genau', midModus:'vorzeichen', optionen:['+',M],
        pre:{ans:vz, label:'Schritt 1: Welches Vorzeichen hat das Ergebnis?'}, midLabel:'Schritt 1: Vorzeichen des Ergebnisses',
        ergLabel:'Schritt 2: ganzes Ergebnis mit Vorzeichen', schritt2:'Schritt 2: Schreib das ganze Ergebnis mit Vorzeichen.',
        preWhy:k1*k2>0?'Gleiche Vorzeichen ergeben Plus.':'Verschiedene Vorzeichen ergeben Minus.', schritt:'Vorzeichen', loesung:ans,
        alleinText:'Ab der nächsten Aufgabe bestimmst du das Vorzeichen und schreibst das Ergebnis selbst.',
        lead:'Multipliziere!', tasten:tastenFuer(q), pruef:'umformen',
        why:`Vorzeichen zuerst: ${k1*k2>0?'gleiche Vorzeichen ergeben Plus':'verschiedene Vorzeichen ergeben Minus'}. ${REGEL3}`,
        steps:`${q} = ${ans}`});
    });
  },
  // G3-A08 Wert eines Terms: Zwischenschritt eingesetzt, dann Ergebnis
  termwert(){ return termwert(); },
  // G3-A09 (Plus) Wertetabelle im Kopf
  wertetabelle(){
    return versuche(()=>{
      const x=pick(['x','a','n']), w=rnd(-10,10)||2, k=rnd(2,25);
      const pool=[`${x} + ${k}`, `${k} ${M} ${x}`, `${rnd(2,6)}·${x}`, `${x}²`, `2·${x} + 3`, `(${M}1)·${x}`, ...(w%2===0?[`${x} : 2`]:[])];
      const terme=mischen(pool).slice(0,rnd(3,4)), ein=t=>einsetzen(t,x,[w,1]);
      return aufg({kind:'felder', q:`${x} = ${R(w)}`, lead:'Berechne den Wert der Terme im Kopf!', wertText:R(w), variable:x,
        felder:terme.map(t=>({label:t, modus:'zahl', ans:qText(wertVon(ein(t)))})), tasten:[M], pruef:'tabelle',
        why:REGEL4, steps:terme.map(t=>`${ein(t)} = ${qText(wertVon(ein(t)))}`).join(' · ')});
    });
  },
  // G3-N01 (Plus) Fehler finden
  fehler_rechenregel(){
    return versuche(()=>{
      const [v,w]=buchst(2).sort(), a=rnd(2,9), b=rnd(2,9), art=pick(['ungleich','hoch','mal']);
      let l,f;
      if(art==='ungleich'){ l=`${a}${v} + ${b}${w}`; f=`${a+b}${v}${w}`; }
      else if(art==='hoch'){ const n=rnd(1,2); l=`${gl(a,v,n)} + ${gl(b,v,n)}`; f=gl(a+b,v,2*n); }
      else { l=`${a}${v} · ${b}${v}`; f=gl(a*b,v,1); }
      const ans=text(l);
      return aufg({kind:'term', modus:'genau', text:true, q:`${pick(NAMEN)} rechnet: ${l} = ${f}. Das stimmt nicht. Was ist richtig?`, ausdruck:l, ans,
        tasten:[v,w,'²','⁴',M], pruef:'fehler', why:art==='ungleich'?'Verschiedene Variablen darf man nicht zusammenfassen.':art==='hoch'?'Beim Zusammenfassen bleibt die Hochzahl gleich.':'Beim Multiplizieren werden die Hochzahlen addiert: '+v+' · '+v+' = '+v+'².',
        steps:`${l} = ${ans}`});
    });
  },
  // G3-N02 (Plus) Gleicher Wert?
  gleicher_wert(){
    return versuche(()=>{
      const x=pick(['x','a','y']), w=rnd(1,5), k=rnd(2,6), c=nz(-9,9), t1=summe([gl(k,x),glied(c)]), z=k*w+c;
      const p=rnd(1,3), d=z-p*w*w; if(!d) return null;
      const richtig=summe([gl(p,x,2),glied(d)]);
      const falsch=[1,2].map(()=>{const a=rnd(2,7),b=nz(-9,9);return a*w+b===z?null:summe([gl(a,x),glied(b)])});
      if(falsch.includes(null)) return null;
      const o=optionen([richtig,...falsch]); if(!o) return null;
      return aufg({kind:'twahl', q:t1, wertText:R(w), variable:x, lead:`Welcher Term hat für ${x} = ${w} denselben Wert wie dieser Term?`, optionen:o, ans:'o0', pruef:'gleicherwert',
        why:`Setze ${x} = ${w} ein: ${t1} ergibt ${R(z)}.`, steps:`${einsetzen(richtig,x,[w,1])} = ${R(z)}`});
    });
  }
};

// Eine Klammer mit Minus oder Plus davor: A − (B ± C) bzw. A + (B ± C)
function klammer(op){
  return versuche(()=>{
    const [v,w]=buchst(2), arten=pick([[[v,1],[null,0]],[[v,1],[w,1]],[[null,0],[v,1]]]);
    const A=pick([gl(rnd(1,40)),gl(rnd(1,15),v),gl(rnd(1,15),w)]);
    const B=gl(nz(-15,15),...arten[0]), C=gl(rnd(1,15),...arten[1]);
    const innen=`${B} ${pick(['+',M])} ${C}`, q=`${A} ${op} (${innen})`;
    if(text(q)==='0') return null;
    return zwischenAufgabe(q, {lead:'Löse die Klammer auf, fasse zusammen und ordne!', tasten:tastenFuer(q), pruef:'umformen',
      qh:`${A} <b class="hlm">${op}</b> (${innen})`, why:op===M?REGEL2M:REGEL2P});
  });
}

// Wert eines Terms für eine Zahl
function termwert(){
  return versuche(()=>{
    const x=pick(['x','a','r','y']), form=pick(['lin','lin','quad','dez']);
    let gls;   // [Koeffizient, Hochzahl]
    if(form==='lin') gls=[[nz(-9,9),1],[nz(-20,20),0]];
    else if(form==='quad') gls=[[nz(-5,5),2],[nz(-9,9),1],[nz(-20,20),0]];
    else gls=[[nz(-9,9),2],[nz(-60,60),0]];
    if(gls.some(([k,n])=>n&&Math.abs(k)<2)) return null;
    const w = form==='dez' ? Q(nz(-39,39),10) : form==='quad' ? [nz(-5,5),1] : [nz(-10,10),1];
    if(w[1]===1&&form==='dez') return null;
    const wT=qText(w), wE=einsetzenWert(w);
    const term=summe(gls.map(([k,n])=>gl(k,n?x:null,n)));
    const mid=summe(gls.map(([k,n])=>!n?glied(k):`${R(k)}·${wE}${hoch(n)}`));
    const ans=qText(wertVon(mid));
    // typische Fehler: Koeffizient addiert statt multipliziert; x² als 2x gerechnet bzw. Vorzeichen der Zahl verloren
    const falsch=[mid.replace(/·/g,' + '), form==='lin' ? summe(gls.map(([k,n])=>!n?glied(k):`${R(k)}·${einsetzenWert(Q(-w[0],w[1]))}`)) : mid.replace(/²/g,'·2')];
    if(falsch.some(f=>{try{const z=wertVon(f);return z[0]===wertVon(mid)[0]&&z[1]===wertVon(mid)[1]}catch(e){return true}})) return null;
    const auswahl=mischen([mid,...falsch]); if(new Set(auswahl).size<3) return null;
    return aufg({kind:'termzwei', q:`${term} für ${x} = ${wT}`, ausdruck:term, variable:x, wertText:wT, ans, modus:'zahl', midModus:'einsetzen',
      optionen:auswahl, pre:{ans:mid, label:'Schritt 1: Welche Zeile zeigt richtig eingesetzt?'}, midLabel:'Zahl eingesetzt',
      schritt:'Einsetzen', alleinText:'Ab der nächsten Aufgabe setzt du selbst ein.', lead:'Berechne den Wert des Terms!', tasten:['(',')','·','²',M],
      eingabeHinweis:'Kommazahlen mit Komma, z. B. 4,97', pruef:'wert', why:REGEL4, steps:`${mid} = ${ans}`});
  });
}

/* ---------- Stationen des Lernwegs (nur Kern-Typen) ---------- */
const stationen = [
  {id:'S1', name:'Gleiches zusammenfassen', hint:'7z + 5z = 12z, aber 4a + 3b bleibt', types:['zwei_gleichartige','geht_oder_nicht','mehrere_glieder']},
  {id:'S2', name:'Klammern auflösen', hint:'32 − (x − 8) = 32 − x + 8 = −x + 40', types:['minus_klammer','plus_klammer','mehrere_klammern']},
  {id:'S3', name:'Monome multiplizieren', hint:'2f · 4e = 8ef', types:['monome_mal']},
  {id:'S4', name:'Wert eines Terms', hint:'7x − 4 für x = 2 → 10', types:['termwert']}
];

const jeTyp = {monome_mal:2, termwert:2};
const plus = ['wertetabelle','fehler_rechenregel','gleicher_wert'];
const plusHint = 'Wertetabelle im Kopf · Fehler finden · Gleicher Wert?';

/* ---------- Erklärung ---------- */
const erklaerung = {
  beispiele: ()=>({zus:typen.mehrere_glieder(), kl:[typen.minus_klammer(),typen.plus_klammer()], mal:typen.monome_mal(), wert:termwert()}),
  neu(kind,E){

<script>
/* Mathe/2.1 Terme/M-Term-V1.js */
/* Baustein M-Term-V1: „Ich kenne das Distributivgesetz und kann ausmultiplizieren und herausheben.“
   Steckbrief: M-Term-V1.md, Auswahl der Lehrkraft: AUSWAHL.md (23.10.2026). Beim Ausmultiplizieren zählt jede
   Reihenfolge der Glieder (Ausnahme der Lehrkraft, Frage 4); Herausheben: nur der größte gemeinsame Faktor.
   „Umfang und Fläche als Term“ (bisher G3-N03) ist auf Wunsch der Lehrkraft hier ein Kern-Typ. */
(function(UR){
const {M, rnd, pick, nz, R} = UR.mathe;
const {glied, summe, text, fak, optionen, versuche, aufg, mischen, buchst, glieder, flachListe, zwischenAufgabe, ggtGlieder, einsetzen, wertVon, qText, gleichwertig} = UR.terme;

const NAMEN = ['Lea','Tom','Mia','Jonas','Emil','Sara'];
const AUSMULT = 'Jedes Glied in der Klammer wird mit dem Faktor vor der Klammer multipliziert. Vorzeichen zuerst: gleiche Vorzeichen ergeben Plus, verschiedene Minus.';
const KLKL = 'Jedes Glied der ersten Klammer mal jedes Glied der zweiten Klammer (Vorzeichen jeweils zuerst), dann gleichartige Glieder zusammenfassen.';
const HERAUS = 'Such den größten gemeinsamen Faktor aller Glieder (Zahl und Variablen). Er kommt vor die Klammer, in die Klammer kommt, was übrig bleibt. Probe: ausmultiplizieren.';
const tastenFuer = s => [...new Set(s.match(/[a-z]/g)||[])].sort().concat(['(',')','·','²',M]);
const gl = (k,v,n=1) => v ? glied(k,{[v]:n}) : glied(k);

// zwei verschiedene Glieder für eine Klammer
function binom(v,w,hoch=false){
  const arten=pick([[[v,1],[null,0]],[[null,0],[v,1]],[[v,1],[w,1]],...(hoch?[[[v,2],[v,1]],[[v,1],[v,2]]]:[])]);
  return summe([gl(nz(-9,9),...arten[0]), gl(nz(-9,9),...arten[1])]);
}
// Glieder für das Herausheben: Klammerinhalt ohne gemeinsamen Faktor
function innen(v,w){
  return versuche(()=>{
    const arten=mischen([[v,1],[w,1],[null,0],[v,2]]).slice(0,rnd(2,3));
    const l=arten.map(([x,h],i)=>gl(i===0?rnd(1,9):nz(-9,9),x,h||1));
    return ggtGlieder(l)==='1' ? l : null;
  });
}
function herausheben(faktor){
  return versuche(()=>{
    const [v,w]=buchst(2), F=faktor(v,w), l=innen(v,w), k=summe(l), ans=`${F}·(${k})`;
    const q=summe(flachListe(ans));
    if(ggtGlieder(flachListe(ans))!==F) return null;
    return aufg({kind:'term', modus:'faktor', q, ans, lead:'Heb den größten gemeinsamen Faktor heraus!', tasten:tastenFuer(q), pruef:'faktor',
      eingabeHinweis:'Schreib so: Faktor·(Klammer), z. B. 3n·(4m − 1)', why:HERAUS, steps:`${q} = ${ans}`});
  });
}

/* ---------- Aufgabentypen ---------- */
const typen = {
  // V1-A01 Zahl mal Klammer
  zahl_mal_klammer(){
    const [v,w]=buchst(2), k=pick([1,-1])*rnd(2,12), q=`${fak(R(k))}·(${binom(v,w)})`, ans=text(q);
    return aufg({kind:'term', modus:'glieder', q, ans, lead:'Multipliziere aus!', tasten:tastenFuer(q), pruef:'umformen', why:AUSMULT, steps:`${q} = ${ans}`});
  },
  // V1-A02 Monom mal Klammer (mit Potenzen)
  monom_mal_klammer(){
    return versuche(()=>{
      const [v,w]=buchst(2), F=pick([gl(nz(-6,6),v,rnd(1,2)), gl(nz(-6,6),w)]), q=`${fak(F)}·(${binom(v,w,true)})`, ans=text(q);
      if(glieder(ans).length<2) return null;
      return aufg({kind:'term', modus:'glieder', q, ans, lead:'Multipliziere aus!', tasten:tastenFuer(q), pruef:'umformen',
        why:`${AUSMULT} Gleiche Variablen: Hochzahlen addieren.`, steps:`${q} = ${ans}`});
    });
  },
  // V1-A03 Klammer mal Klammer: Teilprodukte (Zwischenschritt), dann zusammengefasst
  klammer_mal_klammer(){
    return versuche(()=>{
      const [v,w]=buchst(2), q=`(${binom(v,w)})·(${binom(v,w)})`;
      if(flachListe(q).length!==4) return null;
      return zwischenAufgabe(q, {modus:'glieder', lead:'Multipliziere aus und fasse zusammen!', tasten:tastenFuer(q), pruef:'umformen', why:KLKL,
        pre:{ans:UR.terme.flachText(q), label:'Schritt 1: Welche Teilprodukte sind richtig? (jeder mit jedem)'}, midLabel:'Teilprodukte', schritt:'Teilprodukte',
        alleinText:'Ab der nächsten Aufgabe schreibst du die Teilprodukte selbst.'});
    });
  },
  // V1-A04 Gemeinsamen Faktor erkennen
  faktor_erkennen(){
    return versuche(()=>{
      const [v,w]=buchst(2), F=pick([String(rnd(2,9)), v, `${v}²`, `${rnd(2,6)}${v}`]), l=innen(v,w);
      const gls=flachListe(`${F}·(${summe(l)})`), q=summe(gls);
      if(ggtGlieder(gls)!==F) return null;
      // falsche Auswahl: kommt nicht in allen Gliedern vor
      const kand=[w, `${w}²`, String(rnd(2,9)), `${v}³`, `${rnd(2,9)}${w}`].filter(c=>c!==F&&!gls.every(g=>teilt(c,g)));
      const o=optionen([F,...mischen([...new Set(kand)]).slice(0,2)]); if(!o||o.length<3) return null;
      return aufg({kind:'twahl', q, lead:'Welcher Faktor steckt in allen Gliedern?', optionen:o, ans:'o0', pruef:'gemeinsam',
        why:`${F} steckt in jedem Glied: ${q} = ${F}·(${summe(l)}).`, steps:`${q} = ${F}·(${summe(l)})`});
    });
  },
  // V1-A05 Zahl oder Variable herausheben
  herausheben_einfach(){ return herausheben((v)=>pick([String(rnd(2,9)), v])); },
  // V1-A06 Größten gemeinsamen Faktor herausheben
  herausheben_ggt(){ return herausheben((v,w)=>glied(rnd(2,9), pick([{[v]:1},{[v]:2},{[v]:1,[w]:1},{[v]:2,[w]:1}]))); },
  // V1-A07 Umfang und Fläche als Term (bisher G3-N03, Kern bei V1)
  umfang_flaeche(){
    return versuche(()=>{
      const v=pick(['a','x','b','s']), was=pick(['Umfang','Flächeninhalt']), form=pick(['rechteck','rechteck','binom','quadrat']);
      let satz, l, b;
      if(form==='quadrat'){ l=b=gl(rnd(2,9),v); satz=`Ein Quadrat hat die Seitenlänge ${l}.`; }
      else if(form==='rechteck'){ l=gl(rnd(2,9),v); b=gl(rnd(1,8),v); satz=`Ein Rechteck hat die Länge ${l} und die Breite ${b}.`; }
      else { l=summe([gl(rnd(1,5),v),glied(rnd(1,9))]); b=pick([gl(rnd(1,6),v),glied(rnd(2,9))]); satz=`Ein Rechteck hat die Länge ${l} und die Breite ${b}.`; }
      if(form!=='quadrat'&&l===b) return null;
      const formel = was==='Umfang' ? `2·(${l}) + 2·(${b})` : `(${l})·(${b})`, ans=text(formel);
      return aufg({kind:'term', modus:'glieder', text:true, q:`${satz} Gib den ${was} als Term an.`, ausdruck:formel, ans, tasten:tastenFuer(v), pruef:'flaeche',
        why: was==='Umfang' ? 'Umfang: u = 2·Länge + 2·Breite (beim Quadrat 4·Seite). Dann ausmultiplizieren und zusammenfassen.' : 'Flächeninhalt: A = Länge · Breite. Dann ausmultiplizieren.',
        steps:`${formel} = ${ans}`});
    });
  },
  // V1-N01 (Plus) Flächenmodell
  flaechenmodell(){
    const v=pick(['x','a','b']), k=rnd(2,9), n=rnd(2,9), q=`${k}·(${v} + ${n})`, ans=text(q);
    return aufg({kind:'term', modus:'glieder', text:true, q:`Ein Rechteck ist ${k} breit und ${v} + ${n} lang. Gib den Flächeninhalt ohne Klammer an.`, ausdruck:q, ans,
      qh:`Ein Rechteck ist ${k} breit und ${v} + ${n} lang. Gib den Flächeninhalt ohne Klammer an.${flaecheSVG(k,v,n)}`, tasten:[v,M], pruef:'flaeche',
      why:`Die Fläche besteht aus zwei Teilen: ${k}·${v} und ${k}·${n}. Zusammen ${ans}.`, steps:`${q} = ${ans}`});
  },
  // V1-N02 (Plus) Probe durch Einsetzen
  probe_einsetzen(){
    return versuche(()=>{
      const v=pick(['a','x','b']), k=rnd(2,9), n=rnd(2,9), w=rnd(1,4), l=`${k}·(${v} + ${n})`;
      const richtig=Math.random()<.5, r=richtig?text(l):pick([`${k}${v} + ${n}`, `${k}${v} + ${k+n}`, `${v} + ${k*n}`]);
      const lw=wertVon(einsetzen(l,v,[w,1])), rw=wertVon(einsetzen(r,v,[w,1]));
      if(!richtig&&lw[0]===rw[0]) return null;
      return aufg({kind:'twahl', text:true, q:`${l} = ${r}`, lead:`Stimmt das? Mach die Probe mit ${v} = ${w}.`, wertText:String(w), variable:v,
        optionen:[['ja','stimmt'],['nein','stimmt nicht']], ans:richtig?'ja':'nein', pruef:'probe',
        why:`Links: ${einsetzen(l,v,[w,1])} = ${qText(lw)}. Rechts: ${einsetzen(r,v,[w,1])} = ${qText(rw)}.`});
    });
  },
  // V1-N03 (Plus) Fehler finden
  fehler_distributiv(){
    const v=pick(['x','y','a']), k=rnd(2,9), n=rnd(2,9), art=pick(['vergessen','vorzeichen','heraus']);
    let l, f, kl, modus='glieder';
    if(art==='vergessen'){ l=`${k}·(${n} + ${v})`; f=`${k*n} + ${v}`; }
    else if(art==='vorzeichen'){ l=`${M}${k}·(${v} ${M} ${n})`; f=`${M}${k}${v} ${M} ${k*n}`; }
    else { const g=rnd(2,5), [a,b]=versuche(()=>{const a=rnd(2,7),b=rnd(2,7);return a!==b&&ggtGlieder([String(a),String(b)])==='1'?[a,b]:null});
      l=`${g*a}${v} + ${g*b}`; f=`${g}·(${a}${v} + ${g*b})`; modus='faktor'; kl=`${g}·(${a}${v} + ${b})`; }
    const ans = modus==='faktor' ? kl : text(l);
    return aufg({kind:'term', modus, text:true, q:`${pick(NAMEN)} rechnet: ${l} = ${f}. Das stimmt nicht. Was ist richtig?`, ausdruck:l, ans, tasten:[v,'(',')','·',M], pruef:'fehler',
      why: art==='vergessen'?'Jedes Glied in der Klammer wird multipliziert.':art==='vorzeichen'?'Minus mal Minus ergibt Plus.':'Beim Herausheben wird jedes Glied durch den Faktor dividiert.',
      steps:`${l} = ${ans}`});
  },
  // V1-N04 (Plus) Anwenden: Fläche und Einkauf
  anwenden_distributiv(){
    if(Math.random()<.5){
      const v=pick(['a','x']), m=rnd(1,6), n=rnd(1,6), f=`(${v} + ${m})·(${v} + ${n})`;
      return aufg({kind:'term', modus:'glieder', text:true, q:`Ein Rechteck hat die Seiten ${v} + ${m} und ${v} + ${n}. Gib den Flächeninhalt ohne Klammern an.`, ausdruck:f, ans:text(f),
        tasten:[v,'²',M], pruef:'flaeche', why:KLKL, steps:`${f} = ${text(f)}`});
    }
    const x=pick(['x','p']), k=rnd(3,12), n=rnd(2,6), f=`${n}·(${x} + ${k})`;
    return aufg({kind:'term', modus:'gleich', text:true, q:`Ein T-Shirt kostet ${x} €, eine Kappe ${k} €. ${n} Kinder kaufen je ein T-Shirt und eine Kappe. Wie viel Euro zahlen sie zusammen?`, ans:f,
      tasten:[x,'(',')','·'], pruef:'sach', why:'Ein Kind zahlt '+x+' + '+k+'. Für alle Kinder: mal '+n+'.', steps:`${f} = ${text(f)}`});
  }
};
// teilt das Glied c das Glied g? (für falsche Auswahl beim Faktor-Erkennen)
function teilt(c,g){ try{ return ggtGlieder([c,g])===ggtGlieder([c]); }catch(e){ return false; } }
function flaecheSVG(k,v,n){
  return `<svg class="flaeche" viewBox="0 0 300 120" role="img" aria-label="Rechteck ${k} breit, ${v} + ${n} lang, in zwei Teile geteilt">
    <rect x="30" y="30" width="160" height="70" fill="var(--ink-soft)" stroke="var(--ink)" stroke-width="2"/>
    <rect x="190" y="30" width="90" height="70" fill="var(--c2-soft)" stroke="var(--ink)" stroke-width="2"/>
    <text x="110" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)">${v}</text>
    <text x="235" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)">${n}</text>
    <text x="18" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)">${k}</text></svg>`;
}

/* ---------- Stationen des Lernwegs (nur Kern-Typen) ---------- */
const stationen = [
  {id:'S1', name:'Mal Klammer', hint:'4·(3 + y) = 4y + 12', types:['zahl_mal_klammer','monom_mal_klammer']},
  {id:'S2', name:'Klammer mal Klammer', hint:'(2 + x)·(3 + y)', types:['klammer_mal_klammer']},
  {id:'S3', name:'Gemeinsamen Faktor finden', hint:'cd + ce → c', types:['faktor_erkennen']},
  {id:'S4', name:'Herausheben', hint:'12mn − 3n = 3n·(4m − 1)', types:['herausheben_einfach','herausheben_ggt']},
  {id:'S5', name:'Umfang und Fläche', hint:'Rechteck 3a mal 2a: Fläche 6a²', types:['umfang_flaeche']}
];
const kern = ['zahl_mal_klammer','monom_mal_klammer','klammer_mal_klammer','faktor_erkennen','herausheben_einfach','herausheben_ggt','umfang_flaeche'];
const jeTyp = {klammer_mal_klammer:2, faktor_erkennen:2};
const plus = ['flaechenmodell','probe_einsetzen','fehler_distributiv','anwenden_distributiv'];
const plusHint = 'Flächenmodell · Probe durch Einsetzen · Fehler finden · Anwenden';

/* ---------- Erklärung ---------- */
const erklaerung = {
  beispiele: ()=>({aus:typen.zahl_mal_klammer(), kk:typen.klammer_mal_klammer(), her:typen.herausheben_ggt(), fl:[rnd(2,9),pick(['x','a']),rnd(2,9)]}),
  neu(kind,E){
    if(kind==='aus') E.aus=typen.monom_mal_klammer();

  },
  html: E => `<section class="sheet"><h2>Das Distributivgesetz</h2>

      <p>Ein Rechteck ist ${E.fl[0]} breit und ${E.fl[1]} + ${E.fl[2]} lang. Seine Fläche besteht aus zwei Teilen:</p>${flaecheSVG(...E.fl)}
      <div class="ex">${E.fl[0]}·(${E.fl[1]} + ${E.fl[2]}) = ${E.fl[0]}${E.fl[1]} + ${E.fl[0]*E.fl[2]}</div>
      <p>Vorwärts heißt das <b>ausmultiplizieren</b>, rückwärts <b>herausheben</b>.</p><button class="newex" data-newex="fl">Neues Beispiel</button></div>
    <div class="rule"><h3>Ausmultiplizieren</h3><p>${AUSMULT}</p>
      <div class="ex">${E.aus.steps}</div><button class="newex" data-newex="aus">Neues Beispiel</button></div>
    <div class="rule"><h3>Klammer mal Klammer</h3><p>${KLKL}</p>
      <div class="ex">${E.kk.steps}</div><button class="newex" data-newex="kk">Neues Beispiel</button></div>
    <div class="rule"><h3>Herausheben</h3><p>${HERAUS}</p>
      <div class="ex">${E.her.steps}</div><button class="newex" data-newex="her">Neues Beispiel</button></div>

const lzk = {merkmal:{zahl_mal_klammer:'ausmultiplizieren', monom_mal_klammer:'ausmultiplizieren', faktor_erkennen:'herausheben', herausheben_einfach:'herausheben', herausheben_ggt:'herausheben'}};

<script>
/* Mathe/2.1 Terme/M-Term-V2.js */
/* Baustein M-Term-V2: „Ich kenne die Vorrangregeln beim Rechnen mit Termen und kann sie anwenden.“
   Steckbrief: M-Term-V2.md, Auswahl der Lehrkraft: AUSWAHL.md (23.10.2026). Klapustri: Klammer, Punkt, Strich;
   von innen nach außen. Ergebnisse geordnet; Zwischenschritt = alle Klammern aufgelöst. */
(function(UR){
const {M, rnd, pick, nz, R} = UR.mathe;
const {glied, summe, text, fak, optionen, versuche, aufg, mischen, buchst, glieder, flachListe, flachText, zwischenAufgabe} = UR.terme;

const NAMEN = ['Lea','Tom','Mia','Jonas','Emil','Sara'];
const KLAPUSTRI = 'Klapustri: zuerst KLAmmern (von innen nach außen: <span class="nw">( ) vor [ ] vor { }</span>), dann PUnkt <span class="nw">(· und :)</span>, dann STRIch <span class="nw">(+ und −)</span>.';
const tastenFuer = s => [...new Set(s.match(/[a-z]/g)||[])].sort().concat(['²','³',M]);
const gl = (k,v,n=1) => v ? glied(k,{[v]:n}) : glied(k);
const vz = () => pick(['+',M]);

/* ---------- Aufgabentypen ---------- */
const typen = {
  // V2-A01 Was rechne ich zuerst?
  was_zuerst(){
    return versuche(()=>{
      const [v,w]=buchst(2), art=pick(['klammer','punkt','innen']);
      let q, labels;
      if(art==='klammer'){
        const A=gl(rnd(2,9),v), k=rnd(2,9), op=vz(), innen=`${v} ${vz()} ${rnd(1,9)}`;
        q=`${A} ${op} ${k}·(${innen})`;
        labels=[`zuerst ${k}·(${innen}) ausmultiplizieren`, `zuerst ${A} ${op} ${k} rechnen`, `zuerst ${innen} zusammenfassen`];
      } else if(art==='punkt'){
        const k=rnd(2,9), m=rnd(2,9), A=gl(k*m,v), B=gl(rnd(1,9),pick([v,w])), op=vz();
        q = Math.random()<.5 ? `${A} : ${k} ${op} ${B}` : `${B} ${op} ${A} : ${k}`;
        labels=[`zuerst ${A} : ${k} rechnen`, q.startsWith(A)?`zuerst ${k} ${op} ${B} rechnen`:`zuerst ${B} ${op} ${A} rechnen`, `zuerst ${A} ${op} ${B} zusammenfassen`];
      } else {
        const a=rnd(2,9), b=rnd(2,9), c=rnd(2,9), d=rnd(2,20), innen=`${c}${v} ${vz()} ${d}`;
        q=`${M}${a} ${M} [${b} ${M} (${innen})]·(${M}${v})`;
        labels=[`zuerst (${innen}) auflösen`, `zuerst ${M}${a} ${M} ${b} rechnen`, `zuerst ${b} ${M} ${c}${v} rechnen`];
      }
      const o=optionen(labels); if(!o) return null;
      return aufg({kind:'twahl', q, lead:'Was rechnest du zuerst?', optionen:o, ans:'o0', pruef:'zuerst', art, why:KLAPUSTRI});
    });
  },
  // V2-A02 Punkt vor Strich mit Termen
  punkt_vor_strich(){

/* ---------- Aufgabentypen ---------- */
const typen = {
  // G1-A01 Dreieck einordnen (nach Winkeln und nach Seiten)
  einordnen(ctx){
    const [w,s]=pick(KOMBIS), {W,P}=dreieckFuer(w,s);
    const t=aufg({kind:'fragen', q:'Wie heißt dieses Dreieck?', text:true, lead:ctx&&ctx.leicht?MERK:'', bild:zeichne(P,{hilfe:hilfe(ctx)}),
      gruppen:[{frage:'Nach den Winkeln', optionen:WART, ans:w, klasse:'drei'}, {frage:'Nach den Seiten', optionen:SART, ans:s, klasse:'drei'}],
      daten:{P, W}, pruef:'einordnen', why:`${WARUM_W} ${WARUM_S}`,
      steps:`Winkel ${W.map(x=>x+'°').join(', ')} → ${wName(w)} · ${s}`,
      loesungBild:zeichne(P,{hilfe:'farbe', winkelText:winkelText(W)})});
    t.fehlerText = () => (t.falsch||[]).map((f,i)=>f?(i?`Nach den Seiten: ${s}.`:`Nach den Winkeln: ${wName(w)}.`):'').filter(Boolean).join(' ');
    return t;
  },
  // G1-A02 Dreiecke in die 3×3-Tabelle einordnen; jede vierte Aufgabe: Welche Felder bleiben leer?
  tabelle(ctx){
    if(!(ctx&&ctx.leicht) && Math.random()<.25){
      const opt=[]; for(const [w,wl] of WART) for(const [s,sl] of SART) opt.push([`${w}|${s}`, `${wl} · ${sl}`]);
      return aufg({kind:'fragen', q:'Welche zwei Felder der Tabelle bleiben immer leer? Tippe beide an.', text:true, pruef:'leer',
        gruppen:[{mehrfach:true, optionen:opt, ans:'recht|gleichseitig,stumpf|gleichseitig', klasse:'lang'}],
        why:'Ein gleichseitiges Dreieck hat drei Winkel zu 60°. Darum ist es immer spitzwinkelig, nie rechtwinkelig oder stumpfwinkelig.'});
    }
    const n=ctx&&ctx.leicht?4:rnd(4,6), h=hilfe(ctx), NR='①②③④⑤⑥';
    const dr=mischen(KOMBIS).concat(mischen(KOMBIS)).slice(0,n).map(([w,s],i)=>Object.assign({w,s,i},dreieckFuer(w,s)));
    const t=aufg({kind:'zuordnen', q:'Tippe jedes Dreieck an, dann das passende Feld.', text:true, pruef:'tabelle',
      dinge:dr.map(d=>({id:'d'+d.i, html:`<span class="nr">${NR[d.i]}</span>${zeichne(d.P,{hilfe:h, ecken:false, seitenNamen:false, breite:200, pad:16})}`, kurz:`Dreieck ${NR[d.i]}`})),
      raster:{zeilen:WART, spalten:SART}, ans:Object.fromEntries(dr.map(d=>['d'+d.i,`${d.w}|${d.s}`])),
      daten:{dreiecke:dr.map(d=>({id:'d'+d.i, P:d.P}))},
      why:`${WARUM_W} ${WARUM_S}`});
    t.fehlerText = () => dr.filter(d=>(t.falsch||[]).includes('d'+d.i)).map(d=>`Dreieck ${NR[d.i]} gehört zu „${wName(d.w)} · ${d.s}“ (Winkel ${d.W.join('°, ')}°).`).join(' ');
    return t;
  },
  // G1-A03 Begriffe in Lücken
  begriffe_luecke(ctx){
    const [satz,wort,ablenker]=pick(LUECKEN), andere=mischen(ablenker).slice(0,ctx&&ctx.leicht?2:3);
    return aufg({kind:'fragen', q:satz.replace(/h_([abc])/g,'h$1'), qh:anzeige(satz), text:true, pruef:'luecke', satz,
      gruppen:[{frage:'Welches Wort gehört in die Lücke?', optionen:mischen([wort,...andere]).map(x=>[x,x]), ans:wort, klasse:'lang'}],

  },
  // G1-A04 Dreieck beschriften (Seite, Winkel, Ecke)
  beschriften(ctx){
    const {P}=dreieckFuer(...pick(KOMBIS)), lead=ctx&&ctx.leicht?MERK_ABC:'', e=pick(['A','B','C']), art=pick(['gegen','winkel','verbindet','ecke','seite']);
    const SEITEN=[['a','Seite a'],['b','Seite b'],['c','Seite c']], WINK=[['A','α'],['B','β'],['C','γ']];
    const basis={kind:'fragen', text:true, lead, daten:{P}, pruef:'beschriften', art, e,
      why:'Die Ecken laufen gegen den Uhrzeigersinn A, B, C. Die Seite a liegt der Ecke A gegenüber (b gegenüber B, c gegenüber C). Der Winkel α liegt bei A.',
      loesungBild:zeichne(P,{ecken:true, seitenNamen:true, winkelNamen:true})};
    if(art==='gegen') return aufg(Object.assign(basis,{q:`Welche Seite liegt der Ecke ${e} gegenüber? Tippe sie an.`, bild:zeichne(P,{ecken:true, tippSeiten:'q0'}),
